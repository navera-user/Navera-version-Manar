<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Inter, Segoe UI, sans-serif">
<defs><linearGradient id="sea" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1d4e6b"/><stop offset="1" stop-color="#13284a"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#ff8f7a" stop-opacity=".9"/><stop offset="1" stop-color="#ff8f7a" stop-opacity="0"/></radialGradient></defs>
<rect width="720" height="420" fill="#0b1730"/><rect width="720" height="360" fill="url(#sea)"/>
<path d="M0 360 L0 205 C60 196 120 214 190 206 C215 204 228 214 236 230 L236 360 Z" fill="#2f5a4d"/>
<path d="M484 360 L484 232 C494 214 512 206 540 208 C610 214 660 196 720 204 L720 360 Z" fill="#2f5a4d"/>
<path d="M0 205 C60 196 120 214 190 206 C215 204 228 214 236 230" fill="none" stroke="#f6c7a8" stroke-width="2" opacity=".7"/>
<path d="M484 232 C494 214 512 206 540 208 C610 214 660 196 720 204" fill="none" stroke="#f6c7a8" stroke-width="2" opacity=".7"/>
<text x="40" y="285" fill="#cfe3d9" font-size="13" opacity=".85">land: vision matches</text>
<text x="292" y="305" fill="#9fc4d8" font-size="13" opacity=".85">sea: no vision match</text>
<text x="556" y="285" fill="#cfe3d9" font-size="13" opacity=".85">land again</text>
<text x="20" y="28" fill="#ffb3a3" font-size="11.5" font-weight="700" letter-spacing="3">MISSION 01 · GHOST POSITION</text>
<circle cx="28" cy="50" r="5" fill="#ff8f7a" stroke="#fff" stroke-width="1.5"/><text x="40" y="54" fill="#e8f0f5" font-size="12.5">where the GPS says you are</text>
<path d="M23 72 L33 72 M28 67 L28 77" stroke="#7fe0d3" stroke-width="2.5" stroke-linecap="round"/><text x="40" y="76" fill="#e8f0f5" font-size="12.5">where the drone really is</text>
<line x1="30" y1="240" x2="700" y2="240" stroke="#7fe0d3" stroke-width="2" stroke-dasharray="6 6" opacity=".55"/>
<path d="M30 240 L286.0 240 L490.8 128" fill="none" stroke="#ff8f7a" stroke-width="2.5" stroke-dasharray="489.4" stroke-dashoffset="489.4"><animate attributeName="stroke-dashoffset" dur="15s" repeatCount="indefinite" calcMode="linear" values="489.4;233.4;0;0" keyTimes="0;0.4;0.72;1"/></path>
<line x1="490.8" y1="240" x2="490.8" y2="128" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="3 4" opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.72"/></line>
<g><g><circle r="18" fill="#7fe0d3" opacity=".18"/><path d="M-9 0 L9 0 M0 -9 L0 9" stroke="#7fe0d3" stroke-width="3" stroke-linecap="round"/><circle cx="-9" cy="0" r="4" fill="none" stroke="#7fe0d3" stroke-width="2"/><circle cx="9" cy="0" r="4" fill="none" stroke="#7fe0d3" stroke-width="2"/><circle cx="0" cy="-9" r="4" fill="none" stroke="#7fe0d3" stroke-width="2"/><circle cx="0" cy="9" r="4" fill="none" stroke="#7fe0d3" stroke-width="2"/><animateTransform attributeName="transform" type="translate" dur="15s" repeatCount="indefinite" values="30 240;670 240"/></g></g>
<g><circle r="22" fill="url(#glow)"/><circle r="6" fill="#ff8f7a" stroke="#fff" stroke-width="2"/><animateTransform attributeName="transform" type="translate" dur="15s" repeatCount="indefinite" values="30 240;286.0 240;490.8 128;490.8 128" keyTimes="0;0.4;0.72;1"/></g>
<g transform="translate(490.8,128)" opacity="0"><circle r="26" fill="none" stroke="#ffd166" stroke-width="3"/><text x="32" y="6" fill="#ffd166" font-size="16" font-weight="700">CAUGHT</text><animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.72"/></g>
<rect x="566" y="14" width="140" height="66" rx="12" fill="#0b1730" fill-opacity=".7" stroke="#ffffff" stroke-opacity=".15"/>
<text x="694" y="34" text-anchor="end" fill="#cfe3ea" font-size="12" font-family="ui-monospace, Menlo, monospace">GPS error</text>
<text x="694" y="56" text-anchor="end" fill="#ff8f7a" font-size="18" font-weight="700" font-family="ui-monospace, Menlo, monospace" opacity="0">0 m<animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.4"/></text>
<text x="694" y="56" text-anchor="end" fill="#ff8f7a" font-size="18" font-weight="700" font-family="ui-monospace, Menlo, monospace" opacity="0">≈ 50 m<animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4;0.48"/></text>
<text x="694" y="56" text-anchor="end" fill="#ff8f7a" font-size="18" font-weight="700" font-family="ui-monospace, Menlo, monospace" opacity="0">≈ 150 m<animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.48;0.56"/></text>
<text x="694" y="56" text-anchor="end" fill="#ff8f7a" font-size="18" font-weight="700" font-family="ui-monospace, Menlo, monospace" opacity="0">≈ 250 m<animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.56;0.64"/></text>
<text x="694" y="56" text-anchor="end" fill="#ff8f7a" font-size="18" font-weight="700" font-family="ui-monospace, Menlo, monospace" opacity="0">≈ 350 m<animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.64;0.72"/></text>
<text x="694" y="56" text-anchor="end" fill="#ff8f7a" font-size="18" font-weight="700" font-family="ui-monospace, Menlo, monospace" opacity="0">391 m<animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.72"/></text>
<text x="694" y="72" text-anchor="end" fill="#7fe0d3" font-size="11.5" font-weight="700" font-family="ui-monospace, Menlo, monospace" opacity="0">GPS · FIX<animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.72"/></text>
<text x="694" y="72" text-anchor="end" fill="#ffd166" font-size="11.5" font-weight="700" font-family="ui-monospace, Menlo, monospace" opacity="0">GPS · REFUSED<animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.72"/></text>
<text x="22" y="398" fill="#ffffff" font-size="20" font-family="Fraunces, Georgia, serif" opacity="0">A survey drone flies along the coast. Its GPS looks perfect.<animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.4"/></text>
<text x="22" y="398" fill="#ffffff" font-size="20" font-family="Fraunces, Georgia, serif" opacity="0">Over the sea, a spoofer drags the GPS north, 2 metres every second.<animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4;0.52"/></text>
<text x="22" y="398" fill="#ffffff" font-size="20" font-family="Fraunces, Georgia, serif" opacity="0">No jump, no alarm. Out here, nothing can check the GPS.<animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.52;0.62"/></text>
<text x="22" y="398" fill="#ffffff" font-size="20" font-family="Fraunces, Georgia, serif" opacity="0">At the coast, the camera finds the map again…<animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.62;0.72"/></text>
<text x="22" y="398" fill="#ffffff" font-size="20" font-family="Fraunces, Georgia, serif" opacity="0">…and NAVERA catches the lie: 391 m off.<animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.72;0.9"/></text>
<text x="22" y="398" fill="#ffffff" font-size="20" font-family="Fraunces, Georgia, serif" opacity="0">Today you do both: the attack, and the catch.<animate attributeName="opacity" dur="15s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.9"/></text>
</svg>