<text x="272" y="94" fill="#1d2733" font-weight="bold">estimator_node</text>
<text x="272" y="116" fill="#1d2733">eligible = valid, fresh,</text>
<text x="272" y="138" fill="#1d2733">measured or propagated, finite</text>
<text x="272" y="160" fill="#1d2733" font-weight="bold">priority:</text>
<text x="272" y="182" fill="#1d2733">GPS > day > night > celestial</text>
<text x="272" y="204" fill="#1d2733" font-weight="bold">GPS jump gate:</text>
<text x="272" y="226" fill="#1d2733">refuse if d > v_max·Δt + margin</text>
<text x="272" y="248" fill="#1d2733">→ FIX / DEGRADED / NO_FIX</text>
