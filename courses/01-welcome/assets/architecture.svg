<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="sans-serif" font-size="12">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#555"/></marker></defs>
<rect width="640" height="380" fill="#f7fafc"/>
<text x="16" y="24" font-size="14" font-weight="bold" fill="#1d2733">1. Sources</text>
