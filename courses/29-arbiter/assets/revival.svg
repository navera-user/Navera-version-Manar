<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="sans-serif" font-size="12.5">
  <rect width="760" height="300" fill="#f7fafc"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" fill="#1d2733">revival.csv: a GPS that dies after one fix stamped 20 s ahead (vehicle at 20 m/s)</text>
  <!-- x = 170 + 13.5 t, t 0..40 -->
  <g font-size="12" fill="#1d2733" text-anchor="end">
    <text x="160" y="66">fixes received</text>
    <text x="160" y="130">v0 + your eligible()</text>
    <text x="160" y="144" font-size="10.5" fill="#56606b">(mission 12)</text>
    <text x="160" y="206">your judge (29)</text>
    <text x="160" y="220" font-size="10.5" fill="#56606b">(refused at the door)</text>
  </g>
  <g fill="#1f63d1">
    <circle cx="183.5" cy="60" r="3.5"/><circle cx="197" cy="60" r="3.5"/><circle cx="210.5" cy="60" r="3.5"/>
    <circle cx="224" cy="60" r="3.5"/><circle cx="237.5" cy="60" r="3.5"/><circle cx="251" cy="60" r="3.5"/>
    <circle cx="264.5" cy="60" r="3.5"/><circle cx="278" cy="60" r="3.5"/><circle cx="291.5" cy="60" r="3.5"/>
  </g>
  <circle cx="305" cy="60" r="5" fill="#c62828"/>
  <text x="312" y="50" font-size="11" fill="#c62828">t = 10 s: GPS fix stamped 30 s</text>
  <text x="300" y="82" font-size="10.5" fill="#56606b">GPS: 1 fix/s until 9 s, then dead · day vision (σ 30 m) every second, all along</text>
  <!-- v0 + eligible: day 10-29.6, FIX gps 29.6-33.2, day after -->
  <g font-size="11" fill="#fff" text-anchor="middle">
    <rect x="183.5" y="118" width="121.5" height="20" fill="#2e7d32"/><text x="244" y="132">FIX gps</text>
    <rect x="305" y="118" width="264.6" height="20" fill="#ef6c00"/><text x="437" y="132">DEGRADED day</text>
    <rect x="569.6" y="118" width="48.6" height="20" fill="#2e7d32"/>
    <rect x="618.2" y="118" width="91.8" height="20" fill="#ef6c00"/><text x="664" y="132">day</text>
  </g>
  <text x="594" y="112" font-size="11" fill="#c62828" text-anchor="middle">FIX gps σ 3 m!</text>
  <text x="594" y="158" font-size="10.5" fill="#c62828" text-anchor="middle">29.6–33.2 s: the dead GPS wins with the</text>
  <text x="594" y="171" font-size="10.5" fill="#c62828" text-anchor="middle">position of t = 10 s: 390–460 m behind</text>
  <!-- mine -->
  <g font-size="11" fill="#fff" text-anchor="middle">
    <rect x="183.5" y="194" width="151.2" height="20" fill="#2e7d32"/><text x="257" y="208">FIX gps</text>
    <rect x="334.7" y="194" width="375.3" height="20" fill="#ef6c00"/><text x="520" y="208">DEGRADED day</text>
  </g>
  <text x="334" y="232" font-size="10.5" fill="#56606b">12.2 s: the last honest fix (9 s) is stale</text>
  <line x1="170" y1="250" x2="710" y2="250" stroke="#5a6b7b"/>
  <g font-size="11" fill="#56606b" text-anchor="middle">
    <text x="170" y="266">0</text><text x="305" y="266">10</text><text x="440" y="266">20</text><text x="575" y="266">30</text><text x="710" y="266">40 s</text>
  </g>
  <text x="380" y="290" text-anchor="middle" font-size="11.5" fill="#1d2733">The check was right both times; the difference is what the judge KEEPS from a fix it refused.</text>
</svg>
