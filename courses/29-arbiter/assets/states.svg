<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="sans-serif" font-size="12.5">
  <rect width="760" height="300" fill="#f7fafc"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5a6b7b"/></marker></defs>
  <text x="380" y="24" text-anchor="middle" font-size="15" fill="#1d2733">From the winner to the state (every decision asks the same three questions)</text>
  <!-- q1 -->
  <rect x="30" y="110" width="170" height="54" rx="27" fill="#fff" stroke="#5a6b7b"/>
  <text x="115" y="133" text-anchor="middle" fill="#1d2733">anything received yet?</text>
  <text x="115" y="150" text-anchor="middle" font-size="10.5" fill="#56606b">(stored or refused)</text>
  <line x1="115" y1="110" x2="115" y2="74" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="122" y="96" font-size="11" fill="#56606b">no</text>
  <rect x="60" y="40" width="110" height="32" rx="6" fill="#9e9e9e"/><text x="115" y="61" text-anchor="middle" fill="#fff" font-weight="bold">STARTING</text>
  <line x1="200" y1="137" x2="250" y2="137" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="212" y="130" font-size="11" fill="#56606b">yes</text>
  <!-- q2 -->
  <rect x="254" y="110" width="170" height="54" rx="27" fill="#fff" stroke="#5a6b7b"/>
  <text x="339" y="133" text-anchor="middle" fill="#1d2733">a winner?</text>
  <text x="339" y="150" text-anchor="middle" font-size="10.5" fill="#56606b">(candidates → pick)</text>
  <line x1="339" y1="164" x2="339" y2="206" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="346" y="190" font-size="11" fill="#56606b">no</text>
  <rect x="284" y="210" width="110" height="32" rx="6" fill="#c62828"/><text x="339" y="231" text-anchor="middle" fill="#fff" font-weight="bold">NO_FIX</text>
  <text x="339" y="262" text-anchor="middle" font-size="10.5" fill="#56606b">reason: every source, why not</text>
  <line x1="424" y1="137" x2="474" y2="137" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="436" y="130" font-size="11" fill="#56606b">yes</text>
  <!-- q3 -->
  <rect x="478" y="104" width="190" height="66" rx="30" fill="#fff" stroke="#5a6b7b"/>
  <text x="573" y="128" text-anchor="middle" fill="#1d2733">does it STATE a σ</text>
  <text x="573" y="145" text-anchor="middle" fill="#1d2733">≤ fix_max_sigma_m (25 m)?</text>
  <text x="573" y="161" text-anchor="middle" font-size="10.5" fill="#56606b">(estimate.stated_sigma)</text>
  <line x1="573" y1="104" x2="573" y2="74" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="580" y="94" font-size="11" fill="#56606b">yes</text>
  <rect x="518" y="40" width="110" height="32" rx="6" fill="#2e7d32"/><text x="573" y="61" text-anchor="middle" fill="#fff" font-weight="bold">FIX</text>
  <line x1="573" y1="170" x2="573" y2="206" stroke="#5a6b7b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="580" y="192" font-size="11" fill="#56606b">no, or no σ stated</text>
  <rect x="518" y="210" width="110" height="32" rx="6" fill="#ef6c00"/><text x="573" y="231" text-anchor="middle" fill="#fff" font-weight="bold">DEGRADED</text>
  <text x="680" y="58" font-size="10.5" fill="#56606b">"gps: σ 3.0 m"</text>
  <text x="640" y="262" text-anchor="middle" font-size="10.5" fill="#56606b">"day: σ 30.0 m > 25.0 m", "night: σ unknown"</text>
  <text x="380" y="288" text-anchor="middle" font-size="11.5" fill="#1d2733">Priority picks the winner; the σ it states only colours the answer. A source becomes FIX by measuring its accuracy, never by a vote.</text>
</svg>
