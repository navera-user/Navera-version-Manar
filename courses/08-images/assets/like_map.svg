<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" font-family="sans-serif" font-size="11.5">
  <rect width="780" height="260" fill="#f7fafc"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d2733"/></marker>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d64545"/></marker>
    <clipPath id="f"><rect x="0" y="0" width="100" height="76"/></clipPath>
  </defs>
  <text x="20" y="22" fill="#1d2733" font-weight="bold" font-size="13">Making a drone photo comparable with the map (what make_like_map() does)</text>
  <text x="20" y="44" fill="#555">Red arrow = where north is in the picture. The map has north up, about 0.97 m per pixel, the full range of greys.</text>
  <!-- 1 photo -->
  <g transform="translate(20 82)">
    <rect width="100" height="76" fill="#8a7a55" stroke="#1d2733"/>
    <g clip-path="url(#f)"><g transform="rotate(-35 50 38)">
      <rect x="10" y="16" width="44" height="26" fill="#5f6f4a"/><rect x="60" y="40" width="30" height="22" fill="#b09a6a"/><rect x="20" y="50" width="16" height="10" fill="#6d5c3e"/>
      <line x1="50" y1="30" x2="50" y2="10" stroke="#d64545" stroke-width="2.5" marker-end="url(#n)"/></g></g>
  </g>
  <text x="20" y="182" fill="#1d2733">the photo: colour, dark,</text><text x="20" y="197" fill="#1d2733">image top = heading 35°,</text><text x="20" y="212" fill="#1d2733">0.6 m per pixel</text>
  <line x1="128" y1="120" x2="172" y2="120" stroke="#1d2733" marker-end="url(#a)"/>
  <!-- 2 grey -->
  <g transform="translate(180 82)">
    <rect width="100" height="76" fill="#7a7a7a" stroke="#1d2733"/>
    <g clip-path="url(#f)"><g transform="rotate(-35 50 38)">
      <rect x="10" y="16" width="44" height="26" fill="#626262"/><rect x="60" y="40" width="30" height="22" fill="#959595"/><rect x="20" y="50" width="16" height="10" fill="#6a6a6a"/>
      <line x1="50" y1="30" x2="50" y2="10" stroke="#d64545" stroke-width="2.5" marker-end="url(#n)"/></g></g>
  </g>
  <text x="180" y="182" fill="#1d2733">1. to_gray()</text><text x="180" y="197" fill="#555">one number per pixel</text>
  <line x1="288" y1="120" x2="332" y2="120" stroke="#1d2733" marker-end="url(#a)"/>
  <!-- 3 normalised -->
  <g transform="translate(340 82)">
    <rect width="100" height="76" fill="#9c9c9c" stroke="#1d2733"/>
    <g clip-path="url(#f)"><g transform="rotate(-35 50 38)">
      <rect x="10" y="16" width="44" height="26" fill="#2a2a2a"/><rect x="60" y="40" width="30" height="22" fill="#f4f4f4"/><rect x="20" y="50" width="16" height="10" fill="#444"/>
      <line x1="50" y1="30" x2="50" y2="10" stroke="#d64545" stroke-width="2.5" marker-end="url(#n)"/></g></g>
  </g>
  <text x="340" y="182" fill="#1d2733">2. normalise()</text><text x="340" y="197" fill="#555">darkest → 0,</text><text x="340" y="212" fill="#555">brightest → 255</text>
  <line x1="448" y1="120" x2="492" y2="120" stroke="#1d2733" marker-end="url(#a)"/>
  <!-- 4 rotated: content upright, corners black -->
  <g transform="translate(500 82)">
    <rect width="100" height="76" fill="#111"/>
    <g clip-path="url(#f)"><g transform="rotate(35 50 38)"><rect width="100" height="76" fill="#9c9c9c"/></g></g>
    <rect x="10" y="16" width="44" height="26" fill="#2a2a2a"/><rect x="60" y="40" width="30" height="22" fill="#f4f4f4"/><rect x="20" y="50" width="16" height="10" fill="#444"/>
    <line x1="50" y1="30" x2="50" y2="10" stroke="#d64545" stroke-width="2.5" marker-end="url(#n)"/>
    <rect width="100" height="76" fill="none" stroke="#1d2733"/>
  </g>
  <text x="500" y="182" fill="#1d2733">3. turn by −35°</text><text x="500" y="197" fill="#555">clockwise: north up</text><text x="500" y="212" fill="#555">(the corners go black)</text>
  <line x1="608" y1="120" x2="652" y2="120" stroke="#1d2733" marker-end="url(#a)"/>
  <!-- 5 scaled -->
  <g transform="translate(660 96) scale(0.62)">
    <rect width="100" height="76" fill="#111"/>
    <g clip-path="url(#f)"><g transform="rotate(35 50 38)"><rect width="100" height="76" fill="#9c9c9c"/></g></g>
    <rect x="10" y="16" width="44" height="26" fill="#2a2a2a"/><rect x="60" y="40" width="30" height="22" fill="#f4f4f4"/><rect x="20" y="50" width="16" height="10" fill="#444"/>
    <rect width="100" height="76" fill="none" stroke="#1d2733" stroke-width="1.6"/>
  </g>
  <text x="660" y="182" fill="#1d2733">4. scale by 0.62</text><text x="660" y="197" fill="#555">0.6 / 0.968 →</text><text x="660" y="212" fill="#555">the map's m / pixel</text>
  <text x="20" y="245" fill="#1d2733">Steps 3 and 4 are ONE 2 × 3 affine matrix (rotation_scale_matrix): one warp, one interpolation. Then compare pixel by pixel.</text>
</svg>
