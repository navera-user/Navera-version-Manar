<text x="30" y="274" fill="#d64545" font-size="12">red: neighbourhood of (y=2, x=2)</text>
<text x="280" y="56" fill="#1d2733" font-size="12">kernel k (Sobel x, as cv2.Sobel correlates it)</text>
