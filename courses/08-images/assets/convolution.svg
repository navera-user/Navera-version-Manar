<text x="280" y="200" fill="#1d2733" font-size="12.5">correlation (cv2.filter2D, cv2.Sobel):</text>
<text x="280" y="218" fill="#1d2733" font-size="12.5">out(y,x) = Σ k(i,j)·img(y+i, x+j)</text>
<text x="280" y="240" fill="#1d2733" font-size="12.5">true convolution flips the kernel:</text>
<text x="280" y="258" fill="#1d2733" font-size="12.5">out(y,x) = Σ k(i,j)·img(y−i, x−j)</text>
<text x="280" y="276" fill="#555" font-size="12">(same for a symmetric kernel)</text>
<text x="540" y="70" fill="#1d2733" font-size="12.5" font-weight="bold">Result at (2, 2):</text>
<text x="540" y="90" fill="#1d2733" font-size="12.5">(−1)·10 + 0·10 + 1·80</text>
<text x="540" y="110" fill="#1d2733" font-size="12.5">+ (−2)·10 + 0·10 + 2·80</text>
<text x="540" y="130" fill="#1d2733" font-size="12.5">+ (−1)·10 + 0·10 + 1·80</text>
<text x="540" y="150" fill="#1d2733" font-size="12.5" font-weight="bold">= 280;  ÷ 8 → 35 > 0</text>
<text x="540" y="170" fill="#1d2733" font-size="12.5">brighter to the right:</text>
<text x="540" y="190" fill="#1d2733" font-size="12.5">a vertical edge</text>
<text x="540" y="230" fill="#1d2733" font-size="12.5">Gaussian blur: all weights > 0,</text>
<text x="540" y="250" fill="#1d2733" font-size="12.5">sum = 1 → local average</text>
<text x="540" y="270" fill="#1d2733" font-size="12.5">Sobel: weights sum to 0 →</text>
<text x="540" y="290" fill="#1d2733" font-size="12.5">0 on flat areas, large on edges</text>
<text x="20" y="331" fill="#555" font-size="12">At the border OpenCV mirrors the picture ("reflect 101": … c b | a b c …), np.pad(…, mode="reflect").</text>
</svg>
