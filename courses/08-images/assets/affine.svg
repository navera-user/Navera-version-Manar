<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 410" font-family="sans-serif" font-size="13">
<rect width="740" height="410" fill="#f7fafc"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
<text x="20" y="26" fill="#1d2733" font-weight="bold">Rotation + scale about a point, and inverse mapping with bilinear interpolation</text>
<polygon points="50.0,80.0 250.0,80.0 250.0,220.0 50.0,220.0" fill="#d7ecf5" stroke="#0b6e8a" stroke-width="2"/>
<polygon points="77.0,143.6 181.0,83.6 223.0,156.4 119.0,216.4" fill="#fbe6c8" fill-opacity="0.8" stroke="#a8680d" stroke-width="2"/>
<circle cx="150" cy="150" r="4" fill="#d64545"/><text x="150" y="137" fill="#d64545" font-size="12" text-anchor="middle">c = (cx, cy)</text>
<path d="M220 150 A70 70 0 0 0 210.6 115.0" fill="none" stroke="#2f855a" stroke-width="2" marker-end="url(#a)"/>
<line x1="150" y1="150" x2="230" y2="150" stroke="#2f855a" stroke-dasharray="3 3"/>
<text x="256" y="122" fill="#2f855a" font-size="12">θ = +30°</text>
<text x="40" y="250" fill="#1d2733" font-size="12">blue: source picture · orange: θ = +30°, s = 0.6</text>
<text x="40" y="268" fill="#1d2733" font-size="12">the y axis points DOWN, so a positive θ</text>
<text x="40" y="286" fill="#1d2733" font-size="12">turns counter-clockwise on the screen</text>
<text x="300" y="60" fill="#1d2733" font-size="12.5" font-weight="bold">M = T(c) · R(θ)·s · T(−c)</text>
<text x="300" y="81" fill="#1d2733" font-size="12.5">a = s·cos θ,  b = s·sin θ</text>
<text x="300" y="102" fill="#1d2733" font-size="12.5">M = [[ a,  b, (1 − a)·cx − b·cy ],</text>
<text x="328" y="123" fill="#1d2733" font-size="12.5">[ −b,  a,  b·cx + (1 − a)·cy ]]</text>
<text x="300" y="144" fill="#1d2733" font-size="12.5">[u, v]ᵀ = A·[x, y]ᵀ + t,  A = M[:, :2], t = M[:, 2]</text>
<text x="300" y="201" fill="#1d2733" font-size="12.5" font-weight="bold">Inverse mapping: for each OUTPUT pixel (u, v)</text>
<rect x="330" y="215" width="85" height="85" fill="none" stroke="#bbb"/><rect x="415" y="215" width="85" height="85" fill="none" stroke="#bbb"/><rect x="330" y="300" width="85" height="85" fill="none" stroke="#bbb"/><rect x="415" y="300" width="85" height="85" fill="none" stroke="#bbb"/><circle cx="372.5" cy="257.5" r="4" fill="#0b6e8a"/><text x="372.5" y="249.5" fill="#0b6e8a" font-size="11" text-anchor="middle">I(x0, y0)</text>
<circle cx="457.5" cy="257.5" r="4" fill="#0b6e8a"/><text x="457.5" y="249.5" fill="#0b6e8a" font-size="11" text-anchor="middle">I(x0+1, y0)</text>
<circle cx="372.5" cy="342.5" r="4" fill="#0b6e8a"/><text x="372.5" y="334.5" fill="#0b6e8a" font-size="11" text-anchor="middle">I(x0, y0+1)</text>
<circle cx="457.5" cy="342.5" r="4" fill="#0b6e8a"/><text x="457.5" y="334.5" fill="#0b6e8a" font-size="11" text-anchor="middle">I(x0+1, y0+1)</text>
<circle cx="398.0" cy="312.8" r="5" fill="#d64545"/><line x1="372.5" y1="312.8" x2="398.0" y2="312.8" stroke="#d64545" stroke-dasharray="2 2"/><line x1="398.0" y1="257.5" x2="398.0" y2="312.8" stroke="#d64545" stroke-dasharray="2 2"/>
<text x="385.2" y="306.8" fill="#d64545" font-size="11" text-anchor="middle">fx</text><text x="404.0" y="289.1" fill="#d64545" font-size="11">fy</text>
<text x="530" y="219" fill="#1d2733" font-size="12">source point:</text>
<text x="530" y="238" fill="#1d2733" font-size="12">(x, y) = A⁻¹·((u, v) − t)</text>
<text x="530" y="257" fill="#1d2733" font-size="12">x0 = floor(x), fx = x − x0</text>
<text x="530" y="276" fill="#1d2733" font-size="12">y0 = floor(y), fy = y − y0</text>
<text x="530" y="295" fill="#1d2733" font-size="12" font-weight="bold">value =</text>
<text x="530" y="314" fill="#1d2733" font-size="12">(1−fx)(1−fy)·I(x0, y0)</text>
<text x="530" y="333" fill="#1d2733" font-size="12">+ fx(1−fy)·I(x0+1, y0)</text>
<text x="530" y="352" fill="#1d2733" font-size="12">+ (1−fx)fy·I(x0, y0+1)</text>
<text x="530" y="371" fill="#1d2733" font-size="12">+ fx·fy·I(x0+1, y0+1)</text>
</svg>
