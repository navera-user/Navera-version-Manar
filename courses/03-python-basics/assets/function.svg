<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" font-family="sans-serif" font-size="13">
  <rect width="640" height="200" fill="#f7fafc"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0b6e8a"/>
    </marker>
  </defs>
  <text x="20" y="30" font-family="monospace" font-size="14" fill="#1d2733">speed = kmh_to_ms(36)</text>
  <rect x="20" y="70" width="120" height="50" rx="8" fill="#fde7c5" stroke="#d6a65c"/>
  <text x="80" y="92" text-anchor="middle" fill="#1d2733">argument</text>
  <text x="80" y="110" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#1d2733">36</text>
  <line x1="142" y1="95" x2="208" y2="95" stroke="#0b6e8a" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="210" y="50" width="220" height="90" rx="10" fill="#d7e3ee" stroke="#8aa3b8"/>
  <text x="320" y="72" text-anchor="middle" font-weight="bold" fill="#1d2733">def kmh_to_ms(speed_kmh):</text>
  <text x="320" y="96" text-anchor="middle" font-family="monospace" fill="#1d2733">speed_kmh = 36</text>
  <text x="320" y="122" text-anchor="middle" font-family="monospace" fill="#1d2733">return speed_kmh / 3.6</text>
  <line x1="432" y1="95" x2="498" y2="95" stroke="#0b6e8a" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="500" y="70" width="120" height="50" rx="8" fill="#cde6c8" stroke="#86b67d"/>
  <text x="560" y="92" text-anchor="middle" fill="#1d2733">return value</text>
  <text x="560" y="110" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#1d2733">10.0</text>
  <text x="320" y="170" text-anchor="middle" fill="#4a5866">The value goes IN through the parameter, the answer comes OUT with return,</text>
  <text x="320" y="188" text-anchor="middle" fill="#4a5866">and lands in the variable speed. Nothing is printed unless you print it.</text>
</svg>
