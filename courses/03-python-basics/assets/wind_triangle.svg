<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d17a00"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2e8b57"/></marker>
  </defs>
  <rect width="640" height="330" fill="#f7fafc"/>
  <text x="20" y="26" font-size="15" font-weight="bold" fill="#1d2733">Worked example: track 090°, airspeed 12 m/s, wind 5 m/s towards 225°</text>
  <!-- north arrow -->
  <line x1="585" y1="110" x2="585" y2="60" stroke="#555" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="580" y="52" fill="#555">N</text>
  <!-- wanted track (east) -->
  <line x1="60" y1="230" x2="470" y2="230" stroke="#999" stroke-dasharray="6 5"/>
  <text x="380" y="252" fill="#777">wanted track 090° (east)</text>
  <!-- air velocity: (11.47, 3.54) * 30 px -->
  <line x1="60" y1="230" x2="404" y2="124" stroke="#1f6fb2" stroke-width="3" marker-end="url(#b)"/>
  <text x="120" y="158" fill="#1f6fb2" transform="rotate(-17.1 120 158)">air velocity: heading 072.9°, 12 m/s</text>
  <!-- wind: (-3.54, -3.54) * 30 px from the tip of the air vector -->
  <line x1="404" y1="124" x2="298" y2="230" stroke="#d17a00" stroke-width="3" marker-end="url(#o)"/>
  <text x="372" y="190" fill="#d17a00">wind 5 m/s</text>
  <text x="372" y="206" fill="#d17a00">(−3.54, −3.54)</text>
  <!-- ground velocity (7.93, 0) -->
  <line x1="60" y1="230" x2="298" y2="230" stroke="#2e8b57" stroke-width="3" marker-end="url(#g)"/>
  <text x="80" y="252" fill="#2e8b57">ground velocity 7.93 m/s along the track</text>
  <!-- crab angle arc -->
  <path d="M 140 230 A 80 80 0 0 0 136.5 206.4" fill="none" stroke="#1d2733"/>
  <text x="150" y="222" fill="#1d2733">crab 17.1°</text>
  <text x="20" y="290" fill="#1d2733">The wind pushes to the RIGHT of the track (cross = +3.54 m/s) and against it (along = −3.54 m/s).</text>
  <text x="20" y="310" fill="#1d2733">The drone points 17.1° to the LEFT, into the wind: air velocity + wind = a ground velocity along the track.</text>
</svg>
