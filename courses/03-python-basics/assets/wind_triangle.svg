<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d9822b"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2e8b57"/></marker>
    <marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#333"/></marker>
  </defs>
  <rect width="640" height="380" fill="#f7fafc"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#1d2733">The wind triangle (track 000°, V = 15 m/s, wind 4 m/s towards the east)</text>
  <!-- north arrow -->
  <line x1="40" y1="120" x2="40" y2="70" stroke="#333" stroke-width="2" marker-end="url(#aK)"/>
  <text x="34" y="62" font-weight="bold" fill="#333">N</text>
  <!-- track line (dashed) -->
  <line x1="200" y1="345" x2="200" y2="60" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="208" y="70" fill="#666">desired track T = 000°</text>
  <!-- air velocity O(200,330) -> A(144,128) -->
  <line x1="200" y1="330" x2="145" y2="131" stroke="#1f6fb2" stroke-width="3" marker-end="url(#aB)"/>
  <text x="30" y="240" fill="#1f6fb2" font-weight="bold">air velocity</text>
  <text x="30" y="256" fill="#1f6fb2">V = 15 m/s, heading ψ</text>
  <!-- wind A -> G(200,128) -->
  <line x1="144" y1="128" x2="196" y2="128" stroke="#d9822b" stroke-width="3" marker-end="url(#aO)"/>
  <text x="30" y="133" fill="#d9822b" font-weight="bold">wind w = (4, 0)</text>
  <!-- ground velocity O -> G -->
  <line x1="200" y1="330" x2="200" y2="132" stroke="#2e8b57" stroke-width="3" marker-end="url(#aG)"/>
  <text x="210" y="250" fill="#2e8b57" font-weight="bold">ground velocity</text>
  <text x="210" y="266" fill="#2e8b57">GS = 14.46 m/s</text>
  <!-- crab angle arc -->
  <path d="M200 280 A50 50 0 0 0 186.3 282" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="178" y="304" fill="#333">c</text>
  <circle cx="200" cy="330" r="4" fill="#1d2733"/>
  <text x="208" y="346" fill="#1d2733">vehicle</text>
  <!-- formulas box -->
  <rect x="360" y="70" width="265" height="250" rx="8" fill="#ffffff" stroke="#cbd5e0"/>
  <text x="374" y="96" font-weight="bold" fill="#1d2733">ground = air + wind</text>
  <text x="374" y="124" fill="#1d2733">w_cross = w_e·cos T − w_n·sin T = 4</text>
  <text x="374" y="146" fill="#1d2733">w_along = w_e·sin T + w_n·cos T = 0</text>
  <text x="374" y="174" fill="#1d2733">crab c = asin(w_cross / V)</text>
  <text x="374" y="192" fill="#1d2733">        = asin(4 / 15) = 15.47°</text>
  <text x="374" y="220" fill="#1d2733">heading ψ = T − c = 344.53°</text>
  <text x="374" y="248" fill="#1d2733">GS = V·cos c + w_along</text>
  <text x="374" y="266" fill="#1d2733">     = 15 · 0.9638 = 14.46 m/s</text>
  <text x="374" y="300" fill="#666" font-size="12">w_cross &gt; 0: wind pushes to the right,</text>
  <text x="374" y="315" fill="#666" font-size="12">so the nose points left of the track.</text>
</svg>
