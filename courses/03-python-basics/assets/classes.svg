<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#fff" stroke="#1f6fb2" stroke-width="1.5"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777"/></marker>
  </defs>
  <rect width="660" height="340" fill="#f7fafc"/>
  <text x="20" y="26" font-size="15" font-weight="bold" fill="#1d2733">Classes (blueprints)</text>
  <text x="420" y="26" font-size="15" font-weight="bold" fill="#1d2733">Objects (one value each)</text>
  <rect x="20" y="40" width="250" height="110" rx="6" fill="#e8f1fb" stroke="#1f6fb2" stroke-width="1.5"/>
  <text x="32" y="62" font-weight="bold" fill="#1f6fb2">class Sensor</text>
  <line x1="20" y1="70" x2="270" y2="70" stroke="#1f6fb2"/>
  <text x="32" y="88" fill="#1d2733">attributes: self.name, self.rate_hz</text>
  <line x1="20" y1="98" x2="270" y2="98" stroke="#1f6fb2"/>
  <text x="32" y="116" fill="#1d2733" font-family="monospace">__init__(self, name, rate_hz)</text>
  <text x="32" y="134" fill="#1d2733" font-family="monospace">period_s(self)</text>
  <rect x="20" y="200" width="250" height="110" rx="6" fill="#fdf3e4" stroke="#d17a00" stroke-width="1.5"/>
  <text x="32" y="222" font-weight="bold" fill="#b06400">class Camera(Sensor)</text>
  <line x1="20" y1="230" x2="270" y2="230" stroke="#d17a00"/>
  <text x="32" y="248" fill="#1d2733">+ self.hfov_deg</text>
  <line x1="20" y1="258" x2="270" y2="258" stroke="#d17a00"/>
  <text x="32" y="276" fill="#1d2733" font-family="monospace">__init__: super().__init__(…)</text>
  <text x="32" y="294" fill="#1d2733" font-family="monospace">+ footprint_m(self, altitude_m)</text>
  <line x1="145" y1="200" x2="145" y2="152" stroke="#1f6fb2" stroke-width="1.5" marker-end="url(#tri)"/>
  <text x="152" y="182" fill="#1f6fb2">inherits period_s()</text>
  <rect x="420" y="50" width="215" height="70" rx="6" fill="#fff" stroke="#1f6fb2"/>
  <text x="432" y="72" font-family="monospace" fill="#1d2733">imu = Sensor("imu", 50)</text>
  <text x="432" y="92" fill="#1d2733">name "imu", rate_hz 50</text>
  <text x="432" y="110" fill="#1d2733">imu.period_s() → 0.02</text>
  <rect x="420" y="200" width="215" height="90" rx="6" fill="#fff" stroke="#d17a00"/>
  <text x="432" y="222" font-family="monospace" fill="#1d2733">cam = Camera("day", 10, 90)</text>
  <text x="432" y="242" fill="#1d2733">name "day", rate_hz 10, hfov 90</text>
  <text x="432" y="262" fill="#1d2733">cam.period_s() → 0.1 (Sensor's)</text>
  <text x="432" y="280" fill="#1d2733">cam.footprint_m(100) → 200.0</text>
  <line x1="272" y1="95" x2="416" y2="85" stroke="#777" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <line x1="272" y1="255" x2="416" y2="245" stroke="#777" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="300" y="80" fill="#777">built from</text>
  <text x="300" y="240" fill="#777">built from</text>
  <text x="20" y="330" fill="#1d2733">A Camera IS a Sensor: isinstance(cam, Sensor) is True. Each object keeps its own attribute values.</text>
</svg>
