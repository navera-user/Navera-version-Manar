<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" font-family="sans-serif" font-size="13">
  <rect width="640" height="200" fill="#f7fafc"/>
  <text x="20" y="26" font-size="15" font-weight="bold" fill="#1d2733">4 positions, 3 segments: np.diff makes one value per segment</text>
  <g stroke="#1f6fb2" stroke-width="2.5"><line x1="80" y1="100" x2="240" y2="100"/><line x1="240" y1="100" x2="400" y2="100"/><line x1="400" y1="100" x2="560" y2="100"/></g>
  <g fill="#1f6fb2"><circle cx="80" cy="100" r="7"/><circle cx="240" cy="100" r="7"/><circle cx="400" cy="100" r="7"/><circle cx="560" cy="100" r="7"/></g>
  <g fill="#1d2733" text-anchor="middle">
    <text x="80" y="80">position 0</text><text x="240" y="80">position 1</text><text x="400" y="80">position 2</text><text x="560" y="80">position 3</text>
  </g>
  <g fill="#d17a00" text-anchor="middle">
    <text x="160" y="125">speed[0]</text><text x="320" y="125">speed[1]</text><text x="480" y="125">speed[2]</text>
    <text x="160" y="143" font-size="11">0 → 1</text><text x="320" y="143" font-size="11">1 → 2</text><text x="480" y="143" font-size="11">2 → 3</text>
  </g>
  <text x="20" y="180" fill="#1d2733">speed[i] goes FROM position i TO position i + 1: the position it reaches is i + 1.</text>
</svg>
