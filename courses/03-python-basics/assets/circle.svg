<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="sans-serif" font-size="13">
  <rect width="640" height="400" fill="#f7fafc"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4a5866"/>
    </marker>
  </defs>
  <!-- the 600 m circle (scale: 150 px = 600 m) -->
  <circle cx="200" cy="200" r="150" fill="#e3f1df" stroke="#4e9a44" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="96" y="74" fill="#2f6b28" font-weight="bold">600 m circle</text>
  <!-- axes -->
  <line x1="30" y1="200" x2="380" y2="200" stroke="#4a5866" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="200" y1="375" x2="200" y2="25" stroke="#4a5866" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="366" y="220" fill="#4a5866">x (east)</text>
  <text x="208" y="34" fill="#4a5866">y (north)</text>
  <!-- home -->
  <circle cx="200" cy="200" r="6" fill="#1d2733"/>
  <text x="150" y="218" fill="#1d2733">home (0, 0)</text>
  <!-- drone A: x=300, y=400 -> (275, 100) -->
  <path d="M200 200 H275 V100" fill="none" stroke="#f2a33a" stroke-width="2"/>
  <rect x="265" y="190" width="10" height="10" fill="none" stroke="#f2a33a"/>
  <line x1="200" y1="200" x2="275" y2="100" stroke="#0b6e8a" stroke-width="2.5"/>
  <text x="222" y="194" fill="#a8680d">x = 300</text>
  <text x="281" y="155" fill="#a8680d">y = 400</text>
  <text x="168" y="140" fill="#0b6e8a" font-weight="bold">500 m</text>
  <circle cx="275" cy="100" r="7" fill="#0b6e8a"/>
  <text x="286" y="96" fill="#0b6e8a" font-weight="bold">drone-1 (300, 400)</text>
  <!-- drone B: x=500, y=-500 -> (325, 325) -->
  <line x1="200" y1="200" x2="325" y2="325" stroke="#d64545" stroke-width="2.5" stroke-dasharray="4 3"/>
  <circle cx="325" cy="325" r="7" fill="#d64545"/>
  <text x="250" y="292" fill="#d64545" font-weight="bold">707 m</text>
  <text x="336" y="330" fill="#d64545" font-weight="bold">drone-2 (500, −500)</text>
  <!-- explanation -->
  <g fill="#1d2733">
    <text x="420" y="110" font-weight="bold">Pythagoras</text>
    <text x="420" y="134">distance² = x² + y²</text>
    <text x="420" y="162" fill="#0b6e8a">drone-1:</text>
    <text x="420" y="180" fill="#0b6e8a">√(300² + 400²) = 500</text>
    <text x="420" y="198" fill="#0b6e8a">500 ≤ 600 → INSIDE</text>
    <text x="420" y="226" fill="#d64545">drone-2:</text>
    <text x="420" y="244" fill="#d64545">√(500² + 500²) ≈ 707</text>
    <text x="420" y="262" fill="#d64545">707 &gt; 600 → OUTSIDE</text>
  </g>
</svg>
