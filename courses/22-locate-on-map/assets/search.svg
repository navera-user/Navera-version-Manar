<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="sans-serif" font-size="13">
  <rect width="560" height="380" fill="#f7fafc"/>
  <text x="280" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">The map piece to search</text>
  <!-- patch -->
  <rect x="60" y="40" width="320" height="320" fill="#e8e1d2" stroke="#1d2733" stroke-width="2"/>
  <g stroke="#cbbf9f" stroke-width="1">
    <line x1="60" y1="120" x2="380" y2="120"/><line x1="60" y1="200" x2="380" y2="200"/><line x1="60" y1="280" x2="380" y2="280"/>
    <line x1="140" y1="40" x2="140" y2="360"/><line x1="220" y1="40" x2="220" y2="360"/><line x1="300" y1="40" x2="300" y2="360"/>
  </g>
  <!-- search circle -->
  <circle cx="220" cy="200" r="100" fill="#0b6e8a" fill-opacity="0.12" stroke="#0b6e8a" stroke-width="2.5"/>
  <line x1="220" y1="200" x2="320" y2="200" stroke="#0b6e8a" stroke-width="2"/>
  <text x="246" y="194" fill="#0b6e8a">search_m</text>
  <line x1="320" y1="200" x2="380" y2="200" stroke="#f2a33a" stroke-width="3"/>
  <text x="324" y="218" fill="#a8680d">margin</text>
  <!-- prior -->
  <g stroke="#0b6e8a" stroke-width="3"><line x1="210" y1="200" x2="230" y2="200"/><line x1="220" y1="190" x2="220" y2="210"/></g>
  <text x="170" y="232" fill="#0b6e8a">prior</text>
  <!-- photo footprint at the edge of the circle, rotated -->
  <g transform="translate(290,125) rotate(30)">
    <rect x="-48" y="-36" width="96" height="72" fill="none" stroke="#d64545" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="4" fill="#d64545"/>
  </g>
  <text x="392" y="100" fill="#d64545">photo footprint</text>
  <text x="392" y="118" fill="#d64545">(true position at</text>
  <text x="392" y="136" fill="#d64545">the circle edge)</text>
  <!-- origin -->
  <circle cx="60" cy="40" r="4" fill="#1d2733"/>
  <text x="66" y="56" fill="#1d2733">(x0, y0)</text>
  <!-- legend -->
  <text x="398" y="250" fill="#1d2733">half-width =</text>
  <text x="398" y="268" fill="#1d2733">search_m + margin</text>
  <text x="398" y="296" fill="#1d2733">margin = half the</text>
  <text x="398" y="314" fill="#1d2733">photo's diagonal</text>
  <text x="398" y="332" fill="#1d2733">on the ground</text>
</svg>
