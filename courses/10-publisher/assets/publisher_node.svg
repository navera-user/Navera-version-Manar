<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="sans-serif" font-size="13">
  <rect width="700" height="330" fill="#f7fafc"/>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0b6e8a"/>
    </marker>
  </defs>
  <text x="350" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Inside the fake_gps node</text>
  <!-- node box -->
  <rect x="16" y="40" width="470" height="270" rx="14" fill="#e6f2f6" stroke="#0b6e8a" stroke-width="2"/>
  <text xml:space="preserve" x="30" y="62" font-weight="bold" fill="#0b6e8a">node "fake_gps"   (rclpy.spin keeps it alive)</text>
  <!-- timer -->
  <circle cx="80" cy="140" r="38" fill="#ffffff" stroke="#56606b" stroke-width="2"/>
  <line x1="80" y1="140" x2="80" y2="112" stroke="#1d2733" stroke-width="3"/>
  <line x1="80" y1="140" x2="100" y2="150" stroke="#1d2733" stroke-width="3"/>
  <text x="80" y="198" text-anchor="middle" fill="#1d2733">timer</text>
  <text x="80" y="214" text-anchor="middle" fill="#56606b">every 0.5 s</text>
  <!-- steps -->
  <g fill="#ffffff" stroke="#0b6e8a" stroke-width="1.5">
    <rect x="150" y="80" width="150" height="40" rx="6"/>
    <rect x="150" y="140" width="150" height="40" rx="6"/>
    <rect x="150" y="200" width="150" height="40" rx="6"/>
    <rect x="330" y="200" width="140" height="40" rx="6"/>
  </g>
  <g fill="#1d2733" font-family="monospace" font-size="12" text-anchor="middle">
    <text x="225" y="105">on_timer()</text>
    <text x="225" y="165">position_at(t)</text>
    <text x="225" y="225">make_fix(...)</text>
    <text x="400" y="225">self.pub.publish</text>
  </g>
  <g stroke="#0b6e8a" stroke-width="2" fill="none" marker-end="url(#c)">
    <path d="M118 128 L148 104"/>
    <path d="M225 120 L225 138"/>
    <path d="M225 180 L225 198"/>
    <path d="M300 220 L328 220"/>
    <path d="M470 220 L540 220"/>
  </g>
  <text x="310" y="150" fill="#56606b" font-size="12">t = seconds since start</text>
  <text x="310" y="166" fill="#56606b" font-size="12">→ (lat, lon)</text>
  <text x="150" y="270" fill="#56606b" font-size="12">a NavSatFix: stamp, status, lat, lon, alt, covariance</text>
  <!-- topic -->
  <rect x="544" y="186" width="140" height="68" rx="34" fill="#fff4e0" stroke="#f2a33a" stroke-width="2"/>
  <text x="614" y="214" text-anchor="middle" font-weight="bold" fill="#a8680d">/fake_gps/fix</text>
  <text x="614" y="232" text-anchor="middle" fill="#a8680d" font-size="11">sensor_msgs/NavSatFix</text>
  <text x="614" y="290" text-anchor="middle" fill="#56606b" font-size="12">anyone may subscribe:</text>
  <text x="614" y="306" text-anchor="middle" fill="#56606b" font-size="12">ros2 topic echo, NAVERA…</text>
</svg>
