<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="sans-serif" font-size="13">
  <rect width="720" height="380" fill="#f7fafc"/>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0b6e8a"/>
    </marker>
  </defs>
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Inside the fake_gps node: one timer tick</text>
  <!-- node box -->
  <rect x="16" y="40" width="500" height="324" rx="14" fill="#e6f2f6" stroke="#0b6e8a" stroke-width="2"/>
  <text x="30" y="62" font-weight="bold" fill="#0b6e8a">class FakeGps(Node) — node "fake_gps", kept alive by rclpy.spin</text>
  <!-- parameters -->
  <rect x="30" y="76" width="150" height="112" rx="8" fill="#ffffff" stroke="#a8680d" stroke-width="1.5"/>
  <text x="105" y="95" text-anchor="middle" font-weight="bold" fill="#a8680d">parameters</text>
  <g font-family="monospace" font-size="11.5" fill="#1d2733" xml:space="preserve">
    <text x="40" y="114">rate_hz      2.0</text>
    <text x="40" y="129">speed_mps    5.0</text>
    <text x="40" y="144">heading_deg 30.0</text>
    <text x="40" y="159">start_lat/lon</text>
    <text x="40" y="174">sigma_m      3.0</text>
  </g>
  <!-- timer -->
  <rect x="30" y="262" width="150" height="56" rx="8" fill="#ffffff" stroke="#0b6e8a" stroke-width="1.5"/>
  <text x="105" y="284" text-anchor="middle" font-weight="bold" fill="#1d2733">timer</text>
  <text x="105" y="302" text-anchor="middle" fill="#56606b">every 1 / rate_hz s</text>
  <!-- on_timer steps -->
  <rect x="214" y="76" width="288" height="272" rx="8" fill="#ffffff" stroke="#0b6e8a" stroke-width="1.5"/>
  <text x="358" y="95" text-anchor="middle" font-weight="bold" fill="#1d2733">on_timer()</text>
  <g fill="#1d2733">
    <text x="226" y="120">1. now = clock;  dt = t − last_t</text>
    <text x="226" y="148">2. read speed_mps, heading_deg</text>
    <text x="226" y="176">3. (v_n, v_e) = velocity_ne(v, h)</text>
    <text x="226" y="204">4. north += v_n·dt;  east += v_e·dt</text>
    <text x="226" y="232">5. (lat, lon) = offset_to_latlon(...)</text>
    <text x="226" y="260">6. msg = make_fix(lat, lon, alt,</text>
    <text x="246" y="278">σ, now.to_msg())</text>
    <text x="226" y="306">7. self.pub.publish(msg)</text>
  </g>
  <text x="358" y="338" text-anchor="middle" fill="#56606b" font-size="11.5">covariance = [σ², 0, 0, 0, σ², 0, 0, 0, (2σ)²] as floats</text>
  <!-- arrows inside -->
  <g stroke="#0b6e8a" stroke-width="2" fill="none" marker-end="url(#c)">
    <path d="M180 290 L212 290"/>
    <path d="M180 140 L212 146"/>
  </g>
  <!-- outside: ros2 param set -->
  <text x="105" y="232" text-anchor="middle" fill="#a8680d" font-size="11.5" font-family="monospace">ros2 param set …</text>
  <path d="M105 220 L105 192" stroke="#a8680d" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#c)"/>
  <!-- topic -->
  <g stroke="#0b6e8a" stroke-width="2.5" fill="none" marker-end="url(#c)">
    <path d="M502 302 L562 302"/>
  </g>
  <rect x="564" y="270" width="146" height="64" rx="10" fill="#fff7ea" stroke="#a8680d" stroke-width="2"/>
  <text x="637" y="294" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#a8680d">/fake_gps/fix</text>
  <text x="637" y="314" text-anchor="middle" fill="#56606b" font-size="11.5">sensor_msgs/NavSatFix</text>
  <text x="637" y="358" text-anchor="middle" fill="#56606b" font-size="11.5">any subscriber: echo,</text>
  <text x="637" y="373" text-anchor="middle" fill="#56606b" font-size="11.5">NAVERA (lesson 11)…</text>
</svg>
