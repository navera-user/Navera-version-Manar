<text x="148" y="128" text-anchor="end" font-size="12">calls (real)</text>
<rect x="492.8" y="112" width="195.2" height="22" fill="#fde2e2" stroke="#d64545" stroke-dasharray="3,2"/>
<text x="590.4" y="127" text-anchor="middle" font-size="11" fill="#d64545">callback busy 1.22 s</text>
<circle cx="160.0" cy="123" r="5" fill="#0b6e8a"/>
<circle cx="240.0" cy="123" r="5" fill="#0b6e8a"/>
<circle cx="339.20000000000005" cy="123" r="5" fill="#0b6e8a"/>
<circle cx="404.8" cy="123" r="5" fill="#0b6e8a"/>
<circle cx="492.8" cy="123" r="5" fill="#0b6e8a"/>
