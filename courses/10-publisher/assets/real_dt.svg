<text x="492.8" y="258" text-anchor="middle" font-size="11" fill="#d64545">20</text>
<text x="688.0" y="206" text-anchor="middle" font-size="11">3.30</text>
<text x="688.0" y="232" text-anchor="middle" font-size="11" fill="#2f7a2f">33.0</text>
<text x="688.0" y="258" text-anchor="middle" font-size="11" fill="#d64545">25</text>
<text x="720.0" y="206" text-anchor="middle" font-size="11">3.50</text>
