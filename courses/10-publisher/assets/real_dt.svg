<text x="430" y="292" text-anchor="middle" font-size="12" fill="#1d2733">Vehicle at 10 m/s. Distance travelled at each stamp: green = where it really was (10 × stamp),</text>
<text x="430" y="310" text-anchor="middle" font-size="12" fill="#1d2733">red = 5 m added per call. At 3.30 s it is 8 m behind its stamp; then 5 m behind for good (one tick lost).</text>
