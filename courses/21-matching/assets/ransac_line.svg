<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="13">
  <rect width="640" height="300" fill="#f7fafc"/>
  <text x="20" y="24" fill="#1d2733" font-weight="bold">RANSAC: try a line through 2 random points, count who agrees</text>
  <!-- axes -->
  <line x1="40" y1="270" x2="360" y2="270" stroke="#1d2733"/>
  <line x1="40" y1="270" x2="40" y2="40" stroke="#1d2733"/>
  <!-- tolerance band of the good line y = 250 - 0.55 (x-40) -->
  <polygon points="40,238 360,62 360,86 40,262" fill="#9cc7d6" opacity="0.45"/>
  <line x1="40" y1="250" x2="360" y2="74" stroke="#0b6e8a" stroke-width="3"/>
  <!-- least squares pulled by outliers -->
  <line x1="40" y1="215" x2="360" y2="95" stroke="#f2a33a" stroke-width="2.5" stroke-dasharray="7 5"/>
  <!-- inliers -->
  <g fill="#0b6e8a">
    <circle cx="55" cy="244" r="4"/><circle cx="80" cy="226" r="4"/><circle cx="102" cy="219" r="4"/><circle cx="125" cy="201" r="4"/>
    <circle cx="150" cy="191" r="4"/><circle cx="170" cy="176" r="4"/><circle cx="195" cy="167" r="4"/><circle cx="220" cy="149" r="4"/>
    <circle cx="245" cy="140" r="4"/><circle cx="270" cy="121" r="4"/><circle cx="295" cy="113" r="4"/><circle cx="320" cy="94" r="4"/><circle cx="345" cy="85" r="4"/>
  </g>
  <!-- outliers -->
  <g stroke="#d64545" stroke-width="2.5">
    <path d="M86 70 l8 8 m0 -8 l-8 8"/><path d="M136 96 l8 8 m0 -8 l-8 8"/><path d="M226 236 l8 8 m0 -8 l-8 8"/>
    <path d="M286 222 l8 8 m0 -8 l-8 8"/><path d="M60 120 l8 8 m0 -8 l-8 8"/><path d="M316 186 l8 8 m0 -8 l-8 8"/>
  </g>
  <!-- the 2 sampled points -->
  <circle cx="102" cy="219" r="8" fill="none" stroke="#1d2733" stroke-width="2"/>
  <circle cx="270" cy="121" r="8" fill="none" stroke="#1d2733" stroke-width="2"/>
  <!-- legend -->
  <rect x="380" y="44" width="244" height="226" rx="8" fill="#ffffff" stroke="#9cc7d6"/>
  <circle cx="398" cy="68" r="4" fill="#0b6e8a"/><text x="410" y="72" fill="#1d2733">inliers (agree with the line)</text>
  <path d="M394 86 l8 8 m0 -8 l-8 8" stroke="#d64545" stroke-width="2.5"/><text x="410" y="95" fill="#1d2733">outliers (wrong points)</text>
  <circle cx="398" cy="114" r="7" fill="none" stroke="#1d2733" stroke-width="2"/><text x="410" y="118" fill="#1d2733">the 2 points picked this try</text>
  <rect x="391" y="132" width="14" height="10" fill="#9cc7d6"/><text x="410" y="142" fill="#1d2733">± threshold around the line</text>
  <line x1="390" y1="162" x2="406" y2="162" stroke="#0b6e8a" stroke-width="3"/><text x="410" y="166" fill="#1d2733">RANSAC: most inliers wins</text>
  <line x1="390" y1="186" x2="406" y2="186" stroke="#f2a33a" stroke-width="2.5" stroke-dasharray="5 3"/><text x="410" y="190" fill="#1d2733">least squares on ALL points:</text>
  <text x="410" y="207" fill="#1d2733">pulled away by the outliers</text>
  <text x="392" y="236" fill="#0b6e8a">Repeat 200 times, keep the try</text>
  <text x="392" y="254" fill="#0b6e8a">with the most inliers.</text>
</svg>
