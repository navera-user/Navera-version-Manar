<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="13">
  <rect width="640" height="300" fill="#f7fafc"/>
  <text x="20" y="24" fill="#1d2733" font-weight="bold">A homography lays the drone view onto the map</text>
  <!-- drone view -->
  <text x="30" y="56" fill="#1d2733">drone view (480 × 360 px)</text>
  <rect x="30" y="66" width="160" height="120" fill="#e8dcc4" stroke="#0b6e8a" stroke-width="3"/>
  <path d="M30 140 L190 100 M110 66 L130 186" stroke="#6b5a3e" stroke-width="5"/>
  <rect x="60" y="80" width="22" height="18" fill="#ffffff" stroke="#6b5a3e"/>
  <circle cx="110" cy="126" r="5" fill="#d64545"/>
  <g fill="#f2a33a"><circle cx="30" cy="66" r="5"/><circle cx="190" cy="66" r="5"/><circle cx="190" cy="186" r="5"/><circle cx="30" cy="186" r="5"/></g>
  <text x="30" y="210" fill="#1d2733">red dot = the view's centre</text>
  <text x="30" y="228" fill="#1d2733">= the point under the drone</text>
  <!-- arrow -->
  <path d="M205 126 H275" stroke="#1d2733" stroke-width="2"/><path d="M275 120 L287 126 L275 132 Z" fill="#1d2733"/>
  <text x="212" y="114" fill="#1d2733" font-weight="bold">H</text>
  <!-- map patch -->
  <text x="300" y="56" fill="#1d2733">map patch (800 × 800 px)</text>
  <rect x="300" y="66" width="200" height="200" fill="#d8ccb0" stroke="#1d2733"/>
  <!-- the view laid on the map: rotated 30 deg, scaled 0.8 -->
  <g transform="translate(410 170) rotate(30)">
    <rect x="-64" y="-48" width="128" height="96" fill="#e8dcc4" fill-opacity="0.85" stroke="#0b6e8a" stroke-width="3"/>
    <path d="M-64 11 L64 -21 M0 -48 L16 48" stroke="#6b5a3e" stroke-width="4"/>
    <rect x="-40" y="-37" width="18" height="14" fill="#ffffff" stroke="#6b5a3e"/>
    <g fill="#f2a33a"><circle cx="-64" cy="-48" r="5"/><circle cx="64" cy="-48" r="5"/><circle cx="64" cy="48" r="5"/><circle cx="-64" cy="48" r="5"/></g>
    <circle cx="0" cy="0" r="5" fill="#d64545"/>
  </g>
  <rect x="512" y="66" width="118" height="200" rx="8" fill="#ffffff" stroke="#9cc7d6"/>
  <text x="520" y="88" fill="#1d2733">H tells where</text>
  <text x="520" y="106" fill="#1d2733">every view pixel</text>
  <text x="520" y="124" fill="#1d2733">lands on the map.</text>
  <text x="520" y="152" fill="#0b6e8a">Here: turned 30°,</text>
  <text x="520" y="170" fill="#0b6e8a">scale 0.8,</text>
  <text x="520" y="188" fill="#0b6e8a">moved.</text>
  <text x="520" y="216" fill="#a8680d">4 corners (orange)</text>
  <text x="520" y="234" fill="#a8680d">are enough to</text>
  <text x="520" y="252" fill="#a8680d">define it.</text>
  <text x="300" y="288" fill="#1d2733">centre on the map → map pixel → latitude/longitude (lesson 22)</text>
</svg>
