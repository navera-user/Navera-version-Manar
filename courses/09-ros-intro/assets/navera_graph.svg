<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" font-family="sans-serif" font-size="12">
  <rect width="720" height="390" fill="#f7fafc"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0b6e8a"/>
    </marker>
  </defs>
  <text x="360" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">NAVERA's ROS graph (simplified): boxes are nodes, orange names are topics</text>
  <!-- source nodes -->
  <g fill="#ffffff" stroke="#0b6e8a" stroke-width="2">
    <rect x="16" y="50" width="140" height="44" rx="8"/>
    <rect x="16" y="114" width="140" height="44" rx="8"/>
    <rect x="16" y="178" width="140" height="44" rx="8"/>
    <rect x="16" y="242" width="140" height="44" rx="8"/>
    <rect x="16" y="318" width="140" height="44" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#1d2733">
    <text x="86" y="69" font-weight="bold">gps_node</text><text x="86" y="85">GPS receiver</text>
    <text x="86" y="133" font-weight="bold">day_subscriber</text><text x="86" y="149">day vision</text>
    <text x="86" y="197" font-weight="bold">night_subscriber</text><text x="86" y="213">night vision</text>
    <text x="86" y="261" font-weight="bold">cn_subscriber</text><text x="86" y="277">the stars</text>
    <text x="86" y="337" font-weight="bold">imu_node</text><text x="86" y="353">attitude sensor</text>
  </g>
  <!-- straight arrows into the estimator -->
  <g stroke="#0b6e8a" stroke-width="2" fill="none" marker-end="url(#b)">
    <path d="M156 72 L346 72"/>
    <path d="M156 136 L346 136"/>
    <path d="M156 200 L346 200"/>
    <path d="M156 264 L346 264"/>
    <path d="M156 340 L346 340"/>
  </g>
  <g fill="#a8680d" font-family="monospace" font-size="11">
    <text x="166" y="66">/navera/estimate/gps</text>
    <text x="166" y="130">/navera/estimate/day</text>
    <text x="166" y="194">/navera/estimate/night</text>
    <text x="166" y="258">/navera/estimate/cn</text>
    <text x="166" y="334">/navera/sensors/imu</text>
  </g>
  <text x="166" y="88" fill="#56606b" font-size="10">PositionEstimate</text>
  <text x="166" y="356" fill="#56606b" font-size="10">Imu (liveness only)</text>
  <!-- estimator -->
  <rect x="348" y="48" width="110" height="316" rx="12" fill="#e6f2f6" stroke="#0b6e8a" stroke-width="2.5"/>
  <text x="403" y="190" text-anchor="middle" font-weight="bold" font-size="13" fill="#1d2733">estimator_node</text>
  <text x="403" y="210" text-anchor="middle" fill="#1d2733">the ARBITER</text>
  <text x="403" y="228" text-anchor="middle" fill="#56606b">who do I trust?</text>
  <!-- outputs -->
  <g stroke="#0b6e8a" stroke-width="2" fill="none" marker-end="url(#b)">
    <path d="M458 120 L586 120"/>
    <path d="M458 290 L586 290"/>
  </g>
  <g fill="#a8680d" font-family="monospace" font-size="11">
    <text x="463" y="112">/navera/position</text>
    <text x="463" y="282">/navera/nav_status</text>
  </g>
  <g fill="#ffffff" stroke="#3a8a4a" stroke-width="2">
    <rect x="588" y="98" width="122" height="44" rx="8"/>
    <rect x="588" y="268" width="122" height="44" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#1d2733">
    <text x="649" y="117" font-weight="bold">vehicle_output</text><text x="649" y="133">to the autopilot</text>
    <text x="649" y="287" font-weight="bold">web bridge</text><text x="649" y="303">operator screen</text>
  </g>
  <text x="649" y="205" text-anchor="middle" fill="#56606b">(both of them read</text>
  <text x="649" y="221" text-anchor="middle" fill="#56606b">both topics)</text>
</svg>
