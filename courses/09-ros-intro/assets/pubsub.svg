<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="13">
  <rect width="640" height="300" fill="#f7fafc"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0b6e8a"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Publish / subscribe: nobody calls anybody</text>
  <!-- publisher -->
  <rect x="24" y="110" width="140" height="64" rx="10" fill="#ffffff" stroke="#0b6e8a" stroke-width="2"/>
  <text x="94" y="137" text-anchor="middle" font-weight="bold" fill="#1d2733">node: talker</text>
  <text x="94" y="157" text-anchor="middle" fill="#56606b">publisher</text>
  <!-- topic -->
  <rect x="236" y="104" width="168" height="76" rx="38" fill="#fff4e0" stroke="#f2a33a" stroke-width="2"/>
  <text x="320" y="134" text-anchor="middle" font-weight="bold" fill="#a8680d">topic /chatter</text>
  <text x="320" y="154" text-anchor="middle" fill="#a8680d">type std_msgs/msg/String</text>
  <line x1="166" y1="142" x2="232" y2="142" stroke="#0b6e8a" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- subscribers -->
  <g>
    <rect x="476" y="44" width="140" height="52" rx="10" fill="#ffffff" stroke="#3a8a4a" stroke-width="2"/>
    <text x="546" y="66" text-anchor="middle" font-weight="bold" fill="#1d2733">node: listener</text>
    <text x="546" y="84" text-anchor="middle" fill="#56606b">subscriber</text>
    <rect x="476" y="116" width="140" height="52" rx="10" fill="#ffffff" stroke="#3a8a4a" stroke-width="2"/>
    <text x="546" y="138" text-anchor="middle" font-weight="bold" fill="#1d2733">node: listener_2</text>
    <text x="546" y="156" text-anchor="middle" fill="#56606b">subscriber</text>
    <rect x="476" y="188" width="140" height="52" rx="10" fill="#ffffff" stroke="#3a8a4a" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="546" y="210" text-anchor="middle" font-weight="bold" fill="#1d2733">ros2 topic echo</text>
    <text x="546" y="228" text-anchor="middle" fill="#56606b">(also a subscriber)</text>
  </g>
  <line x1="404" y1="130" x2="472" y2="72" stroke="#0b6e8a" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="406" y1="142" x2="472" y2="142" stroke="#0b6e8a" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="404" y1="156" x2="472" y2="210" stroke="#0b6e8a" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- message -->
  <rect x="172" y="200" width="160" height="40" rx="4" fill="#ffffff" stroke="#56606b"/>
  <text x="252" y="217" text-anchor="middle" fill="#1d2733">message</text>
  <text x="252" y="233" text-anchor="middle" font-family="monospace" fill="#1d2733">data: 'Hello World: 7'</text>
  <line x1="220" y1="198" x2="220" y2="150" stroke="#56606b" stroke-dasharray="3 3"/>
  <text x="320" y="282" text-anchor="middle" fill="#56606b">All of this happens inside one ROS_DOMAIN_ID. Another domain = another, separate post office.</text>
</svg>
