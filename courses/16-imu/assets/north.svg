  <text x="340" y="170" fill="#1d2733">true heading =</text>
  <text x="340" y="188" fill="#1d2733">magnetic heading</text>
  <text x="340" y="206" fill="#1d2733">+ declination</text>
  <text x="340" y="228" fill="#1d2733" font-size="12">(east positive)</text>
