<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="sans-serif" font-size="13">
  <rect width="640" height="330" fill="#f7fafc"/>
  <text x="320" y="22" text-anchor="middle" fill="#1d2733" font-weight="bold">Repeatability measured in the lab (1000 points per detector, ε = 3 px)</text><text x="320" y="42" text-anchor="middle" fill="#5a6573" font-size="12">Sousse city map patch → synthetic drone photo, OpenCV 4.11</text>
  <!-- axis: y = 270 is 0, y = 70 is 1.0 (200 px) -->
  <g stroke="#c9d2dc" stroke-width="1">
    <line x1="60" y1="70" x2="620" y2="70"/><line x1="60" y1="120" x2="620" y2="120"/>
    <line x1="60" y1="170" x2="620" y2="170"/><line x1="60" y1="220" x2="620" y2="220"/>
  </g>
  <line x1="60" y1="270" x2="620" y2="270" stroke="#1d2733" stroke-width="1.5"/>
  <g fill="#5a6573" font-size="11" text-anchor="end">
    <text x="54" y="74">1.0</text><text x="54" y="124">0.75</text><text x="54" y="174">0.5</text>
    <text x="54" y="224">0.25</text><text x="54" y="274">0</text>
  </g>
  <!-- chance level 0.10 → y = 250 -->
  <line x1="60" y1="250" x2="620" y2="250" stroke="#5a6573" stroke-width="1.5" stroke-dasharray="6 4"/>
  
  <!-- groups: centres 130, 270, 410, 550; bars 30 wide: harris, orb, sift -->
  <g fill="#f2a33a">
    <rect x="85" y="142" width="30" height="128"/><rect x="225" y="106" width="30" height="164"/>
    <rect x="365" y="206" width="30" height="64"/><rect x="505" y="92" width="30" height="178"/>
  </g>
  <g fill="#8a9bb0">
    <rect x="115" y="132" width="30" height="138"/><rect x="255" y="194" width="30" height="76"/>
    <rect x="395" y="256" width="30" height="14"/><rect x="535" y="165" width="30" height="105"/>
  </g>
  <g fill="#0b6e8a">
    <rect x="145" y="164" width="30" height="106"/><rect x="285" y="102" width="30" height="168"/>
    <rect x="425" y="113" width="30" height="157"/><rect x="565" y="108" width="30" height="162"/>
  </g>
  <g fill="#1d2733" font-size="11" text-anchor="middle">
    <text x="100" y="137">0.64</text><text x="130" y="127">0.69</text><text x="160" y="159">0.53</text>
    <text x="240" y="101">0.82</text><text x="270" y="189">0.38</text><text x="300" y="97">0.84</text>
    <text x="380" y="201">0.32</text><text x="410" y="241">0.07</text><text x="440" y="108">0.79</text>
    <text x="520" y="87">0.89</text><text x="550" y="160">0.53</text><text x="580" y="103">0.81</text>
  </g>
  <g fill="#1d2733" text-anchor="middle">
    <text x="130" y="290">turned 35°</text><text x="270" y="290">2× closer</text>
    <text x="410" y="290" font-weight="bold">3.9× closer</text><text x="550" y="290">35° and 1.6×</text>
  </g>
  <!-- legend -->
  <rect x="110" y="306" width="14" height="12" fill="#f2a33a"/><text x="130" y="317" fill="#1d2733">Harris (yours)</text>
  <rect x="250" y="306" width="14" height="12" fill="#8a9bb0"/><text x="270" y="317" fill="#1d2733">ORB</text>
  <rect x="330" y="306" width="14" height="12" fill="#0b6e8a"/><text x="350" y="317" fill="#1d2733">SIFT</text>
  <line x1="410" y1="312" x2="440" y2="312" stroke="#5a6573" stroke-width="1.5" stroke-dasharray="6 4"/><text x="448" y="317" fill="#1d2733">chance level ≈ 0.10</text>
</svg>
