<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="sans-serif" font-size="13">
  <rect width="760" height="300" fill="#f7fafc"/>
  <text x="380" y="24" text-anchor="middle" fill="#1d2733" font-weight="bold">From a photo to latitude and longitude: coarse, then fine</text>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5a6573"/></marker></defs>
  <g>
    <rect x="14" y="50" width="130" height="92" rx="8" fill="#ffffff" stroke="#9aa8b6"/>
    <text x="79" y="72" text-anchor="middle" font-weight="bold" fill="#1d2733">inputs</text>
    <text x="24" y="92" fill="#1d2733">photo (640 × 480)</text>
    <text x="24" y="109" fill="#1d2733">height, heading</text>
    <text x="24" y="126" fill="#1d2733">prior (lat, lon, σ)</text>
    <line x1="144" y1="96" x2="176" y2="96" stroke="#5a6573" stroke-width="2" marker-end="url(#a)"/>
    <rect x="180" y="50" width="130" height="92" rx="8" fill="#ffffff" stroke="#9aa8b6"/>
    <text x="245" y="72" text-anchor="middle" font-weight="bold" fill="#1d2733">search circle</text>
    <text x="190" y="96" fill="#1d2733">r = clamp(k·σ,</text>
    <text x="190" y="113" fill="#1d2733">        r_min, r_max)</text>
    <line x1="310" y1="96" x2="350" y2="96" stroke="#5a6573" stroke-width="2" marker-end="url(#a)"/>
    <polygon points="355,96 400,60 445,96 400,132" fill="#fff4d6" stroke="#c99a2e"/>
    <text x="400" y="93" text-anchor="middle" fill="#1d2733">r small?</text>
    <text x="400" y="109" text-anchor="middle" font-size="11" fill="#5a6573">(your rule)</text>
    <line x1="400" y1="132" x2="400" y2="190" stroke="#5a6573" stroke-width="2" marker-end="url(#a)"/>
    <text x="408" y="165" fill="#5a6573">no</text>
    <line x1="445" y1="96" x2="586" y2="96" stroke="#5a6573" stroke-width="2" marker-end="url(#a)"/>
    <text x="452" y="88" fill="#5a6573">yes: one patch for</text><text x="452" y="122" fill="#5a6573">the whole circle</text>
    <rect x="320" y="194" width="160" height="80" rx="8" fill="#e6f2f7" stroke="#0b6e8a"/>
    <text x="400" y="216" text-anchor="middle" font-weight="bold" fill="#0b6e8a">COARSE: retrieval</text>
    <text x="400" y="236" text-anchor="middle" fill="#1d2733">embed the view, rank the</text>
    <text x="400" y="253" text-anchor="middle" fill="#1d2733">tiles of the circle → top k</text>
    <line x1="480" y1="234" x2="586" y2="140" stroke="#5a6573" stroke-width="2" marker-end="url(#a)"/>
    <text x="492" y="262" fill="#5a6573">a small circle</text>
    <text x="492" y="278" fill="#5a6573">around each tile</text>
    <rect x="590" y="50" width="156" height="110" rx="8" fill="#e8f5ee" stroke="#1b9e77"/>
    <text x="668" y="72" text-anchor="middle" font-weight="bold" fill="#137a5b">FINE: local match</text>
    <text x="600" y="92" fill="#1d2733">like_map, SIFT, ratio,</text>
    <text x="600" y="109" fill="#1d2733">RANSAC similarity,</text>
    <text x="600" y="126" fill="#1d2733">gates: inliers, scale</text>
    <text x="600" y="143" fill="#1d2733">centre → lat, lon</text>
    <line x1="668" y1="160" x2="668" y2="196" stroke="#5a6573" stroke-width="2" marker-end="url(#a)"/>
    <rect x="590" y="200" width="156" height="74" rx="8" fill="#ffffff" stroke="#9aa8b6"/>
    <text x="668" y="222" text-anchor="middle" font-weight="bold" fill="#1d2733">output</text>
    <text x="600" y="242" fill="#1d2733">(lat, lon) ± 30 m</text>
    <text x="600" y="260" fill="#d64545">or "no fix" + a reason</text>
  </g>
  <text x="14" y="200" fill="#5a6573" font-size="12">coarse: which 250 m tile?</text>
  <text x="14" y="218" fill="#5a6573" font-size="12">fine: which metre?</text>
</svg>
