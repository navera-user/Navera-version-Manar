<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="sans-serif" font-size="13">
  <rect width="700" height="330" fill="#f7fafc"/>
  <text x="350" y="22" text-anchor="middle" fill="#1d2733" font-weight="bold">The search circle: tiles whose centre is within r of the prior are the candidates</text>
  <g transform="translate(30,40)">
    <g stroke="#c8d0d8" stroke-width="1" fill="none">
      <rect x="0" y="0" width="280" height="280"/>
      <line x1="40" y1="0" x2="40" y2="280"/><line x1="80" y1="0" x2="80" y2="280"/><line x1="120" y1="0" x2="120" y2="280"/>
      <line x1="160" y1="0" x2="160" y2="280"/><line x1="200" y1="0" x2="200" y2="280"/><line x1="240" y1="0" x2="240" y2="280"/>
      <line x1="0" y1="40" x2="280" y2="40"/><line x1="0" y1="80" x2="280" y2="80"/><line x1="0" y1="120" x2="280" y2="120"/>
      <line x1="0" y1="160" x2="280" y2="160"/><line x1="0" y1="200" x2="280" y2="200"/><line x1="0" y1="240" x2="280" y2="240"/>
    </g>
    <g fill="#e6f2f7" stroke="#0b6e8a" stroke-width="1" opacity="0.9">
      <rect x="80" y="40" width="40" height="40"/><rect x="120" y="40" width="40" height="40"/><rect x="160" y="40" width="40" height="40"/>
      <rect x="40" y="80" width="40" height="40"/><rect x="80" y="80" width="40" height="40"/><rect x="120" y="80" width="40" height="40"/><rect x="160" y="80" width="40" height="40"/><rect x="200" y="80" width="40" height="40"/>
      <rect x="40" y="120" width="40" height="40"/><rect x="80" y="120" width="40" height="40"/><rect x="120" y="120" width="40" height="40"/><rect x="160" y="120" width="40" height="40"/><rect x="200" y="120" width="40" height="40"/>
      <rect x="40" y="160" width="40" height="40"/><rect x="80" y="160" width="40" height="40"/><rect x="120" y="160" width="40" height="40"/><rect x="160" y="160" width="40" height="40"/><rect x="200" y="160" width="40" height="40"/>
      <rect x="80" y="200" width="40" height="40"/><rect x="120" y="200" width="40" height="40"/><rect x="160" y="200" width="40" height="40"/>
    </g>
    <circle cx="142" cy="138" r="96" fill="none" stroke="#c97a2e" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="142" cy="138" r="5" fill="#c97a2e"/>
    <text x="150" y="134" fill="#c97a2e" font-weight="bold">prior</text>
    <line x1="142" y1="138" x2="238" y2="138" stroke="#c97a2e" stroke-width="1.5"/>
    <text x="196" y="153" fill="#c97a2e">r = 3σ</text>
    <circle cx="186" cy="96" r="6" fill="#1b9e77"/>
    <text x="196" y="72" fill="#137a5b" font-weight="bold">truth</text>
  </g>
  <g transform="translate(340,60)" fill="#1d2733">
    <text x="0" y="10">• blue: the candidate tiles (centre inside the circle)</text>
    <text x="0" y="34">• one tile at zoom 17 ≈ 248 m at Sousse: even the BEST</text>
    <text x="0" y="52">   tile's centre is tens of metres from the truth</text>
    <text x="0" y="76">• the circle holds the truth with probability</text>
    <text x="0" y="94">   1 − exp(−k²/2): 98.9 % for k = 3 (if σ is honest)</text>
    <text x="0" y="118">• candidates ≈ π r² / (248 m)²: r 600 m → about 18,</text>
    <text x="0" y="136">   r 1 200 m → about 74 (more look-alikes)</text>
    <text x="0" y="160">• "stay at the prior" errs as much as the prior;</text>
    <text x="0" y="178">   "random tile" errs about as much as the circle</text>
    <text x="0" y="202">• (drawing not to scale)</text>
  </g>
</svg>
