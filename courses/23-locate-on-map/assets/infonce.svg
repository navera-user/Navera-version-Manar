<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif" font-size="13">
  <rect width="720" height="300" fill="#f7fafc"/>
  <text x="360" y="22" text-anchor="middle" fill="#1d2733" font-weight="bold">InfoNCE: in each row, the tile's own view must win the softmax</text>
  <g transform="translate(110,55)">
    <text x="100" y="-10" text-anchor="middle" fill="#1d2733">views zp[0] … zp[3] (one batch)</text>
    <text x="-12" y="100" text-anchor="middle" fill="#1d2733" transform="rotate(-90,-12,100)">tiles za[0] … za[3]</text>
    <g stroke="#ffffff" stroke-width="2">
      <rect x="0" y="0" width="50" height="50" fill="#1b9e77"/><rect x="50" y="0" width="50" height="50" fill="#dfe6ec"/><rect x="100" y="0" width="50" height="50" fill="#c9d4dd"/><rect x="150" y="0" width="50" height="50" fill="#dfe6ec"/>
      <rect x="0" y="50" width="50" height="50" fill="#dfe6ec"/><rect x="50" y="50" width="50" height="50" fill="#1b9e77"/><rect x="100" y="50" width="50" height="50" fill="#e98b8b"/><rect x="150" y="50" width="50" height="50" fill="#dfe6ec"/>
      <rect x="0" y="100" width="50" height="50" fill="#c9d4dd"/><rect x="50" y="100" width="50" height="50" fill="#dfe6ec"/><rect x="100" y="100" width="50" height="50" fill="#1b9e77"/><rect x="150" y="100" width="50" height="50" fill="#dfe6ec"/>
      <rect x="0" y="150" width="50" height="50" fill="#dfe6ec"/><rect x="50" y="150" width="50" height="50" fill="#c9d4dd"/><rect x="100" y="150" width="50" height="50" fill="#dfe6ec"/><rect x="150" y="150" width="50" height="50" fill="#1b9e77"/>
    </g>
    <text x="25" y="230" text-anchor="middle" font-size="11" fill="#5a6573">each cell: za[i]·zp[j] / τ</text>
  </g>
  <g transform="translate(360,70)" fill="#1d2733">
    <text x="0" y="0"><tspan fill="#1b9e77" font-weight="bold">green diagonal</tspan>: a tile and a view of a place inside it</text>
    <text x="0" y="22"><tspan fill="#d64545" font-weight="bold">red</tspan>: another place that looks too much alike</text>
    <text x="0" y="52">one row = one classification with B answers:</text>
    <text x="0" y="72">softmax turns the row into probabilities,</text>
    <text x="0" y="92">the loss of the row is −log(probability of its diagonal)</text>
    <text x="0" y="122">small τ (temperature) sharpens the softmax:</text>
    <text x="0" y="142">the closest impostors count much more</text>
    <text x="0" y="172">every other view of the batch is a negative:</text>
    <text x="0" y="192">a batch of 64 gives 63 impostors per row, for free</text>
  </g>
</svg>
