<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="sans-serif" font-size="13">
  <rect width="760" height="260" fill="#f7fafc"/>
  <text x="380" y="24" text-anchor="middle" fill="#1d2733" font-weight="bold">DINOv2 (a vision transformer): picture → patches → tokens → one embedding</text>
  <defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5a6573"/></marker></defs>
  <rect x="20" y="50" width="160" height="160" fill="#efe9e1" stroke="#9aa8b6"/>
  <g stroke="#b9b0a4" stroke-width="1">
    <line x1="40" y1="50" x2="40" y2="210"/><line x1="60" y1="50" x2="60" y2="210"/><line x1="80" y1="50" x2="80" y2="210"/>
    <line x1="100" y1="50" x2="100" y2="210"/><line x1="120" y1="50" x2="120" y2="210"/><line x1="140" y1="50" x2="140" y2="210"/>
    <line x1="160" y1="50" x2="160" y2="210"/>
    <line x1="20" y1="70" x2="180" y2="70"/><line x1="20" y1="90" x2="180" y2="90"/><line x1="20" y1="110" x2="180" y2="110"/>
    <line x1="20" y1="130" x2="180" y2="130"/><line x1="20" y1="150" x2="180" y2="150"/><line x1="20" y1="170" x2="180" y2="170"/>
    <line x1="20" y1="190" x2="180" y2="190"/>
  </g>
  <rect x="60" y="90" width="20" height="20" fill="none" stroke="#d64545" stroke-width="2"/>
  <text x="100" y="230" text-anchor="middle" fill="#1d2733">size × size pixels, cut into</text>
  <text x="100" y="247" text-anchor="middle" fill="#1d2733">squares of 14 × 14 (drawn fewer)</text>
  <line x1="190" y1="130" x2="236" y2="130" stroke="#5a6573" stroke-width="2" marker-end="url(#b)"/>
  <g>
    <rect x="245" y="60" width="26" height="140" rx="4" fill="#fde2c8" stroke="#c97a2e"/>
    <text x="258" y="215" text-anchor="middle" font-size="11" fill="#c97a2e">class</text>
    <rect x="277" y="60" width="26" height="140" rx="4" fill="#e6f2f7" stroke="#0b6e8a"/>
    <rect x="309" y="60" width="26" height="140" rx="4" fill="#e6f2f7" stroke="#0b6e8a"/>
    <rect x="341" y="60" width="26" height="140" rx="4" fill="#e6f2f7" stroke="#0b6e8a"/>
    <text x="387" y="135" fill="#0b6e8a" font-size="18">…</text>
    <rect x="410" y="60" width="26" height="140" rx="4" fill="#e6f2f7" stroke="#0b6e8a"/>
    <text x="340" y="52" text-anchor="middle" fill="#1d2733">one token (384 numbers) per patch, plus a class token</text>
  </g>
  <line x1="446" y1="130" x2="486" y2="130" stroke="#5a6573" stroke-width="2" marker-end="url(#b)"/>
  <rect x="490" y="80" width="120" height="100" rx="8" fill="#ffffff" stroke="#9aa8b6"/>
  <text x="550" y="112" text-anchor="middle" fill="#1d2733">12 attention</text>
  <text x="550" y="130" text-anchor="middle" fill="#1d2733">layers: every token</text>
  <text x="550" y="148" text-anchor="middle" fill="#1d2733">looks at all others</text>
  <line x1="610" y1="130" x2="646" y2="130" stroke="#5a6573" stroke-width="2" marker-end="url(#b)"/>
  <rect x="652" y="60" width="26" height="140" rx="4" fill="#fde2c8" stroke="#c97a2e"/>
  <text x="700" y="100" fill="#1d2733">the class</text>
  <text x="700" y="117" fill="#1d2733">token:</text>
  <text x="700" y="134" fill="#1d2733">384</text>
  <text x="700" y="151" fill="#1d2733">numbers</text>
  <text x="665" y="225" text-anchor="middle" fill="#1d2733">÷ its length</text>
  <text x="665" y="242" text-anchor="middle" fill="#1d2733">= the embedding</text>
</svg>
