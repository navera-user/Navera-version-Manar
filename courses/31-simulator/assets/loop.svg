<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 430" font-family="sans-serif" font-size="13"><rect width="816" height="430" fill="#f7fafc"/><defs><marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d2733"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98a06"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e4f"/></marker></defs><text x="20" y="26" font-weight="bold" font-size="15" fill="#1d2733">The closed loop of mission 31: what is real, what is simulated</text><rect x="14" y="40" width="262" height="330" rx="10" fill="#fdf3e3" stroke="#c98a06" stroke-dasharray="5 4"/><text x="145" y="60" text-anchor="middle" font-weight="bold" fill="#c98a06">SIMULATED (sim/world.py)</text><rect x="30" y="72" width="230" height="62" rx="8" fill="#ffffff" stroke="#c98a06" stroke-width="2"/><text x="145.0" y="92" text-anchor="middle" font-weight="bold" fill="#c98a06">GPS receiver</text><text x="145.0" y="110" text-anchor="middle" font-size="12" fill="#1d2733">Gauss–Markov noise, 5 Hz</text><text x="145.0" y="126" text-anchor="middle" font-size="12" fill="#1d2733">jammed · off · jump · drift</text><rect x="30" y="144" width="230" height="62" rx="8" fill="#ffffff" stroke="#c98a06" stroke-width="2"/><text x="145.0" y="164" text-anchor="middle" font-weight="bold" fill="#c98a06">cameras</text><text x="145.0" y="182" text-anchor="middle" font-size="12" fill="#1d2733">error profile (target / measured)</text><text x="145.0" y="198" text-anchor="middle" font-size="12" fill="#1d2733">or YOUR networks on pictures</text><rect x="30" y="216" width="230" height="46" rx="8" fill="#ffffff" stroke="#c98a06" stroke-width="2"/><text x="145.0" y="236" text-anchor="middle" font-weight="bold" fill="#c98a06">IMU</text><text x="145.0" y="254" text-anchor="middle" font-size="12" fill="#1d2733">ok · tilt bias · off</text><rect x="30" y="274" width="230" height="80" rx="8" fill="#ffffff" stroke="#c98a06" stroke-width="2"/><text x="145.0" y="294" text-anchor="middle" font-weight="bold" fill="#c98a06">truth (kinematics)</text><text x="145.0" y="312" text-anchor="middle" font-size="12" fill="#1d2733">x[k+1] = f(x[k], u[k], Δt)</text><text x="145.0" y="328" text-anchor="middle" font-size="12" fill="#1d2733">turn rate and acceleration</text><text x="145.0" y="344" text-anchor="middle" font-size="12" fill="#1d2733">limits, no wind, Δt = 0.1 s</text><rect x="300" y="40" width="250" height="330" rx="10" fill="#e8f3f6" stroke="#0b6e8a" stroke-dasharray="5 4"/><text x="425" y="60" text-anchor="middle" font-weight="bold" fill="#0b6e8a">REAL: NAVERA Lite</text><rect x="316" y="72" width="218" height="62" rx="8" fill="#ffffff" stroke="#0b6e8a" stroke-width="2"/><text x="425.0" y="92" text-anchor="middle" font-weight="bold" fill="#0b6e8a">judge (mission 29)</text><text x="425.0" y="110" text-anchor="middle" font-size="12" fill="#1d2733">+ guard (mission 30)</text><text x="425.0" y="126" text-anchor="middle" font-size="12" fill="#1d2733">Estimates → Decision</text><rect x="316" y="160" width="218" height="62" rx="8" fill="#ffffff" stroke="#0b6e8a" stroke-width="2"/><text x="425.0" y="180" text-anchor="middle" font-weight="bold" fill="#0b6e8a">messenger (output.py)</text><text x="425.0" y="198" text-anchor="middle" font-size="12" fill="#1d2733">each NEW position once</text><text x="425.0" y="214" text-anchor="middle" font-size="12" fill="#1d2733">GPS_INPUT bytes, MAVLink 2</text><rect x="316" y="248" width="218" height="106" rx="8" fill="#ffffff" stroke="#0b6e8a" stroke-width="2"/><text x="425.0" y="268" text-anchor="middle" font-weight="bold" fill="#0b6e8a">your choice: --mine</text><text x="425.0" y="286" text-anchor="middle" font-size="12" fill="#1d2733">your arbiter (29), guard (30)</text><text x="425.0" y="302" text-anchor="middle" font-size="12" fill="#1d2733">your Kalman filter (28)</text><text x="425.0" y="318" text-anchor="middle" font-size="12" fill="#1d2733">your weights (21, 25)</text><text x="425.0" y="334" text-anchor="middle" font-size="12" fill="#1d2733">your decoder (31) always</text><rect x="574" y="40" width="226" height="330" rx="10" fill="#eaf6ee" stroke="#2e9e4f" stroke-dasharray="5 4"/><text x="687" y="60" text-anchor="middle" font-weight="bold" fill="#2e9e4f">the autopilot (simulated)</text><rect x="590" y="72" width="194" height="78" rx="8" fill="#ffffff" stroke="#2e9e4f" stroke-width="2"/><text x="687.0" y="92" text-anchor="middle" font-weight="bold" fill="#2e9e4f">reads the link</text><text x="687.0" y="110" text-anchor="middle" font-size="12" fill="#1d2733">YOUR parse_frames</text><text x="687.0" y="126" text-anchor="middle" font-size="12" fill="#1d2733">YOUR decode_gps_input</text><text x="687.0" y="142" text-anchor="middle" font-size="12" fill="#1d2733">(only these bytes)</text><rect x="590" y="166" width="194" height="78" rx="8" fill="#ffffff" stroke="#2e9e4f" stroke-width="2"/><text x="687.0" y="186" text-anchor="middle" font-weight="bold" fill="#2e9e4f">its filter</text><text x="687.0" y="204" text-anchor="middle" font-size="12" fill="#1d2733">predict with its IMU</text><text x="687.0" y="220" text-anchor="middle" font-size="12" fill="#1d2733">update, χ² gate 99 %</text><text x="687.0" y="236" text-anchor="middle" font-size="12" fill="#1d2733">glitch reset after 5 s</text><rect x="590" y="260" width="194" height="78" rx="8" fill="#ffffff" stroke="#2e9e4f" stroke-width="2"/><text x="687.0" y="280" text-anchor="middle" font-weight="bold" fill="#2e9e4f">guidance</text><text x="687.0" y="298" text-anchor="middle" font-size="12" fill="#1d2733">fly to the destination</text><text x="687.0" y="314" text-anchor="middle" font-size="12" fill="#1d2733">no fix for 5 s:</text><text x="687.0" y="330" text-anchor="middle" font-size="12" fill="#1d2733">FAILSAFE (LAND / HOLD)</text><line x1="260" y1="103" x2="316" y2="103" stroke="#c98a06" stroke-width="2" marker-end="url(#ma)"/><text x="288.0" y="97.0" text-anchor="middle" font-size="12" fill="#c98a06">fixes</text><line x1="260" y1="175" x2="316" y2="118" stroke="#c98a06" stroke-width="2" marker-end="url(#ma)"/><line x1="425" y1="134" x2="425" y2="160" stroke="#0b6e8a" stroke-width="2" marker-end="url(#mb)"/><line x1="534" y1="191" x2="590" y2="111" stroke="#0b6e8a" stroke-width="2" marker-end="url(#mb)"/><text x="562.0" y="143.0" text-anchor="middle" font-size="12" fill="#0b6e8a">bytes</text><line x1="687" y1="150" x2="687" y2="166" stroke="#2e9e4f" stroke-width="2" marker-end="url(#mg)"/><line x1="687" y1="244" x2="687" y2="260" stroke="#2e9e4f" stroke-width="2" marker-end="url(#mg)"/><path d="M687 338 L687 392 L145 392 L145 354" fill="none" stroke="#1d2733" stroke-width="2" marker-end="url(#mi)"/><text x="416" y="386" text-anchor="middle" font-size="12" fill="#1d2733">commands u[k]: the vehicle moves → the sensors see the NEW true position → …</text><text x="20" y="418" font-size="12" fill="#7a8794">A wrong position from NAVERA Lite changes the trajectory, which changes the next measurements: only a closed loop shows that.</text></svg>