<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 296" font-family="sans-serif" font-size="13"><rect width="820" height="296" fill="#f7fafc"/><defs><marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d2733"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98a06"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e4f"/></marker></defs><text x="20" y="26" font-weight="bold" font-size="15" fill="#1d2733">One MAVLink 2 frame: the first GPS_INPUT of gps_input.bin</text><rect x="20" y="44" width="60" height="56" fill="#ffffff" stroke="#0b6e8a" stroke-width="1.5"/><text x="50.0" y="64" text-anchor="middle" font-size="12" fill="#0b6e8a">STX</text><text x="50.0" y="88" text-anchor="middle" font-family="monospace" fill="#1d2733">fd</text><text x="23" y="116" font-size="11" fill="#7a8794">0</text><rect x="80" y="44" width="60" height="56" fill="#ffffff" stroke="#0b6e8a" stroke-width="1.5"/><text x="110.0" y="64" text-anchor="middle" font-size="12" fill="#0b6e8a">len</text><text x="110.0" y="88" text-anchor="middle" font-family="monospace" fill="#1d2733">3f</text><text x="83" y="116" font-size="11" fill="#7a8794">1</text><rect x="140" y="44" width="60" height="56" fill="#ffffff" stroke="#0b6e8a" stroke-width="1.5"/><text x="170.0" y="64" text-anchor="middle" font-size="12" fill="#0b6e8a">inc</text><text x="170.0" y="88" text-anchor="middle" font-family="monospace" fill="#1d2733">00</text><text x="143" y="116" font-size="11" fill="#7a8794">2</text><rect x="200" y="44" width="60" height="56" fill="#ffffff" stroke="#0b6e8a" stroke-width="1.5"/><text x="230.0" y="64" text-anchor="middle" font-size="12" fill="#0b6e8a">cmp</text><text x="230.0" y="88" text-anchor="middle" font-family="monospace" fill="#1d2733">00</text><text x="203" y="116" font-size="11" fill="#7a8794">3</text><rect x="260" y="44" width="60" height="56" fill="#ffffff" stroke="#0b6e8a" stroke-width="1.5"/><text x="290.0" y="64" text-anchor="middle" font-size="12" fill="#0b6e8a">seq</text><text x="290.0" y="88" text-anchor="middle" font-family="monospace" fill="#1d2733">00</text><text x="263" y="116" font-size="11" fill="#7a8794">4</text><rect x="320" y="44" width="60" height="56" fill="#ffffff" stroke="#0b6e8a" stroke-width="1.5"/><text x="350.0" y="64" text-anchor="middle" font-size="12" fill="#0b6e8a">sys</text><text x="350.0" y="88" text-anchor="middle" font-family="monospace" fill="#1d2733">01</text><text x="323" y="116" font-size="11" fill="#7a8794">5</text><rect x="380" y="44" width="60" height="56" fill="#ffffff" stroke="#0b6e8a" stroke-width="1.5"/><text x="410.0" y="64" text-anchor="middle" font-size="12" fill="#0b6e8a">comp</text><text x="410.0" y="88" text-anchor="middle" font-family="monospace" fill="#1d2733">bf</text><text x="383" y="116" font-size="11" fill="#7a8794">6</text><rect x="440" y="44" width="120" height="56" fill="#ffffff" stroke="#0b6e8a" stroke-width="1.5"/><text x="500.0" y="64" text-anchor="middle" font-size="12" fill="#0b6e8a">msgid (3 B, LE)</text><text x="500.0" y="88" text-anchor="middle" font-family="monospace" fill="#1d2733">e8 00 00</text><text x="443" y="116" font-size="11" fill="#7a8794">7</text><rect x="560" y="44" width="140" height="56" fill="#fff8ec" stroke="#c98a06" stroke-width="1.5"/><text x="630" y="64" text-anchor="middle" font-size="12" fill="#c98a06">payload (len bytes)</text><text x="630" y="88" text-anchor="middle" fill="#1d2733">63 bytes</text><text x="563" y="116" font-size="11" fill="#7a8794">10</text><rect x="700" y="44" width="84" height="56" fill="#ffffff" stroke="#d64545" stroke-width="1.5"/><text x="742" y="64" text-anchor="middle" font-size="12" fill="#d64545">checksum</text><text x="742" y="88" text-anchor="middle" font-family="monospace" fill="#1d2733">5c 84</text><text x="703" y="116" font-size="11" fill="#7a8794">10 + len</text><text x="20" y="146" font-size="12.5" fill="#1d2733">fd = MAVLink 2 · len 0x3f = 63 · not signed (inc bit 0 = 0) · seq 0 · system 1, component 191 · msgid 0x0000e8 = 232 (GPS_INPUT)</text><text x="20" y="166" font-size="12.5" fill="#1d2733">checksum = crc_x25 over bytes 1 … 9 + len, then over CRC_EXTRA = 151 (known to both sides, never sent)</text><text x="20" y="186" font-size="12.5" fill="#1d2733">payload = struct "&lt;QIiifffffffffHHBBBH": 8-byte fields first, then 4, 2, 1 (65 bytes when complete)</text><text x="20" y="206" font-size="12.5" fill="#1d2733">time_usec(8) · time_week_ms(4) · lat(4) · lon(4) · alt hdop vdop vn ve vd speed_acc horiz_acc vert_acc (9 × 4)</text><text x="20" y="226" font-size="12.5" fill="#1d2733">· ignore_flags(2) · time_week(2) · gps_id · fix_type · satellites (1 each) · yaw(2)</text><text x="20" y="246" font-size="12.5" fill="#1d2733">here: lat 35.8081271°, lon 10.5480014°, fix_type 3, horiz_accuracy 1.8 m, ignore_flags 180, yaw 0</text><text x="20" y="266" font-size="12.5" fill="#1d2733">yaw = 0 → its 2 zero bytes are not sent (63, not 65): the receiver pads the payload back to 65 bytes</text></svg>