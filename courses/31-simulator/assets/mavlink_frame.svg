<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="820" height="300" rx="12" fill="#f8fafc"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">A MAVLink 2 frame (GPS_INPUT from NAVERA, t = 100.7 s)</text>
  <!-- header cells: 10 bytes, 44 px each, start x=20 -->
  <g stroke="#2563eb" fill="#dbeafe">
    <rect x="20" y="60" width="44" height="44"/><rect x="64" y="60" width="44" height="44"/>
    <rect x="108" y="60" width="44" height="44"/><rect x="152" y="60" width="44" height="44"/>
    <rect x="196" y="60" width="44" height="44"/><rect x="240" y="60" width="44" height="44"/>
    <rect x="284" y="60" width="44" height="44"/><rect x="328" y="60" width="132" height="44"/>
  </g>
  <rect x="460" y="60" width="200" height="44" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="660" y="60" width="88" height="44" fill="#fee2e2" stroke="#dc2626"/>
  <rect x="748" y="60" width="52" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <g text-anchor="middle" font-size="12" fill="#0f172a">
    <text x="42" y="79">STX</text><text x="86" y="79">len</text><text x="130" y="79">inc</text>
    <text x="174" y="79">cmp</text><text x="218" y="79">seq</text><text x="262" y="79">sys</text>
    <text x="306" y="79">comp</text><text x="394" y="79">msgid (3 B, LE)</text>
    <text x="560" y="79">payload (len bytes)</text><text x="704" y="79">CRC (2 B)</text>
    <text x="774" y="79" font-size="10">signature</text>
  </g>
  <g text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#1e3a8a">
    <text x="42" y="97">fd</text><text x="86" y="97">3f</text><text x="130" y="97">00</text>
    <text x="174" y="97">00</text><text x="218" y="97">c9</text><text x="262" y="97">01</text>
    <text x="306" y="97">bf</text><text x="394" y="97">e8 00 00</text>
    <text x="560" y="97" fill="#166534">63 bytes</text><text x="704" y="97" fill="#991b1b">bd aa</text>
    <text x="774" y="97" font-size="11" fill="#475569">13 B</text><text x="774" y="118" text-anchor="middle" font-size="10" fill="#475569">(if signed)</text>
  </g>
  <!-- offsets -->
  <g text-anchor="middle" font-size="11" fill="#475569">
    <text x="20" y="54">0</text><text x="64" y="54">1</text><text x="108" y="54">2</text><text x="152" y="54">3</text>
    <text x="196" y="54">4</text><text x="240" y="54">5</text><text x="284" y="54">6</text><text x="328" y="54">7</text>
    <text x="460" y="54">10</text><text x="660" y="54">10+len</text>
  </g>
  <!-- meanings -->
  <g font-size="12" fill="#334155">
    <text x="20" y="128">fd = MAVLink 2 · len 63 · not signed · seq 201 · system 1, component 191 (NAVERA) · msgid 0x0000E8 = 232</text>
  </g>
  <!-- CRC coverage bracket -->
  <path d="M66 146 V156 H656 V146" stroke="#dc2626" stroke-width="2" fill="none"/>
  <text x="361" y="176" text-anchor="middle" font-size="12" fill="#991b1b">CRC-16/MCRF4XX over bytes 1 … 9+len, then + CRC_EXTRA (151 for GPS_INPUT, never sent)</text>
  <!-- payload detail -->
  <text x="20" y="212" font-weight="bold" fill="#166534">Payload, fields ordered by size: struct "&lt;QIiifffffffffHHBBBH" (65 bytes when complete)</text>
  <g font-family="Courier New, monospace" font-size="12" fill="#0f172a">
    <text x="20" y="236">time_usec(8)  time_week_ms(4)  lat(4)=81 58 5a 15  lon(4)=f2 ec 56 06  alt hdop vdop vn ve vd …</text>
    <text x="20" y="256">… horiz_accuracy(4)  vert_accuracy(4)  ignore_flags(2)=30 00  time_week(2)  gps_id fix_type sats  [yaw(2)]</text>
  </g>
  <text x="20" y="284" font-size="12" fill="#334155">lat = 0x155A5881 = 358242433 → 35.8242433°   ·   trailing zero bytes (here yaw = 0) are cut: pad back to 65 before unpacking</text>
</svg>
