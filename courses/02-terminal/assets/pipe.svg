<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="sans-serif" font-size="13">
<rect width="760" height="330" fill="#f7fafc"/>
<text x="20" y="28" font-family="monospace" font-size="14" fill="#1d2733">grep "^\[WARN\]" sousse.log | cut -d' ' -f3 | sort | uniq -c</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b6e8a"/></marker>
<marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c0392b"/></marker></defs>
<g font-weight="bold" text-anchor="middle" fill="#1d2733">
<rect x="20" y="60" width="150" height="48" rx="8" fill="#d7e3ee" stroke="#9fb3c8"/><text x="95" y="80">grep "^\[WARN\]"</text>
<rect x="215" y="60" width="130" height="48" rx="8" fill="#ffe9c7" stroke="#e0b878"/><text x="280" y="80">cut -d' ' -f3</text>
<rect x="390" y="60" width="110" height="48" rx="8" fill="#e8e3f3" stroke="#b9acd6"/><text x="445" y="80">sort</text>
<rect x="545" y="60" width="120" height="48" rx="8" fill="#cfe8cf" stroke="#8fbf8f"/><text x="605" y="80">uniq -c</text>
</g>
<g font-size="12" text-anchor="middle" fill="#4a5866">
<text x="95" y="98">keep WARN lines</text><text x="280" y="98">keep the node field</text><text x="445" y="98">same names together</text><text x="605" y="98">count each name</text>
</g>
<g stroke="#0b6e8a" stroke-width="3" marker-end="url(#a)"><line x1="170" y1="84" x2="210" y2="84"/><line x1="345" y1="84" x2="385" y2="84"/><line x1="500" y1="84" x2="540" y2="84"/><line x1="665" y1="84" x2="705" y2="84"/></g>
<text x="712" y="80" font-size="12" fill="#0b6e8a">stdout</text><text x="712" y="95" font-size="12" fill="#0b6e8a">screen</text>
<g font-family="monospace" font-size="11" fill="#1d2733" xml:space="preserve" style="white-space:pre">
<rect x="40" y="130" width="310" height="92" fill="#fff" stroke="#ccd6e0"/>
<text x="46" y="148">[WARN] [1789976102.2] [gps_node]: no fix…</text>
<text x="46" y="164">[WARN] [1789976103.1] [estimator_node]: …</text>
<text x="46" y="180">[WARN] [1789976104.1] [day_subscriber]: …</text>
<text x="46" y="196">[WARN] [1789976112.1] [gps_node]: no fix…</text>
<text x="46" y="212">… 84 lines</text>
<rect x="370" y="130" width="150" height="92" fill="#fff" stroke="#ccd6e0"/>
<text x="378" y="148">[day_subscriber]:</text><text x="378" y="164">[day_subscriber]:</text><text x="378" y="180">[estimator_node]:</text><text x="378" y="196">[gps_node]:</text><text x="378" y="212">…</text>
<rect x="540" y="130" width="200" height="92" fill="#fff" stroke="#ccd6e0"/>
<text x="548" y="148">     61 [day_subscriber]:</text><text x="548" y="164">      5 [estimator_node]:</text><text x="548" y="180">     18 [gps_node]:</text>
</g>
<text x="185" y="236" font-size="12" text-anchor="middle" fill="#4a5866">what flows into the first pipe</text>
<text x="445" y="236" font-size="12" text-anchor="middle" fill="#4a5866">after cut</text>
<text x="640" y="236" font-size="12" text-anchor="middle" fill="#4a5866">final output (stdout)</text>
<path d="M28 108 V270 H690" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>
<text x="40" y="262" font-size="12" fill="#c0392b">stderr (grep's error messages) does NOT go into the pipe: it goes to the screen, or to a file with 2&gt;</text>
<text x="20" y="306" font-size="12" fill="#4a5866">Every program has 3 streams: 0 = stdin (input), 1 = stdout (normal output), 2 = stderr (errors).</text>
<text x="20" y="322" font-size="12" fill="#4a5866">A pipe | connects stdout of the left program to stdin of the right program.</text>
</svg>
