<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="sans-serif" font-size="13"><rect width="860" height="340" fill="#f7fafc"/><defs><marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d2733"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8680d"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a96a3"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e4f"/></marker></defs><text x="430.0" y="24.0" text-anchor="middle" font-size="13" fill="#1d2733" font-weight="bold">The same fix, two filters: the 99 % gate is as wide as the filter's own σ</text><text x="215.0" y="46.0" text-anchor="middle" font-size="12" fill="#2e9e4f" font-weight="bold">honest: σ 40 m per axis</text><circle cx="215" cy="170" r="110.1" fill="#2e9e4f" fill-opacity="0.08" stroke="#2e9e4f" stroke-width="1.6"/><circle cx="215.0" cy="170.0" r="4.0" stroke="#0b6e8a" fill="#0b6e8a" stroke-width="1.5"/><text x="215.0" y="190.0" text-anchor="middle" font-size="11" fill="#0b6e8a" font-weight="normal">prediction</text><circle cx="251.0" cy="170.0" r="5.0" stroke="#a8680d" fill="#a8680d" stroke-width="1.5"/><line x1="215.0" y1="170.0" x2="251.0" y2="170.0" stroke="#a8680d" stroke-width="1.2" stroke-dasharray="3 3"/><text x="259.0" y="162.0" text-anchor="start" font-size="11" fill="#a8680d" font-weight="normal">fix, 40 m east</text><text x="215.0" y="300.0" text-anchor="middle" font-size="12" fill="#2e9e4f" font-weight="bold">d² = 40² / (40² + 5²) = 0.98  →  accepted</text><text x="215.0" y="318.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">gate radius √9.21 · √(σ² + 5²) = 122 m</text><text x="645.0" y="46.0" text-anchor="middle" font-size="12" fill="#d64545" font-weight="bold">overconfident: σ 10 m per axis</text><circle cx="645" cy="170" r="30.5" fill="#d64545" fill-opacity="0.08" stroke="#d64545" stroke-width="1.6"/><circle cx="645.0" cy="170.0" r="4.0" stroke="#0b6e8a" fill="#0b6e8a" stroke-width="1.5"/><text x="645.0" y="190.0" text-anchor="middle" font-size="11" fill="#0b6e8a" font-weight="normal">prediction</text><circle cx="681.0" cy="170.0" r="5.0" stroke="#a8680d" fill="#a8680d" stroke-width="1.5"/><line x1="645.0" y1="170.0" x2="681.0" y2="170.0" stroke="#a8680d" stroke-width="1.2" stroke-dasharray="3 3"/><text x="689.0" y="162.0" text-anchor="start" font-size="11" fill="#a8680d" font-weight="normal">fix, 40 m east</text><text x="645.0" y="300.0" text-anchor="middle" font-size="12" fill="#d64545" font-weight="bold">d² = 40² / (10² + 5²) = 12.80  →  REFUSED</text><text x="645.0" y="318.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">gate radius √9.21 · √(σ² + 5²) = 34 m</text></svg>
