<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="sans-serif" font-size="13"><rect width="900" height="330" fill="#f7fafc"/><defs><marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d2733"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8680d"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a96a3"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e4f"/></marker></defs><text x="450.0" y="26.0" text-anchor="middle" font-size="13" fill="#1d2733" font-weight="bold">Simulator, 2026-10-01: GPS jammed over uniform terrain, the autopilot's Kalman filter fed by NAVERA's day vision</text><text x="245.0" y="54.0" text-anchor="middle" font-size="12" fill="#1d2733" font-weight="bold">what day vision SAID vs what it WAS</text><text x="154.0" y="105.0" text-anchor="end" font-size="11" fill="#1d2733" font-weight="normal">stated σ</text><rect x="160.0" y="90.0" width="83.3" height="22.0" fill="#0b6e8a" stroke="none" rx="3" fill-opacity="1.0"/><text x="249.3" y="106.0" text-anchor="start" font-size="12" fill="#0b6e8a" font-weight="bold">±300 m</text><text x="154.0" y="153.0" text-anchor="end" font-size="11" fill="#1d2733" font-weight="normal">true error, median</text><rect x="160.0" y="138.0" width="97.5" height="22.0" fill="#a8680d" stroke="none" rx="3" fill-opacity="1.0"/><text x="263.5" y="154.0" text-anchor="start" font-size="12" fill="#a8680d" font-weight="bold">351 m</text><text x="154.0" y="201.0" text-anchor="end" font-size="11" fill="#1d2733" font-weight="normal">true error, 90 % below</text><rect x="160.0" y="186.0" width="236.9" height="22.0" fill="#d64545" stroke="none" rx="3" fill-opacity="1.0"/><text x="402.9" y="202.0" text-anchor="start" font-size="12" fill="#d64545" font-weight="bold">853 m</text><text x="285.0" y="260.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">the filter downstream was told ±300 m (and uses at most 100 m)</text><text x="730.0" y="54.0" text-anchor="middle" font-size="12" fill="#1d2733" font-weight="bold">time until the autopilot gave up (failsafe)</text><text x="594.0" y="105.0" text-anchor="end" font-size="11" fill="#1d2733" font-weight="normal">stated ±300 m</text><rect x="600.0" y="90.0" width="48.8" height="20.0" fill="#d64545" stroke="none" rx="3" fill-opacity="0.85"/><text x="654.8" y="105.0" text-anchor="start" font-size="11" fill="#d64545" font-weight="bold">45 s</text><text x="594.0" y="145.0" text-anchor="end" font-size="11" fill="#1d2733" font-weight="normal">stated ±300 m, small map</text><rect x="600.0" y="130.0" width="66.1" height="20.0" fill="#d64545" stroke="none" rx="3" fill-opacity="0.85"/><text x="672.1" y="145.0" text-anchor="start" font-size="11" fill="#d64545" font-weight="bold">61 s</text><text x="594.0" y="185.0" text-anchor="end" font-size="11" fill="#1d2733" font-weight="normal">stated ±500 m</text><rect x="600.0" y="170.0" width="98.6" height="20.0" fill="#a8680d" stroke="none" rx="3" fill-opacity="0.85"/><text x="704.6" y="185.0" text-anchor="start" font-size="11" fill="#a8680d" font-weight="bold">91 s</text><text x="594.0" y="225.0" text-anchor="end" font-size="11" fill="#1d2733" font-weight="normal">local matching (later)</text><rect x="600.0" y="210.0" width="249.2" height="20.0" fill="#2e9e4f" stroke="none" rx="3" fill-opacity="0.85"/><text x="843.2" y="225.0" text-anchor="end" font-size="11" fill="#ffffff" font-weight="bold">held 230 s (end of test)</text><text x="450.0" y="300.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">Sources: NAVERA validation, troubleshooting and ArduPilot guides, Release 0.2 (2026-10-03) — simulation, not a real flight.</text></svg>
