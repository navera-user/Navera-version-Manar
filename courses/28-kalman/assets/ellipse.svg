<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="340" rx="12" fill="#f8fafc"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">A covariance matrix is an ellipse: its eigen-decomposition gives the axes</text>
  <g transform="translate(200,185)">
    <line x1="-170" y1="0" x2="170" y2="0" stroke="#94a3b8"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#94a3b8"/>
    <text x="150" y="-8" font-size="12" fill="#64748b">east</text>
    <text x="6" y="-126" font-size="12" fill="#64748b">north</text>
    <g transform="rotate(-29.5)">
      <ellipse rx="139" ry="64" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/>
      <ellipse rx="57" ry="26" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="57" y2="0" stroke="#b91c1c" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="0" y2="-26" stroke="#1d4ed8" stroke-width="2.5"/>
    </g>
    <path d="M 40 0 A 40 40 0 0 0 34.8 -19.7" fill="none" stroke="#0f172a" stroke-width="1.2"/>
    <text x="46" y="-4" font-size="12" fill="#0f172a">θ</text>
    <text x="36" y="-40" font-size="13" font-weight="bold" fill="#b91c1c">a = √λ₁</text>
    <text x="-62" y="-44" font-size="13" font-weight="bold" fill="#1d4ed8" stroke="#f8fafc" stroke-width="4" paint-order="stroke">b = √λ₂</text>
    <text x="40" y="70" font-size="12" fill="#b45309">95 % ellipse: k = 2.45</text>
    <text x="-160" y="125" font-size="12" fill="#334155">1σ ellipse (k = 1): 39.3 % of fixes</text>
  </g>
  <g font-size="13" fill="#0f172a">
    <text x="420" y="72" font-weight="bold">Example</text>
    <text x="420" y="96" font-family="monospace" xml:space="preserve">P = [ 12   5 ]   (m²)</text>
    <text x="420" y="114" font-family="monospace" xml:space="preserve">    [  5   6 ]</text>
    <text x="420" y="142" font-family="monospace">P = V Λ Vᵀ   (numpy.linalg.eigh)</text>
    <text x="420" y="166" font-family="monospace">λ₁ = 14.83, λ₂ = 3.17 m²</text>
    <text x="420" y="190" font-family="monospace">a = 3.85 m,  b = 1.78 m</text>
    <text x="420" y="214" font-family="monospace">θ = atan2(v₁ₙ, v₁ₑ) = 29.5°</text>
    <text x="420" y="248" font-weight="bold">Inside the k-sigma ellipse:</text>
    <text x="420" y="272" font-family="monospace">d² = rᵀ P⁻¹ r ≤ k²</text>
    <text x="420" y="300" fill="#334155">k² = χ²₂(p):  1 → 39.3 %,  5.99 → 95 %,  9.21 → 99 %</text>
  </g>
</svg>
