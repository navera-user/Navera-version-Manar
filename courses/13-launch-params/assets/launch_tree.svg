<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" font-family="sans-serif" font-size="13">
  <rect width="680" height="280" fill="#f7fafc"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0b6e8a"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">One command, a whole system: ros2 launch ./my_navera.launch.py</text>
  <rect x="230" y="44" width="220" height="44" rx="8" fill="#1d2733"/>
  <text x="340" y="71" text-anchor="middle" fill="#ffffff" font-family="monospace">my_navera.launch.py</text>
  <g stroke="#0b6e8a" stroke-width="2" fill="none" marker-end="url(#g)">
    <path d="M300 88 L120 134"/>
    <path d="M340 88 L340 134"/>
    <path d="M380 88 L560 134"/>
    <path d="M560 182 L560 214"/>
  </g>
  <g fill="#ffffff" stroke-width="2">
    <rect x="20" y="136" width="200" height="46" rx="8" stroke="#3a8a4a"/>
    <rect x="240" y="136" width="200" height="46" rx="8" stroke="#0b6e8a"/>
    <rect x="460" y="136" width="200" height="46" rx="8" stroke="#0b6e8a" stroke-dasharray="6 4"/>
    <rect x="460" y="216" width="200" height="46" rx="8" stroke="#0b6e8a"/>
  </g>
  <g text-anchor="middle" fill="#1d2733">
    <text x="120" y="156" font-weight="bold">ExecuteProcess</text>
    <text x="120" y="173" font-size="12">fake_gps_params.py + my_gps.yaml</text>
    <text x="340" y="156" font-weight="bold">Node (gps_pkg)</text>
    <text x="340" y="173" font-size="12">ros_gps_node, fix_topic param</text>
    <text x="560" y="156" font-weight="bold">IncludeLaunchDescription</text>
    <text x="560" y="173" font-size="12">NAVERA's estimator.launch.py</text>
    <text x="560" y="236" font-weight="bold">Node (navera_estimator)</text>
    <text x="560" y="253" font-size="12">+ estimator_params.yaml</text>
  </g>
  <text x="20" y="230" fill="#56606b" font-size="12">Ctrl+C on the launch stops every process it started.</text>
  <text x="20" y="248" fill="#56606b" font-size="12">Each line of output starts with the process name in [brackets].</text>
</svg>
