<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="sans-serif" font-size="12">
  <rect width="720" height="400" fill="#f7fafc"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0b6e8a"/>
    </marker>
  </defs>
  <text x="360" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">ros2 launch ./my_navera.launch.py with_boat:=true gps_source:=car</text>
  <!-- root -->
  <rect x="250" y="38" width="220" height="44" rx="10" fill="#e6f2f6" stroke="#0b6e8a" stroke-width="2"/>
  <text x="360" y="58" text-anchor="middle" font-weight="bold" fill="#1d2733">my_navera.launch.py</text>
  <text x="360" y="74" text-anchor="middle" fill="#56606b" font-size="11">args: with_boat, gps_source</text>
  <!-- arrows -->
  <g stroke="#0b6e8a" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <path d="M290 82 L95 128"/>
    <path d="M330 82 L272 128"/>
    <path d="M390 82 L452 128"/>
    <path d="M430 82 L622 128"/>
  </g>
  <!-- car -->
  <rect x="14" y="130" width="160" height="96" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="94" y="149" text-anchor="middle" font-weight="bold" fill="#2e7d32">Node /car/fake_gps</text>
  <text x="24" y="168" fill="#1d2733" font-size="11">namespace: car</text>
  <text x="24" y="184" fill="#1d2733" font-size="11">params: my_gps.yaml</text>
  <text x="24" y="200" fill="#1d2733" font-size="11">remap /fake_gps/fix → fix</text>
  <text x="24" y="216" fill="#a8680d" font-size="11" font-family="monospace">→ /car/fix</text>
  <!-- boat -->
  <rect x="192" y="130" width="160" height="96" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="272" y="149" text-anchor="middle" font-weight="bold" fill="#2e7d32">Node /boat/fake_gps</text>
  <text x="202" y="168" fill="#1d2733" font-size="11">only if with_boat</text>
  <text x="202" y="184" fill="#1d2733" font-size="11">(IfCondition)</text>
  <text x="202" y="200" fill="#1d2733" font-size="11">same file, same remap</text>
  <text x="202" y="216" fill="#a8680d" font-size="11" font-family="monospace">→ /boat/fix</text>
  <!-- ros_gps -->
  <rect x="370" y="130" width="164" height="96" rx="8" fill="#ffffff" stroke="#0b6e8a" stroke-width="2"/>
  <text x="452" y="149" text-anchor="middle" font-weight="bold" fill="#0b6e8a">Node /ros_gps</text>
  <text x="380" y="168" fill="#1d2733" font-size="11">NAVERA gps_pkg</text>
  <text x="380" y="184" fill="#1d2733" font-size="11">fix_topic = "/" + gps_source</text>
  <text x="380" y="200" fill="#1d2733" font-size="11">            + "/fix"</text>
  <text x="380" y="216" fill="#a8680d" font-size="10" font-family="monospace">→ /navera/estimate/gps</text>
  <!-- estimator include -->
  <rect x="552" y="130" width="156" height="96" rx="8" fill="#ffffff" stroke="#0b6e8a" stroke-width="2"/>
  <text x="630" y="149" text-anchor="middle" font-weight="bold" fill="#0b6e8a">Include</text>
  <text x="562" y="168" fill="#1d2733" font-size="11">NAVERA's</text>
  <text x="562" y="184" fill="#1d2733" font-size="11">estimator.launch.py</text>
  <text x="562" y="200" fill="#1d2733" font-size="11">gps_timeout_s:=2.0</text>
  <!-- estimator node -->
  <path d="M630 226 L630 262" stroke="#0b6e8a" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <rect x="520" y="264" width="188" height="80" rx="8" fill="#e6f2f6" stroke="#0b6e8a" stroke-width="2"/>
  <text x="614" y="283" text-anchor="middle" font-weight="bold" fill="#0b6e8a">Node /estimator_node</text>
  <text x="530" y="302" fill="#1d2733" font-size="11">1. estimator_params.yaml</text>
  <text x="530" y="318" fill="#1d2733" font-size="11">2. dict {gps_timeout_s: …} wins</text>
  <text x="530" y="334" fill="#1d2733" font-size="11">3. vehicle max speed, IMU topic</text>
  <!-- data flow -->
  <path d="M94 226 L94 262 L420 262 L420 230" stroke="#a8680d" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#a)"/>
  <path d="M500 226 L500 300 L518 300" stroke="#a8680d" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#a)"/>
  <text x="104" y="256" fill="#a8680d" font-size="11">/car/fix (NavSatFix)</text><text x="494" y="282" text-anchor="end" fill="#a8680d" font-size="11">PositionEstimate</text>
      <text x="14" y="372" fill="#1d2733">Ctrl+C on the launch stops every process. Each output line starts with the process name in [brackets].</text>
  <text x="14" y="390" fill="#56606b">Dashed green box: started only when the condition is true. Dashed orange: data flow (topics).</text>
</svg>
