<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="sans-serif" font-size="13">
<rect width="720" height="330" fill="#f7fafc"/>
<text x="20" y="28" font-size="15" font-weight="bold" fill="#1d2733">ros2 launch navera_lite/ros/navera_lite_launch.py gps_source:=boat</text>
<text x="20" y="48" fill="#555" font-size="12">one command, three processes, one program for two vehicles</text>
<!-- drone namespace -->
<rect x="20" y="70" width="300" height="100" rx="8" fill="#e6f2f6" stroke="#0b6e8a" stroke-dasharray="5 3"/>
<text x="30" y="88" fill="#0b6e8a" font-weight="bold">namespace /drone</text>
<rect x="40" y="98" width="130" height="40" rx="6" fill="#0b6e8a"/>
<text x="105" y="115" fill="#fff" text-anchor="middle">fake_gps</text>
<text x="105" y="131" fill="#d8eef5" text-anchor="middle" font-size="11">drone · 12.0 m/s · 090°</text>
<text x="40" y="160" fill="#1d2733" font-size="12">/drone/navera_lite/fix/gps</text>
<!-- boat namespace -->
<rect x="20" y="190" width="300" height="110" rx="8" fill="#e6f2f6" stroke="#0b6e8a" stroke-dasharray="5 3"/>
<text x="30" y="208" fill="#0b6e8a" font-weight="bold">namespace /boat</text>
<text x="190" y="208" fill="#555" font-size="11">only if use_boat is true</text>
<rect x="40" y="218" width="130" height="40" rx="6" fill="#0b6e8a"/>
<text x="105" y="235" fill="#fff" text-anchor="middle">fake_gps</text>
<text x="105" y="251" fill="#d8eef5" text-anchor="middle" font-size="11">boat · 5.0 m/s · 000°</text>
<text x="40" y="282" fill="#1d2733" font-size="12">/boat/navera_lite/fix/gps</text>
<!-- judge -->
<rect x="466" y="160" width="230" height="60" rx="8" fill="#2f855a"/>
<text x="581" y="184" fill="#fff" text-anchor="middle" font-weight="bold">arbiter (no namespace)</text>
<text x="581" y="204" fill="#e3f4ea" text-anchor="middle" font-size="11">--params-file navera_lite.yaml</text>
<!-- arrows -->
<path d="M200 278 C 380 278, 400 210, 466 200" fill="none" stroke="#2f855a" stroke-width="3"/>
<polygon points="466,200 456,194 457,206" fill="#2f855a"/>
<path d="M200 156 C 380 156, 400 175, 466 178" fill="none" stroke="#aaa" stroke-width="2" stroke-dasharray="4 4"/>
<text x="345" y="140" fill="#888" font-size="11">not read (gps_source is boat)</text>
<text x="350" y="300" fill="#2f855a" font-size="12">remap: navera_lite/fix/gps :=</text>
<text x="350" y="316" fill="#2f855a" font-size="12">/boat/navera_lite/fix/gps</text>
<text x="470" y="245" fill="#1d2733" font-size="12">→ /navera_lite/status</text>
<text x="470" y="262" fill="#1d2733" font-size="12">→ /navera_lite/position</text>
</svg>
