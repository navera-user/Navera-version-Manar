# Parameters of TWO fake GNSS receivers, for:
#   python3 fake_gps_node.py --ros-args -r __ns:=/car  --params-file my_gps.yaml
#   python3 fake_gps_node.py --ros-args -r __ns:=/boat --params-file my_gps.yaml
#
# Structure of a ROS 2 parameters file:
#   <fully qualified node name, or /** for every node>:
#     ros__parameters:              (two underscores)
#       <parameter>: <value>
# Indent with spaces, never tabs. Decimal numbers WITH a dot (1.0, not 1); text between quotes.
# When several sections match a node, the LAST one in the file wins: put /** first.
#
# TODO 3: complete the three sections with the values of the lab (step 4).
/**:
  ros__parameters:
    rate_hz: 2.0

/car/fake_gps:
  ros__parameters:
    vehicle: "car"

/boat/fake_gps:
  ros__parameters:
    vehicle: "boat"
