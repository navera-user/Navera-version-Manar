#   python3 -m navera_lite.ros.gps_node --ros-args -r __ns:=/boat --params-file my_gps.yaml
#
# A ROS 2 parameters file is made of SECTIONS:
#   <a node's full name, or /** for every node>:
#     ros__parameters:              (two underscores)
#       <parameter>: <value>
# Spaces, never tabs. Decimal numbers with a dot (1.0, not 1). Text between quotes ("boat").
