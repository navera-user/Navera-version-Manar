<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="780" height="400" rx="12" fill="#f8fafc"/>
  <defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#475569"/></marker></defs>
  <text x="390" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">The arbiter's output state machine (evaluated on every arrival and every 0.2 s)</text>
  <!-- states -->
  <rect x="20" y="120" width="150" height="56" rx="28" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="95" y="153" text-anchor="middle" font-weight="bold" fill="#334155">INITIALIZING</text>
  <rect x="290" y="120" width="140" height="56" rx="28" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="360" y="153" text-anchor="middle" font-weight="bold" fill="#991b1b">NO_FIX</text>
  <rect x="580" y="50" width="160" height="56" rx="28" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="83" text-anchor="middle" font-weight="bold" fill="#166534">FIX</text>
  <rect x="580" y="190" width="160" height="56" rx="28" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="660" y="223" text-anchor="middle" font-weight="bold" fill="#92400e">DEGRADED</text>
  <!-- INIT -> NO_FIX -->
  <path d="M170 148 H286" stroke="#475569" stroke-width="2" marker-end="url(#m)"/>
  <circle cx="228" cy="134" r="10" fill="#fff" stroke="#475569"/><text x="228" y="138" text-anchor="middle" font-weight="bold">a</text>
  <!-- INIT -> FIX (over the top) -->
  <path d="M95 120 C95 60 300 62 576 72" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#m)"/>
  <circle cx="300" cy="64" r="10" fill="#fff" stroke="#475569"/><text x="300" y="68" text-anchor="middle" font-weight="bold">b</text>
  <!-- INIT -> DEGRADED (below) -->
  <path d="M95 176 C95 250 300 250 576 228" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#m)"/>
  <circle cx="300" cy="242" r="10" fill="#fff" stroke="#475569"/><text x="300" y="246" text-anchor="middle" font-weight="bold">c</text>
  <!-- NO_FIX <-> FIX -->
  <path d="M430 136 L576 86" stroke="#475569" stroke-width="2" marker-end="url(#m)"/>
  <path d="M580 98 L436 148" stroke="#475569" stroke-width="2" marker-end="url(#m)"/>
  <circle cx="492" cy="104" r="10" fill="#fff" stroke="#475569"/><text x="492" y="108" text-anchor="middle" font-weight="bold">b</text>
  <circle cx="528" cy="128" r="10" fill="#fff" stroke="#475569"/><text x="528" y="132" text-anchor="middle" font-weight="bold">d</text>
  <!-- NO_FIX <-> DEGRADED -->
  <path d="M430 160 L576 210" stroke="#475569" stroke-width="2" marker-end="url(#m)"/>
  <path d="M580 222 L436 172" stroke="#475569" stroke-width="2" marker-end="url(#m)"/>
  <circle cx="490" cy="168" r="10" fill="#fff" stroke="#475569"/><text x="490" y="172" text-anchor="middle" font-weight="bold">c</text>
  <circle cx="530" cy="194" r="10" fill="#fff" stroke="#475569"/><text x="530" y="198" text-anchor="middle" font-weight="bold">d</text>
  <!-- FIX <-> DEGRADED -->
  <path d="M640 106 V186" stroke="#475569" stroke-width="2" marker-end="url(#m)"/>
  <path d="M680 190 V110" stroke="#475569" stroke-width="2" marker-end="url(#m)"/>
  <circle cx="626" cy="148" r="10" fill="#fff" stroke="#475569"/><text x="626" y="152" text-anchor="middle" font-weight="bold">e</text>
  <circle cx="694" cy="148" r="10" fill="#fff" stroke="#475569"/><text x="694" y="152" text-anchor="middle" font-weight="bold">f</text>
  <!-- legend -->
  <rect x="20" y="272" width="740" height="116" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="34" y="294" fill="#0f172a"><tspan font-weight="bold">a</tspan>  a first message arrives, but no source is eligible</text>
  <text x="34" y="316" fill="#0f172a"><tspan font-weight="bold">b</tspan>  winner is MEASURED with a stated σ ≤ 25 m</text>
  <text x="34" y="338" fill="#0f172a"><tspan font-weight="bold">c</tspan>  winner has σ unknown or &gt; 25 m, or is PROPAGATED</text>
  <text x="34" y="360" fill="#0f172a"><tspan font-weight="bold">d</tspan>  no source eligible any more (stale, invalid, refused…)</text>
  <text x="400" y="294" fill="#0f172a"><tspan font-weight="bold">e</tspan>  the winner changes to a worse one, or its σ grows</text>
  <text x="400" y="316" fill="#0f172a"><tspan font-weight="bold">f</tspan>  a FIX-quality source wins again (after the hold-off</text>
  <text x="418" y="334" fill="#0f172a">if another source was active)</text>
  <text x="400" y="360" fill="#64748b">INITIALIZING is never re-entered after start-up.</text>
  <text x="34" y="381" fill="#64748b" font-size="12">The state is a function of the winner; the memory (active source, eligible_since) lives in the selection step.</text>
</svg>
