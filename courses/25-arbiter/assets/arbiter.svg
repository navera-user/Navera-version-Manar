<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="760" height="330" rx="12" fill="#f8fafc"/>
  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Every 0.2 s (and at every new message), the arbiter asks each source two questions</text>
  <!-- sources -->
  <g>
    <rect x="20" y="55" width="150" height="46" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="95" y="76" text-anchor="middle" font-weight="bold">1. GPS</text><text x="95" y="93" text-anchor="middle" font-size="12">window 3 s</text>
    <rect x="20" y="115" width="150" height="46" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="95" y="136" text-anchor="middle" font-weight="bold">2. day vision</text><text x="95" y="153" text-anchor="middle" font-size="12">window 5 s</text>
    <rect x="20" y="175" width="150" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="95" y="196" text-anchor="middle" font-weight="bold">3. night vision</text><text x="95" y="213" text-anchor="middle" font-size="12">window 5 s</text>
    <rect x="20" y="235" width="150" height="46" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="95" y="256" text-anchor="middle" font-weight="bold">4. celestial</text><text x="95" y="273" text-anchor="middle" font-size="12">window 45 s</text>
  </g>
  <!-- question 1 -->
  <rect x="205" y="70" width="230" height="210" rx="10" fill="#fff" stroke="#334155"/>
  <text x="320" y="95" text-anchor="middle" font-weight="bold" fill="#0f172a">① Is it usable? (eligible)</text>
  <text x="222" y="125" fill="#334155">✔ valid = true</text>
  <text x="222" y="150" fill="#334155" font-size="13">✔ MEASURED or PROPAGATED</text>
  <text x="222" y="175" fill="#334155">✔ fresh (age &lt; window,</text>
  <text x="240" y="193" fill="#334155">not &gt; 0.5 s in the future)</text>
  <text x="222" y="218" fill="#334155">✔ finite, in-range position</text>
  <text x="222" y="243" fill="#334155">✔ a real covariance</text>
  <!-- arrows -->
  <path d="M170 78 H205 M170 138 H205 M170 198 H205 M170 258 H205" stroke="#64748b" stroke-width="2"/>
  <path d="M435 175 H464" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
  <!-- question 2 -->
  <rect x="470" y="70" width="280" height="210" rx="10" fill="#fff" stroke="#334155"/>
  <text x="610" y="95" text-anchor="middle" font-weight="bold" fill="#0f172a">② Who wins?</text>
  <text x="486" y="125" fill="#334155">The first usable source in the order</text>
  <text x="486" y="145" fill="#334155">GPS → day → night → celestial …</text>
  <text x="486" y="175" fill="#334155">… unless the active source is still</text>
  <text x="486" y="195" fill="#334155">usable and the better one has been</text>
  <text x="486" y="215" fill="#334155">usable for less than <tspan font-weight="bold">2 s</tspan> (hold-off).</text>
  <text x="486" y="248" fill="#0f172a" font-weight="bold">→ /navera/position</text>
  <text x="502" y="267" fill="#0f172a" font-weight="bold">+ /navera/nav_status</text>
  <text x="380" y="310" text-anchor="middle" font-size="12" fill="#64748b">navera_estimator/nodes/estimator_node.py — _eval_source(), _sane(), _select(), _classify()</text>
</svg>
