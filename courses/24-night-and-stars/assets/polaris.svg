<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="sans-serif" font-size="13">
  <rect width="560" height="300" fill="#f7fafc"/>
  <!-- ground -->
  <rect x="0" y="230" width="560" height="70" fill="#cde6c8"/>
  <line x1="20" y1="230" x2="540" y2="230" stroke="#1d2733" stroke-width="2"/>
  <text x="440" y="250" fill="#1d2733">horizon</text>
  <!-- observer -->
  <circle cx="110" cy="222" r="7" fill="#d64545"/>
  <text x="70" y="270" fill="#1d2733">you, at latitude φ</text>
  <!-- line to Polaris -->
  <line x1="110" y1="222" x2="470" y2="-40" stroke="#f2a33a" stroke-width="2.5" stroke-dasharray="7 5"/>
  <g transform="translate(400,10)"><polygon points="0,-11 3,-3 11,-3 5,2 7,10 0,5 -7,10 -5,2 -11,-3 -3,-3" fill="#f2a33a"/></g>
  <text x="418" y="16" fill="#a8680d" font-weight="bold">Polaris</text>
  <text x="418" y="34" fill="#a8680d">(the sky's north pole)</text>
  <!-- angle arc -->
  <path d="M 200 222 A 90 90 0 0 0 183 169" fill="none" stroke="#0b6e8a" stroke-width="2.5"/>
  <text x="205" y="195" fill="#0b6e8a" font-weight="bold">altitude of Polaris = φ</text>
  <!-- zenith -->
  <line x1="110" y1="222" x2="110" y2="40" stroke="#1d2733" stroke-dasharray="3 4"/>
  <text x="82" y="34" fill="#1d2733">zenith (straight up)</text>
  <text x="300" y="120" fill="#1d2733" font-size="12">Tunis 36.8° N → Polaris 36.8° high</text>
  <text x="300" y="138" fill="#1d2733" font-size="12">Sousse 35.8° N → 35.8° high</text>
  <text x="300" y="156" fill="#1d2733" font-size="12">North Pole 90° → straight up · Equator 0° → on the horizon</text>
</svg>
