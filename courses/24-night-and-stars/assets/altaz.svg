<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" font-family="sans-serif" font-size="13">
  <rect width="560" height="280" fill="#f7fafc"/>
  <!-- ground ellipse (horizon) -->
  <ellipse cx="260" cy="210" rx="220" ry="55" fill="#cde6c8" stroke="#1d2733" stroke-width="1.5"/>
  <!-- sky dome -->
  <path d="M 40 210 A 220 190 0 0 1 480 210" fill="none" stroke="#9fb3c8" stroke-dasharray="4 4"/>
  <circle cx="260" cy="210" r="6" fill="#d64545"/>
  <text x="230" y="238" fill="#1d2733">you</text>
  <!-- north & east -->
  <line x1="260" y1="210" x2="260" y2="155" stroke="#1d2733" stroke-width="1.5"/>
  <text x="252" y="150" fill="#1d2733" font-weight="bold">N</text>
  <line x1="260" y1="210" x2="480" y2="210" stroke="#1d2733" stroke-width="1"/>
  <text x="486" y="214" fill="#1d2733" font-weight="bold">E</text>
  <!-- star direction projected on ground -->
  <line x1="260" y1="210" x2="400" y2="168" stroke="#0b6e8a" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- star -->
  <line x1="260" y1="210" x2="400" y2="60" stroke="#f2a33a" stroke-width="2.5"/>
  <line x1="400" y1="60" x2="400" y2="168" stroke="#9fb3c8" stroke-dasharray="3 3"/>
  <g transform="translate(400,60)"><polygon points="0,-11 3,-3 11,-3 5,2 7,10 0,5 -7,10 -5,2 -11,-3 -3,-3" fill="#f2a33a"/></g>
  <text x="414" y="56" fill="#a8680d" font-weight="bold">a star</text>
  <!-- altitude arc -->
  <path d="M 327 190 Q 336 160 320 146" fill="none" stroke="#d64545" stroke-width="2"/>
  <text x="338" y="150" fill="#d64545" font-weight="bold">altitude</text>
  <text x="338" y="166" fill="#d64545" font-size="12">(angle above the horizon)</text>
  <!-- azimuth arc -->
  <path d="M 260 178 Q 290 176 300 198" fill="none" stroke="#0b6e8a" stroke-width="2"/>
  <text x="95" y="120" fill="#0b6e8a" font-weight="bold">azimuth</text>
  <text x="95" y="136" fill="#0b6e8a" font-size="12">(compass direction,</text>
  <text x="95" y="151" fill="#0b6e8a" font-size="12">clockwise from north)</text>
  <line x1="165" y1="155" x2="272" y2="183" stroke="#0b6e8a" stroke-width="1"/>
  <text x="20" y="270" fill="#1d2733" font-size="12">Two angles place a star in YOUR sky. They change with your place and the time.</text>
</svg>
