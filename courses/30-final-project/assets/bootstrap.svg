<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="800" height="470" rx="12" fill="#f8fafc"/>
  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Why the bootstrap must resample blocks of time</text>
  <!-- original series -->
  <text x="20" y="62" font-weight="bold" fill="#0f172a">The 1800 epochs</text>
  <rect x="200" y="48" width="580" height="20" fill="#cbd5e1"/>
  <rect x="264" y="48" width="13" height="20" fill="#dc2626"/>
  <rect x="396" y="48" width="13" height="20" fill="#dc2626"/>
  <rect x="554" y="48" width="8" height="20" fill="#dc2626"/>
  <rect x="683" y="48" width="10" height="20" fill="#dc2626"/>
  <text x="490" y="86" text-anchor="middle" font-size="11" fill="#991b1b">red: the four 3-satellite episodes (135 s in total, only 4 independent events)</text>
  <!-- iid -->
  <text x="20" y="122" font-weight="bold" fill="#0f172a">iid resample</text>
  <text x="20" y="138" font-size="11" fill="#475569">single epochs, drawn at random</text>
  <rect x="200" y="110" width="580" height="20" fill="#cbd5e1"/>
  <g fill="#dc2626">
    <rect x="214" y="110" width="2" height="20"/><rect x="241" y="110" width="2" height="20"/><rect x="262" y="110" width="2" height="20"/>
    <rect x="300" y="110" width="2" height="20"/><rect x="333" y="110" width="2" height="20"/><rect x="352" y="110" width="2" height="20"/>
    <rect x="390" y="110" width="2" height="20"/><rect x="419" y="110" width="2" height="20"/><rect x="447" y="110" width="2" height="20"/>
    <rect x="471" y="110" width="2" height="20"/><rect x="505" y="110" width="2" height="20"/><rect x="531" y="110" width="2" height="20"/>
    <rect x="560" y="110" width="2" height="20"/><rect x="592" y="110" width="2" height="20"/><rect x="615" y="110" width="2" height="20"/>
    <rect x="648" y="110" width="2" height="20"/><rect x="677" y="110" width="2" height="20"/><rect x="709" y="110" width="2" height="20"/>
    <rect x="733" y="110" width="2" height="20"/><rect x="760" y="110" width="2" height="20"/>
  </g>
  <text x="490" y="148" text-anchor="middle" font-size="11" fill="#475569">always about 7.5 % bad epochs, spread evenly: every resample looks the same</text>
  <!-- block -->
  <text x="20" y="184" font-weight="bold" fill="#0f172a">block resample</text>
  <text x="20" y="200" font-size="11" fill="#475569">whole 60 s blocks</text>
  <rect x="200" y="172" width="580" height="20" fill="#cbd5e1"/>
  <g stroke="#f8fafc" stroke-width="1"><path d="M219 172v20M239 172v20M258 172v20M277 172v20M297 172v20M316 172v20M335 172v20M355 172v20M374 172v20M393 172v20M413 172v20M432 172v20M451 172v20M471 172v20M490 172v20M509 172v20M529 172v20M548 172v20M567 172v20M587 172v20M606 172v20M625 172v20M645 172v20M664 172v20M683 172v20M703 172v20M722 172v20M741 172v20M761 172v20"/></g>
  <rect x="297" y="172" width="13" height="20" fill="#dc2626"/>
  <rect x="606" y="172" width="13" height="20" fill="#dc2626"/>
  <rect x="625" y="172" width="13" height="20" fill="#dc2626"/>
  <text x="490" y="210" text-anchor="middle" font-size="11" fill="#475569">this one drew an episode twice, another may draw none: the spread is honest</text>
  <!-- CI plot 1 -->
  <text x="20" y="252" font-weight="bold" fill="#0f172a">95 % CI of the p95 difference (after - before), m</text>
  <line x1="200" y1="300" x2="780" y2="300" stroke="#64748b"/>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="200" y="316">-80</text><text x="329" y="316">-60</text><text x="458" y="316">-40</text><text x="587" y="316">-20</text><text x="716" y="316">0</text>
  </g>
  <line x1="716" y1="262" x2="716" y2="300" stroke="#0f172a" stroke-dasharray="4 3"/>
  <text x="20" y="276" font-size="12">iid</text>
  <rect x="409" y="268" width="117" height="10" fill="#94a3b8"/>
  <text x="530" y="277" font-size="11" fill="#334155">[-47.7, -29.6]</text>
  <text x="20" y="294" font-size="12">moving block (60 s)</text>
  <rect x="286" y="286" width="425" height="10" fill="#7c3aed"/>
  <text x="200" y="334" font-size="11" fill="#5b21b6">block: [-66.6, -0.7] — still below 0, but only just</text>
  <!-- CI plot 2 -->
  <text x="20" y="374" font-weight="bold" fill="#0f172a">95 % CI of the availability difference, percentage points</text>
  <line x1="200" y1="422" x2="780" y2="422" stroke="#64748b"/>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="200" y="438">-16</text><text x="345" y="438">-12</text><text x="490" y="438">-8</text><text x="635" y="438">-4</text><text x="780" y="438">0</text>
  </g>
  <line x1="417" y1="384" x2="417" y2="422" stroke="#dc2626" stroke-dasharray="4 3"/>
  <text x="422" y="394" font-size="11" fill="#991b1b">limit -10</text>
  <text x="20" y="398" font-size="12">iid</text>
  <rect x="468" y="390" width="87" height="10" fill="#94a3b8"/>
  <text x="562" y="399" font-size="11" fill="#334155">[-8.6, -6.2] → accept</text>
  <text x="20" y="416" font-size="12">moving block (60 s)</text>
  <rect x="276" y="408" width="431" height="10" fill="#7c3aed"/>
  <text x="200" y="456" font-size="11" fill="#5b21b6">block: [-13.9, -2.0] crosses the -10 limit → inconclusive</text>
</svg>
