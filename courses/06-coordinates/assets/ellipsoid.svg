<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="sans-serif" font-size="13">
<rect width="720" height="380" fill="#f7fafc"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
<text x="20" y="24" fill="#1d2733" font-weight="bold">A meridian cut through the WGS84 ellipsoid (flattening exaggerated)</text>
<ellipse cx="215" cy="200" rx="150" ry="114" fill="#d7ecf5" stroke="#0b6e8a" stroke-width="2"/>
<line x1="40" y1="200" x2="385" y2="200" stroke="#1d2733" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="215" y1="339" x2="215" y2="51" stroke="#1d2733" stroke-width="1.2" marker-end="url(#a)"/>
<text x="369" y="192" fill="#1d2733" font-size="12">X</text><text x="20" y="192" fill="#1d2733" font-size="12">equatorial plane</text>
<text x="223" y="60" fill="#1d2733" font-size="12">Z (spin axis)</text>
<text x="201" y="216" fill="#1d2733" font-size="12">O</text>
<line x1="215" y1="206" x2="65" y2="206" stroke="#a8680d" stroke-width="1.5"/><text x="140.0" y="222" fill="#a8680d" font-size="12" text-anchor="middle">a = 6 378 137 m</text>
<line x1="209" y1="200" x2="209" y2="314" stroke="#a8680d" stroke-width="1.5"/><text x="203" y="284" fill="#a8680d" font-size="12" text-anchor="end">b = 6 356 752 m</text>
<line x1="215.0" y1="255.8" x2="326.5" y2="123.7" stroke="#2f855a" stroke-width="2"/>
<line x1="326.5" y1="123.7" x2="361.9" y2="81.7" stroke="#d64545" stroke-width="2" marker-end="url(#a)"/>
<line x1="215" y1="200" x2="326.5" y2="123.7" stroke="#555" stroke-width="1" stroke-dasharray="5 4"/>
<circle cx="326.5" cy="123.7" r="4.5" fill="#1d2733"/><text x="336.5" y="137.7" fill="#1d2733" font-weight="bold">P</text>
<text x="367.9" y="87.7" fill="#d64545" font-size="13" font-weight="bold">h</text>
<text x="266.7" y="181.8" fill="#2f855a" font-size="12" text-anchor="end" stroke="#d7ecf5" stroke-width="3" paint-order="stroke">N(φ)</text>
<line x1="262.1" y1="200" x2="215.0" y2="255.8" stroke="#2f855a" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M300.1 200 A38 38 0 0 0 286.6 171.0" fill="none" stroke="#2f855a" stroke-width="1.5"/>
<text x="305.1" y="191" fill="#2f855a" font-size="13" font-weight="bold">φ</text>
<text x="455" y="56" fill="#1d2733" font-size="12.5" font-weight="bold">WGS84 (the GPS reference)</text>
<text x="455" y="76" fill="#1d2733" font-size="12.5">a = 6 378 137.0 m (exact)</text>
<text x="455" y="96" fill="#1d2733" font-size="12.5">f = 1 / 298.257223563 (exact)</text>
<text x="455" y="116" fill="#1d2733" font-size="12.5">b = a(1 − f) = 6 356 752.314 m</text>
<text x="455" y="136" fill="#1d2733" font-size="12.5">e² = f(2 − f) = 0.00669438</text>
<text x="455" y="176" fill="#1d2733" font-size="12.5" font-weight="bold">geodetic latitude φ</text>
<text x="455" y="196" fill="#1d2733" font-size="12.5">= angle between the NORMAL to the</text>
<text x="455" y="216" fill="#1d2733" font-size="12.5">ellipsoid and the equatorial plane</text>
<text x="455" y="236" fill="#1d2733" font-size="12.5">(not the line to the centre O, dashed)</text>
<text x="455" y="256" fill="#1d2733" font-size="12.5">h = height along the normal</text>
<text x="455" y="296" fill="#1d2733" font-size="12.5" font-weight="bold">N(φ) = a / √(1 − e² sin²φ)</text>
<text x="455" y="316" fill="#1d2733" font-size="12.5">length of the normal from P to the Z axis</text>
<text x="455" y="336" fill="#1d2733" font-size="12.5" font-weight="bold">M(φ) = a(1 − e²) / (1 − e² sin²φ)^1.5</text>
<text x="455" y="356" fill="#1d2733" font-size="12.5">radius of curvature along the meridian</text>
</svg>
