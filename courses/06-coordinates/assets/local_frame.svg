<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="sans-serif" font-size="13">
  <rect width="600" height="340" fill="#f7fafc"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d2733"/></marker></defs>
  <!-- grid -->
  <g stroke="#dde5ea" stroke-width="1">
    <line x1="60" y1="70" x2="500" y2="70"/><line x1="60" y1="130" x2="500" y2="130"/><line x1="60" y1="250" x2="500" y2="250"/><line x1="60" y1="310" x2="500" y2="310"/>
    <line x1="100" y1="30" x2="100" y2="320"/><line x1="340" y1="30" x2="340" y2="320"/><line x1="460" y1="30" x2="460" y2="320"/>
  </g>
  <!-- axes -->
  <line x1="60" y1="190" x2="510" y2="190" stroke="#1d2733" stroke-width="2" marker-end="url(#a)"/>
  <line x1="220" y1="325" x2="220" y2="25" stroke="#1d2733" stroke-width="2" marker-end="url(#a)"/>
  <text x="515" y="195" fill="#1d2733" font-weight="bold">east (x)</text>
  <text x="228" y="22" fill="#1d2733" font-weight="bold">north (y)</text>
  <text x="225" y="208" fill="#1d2733">home (0, 0)</text>
  <circle cx="220" cy="190" r="7" fill="#d64545"/>
  <!-- point -->
  <line x1="220" y1="190" x2="400" y2="100" stroke="#0b6e8a" stroke-width="2.5" stroke-dasharray="7 4"/>
  <circle cx="400" cy="100" r="7" fill="#0b6e8a"/>
  <text x="410" y="96" fill="#0b6e8a">drone</text>
  <line x1="400" y1="100" x2="400" y2="190" stroke="#f2a33a" stroke-width="2"/>
  <line x1="220" y1="190" x2="400" y2="190" stroke="#f2a33a" stroke-width="2"/>
  <text x="270" y="183" fill="#a8680d">east = 1500 m</text>
  <text x="405" y="150" fill="#a8680d">north = 750 m</text>
  <text x="300" y="168" fill="#0b6e8a" transform="rotate(-26 300 168)">distance ≈ 1677 m</text>
  <text x="330" y="60" fill="#0b6e8a">distance = √(1500² + 750²) ≈ 1677 m</text>
  <!-- bearing arc -->
  <path d="M220 130 A60 60 0 0 1 274 163" fill="none" stroke="#2f855a" stroke-width="2" marker-end="url(#a)"/>
  <text x="150" y="122" fill="#2f855a">bearing ≈ 63°</text>
  <text x="232" y="290" fill="#555" font-size="12">bearing = angle from NORTH, turning clockwise</text>
  <text x="232" y="306" fill="#555" font-size="12">= atan2(east, north) → 0° north, 90° east, 180° south, 270° west</text>
</svg>
