<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="sans-serif" font-size="13">
  <rect width="560" height="320" fill="#f7fafc"/>
  <!-- ground -->
  <rect x="0" y="262" width="560" height="58" fill="#cde6c8"/>
  <!-- field of view -->
  <polygon points="280,52 90,262 470,262" fill="#f2a33a" fill-opacity="0.18" stroke="#f2a33a" stroke-width="2"/>
  <!-- footprint -->
  <line x1="90" y1="270" x2="470" y2="270" stroke="#d64545" stroke-width="5"/>
  <text x="200" y="295" fill="#d64545" font-weight="bold">footprint  W = 2 · h · tan(HFOV / 2)</text>
  <!-- height -->
  <line x1="280" y1="58" x2="280" y2="262" stroke="#0b6e8a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="288" y="170" fill="#0b6e8a" font-weight="bold">h  (height above ground)</text>
  <!-- half angle -->
  <path d="M280 100 A48 48 0 0 0 252 90" fill="none" stroke="#1d2733" stroke-width="1.5"/>
  <text x="150" y="118" fill="#1d2733">HFOV / 2</text>
  <path d="M280 108 A56 56 0 0 1 316 96" fill="none" stroke="#1d2733" stroke-width="1.5"/>
  <text x="348" y="118" fill="#1d2733">HFOV / 2</text>
  <!-- half footprint -->
  <line x1="280" y1="250" x2="470" y2="250" stroke="#1d2733" stroke-width="1" marker-end="url(#a)"/>
  <text x="330" y="244" fill="#1d2733">W/2 = h · tan(HFOV/2)</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#1d2733"/></marker></defs>
  <!-- drone -->
  <rect x="258" y="34" width="44" height="16" rx="4" fill="#1d2733"/>
  <line x1="236" y1="32" x2="324" y2="32" stroke="#1d2733" stroke-width="3"/>
  <ellipse cx="236" cy="30" rx="14" ry="3" fill="#7a8794"/><ellipse cx="324" cy="30" rx="14" ry="3" fill="#7a8794"/>
  <circle cx="280" cy="52" r="5" fill="#d64545"/>
  <text x="312" y="56" fill="#1d2733">camera looking straight down</text>
  <text x="14" y="22" fill="#1d2733" font-weight="bold">How much ground does one photo cover?</text>
</svg>
