<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="sans-serif" font-size="13">
  <rect width="600" height="280" fill="#f7fafc"/>
  <text x="14" y="22" fill="#1d2733" font-weight="bold">The pinhole camera: two similar triangles</text>
  <!-- image sensor -->
  <rect x="40" y="116" width="10" height="58" fill="#0b6e8a"/>
  <text x="18" y="222" fill="#0b6e8a">image (pixels)</text>
  <!-- pinhole -->
  <line x1="160" y1="60" x2="160" y2="134" stroke="#1d2733" stroke-width="4"/>
  <line x1="160" y1="156" x2="160" y2="230" stroke="#1d2733" stroke-width="4"/>
  <text x="138" y="250" fill="#1d2733">pinhole</text>
  <!-- object -->
  <rect x="540" y="70" width="12" height="150" fill="#f2a33a"/>
  <text x="496" y="240" fill="#a8680d">object (meters)</text>
  <!-- rays -->
  <line x1="546" y1="70" x2="50" y2="166" stroke="#d64545" stroke-width="1.6"/>
  <line x1="546" y1="220" x2="50" y2="124" stroke="#d64545" stroke-width="1.6"/>
  <!-- labels -->
  <line x1="50" y1="262" x2="160" y2="262" stroke="#1d2733" marker-start="url(#b)" marker-end="url(#b)"/>
  <text x="70" y="276" fill="#1d2733">f (pixels)</text>
  <line x1="160" y1="262" x2="546" y2="262" stroke="#1d2733" marker-start="url(#b)" marker-end="url(#b)"/>
  <text x="300" y="276" fill="#1d2733">distance D (meters) = height h</text>
  <text x="56" y="112" fill="#0b6e8a">size_px</text>
  <text x="472" y="150" fill="#a8680d">size_m</text>
  <rect x="235" y="40" width="210" height="30" rx="6" fill="#fff" stroke="#0b6e8a"/>
  <text x="248" y="60" fill="#1d2733" font-weight="bold">size_px / f  =  size_m / D</text>
  <defs><marker id="b" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 4 L8 0 L8 8 z" fill="#1d2733"/></marker></defs>
</svg>
