<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="800" height="300" rx="12" fill="#f8fafc"/>
  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">One project, one change: the engineer's loop</text>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker></defs>
  <!-- row 1 -->
  <rect x="20" y="50" width="130" height="66" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="85" y="76" text-anchor="middle" font-weight="bold">1 understand</text><text x="85" y="96" text-anchor="middle" font-size="11">read, grep, branch</text>
  <rect x="175" y="50" width="130" height="66" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="240" y="76" text-anchor="middle" font-weight="bold">2 propose</text><text x="240" y="93" text-anchor="middle" font-size="11">hypothesis, metric,</text><text x="240" y="107" text-anchor="middle" font-size="11">acceptance criterion</text>
  <rect x="330" y="50" width="130" height="66" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="395" y="76" text-anchor="middle" font-weight="bold">3 measure</text><text x="395" y="96" text-anchor="middle" font-size="11">BEFORE (base code)</text>
  <rect x="485" y="50" width="130" height="66" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="550" y="76" text-anchor="middle" font-weight="bold">4 test</text><text x="550" y="96" text-anchor="middle" font-size="11">written first: FAILS</text>
  <rect x="640" y="50" width="140" height="66" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="710" y="76" text-anchor="middle" font-weight="bold">5 change</text><text x="710" y="96" text-anchor="middle" font-size="11">the smallest one</text>
  <path d="M150 83 H174" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M305 83 H329" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M460 83 H484" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M615 83 H639" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <!-- wrap -->
  <path d="M710 116 V140 H85 V163" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <!-- row 2 -->
  <rect x="20" y="165" width="130" height="66" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="85" y="191" text-anchor="middle" font-weight="bold">6 tests green</text><text x="85" y="211" text-anchor="middle" font-size="11">yours + the package's</text>
  <rect x="175" y="165" width="130" height="66" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="240" y="191" text-anchor="middle" font-weight="bold">7 measure</text><text x="240" y="208" text-anchor="middle" font-size="11">AFTER, same data,</text><text x="240" y="222" text-anchor="middle" font-size="11">bootstrap 95 % CI</text>
  <rect x="330" y="165" width="130" height="66" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="395" y="191" text-anchor="middle" font-weight="bold">8 decide</text><text x="395" y="208" text-anchor="middle" font-size="11">accept / reject /</text><text x="395" y="222" text-anchor="middle" font-size="11">inconclusive</text>
  <rect x="485" y="165" width="130" height="66" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="550" y="191" text-anchor="middle" font-weight="bold">9 commit</text><text x="550" y="211" text-anchor="middle" font-size="11">git diff base &gt; patch</text>
  <rect x="640" y="165" width="140" height="66" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="710" y="191" text-anchor="middle" font-weight="bold">10 report</text><text x="710" y="208" text-anchor="middle" font-size="11">PROJECT.md</text><text x="710" y="222" text-anchor="middle" font-size="11">+ results.json</text>
  <path d="M150 198 H174" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M305 198 H329" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M460 198 H484" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M615 198 H639" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <!-- red loop: tests red -> back to change -->
  <text x="400" y="262" text-anchor="middle" font-size="12" fill="#991b1b">Step 2 is written before step 7: the criterion cannot be bent to fit the result.</text>
  <text x="400" y="284" text-anchor="middle" font-size="12" fill="#334155">Tests red at step 6? Fix the change, not the test.</text>
</svg>
