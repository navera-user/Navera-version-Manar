# pytest settings for this lesson folder (you do not need to change this file).
# ROS 2's launch_testing pytest plugin uses a private pytest function, and pytest warns "A private pytest
# class or function was used." once per test: it is not about your code, so it is hidden here. Every other
# warning stays visible.
[pytest]
filterwarnings =
    ignore:A private pytest class or function was used:pytest.PytestDeprecationWarning
