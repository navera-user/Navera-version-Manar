<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="sans-serif" font-size="12">
  <rect width="560" height="250" fill="#f7fafc"/>
  <text x="20" y="24" font-size="15" font-weight="bold" fill="#1d2733">One frame, two lenses</text>
  <rect x="40" y="45" width="320" height="90" fill="#cde6c8" stroke="#1d2733"/>
  <rect x="40" y="135" width="320" height="90" fill="#dbe4ec" stroke="#1d2733"/>
  <text x="200" y="85" text-anchor="middle" fill="#1d2733" font-weight="bold">TOP lens</text>
  <text x="200" y="103" text-anchor="middle" fill="#1d2733">frame[0:540, :]</text>
  <text x="200" y="175" text-anchor="middle" fill="#1d2733" font-weight="bold">BOTTOM lens</text>
  <text x="200" y="193" text-anchor="middle" fill="#1d2733">frame[540:1080, :]</text>
  <text x="40" y="40" fill="#5a6775">column 0</text><text x="360" y="40" text-anchor="end" fill="#5a6775">1919</text>
  <text x="34" y="50" text-anchor="end" fill="#5a6775">row 0</text>
  <text x="34" y="139" text-anchor="end" fill="#5a6775">540</text>
  <text x="34" y="228" text-anchor="end" fill="#5a6775">1079</text>
  <text x="380" y="80" fill="#1d2733">1920 × 540</text>
  <text x="380" y="96" fill="#1d2733">≈ 166° × 43° fisheye</text>
  <text x="380" y="112" fill="#0b6e8a">NAVERA uses this one</text>
  <text x="380" y="128" fill="#0b6e8a">(crop "top")</text>
  <text x="380" y="175" fill="#1d2733">1920 × 540</text>
  <text x="380" y="191" fill="#5a6775">the other side of</text>
  <text x="380" y="207" fill="#5a6775">the camera</text>
</svg>
