<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="sans-serif" font-size="13">
  <rect width="760" height="300" fill="#f7fafc"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" fill="#1d2733">One GGA line through NAVERA Lite's gnss.py, and what each stage refuses</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5a6b7b"/></marker>
  </defs>
  <g font-family="monospace" font-size="12.5">
    <rect x="12" y="60" width="104" height="44" rx="6" fill="#e3edf7" stroke="#0b6e8a"/><text x="64" y="87" text-anchor="middle">serial line</text>
    <rect x="140" y="60" width="104" height="44" rx="6" fill="#fff" stroke="#0b6e8a"/><text x="192" y="87" text-anchor="middle">is_valid</text>
    <rect x="268" y="60" width="104" height="44" rx="6" fill="#fff" stroke="#0b6e8a"/><text x="320" y="87" text-anchor="middle">parse_gga</text>
    <rect x="396" y="60" width="110" height="44" rx="6" fill="#fff" stroke="#0b6e8a"/><text x="451" y="87" text-anchor="middle">fix_decision</text>
    <rect x="530" y="60" width="96" height="44" rx="6" fill="#fff" stroke="#0b6e8a"/><text x="578" y="81" text-anchor="middle">σ from</text><text x="578" y="96" text-anchor="middle">HDOP</text>
    <rect x="650" y="60" width="98" height="44" rx="6" fill="#d7f0d2" stroke="#2f7a2f"/><text x="699" y="87" text-anchor="middle">fix_state</text>
  </g>
  <g stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#a)">
    <line x1="116" y1="82" x2="138" y2="82"/><line x1="244" y1="82" x2="266" y2="82"/>
    <line x1="372" y1="82" x2="394" y2="82"/><line x1="506" y1="82" x2="528" y2="82"/><line x1="626" y1="82" x2="648" y2="82"/>
  </g>
  <g font-size="12" fill="#d64545">
    <text x="192" y="128" text-anchor="middle">refuses:</text>
    <text x="192" y="145" text-anchor="middle">bad checksum, cut,</text>
    <text x="192" y="160" text-anchor="middle">glued, garbage</text>
    <text x="320" y="128" text-anchor="middle">gives None for:</text>
    <text x="320" y="145" text-anchor="middle">empty fields,</text>
    <text x="320" y="160" text-anchor="middle">minutes ≥ 60, lat > 90°</text>
    <text x="451" y="128" text-anchor="middle">refuses:</text>
    <text x="451" y="145" text-anchor="middle">quality 0, 6, 7, 8…</text>
    <text x="451" y="160" text-anchor="middle">no position</text>
    <text x="578" y="128" text-anchor="middle">no HDOP:</text>
    <text x="578" y="145" text-anchor="middle">σ unknown,</text>
    <text x="578" y="160" text-anchor="middle">never invented</text>
  </g>
  <g font-size="12" fill="#1d2733">
    <text x="699" y="128" text-anchor="middle" fill="#2f7a2f" font-weight="bold">FIX</text>
    <text x="699" y="144" text-anchor="middle">σ ≤ 25 m</text>
    <text x="699" y="168" text-anchor="middle" fill="#b07a3a" font-weight="bold">DEGRADED</text>
    <text x="699" y="184" text-anchor="middle">σ unknown</text>
    <text x="699" y="199" text-anchor="middle">or σ &gt; 25 m</text>
    <text x="699" y="223" text-anchor="middle" fill="#d64545" font-weight="bold">NO_FIX</text>
    <text x="699" y="239" text-anchor="middle">refused before</text>
  </g>
  <rect x="20" y="200" width="600" height="70" rx="6" fill="#fff" stroke="#c7d3dc" stroke-dasharray="5 4"/>
  <text x="320" y="222" text-anchor="middle" fill="#1d2733">What no stage of gnss.py can see: a damaged line whose checksum is still right</text>
  <text x="320" y="240" text-anchor="middle" fill="#1d2733">(two characters swapped) with plausible numbers, or a perfect line from a spoofer.</text>
  <text x="320" y="258" text-anchor="middle" fill="#5a6b7b">That needs the jump gate (mission 01) and an independent source (mission 30).</text>
</svg>
