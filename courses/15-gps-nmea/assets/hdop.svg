<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="13">
  <rect width="640" height="300" fill="#f7fafc"/>
  <!-- left: well spread -->
  <g transform="translate(160,140)">
    <circle r="100" fill="#ffffff" stroke="#9cc7d6"/>
    <circle r="50" fill="none" stroke="#e1edf2"/>
    <text y="-106" text-anchor="middle" fill="#5a6b7b" font-size="11">N</text>
    <g fill="#0b6e8a"><circle cx="0" cy="-80" r="7"/><circle cx="75" cy="30" r="7"/><circle cx="-72" cy="40" r="7"/><circle cx="45" cy="-20" r="7"/><circle cx="-40" cy="-55" r="7"/></g>
    <!-- small error area -->
    <ellipse cx="0" cy="0" rx="14" ry="12" fill="#3a8d3a" fill-opacity="0.35" stroke="#2f7a2f"/>
    <text y="125" text-anchor="middle" fill="#1d2733">satellites all around the sky</text>
    <text y="-118" x="0" text-anchor="middle" fill="#2f7a2f" font-weight="bold">HDOP 0.7 — good</text>
  </g>
  <!-- right: bunched -->
  <g transform="translate(480,140)">
    <circle r="100" fill="#ffffff" stroke="#9cc7d6"/>
    <circle r="50" fill="none" stroke="#e1edf2"/>
    <text y="-106" text-anchor="middle" fill="#5a6b7b" font-size="11">N</text>
    <g fill="#0b6e8a"><circle cx="40" cy="-70" r="7"/><circle cx="58" cy="-50" r="7"/><circle cx="30" cy="-45" r="7"/><circle cx="65" cy="-75" r="7"/></g>
    <!-- big stretched error area -->
    <ellipse cx="0" cy="0" rx="62" ry="22" transform="rotate(45)" fill="#d64545" fill-opacity="0.25" stroke="#d64545"/>
    <text y="125" text-anchor="middle" fill="#1d2733">satellites bunched (a wall hides the rest)</text>
    <text y="-118" x="0" text-anchor="middle" fill="#d64545" font-weight="bold">HDOP 4.0 — poor</text>
  </g>
  <text x="320" y="290" text-anchor="middle" fill="#5a6b7b" font-size="11">Sky seen from above (centre = straight up). Coloured shape = where the receiver may really be.</text>
</svg>
