<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="sans-serif" font-size="13">
  <rect width="760" height="330" fill="#f7fafc"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" fill="#1d2733">Where is the satellite? Azimuth and elevation give the unit vector u (East, North, Up)</text>

  <!-- left: seen from above (azimuth) -->
  <g transform="translate(190,175)">
    <circle r="110" fill="#fff" stroke="#9cc7d6"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#c7d3dc"/>
    <line x1="0" y1="120" x2="0" y2="-120" stroke="#c7d3dc"/>
    <text y="-124" text-anchor="middle" fill="#5a6b7b">N</text>
    <text x="126" y="5" fill="#5a6b7b">E</text>
    <!-- satellite at az 60: ground projection length cos(el)=cos 35 = 0.819 -> 90 px -->
    <line x1="0" y1="0" x2="77.9" y2="-45.0" stroke="#0b6e8a" stroke-width="3"/>
    <circle cx="77.9" cy="-45.0" r="7" fill="#0b6e8a"/>
    <path d="M 0 -40 A 40 40 0 0 1 34.6 -20" fill="none" stroke="#d64545" stroke-width="2"/>
    <text x="14" y="-50" fill="#d64545">az</text>
    <line x1="77.9" y1="-45" x2="77.9" y2="0" stroke="#b07a3a" stroke-dasharray="4 3"/>
    <line x1="0" y1="-45" x2="77.9" y2="-45" stroke="#b07a3a" stroke-dasharray="4 3"/>
    <text x="40" y="18" text-anchor="middle" fill="#b07a3a" font-size="12">cos el · sin az</text>
    <text x="-8" y="-50" text-anchor="end" fill="#b07a3a" font-size="12">cos el · cos az</text>
    <circle r="4" fill="#1d2733"/>
  </g>
  <text x="190" y="315" text-anchor="middle" fill="#1d2733">Seen from above: azimuth, clockwise from north</text>

  <!-- right: side view in the vertical plane of the satellite (elevation) -->
  <g transform="translate(470,250)">
    <line x1="-10" y1="0" x2="250" y2="0" stroke="#5a6b7b" stroke-width="2"/>
    <text x="252" y="18" text-anchor="end" fill="#5a6b7b" font-size="12">horizon, towards the satellite's azimuth</text>
    <line x1="0" y1="10" x2="0" y2="-180" stroke="#c7d3dc"/>
    <text x="6" y="-170" fill="#5a6b7b">Up</text>
    <!-- el = 35 deg, length 180 -->
    <line x1="0" y1="0" x2="147.4" y2="-103.2" stroke="#0b6e8a" stroke-width="3"/>
    <circle cx="147.4" cy="-103.2" r="7" fill="#0b6e8a"/>
    <text x="158" y="-108" fill="#0b6e8a">satellite</text>
    <path d="M 50 0 A 50 50 0 0 0 41 -28.7" fill="none" stroke="#d64545" stroke-width="2"/>
    <text x="58" y="-24" fill="#d64545">el</text>
    <line x1="147.4" y1="-103.2" x2="147.4" y2="0" stroke="#b07a3a" stroke-dasharray="4 3"/>
    <text x="153" y="-45" fill="#b07a3a" font-size="12">sin el</text>
    <text x="112" y="-6" text-anchor="middle" fill="#b07a3a" font-size="12">cos el</text>
    <circle r="4" fill="#1d2733"/>
    <text x="-6" y="18" text-anchor="end" fill="#1d2733" font-size="12">receiver</text>
  </g>
  <text x="590" y="315" text-anchor="middle" fill="#1d2733">Side view: elevation, above the horizon</text>
  <text x="380" y="292" text-anchor="middle" fill="#0b6e8a" font-size="13">u = ( cos el · sin az ,  cos el · cos az ,  sin el )   — a vector of length 1</text>
</svg>
