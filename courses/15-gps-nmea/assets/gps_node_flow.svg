<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" font-size="13">
  <rect width="760" height="400" fill="#f7fafc"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" fill="#1d2733">What gps_node does with one line from the serial port</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b7b"/>
    </marker>
  </defs>
  <g stroke="#0b6e8a" fill="#e3edf7">
    <rect x="20" y="50" width="130" height="46" rx="6"/>
    <rect x="190" y="50" width="140" height="46" rx="6"/>
    <rect x="370" y="50" width="160" height="46" rx="6"/>
    <rect x="570" y="50" width="170" height="46" rx="6"/>
    <rect x="370" y="160" width="160" height="60" rx="6"/>
  </g>
  <g fill="#1d2733" text-anchor="middle">
    <text x="85" y="70">readline()</text><text x="85" y="87" font-size="11">ASCII, bad bytes → �</text>
    <text x="260" y="70">starts with "$"?</text><text x="260" y="87" font-size="11">.strip() first</text>
    <text x="450" y="70">pynmea2.parse(</text><text x="450" y="87" font-size="11">raw, check=True)</text>
    <text x="655" y="70">sentence type?</text><text x="655" y="87" font-size="11">GGA, RMC (others ignored)</text>
    <text x="450" y="182">quality in {1,2,4,5}</text><text x="450" y="199">and lat, lon present?</text>
    <text x="450" y="214" font-size="11">_publish_fix</text>
  </g>
  <g stroke="#5a6b7b" fill="none" marker-end="url(#ar)">
    <line x1="150" y1="73" x2="188" y2="73"/>
    <line x1="330" y1="73" x2="368" y2="73"/>
    <line x1="530" y1="73" x2="568" y2="73"/>
    <path d="M 640 96 L 640 130 L 470 130 L 470 158"/>
    <path d="M 700 96 L 700 158"/>
    <line x1="260" y1="96" x2="260" y2="158"/>
    <path d="M 400 96 L 400 140 L 305 140 L 305 158"/>
    <path d="M 410 220 L 410 262 L 250 262 L 250 288"/>
    <path d="M 490 220 L 490 262 L 590 262 L 590 288"/>
  </g>
  <g font-size="11" fill="#5a6b7b">
    <text x="268" y="125">no</text>
    <text x="408" y="114">ParseError</text>
    <text x="560" y="125">GGA</text>
    <text x="708" y="125">RMC</text>
    <text x="300" y="256">no</text>
    <text x="555" y="256">yes</text>
  </g>
  <!-- outcomes -->
  <rect x="190" y="160" width="140" height="46" rx="6" fill="#eee" stroke="#9aa"/>
  <text x="260" y="180" text-anchor="middle" fill="#1d2733">dropped silently</text>
  <text x="260" y="196" text-anchor="middle" font-size="11" fill="#5a6b7b">(checksum, cut, garbage)</text>
  <rect x="610" y="160" width="140" height="46" rx="6" fill="#fff" stroke="#9aa"/>
  <text x="680" y="180" text-anchor="middle" fill="#1d2733">/gps_vel</text>
  <text x="680" y="196" text-anchor="middle" font-size="11" fill="#5a6b7b">only if status = A</text>
  <rect x="130" y="290" width="250" height="78" rx="6" fill="#f6d2d2" stroke="#d64545"/>
  <text x="255" y="311" text-anchor="middle" fill="#1d2733" font-weight="bold">PositionEstimate valid = False</text>
  <text x="255" y="330" text-anchor="middle" font-size="11" fill="#1d2733">NaN position, covariance UNKNOWN</text>
  <text x="255" y="346" text-anchor="middle" font-size="11" fill="#1d2733">"no GPS fix (qual=0)" or</text>
  <text x="255" y="361" text-anchor="middle" font-size="11" fill="#1d2733">"…non-satellite position (qual=6) — not used"</text>
  <rect x="450" y="290" width="280" height="78" rx="6" fill="#d7f0d2" stroke="#3a8d3a"/>
  <text x="590" y="311" text-anchor="middle" fill="#1d2733" font-weight="bold">PositionEstimate valid = True</text>
  <text x="590" y="330" text-anchor="middle" font-size="11" fill="#1d2733">altitude = MSL + geoid separation</text>
  <text x="590" y="346" text-anchor="middle" font-size="11" fill="#1d2733">σ = 2 m × HDOP (E, N), 2σ vertical</text>
  <text x="590" y="361" text-anchor="middle" font-size="11" fill="#1d2733">+ NavSatFix on /navera/sensors/gps_fix</text>
  <text x="380" y="392" text-anchor="middle" font-size="11" fill="#5a6b7b">Not checked here: minutes ≥ 60, jumps, HDOP limits — the estimator's plausibility gate comes later (lesson 25).</text>
</svg>
