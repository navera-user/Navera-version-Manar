<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="monospace" font-size="13">
  <rect width="760" height="250" fill="#f7fafc"/>
  <text x="380" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1d2733">Anatomy of a GGA sentence (an example at NAVERA's test site, M'saken)</text>
  <!-- the sentence, one box per field -->
  <g font-size="12.5">
    <rect x="10" y="95" width="62" height="30" fill="#e3edf7" stroke="#0b6e8a"/><text x="41" y="115" text-anchor="middle">$GNGGA</text>
    <rect x="72" y="95" width="78" height="30" fill="#fff" stroke="#0b6e8a"/><text x="111" y="115" text-anchor="middle">141621.00</text>
    <rect x="150" y="95" width="88" height="30" fill="#fde9cf" stroke="#0b6e8a"/><text x="194" y="115" text-anchor="middle">3544.04006</text>
    <rect x="238" y="95" width="20" height="30" fill="#fde9cf" stroke="#0b6e8a"/><text x="248" y="115" text-anchor="middle">N</text>
    <rect x="258" y="95" width="96" height="30" fill="#fde9cf" stroke="#0b6e8a"/><text x="306" y="115" text-anchor="middle">01034.55091</text>
    <rect x="354" y="95" width="20" height="30" fill="#fde9cf" stroke="#0b6e8a"/><text x="364" y="115" text-anchor="middle">E</text>
    <rect x="374" y="95" width="20" height="30" fill="#d7f0d2" stroke="#0b6e8a"/><text x="384" y="115" text-anchor="middle">1</text>
    <rect x="394" y="95" width="28" height="30" fill="#fff" stroke="#0b6e8a"/><text x="408" y="115" text-anchor="middle">12</text>
    <rect x="422" y="95" width="42" height="30" fill="#d7f0d2" stroke="#0b6e8a"/><text x="443" y="115" text-anchor="middle">0.72</text>
    <rect x="464" y="95" width="42" height="30" fill="#fff" stroke="#0b6e8a"/><text x="485" y="115" text-anchor="middle">95.3</text>
    <rect x="506" y="95" width="20" height="30" fill="#fff" stroke="#0b6e8a"/><text x="516" y="115" text-anchor="middle">M</text>
    <rect x="526" y="95" width="42" height="30" fill="#fff" stroke="#0b6e8a"/><text x="547" y="115" text-anchor="middle">32.1</text>
    <rect x="568" y="95" width="20" height="30" fill="#fff" stroke="#0b6e8a"/><text x="578" y="115" text-anchor="middle">M</text>
    <rect x="588" y="95" width="40" height="30" fill="#eee" stroke="#0b6e8a"/><text x="608" y="115" text-anchor="middle">,,</text>
    <rect x="628" y="95" width="40" height="30" fill="#f6d2d2" stroke="#d64545"/><text x="648" y="115" text-anchor="middle">*70</text>
  </g>
  <!-- field numbers -->
  <g font-size="11" fill="#5a6b7b" text-anchor="middle">
    <text x="41" y="88">[0]</text><text x="111" y="88">[1]</text><text x="194" y="88">[2]</text><text x="248" y="88">[3]</text>
    <text x="306" y="88">[4]</text><text x="364" y="88">[5]</text><text x="384" y="88">[6]</text><text x="408" y="88">[7]</text>
    <text x="443" y="88">[8]</text><text x="485" y="88">[9]</text><text x="516" y="88">[10]</text><text x="547" y="88">[11]</text>
    <text x="578" y="88">[12]</text>
  </g>
  <!-- labels above -->
  <g font-family="sans-serif" font-size="12" fill="#1d2733">
    <text x="10" y="52">talker + type</text><line x1="41" y1="56" x2="41" y2="76" stroke="#5a6b7b"/>
    <text x="80" y="66">UTC time</text>
    <text x="196" y="52">latitude 35° 44.04006′ N</text><line x1="210" y1="56" x2="210" y2="76" stroke="#5a6b7b"/>
    <text x="290" y="66">longitude 10° 34.55091′ E</text>
    <text x="640" y="52" fill="#d64545">checksum</text><line x1="648" y1="56" x2="648" y2="92" stroke="#d64545"/>
  </g>
  <!-- labels below -->
  <g font-family="sans-serif" font-size="12" fill="#1d2733">
    <line x1="384" y1="128" x2="384" y2="160" stroke="#3a8d3a"/><text x="400" y="175" fill="#2f7a2f" text-anchor="end">fix quality (1 = GPS)</text>
    <line x1="408" y1="128" x2="408" y2="195" stroke="#5a6b7b"/><text x="360" y="210">satellites used</text>
    <line x1="443" y1="128" x2="443" y2="160" stroke="#3a8d3a"/><text x="424" y="175" fill="#2f7a2f">HDOP</text>
    <line x1="485" y1="128" x2="485" y2="195" stroke="#5a6b7b"/><text x="470" y="210">altitude above sea level (m)</text>
    <line x1="547" y1="128" x2="547" y2="148" stroke="#5a6b7b"/><text x="555" y="152">geoid separation (m)</text>
    <text x="10" y="160">$ = start</text>
    <text x="10" y="236" fill="#5a6b7b">The checksum covers every character BETWEEN "$" and "*". Fields are separated by commas; an empty field is just ",,".</text>
  </g>
</svg>
