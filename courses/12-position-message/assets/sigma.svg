<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="sans-serif" font-size="13">
  <rect width="560" height="260" fill="#f7fafc"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">"I am here, give or take σ"</text>
  <circle cx="170" cy="145" r="100" fill="#fdf0d8" stroke="#f2a33a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="170" cy="145" r="50" fill="#f9dca8" stroke="#a8680d" stroke-width="2"/>
  <circle cx="170" cy="145" r="5" fill="#d64545"/>
  <line x1="170" y1="145" x2="220" y2="145" stroke="#1d2733" stroke-width="1.5"/>
  <text x="188" y="139" fill="#1d2733">σ</text>
  <line x1="170" y1="145" x2="170" y2="45" stroke="#1d2733" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="176" y="62" fill="#a8680d">2σ</text>
  <text x="290" y="80" fill="#1d2733">red dot: latitude, longitude</text>
  <text x="290" y="104" fill="#1d2733">σ = 15 m → covariance[0] = covariance[4]</text>
  <text xml:space="preserve" x="290" y="122" fill="#1d2733">     = 15² = 225 (m²)</text>
  <text x="290" y="156" fill="#56606b">unknown accuracy? Then no circle at all:</text>
  <text x="290" y="174" fill="#56606b">COVARIANCE_TYPE_UNKNOWN and nine</text>
  <text x="290" y="192" fill="#56606b">zeros — never an invented number.</text>
</svg>
