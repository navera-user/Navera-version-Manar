<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="sans-serif" font-size="12">
  <rect width="720" height="440" fill="#f7fafc"/>
  <defs>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d2733"/>
    </marker>
  </defs>
  <text x="360" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">The lab's source: σ along 15 m, σ across 6 m, heading 30° (scale 5 px = 1 m)</text>
  <!-- axes -->
  <g stroke="#9aa5b1" stroke-width="1.2">
    <path d="M60 240 L470 240" marker-end="url(#k)"/>
    <path d="M260 420 L260 50" marker-end="url(#k)"/>
  </g>
  <text x="474" y="244" fill="#1d2733" font-weight="bold">E</text>
  <text x="252" y="44" fill="#1d2733" font-weight="bold">N</text>
  <!-- 95 % ellipse -->
    <ellipse cx="260" cy="240" rx="73.4" ry="183.6" transform="rotate(30 260 240)" fill="#e6f2f6" stroke="#0b6e8a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- 1 sigma ellipse -->
  <ellipse cx="260" cy="240" rx="30" ry="75" transform="rotate(30 260 240)" fill="#cfe6ee" stroke="#0b6e8a" stroke-width="2.5"/>
  <!-- major axis -->
  <path d="M260 240 L297.5 175" stroke="#b3261e" stroke-width="2.5" marker-end="url(#k)"/>
  <text x="306" y="170" fill="#b3261e" font-weight="bold">√λ₁ = 15 m (σ max)</text>
  <!-- minor axis -->
  <path d="M260 240 L286 255" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="290" y="270" fill="#2e7d32" font-weight="bold">√λ₂ = 6 m</text>
  <!-- heading arc -->
  <path d="M260 200 A40 40 0 0 1 280 205.4" fill="none" stroke="#a8680d" stroke-width="1.5"/>
  <text x="268" y="196" fill="#a8680d">30°</text>
  <!-- stated sigma: sqrt(Sigma_NN) = 13.3 m -> 66.7 px on N axis -->
  <path d="M240 240 L240 173.3" stroke="#6a3d9a" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M234 173.3 L246 173.3" stroke="#6a3d9a" stroke-width="2"/>
  <text x="66" y="150" fill="#6a3d9a">√Σ_NN = 13.3 m</text>
  <text x="40" y="166" fill="#6a3d9a" font-size="11">(what _stated_sigma reads)</text><path d="M150 160 L236 174" stroke="#6a3d9a" stroke-width="1"/>
  <!-- legend boxes -->
  <text x="490" y="392" fill="#0b6e8a">solid: 1σ ellipse — 39.3 % inside</text>
  <text x="490" y="410" fill="#0b6e8a">dashed: 2.448σ ellipse — 95 % inside</text>
  <!-- numbers panel -->
  <rect x="490" y="60" width="216" height="300" rx="10" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="598" y="82" text-anchor="middle" font-weight="bold" fill="#1d2733">the nine numbers</text>
  <g font-family="monospace" font-size="11.5" fill="#1d2733" style="white-space:pre" xml:space="preserve">
    <text x="502" y="106">[ 83.25,  81.84, 0.0,</text>
    <text x="502" y="122">  81.84, 177.75, 0.0,</text>
    <text x="502" y="138">   0.0,    0.0, 36.0 ]</text>
  </g>
  <text x="502" y="164" fill="#56606b">Σ_EE = 225·sin²30° + 36·cos²30°</text>
  <text x="502" y="182" fill="#56606b">Σ_NN = 225·cos²30° + 36·sin²30°</text>
  <text x="502" y="200" fill="#56606b">Σ_EN = (225 − 36)·sin30°·cos30°</text>
  <text x="502" y="226" fill="#1d2733">det = 8100 = (15 × 6)²</text>
  <text x="502" y="244" fill="#1d2733">eigenvalues: 225 and 36 m²</text>
  <text x="502" y="270" fill="#b3261e">σ max = 15 m</text>
  <text x="502" y="288" fill="#6a3d9a">stated σ = √max(83.25, 177.75)</text>
  <text x="502" y="306" fill="#6a3d9a">         = 13.3 m  → FIX (≤ 25 m)</text>
  <text x="502" y="332" fill="#56606b" font-size="11">up: σ = 6 m (36 m²), not used</text>
  <text x="502" y="348" fill="#56606b" font-size="11">by the 2-D tests</text>
</svg>
