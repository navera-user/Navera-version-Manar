<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="sans-serif" font-size="13">
  <rect width="760" height="340" fill="#f7fafc"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#1d2733">The judge's checklist for one estimate, then the choice between sources</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5a6b7b"/></marker></defs>
  <g font-size="12.5">
    <rect x="20" y="44" width="300" height="270" rx="10" fill="#fff" stroke="#0b6e8a"/>
    <text x="170" y="64" text-anchor="middle" font-weight="bold" fill="#0b6e8a">eligible(est, now_s, cfg) — first rule broken</text>
    <g fill="#1d2733">
      <text x="34" y="92">1  has a position (valid)</text>
      <text x="34" y="120">2  not exactly (0, 0)</text>
      <text x="34" y="148">3  finite lat/lon, in range</text>
      <text x="34" y="176">4  stated type ⇒ a covariance</text>
      <text x="34" y="204">5  not &gt; 0.5 s in the future</text>
      <text x="34" y="232">6  a known source</text>
      <text x="34" y="260">7  age ≤ the source's timeout</text>
    </g>
    <g fill="#d64545" font-family="monospace" font-size="11.5" text-anchor="end">
      <text x="310" y="92">no position</text>
      <text x="310" y="120">null island</text>
      <text x="310" y="148">bad position</text>
      <text x="310" y="176">not a covariance</text>
      <text x="310" y="204">from the future</text>
      <text x="310" y="232">unknown source</text>
      <text x="310" y="260">stale (…)</text>
    </g>
    <text x="170" y="296" text-anchor="middle" fill="#2f7a2f" font-family="monospace">all passed → (True, "eligible")</text>
  </g>
  <line x1="324" y1="180" x2="380" y2="180" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="384" y="130" width="160" height="100" rx="10" fill="#fff" stroke="#5a6b7b"/>
  <text x="464" y="154" text-anchor="middle" font-weight="bold">priority</text>
  <text x="464" y="176" text-anchor="middle" font-size="12">first eligible of</text>
  <text x="464" y="194" text-anchor="middle" font-size="12">GPS › day › night</text>
  <text x="464" y="212" text-anchor="middle" font-size="12">› celestial</text>
  <line x1="548" y1="180" x2="584" y2="180" stroke="#5a6b7b" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="588" y="94" width="160" height="172" rx="10" fill="#fff" stroke="#5a6b7b"/>
  <text x="668" y="118" text-anchor="middle" font-weight="bold">classify(stated σ)</text>
  <rect x="604" y="132" width="128" height="34" rx="6" fill="#d7f0d2" stroke="#2f7a2f"/>
  <text x="668" y="154" text-anchor="middle" font-size="12">FIX: σ ≤ 25 m</text>
  <rect x="604" y="176" width="128" height="50" rx="6" fill="#fdf0c8" stroke="#8a6d0b"/>
  <text x="668" y="197" text-anchor="middle" font-size="12">DEGRADED: σ &gt; 25 m</text>
  <text x="668" y="215" text-anchor="middle" font-size="12">or σ unknown</text>
  <text x="668" y="250" text-anchor="middle" font-size="11.5" fill="#56606b">none eligible → NO_FIX</text>
  <text x="566" y="292" text-anchor="middle" font-size="11.5" fill="#56606b">stated σ = √max(a, c), only for a stated type,</text><text x="566" y="308" text-anchor="middle" font-size="11.5" fill="#56606b">a real covariance and σ ≥ 1 cm; else unknown</text>
</svg>
