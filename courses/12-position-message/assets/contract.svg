<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="sans-serif" font-size="13">
  <rect width="760" height="330" fill="#f7fafc"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#1d2733">One form, five questions: an Estimate in Python, a NavSatFix on the wire</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5a6b7b"/></marker></defs>
  <text x="130" y="56" text-anchor="middle" font-weight="bold" fill="#0b6e8a">Estimate (estimate.py)</text>
  <text x="380" y="56" text-anchor="middle" font-weight="bold" fill="#1d2733">question</text>
  <text x="630" y="56" text-anchor="middle" font-weight="bold" fill="#0b6e8a">sensor_msgs/NavSatFix</text>
  <g font-family="monospace" font-size="12.5" fill="#1d2733">
    <rect x="20" y="68" width="220" height="34" rx="6" fill="#fff" stroke="#0b6e8a"/><text x="32" y="90">source = "day"</text>
    <rect x="20" y="110" width="220" height="50" rx="6" fill="#fff" stroke="#0b6e8a"/><text x="32" y="131">lat, lon = 35.8301, 10.6352</text><text x="32" y="150">alt_m = nan   (unknown)</text>
    <rect x="20" y="168" width="220" height="50" rx="6" fill="#fff" stroke="#0b6e8a"/><text x="32" y="189" font-size="11">cov = (900, 0, 0, 0, 900, …)</text><text x="32" y="208">cov_type = 1  APPROXIMATED</text>
    <rect x="20" y="226" width="220" height="34" rx="6" fill="#fff" stroke="#0b6e8a"/><text x="32" y="248">stamp_s = 1000.0</text>
    <rect x="20" y="268" width="220" height="34" rx="6" fill="#fff" stroke="#0b6e8a"/><text x="32" y="290">valid = True, reason = ""</text>
    <rect x="520" y="68" width="220" height="34" rx="6" fill="#fff" stroke="#0b6e8a"/><text x="532" y="90">header.frame_id</text>
    <rect x="520" y="110" width="220" height="50" rx="6" fill="#fff" stroke="#0b6e8a"/><text x="532" y="131">latitude, longitude</text><text x="532" y="150">altitude</text>
    <rect x="520" y="168" width="220" height="50" rx="6" fill="#fff" stroke="#0b6e8a"/><text x="532" y="189">position_covariance</text><text x="532" y="208">position_covariance_type</text>
    <rect x="520" y="226" width="220" height="34" rx="6" fill="#fff" stroke="#0b6e8a"/><text x="532" y="248">header.stamp</text>
    <rect x="520" y="268" width="220" height="34" rx="6" fill="#fff" stroke="#0b6e8a"/><text x="532" y="290">status.status (−1 = none)</text>
  </g>
  <g text-anchor="middle" fill="#1d2733">
    <text x="380" y="90">who?</text>
    <text x="380" y="140">where?</text>
    <text x="380" y="190">how sure?</text>
    <text x="380" y="207" font-size="11.5" fill="#56606b">variances in m², ENU</text>
    <text x="380" y="242">when MEASURED?</text>
    <text x="380" y="257" font-size="11.5" fill="#56606b">the photo, not the message</text>
    <text x="380" y="290">usable?</text>
  </g>
  <g stroke="#5a6b7b" stroke-width="1.4" marker-end="url(#a)">
    <line x1="244" y1="85" x2="330" y2="85"/><line x1="430" y1="85" x2="516" y2="85"/>
    <line x1="244" y1="135" x2="340" y2="135"/><line x1="420" y1="135" x2="516" y2="135"/>
    <line x1="244" y1="193" x2="335" y2="186"/><line x1="425" y1="186" x2="516" y2="193"/>
    <line x1="244" y1="243" x2="318" y2="238"/><line x1="442" y1="238" x2="516" y2="243"/>
    <line x1="244" y1="285" x2="350" y2="285"/><line x1="410" y1="285" x2="516" y2="285"/>
  </g>
  <text x="380" y="320" text-anchor="middle" font-size="12" fill="#56606b">ros/convert.py: to_navsatfix(est) and from_navsatfix(msg). Unknown stays unknown: nan, type 0 — never an invented value.</text>
</svg>
