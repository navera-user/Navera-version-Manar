<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 220" font-family="sans-serif" font-size="13">
  <rect width="660" height="220" fill="#f7fafc"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d2733"/>
    </marker>
  </defs>
  <text x="330" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d2733">Two clocks in one message: measured, then published</text>
  <line x1="30" y1="120" x2="630" y2="120" stroke="#1d2733" stroke-width="2" marker-end="url(#f)"/>
  <text x="612" y="142" fill="#56606b">time</text>
  <!-- exposure -->
  <circle cx="120" cy="120" r="8" fill="#a8680d"/>
  <text x="120" y="92" text-anchor="middle" font-weight="bold" fill="#a8680d">sensor_stamp</text>
  <text x="120" y="74" text-anchor="middle" fill="#1d2733">the photo is taken</text>
  <!-- processing -->
  <rect x="134" y="108" width="236" height="24" fill="#e6f2f6" stroke="#0b6e8a"/>
  <text x="252" y="125" text-anchor="middle" fill="#0b6e8a">vision computes the position…</text>
  <!-- publish -->
  <circle cx="384" cy="120" r="8" fill="#0b6e8a"/>
  <text x="384" y="92" text-anchor="middle" font-weight="bold" fill="#0b6e8a">header.stamp</text>
  <text x="384" y="74" text-anchor="middle" fill="#1d2733">the message is published</text>
  <!-- now -->
  <line x1="540" y1="96" x2="540" y2="144" stroke="#d64545" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="540" y="88" text-anchor="middle" font-weight="bold" fill="#d64545">now</text>
  <!-- age -->
  <line x1="120" y1="168" x2="536" y2="168" stroke="#d64545" stroke-width="1.5" marker-end="url(#f)"/>
  <text xml:space="preserve" x="330" y="188" text-anchor="middle" fill="#d64545">age of the position = now − sensor_stamp   (NAVERA's freshness rule)</text>
  <text x="252" y="156" text-anchor="middle" fill="#56606b" font-size="12">latency = header.stamp − sensor_stamp</text>
  <text x="330" y="210" text-anchor="middle" fill="#56606b" font-size="12">The drone kept flying during the latency: a position is as old as its photo, not as its message.</text>
</svg>
