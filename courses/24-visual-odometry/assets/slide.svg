<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" font-family="sans-serif" font-size="13">
  <rect width="560" height="290" fill="#f7fafc"/>
  <defs>
    <marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d64545"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0b6e8a"/></marker>
  </defs>
  <text x="20" y="22" fill="#1d2733" font-weight="bold">Photo 1</text>
  <text x="300" y="22" fill="#1d2733" font-weight="bold">Photo 2 (one second later)</text>
  <!-- photo 1 -->
  <rect x="20" y="32" width="220" height="160" fill="#cde6c8" stroke="#1d2733"/>
  <rect x="60" y="120" width="40" height="30" fill="#b9b2a3" stroke="#1d2733"/>
  <rect x="150" y="70" width="50" height="35" fill="#b9b2a3" stroke="#1d2733"/>
  <path d="M20 175 L240 160" stroke="#888" stroke-width="7"/>
  <!-- photo 2: the same ground slid 20 px LEFT and 40 px DOWN; new ground enters at the top -->
  <rect x="300" y="32" width="220" height="160" fill="#cde6c8" stroke="#1d2733"/>
  <rect x="340" y="160" width="40" height="30" fill="#b9b2a3" stroke="#1d2733"/>
  <rect x="430" y="110" width="50" height="35" fill="#b9b2a3" stroke="#1d2733"/>
  <rect x="470" y="40" width="34" height="34" fill="#b9b2a3" stroke="#1d2733"/>
  <rect x="450" y="70" width="50" height="35" fill="none" stroke="#d64545" stroke-dasharray="4 3"/>
  <line x1="475" y1="88" x2="458" y2="122" stroke="#d64545" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="300" y="210" fill="#d64545">the ground slid ← and ↓ : dx &lt; 0, dy &gt; 0</text>
  <!-- the drone's motion -->
  <line x1="255" y1="150" x2="280" y2="100" stroke="#0b6e8a" stroke-width="3" marker-end="url(#b)"/>
  <text x="246" y="170" fill="#0b6e8a">drone</text>
  <text x="20" y="240" fill="#0b6e8a">The drone flew north and a bit east: the ground slides the OPPOSITE way.</text>
  <text x="20" y="258" fill="#0b6e8a">Shift in pixels × meters per pixel = the step in meters.</text>
  <text x="20" y="278" fill="#1d2733">(north is up in both photos; the image y axis points DOWN)</text>
</svg>
