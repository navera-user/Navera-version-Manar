<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif" font-size="13">
  <rect width="640" height="300" fill="#f7fafc"/>
  <text x="20" y="24" fill="#1d2733" font-weight="bold">The ratio test: is the best candidate clearly the best?</text>
  <!-- case A -->
  <text x="20" y="54" fill="#1d2733">A — a crossroads (unique)</text>
  <rect x="20" y="64" width="60" height="60" fill="#e8dcc4" stroke="#1d2733"/>
  <path d="M50 64 V124 M20 94 H80" stroke="#6b5a3e" stroke-width="6"/>
  <circle cx="50" cy="94" r="6" fill="none" stroke="#d64545" stroke-width="2"/>
  <text x="96" y="80" fill="#1d2733">best candidate</text>
  <text x="96" y="96" fill="#0b6e8a">distance 100</text>
  <text x="200" y="80" fill="#1d2733">2nd best</text>
  <text x="200" y="96" fill="#a8680d">distance 300</text>
  <rect x="96" y="106" width="50" height="10" fill="#0b6e8a"/>
  <rect x="200" y="106" width="150" height="10" fill="#f2a33a"/>
  <text x="96" y="140" fill="#1d2733">100 &lt; 0.8 × 300 = 240  →</text>
  <text x="252" y="140" fill="#2e7d32" font-weight="bold">KEEP ✔</text>
  <!-- case B -->
  <text x="20" y="184" fill="#1d2733">B — one olive tree among hundreds</text>
  <rect x="20" y="194" width="60" height="60" fill="#d9c49a" stroke="#1d2733"/>
  <g fill="#4d6b2f"><circle cx="32" cy="206" r="5"/><circle cx="50" cy="206" r="5"/><circle cx="68" cy="206" r="5"/><circle cx="32" cy="224" r="5"/><circle cx="50" cy="224" r="5"/><circle cx="68" cy="224" r="5"/><circle cx="32" cy="242" r="5"/><circle cx="50" cy="242" r="5"/><circle cx="68" cy="242" r="5"/></g>
  <circle cx="50" cy="224" r="9" fill="none" stroke="#d64545" stroke-width="2"/>
  <text x="96" y="210" fill="#1d2733">best candidate</text>
  <text x="96" y="226" fill="#0b6e8a">distance 200</text>
  <text x="200" y="210" fill="#1d2733">2nd best</text>
  <text x="200" y="226" fill="#a8680d">distance 210</text>
  <rect x="96" y="236" width="100" height="10" fill="#0b6e8a"/>
  <rect x="200" y="236" width="105" height="10" fill="#f2a33a"/>
  <text x="96" y="270" fill="#1d2733">200 &gt; 0.8 × 210 = 168  →</text>
  <text x="252" y="270" fill="#d64545" font-weight="bold">DROP ✘ (ambiguous)</text>
  <!-- explanation -->
  <rect x="400" y="60" width="220" height="196" rx="8" fill="#ffffff" stroke="#9cc7d6"/>
  <text x="412" y="84" fill="#1d2733">A short distance means</text>
  <text x="412" y="102" fill="#1d2733">"fingerprints look alike".</text>
  <text x="412" y="132" fill="#1d2733">But if the 2nd best looks</text>
  <text x="412" y="150" fill="#1d2733">almost as alike, we cannot</text>
  <text x="412" y="168" fill="#1d2733">tell which one is right:</text>
  <text x="412" y="186" fill="#1d2733">better to drop the match.</text>
  <text x="412" y="222" fill="#0b6e8a">NAVERA: ratio = 0.8</text>
  <text x="412" y="240" fill="#0b6e8a">(Lowe, 2004)</text>
</svg>
