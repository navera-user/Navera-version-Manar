<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="sans-serif" font-size="13">
  <defs>
    <clipPath id="photoClip"><rect x="31" y="102" width="128" height="96"/></clipPath>
    <clipPath id="validClip"><rect x="-40" y="-30" width="80" height="60" transform="translate(320 150) rotate(35)"/></clipPath>
  </defs>
  <rect width="680" height="330" fill="#f7fafc"/>
  <text x="20" y="26" fill="#1d2733" font-weight="bold">Matching with your network: prepare the photo with the prior, match, come back</text>
  <!-- 1. the photo as the camera delivers it: axis-aligned, the ground turned by -35 degrees -->
  <text x="30" y="56" fill="#1d2733" font-weight="bold">1. the photo</text>
  <rect x="31" y="102" width="128" height="96" fill="#e8dcc0" stroke="#0b6e8a" stroke-width="2"/>
  <g clip-path="url(#photoClip)">
    <g transform="translate(95 150) rotate(-35)">
      <path d="M-120 -16 L120 39" stroke="#7a6a50" stroke-width="7"/>
      <rect x="-14" y="-40" width="22" height="16" fill="#ffffff" stroke="#555"/>
    </g>
  </g>
  <g transform="translate(140 125) rotate(-35)">
    <path d="M0 14 V-12" stroke="#d64545" stroke-width="2"/><path d="M-4 -8 L0 -16 L4 -8 Z" fill="#d64545"/>
    <text x="-4" y="-19" fill="#d64545" font-size="11">N</text>
  </g>
  <text x="30" y="226" fill="#5b6b7a">its top looks to heading h = 35°:</text>
  <text x="30" y="244" fill="#5b6b7a">north is 35° LEFT of the top</text>
  <!-- arrow A -->
  <path d="M174 150 H232" stroke="#1d2733" stroke-width="2"/><path d="M230 144 L242 150 L230 156 Z" fill="#1d2733"/>
  <text x="182" y="138" fill="#1d2733" font-weight="bold">A</text>
  <text x="178" y="172" fill="#5b6b7a" font-size="11">turn by h,</text>
  <text x="178" y="186" fill="#5b6b7a" font-size="11">÷ zoom</text>
  <!-- 2. upright: the photo's area turned 35 degrees clockwise, the ground north up -->
  <text x="250" y="56" fill="#1d2733" font-weight="bold">2. upright (north up)</text>
  <rect x="250" y="80" width="140" height="140" fill="#9aa5b1" stroke="#9cc7d6"/>
  <rect x="-40" y="-30" width="80" height="60" transform="translate(320 150) rotate(35)" fill="#e8dcc0" stroke="#0b6e8a" stroke-width="2"/>
  <g clip-path="url(#validClip)">
    <path d="M250 136 L390 168" stroke="#7a6a50" stroke-width="4"/>
    <rect x="312" y="126" width="14" height="10" fill="#ffffff" stroke="#555"/>
  </g>
  <text x="250" y="240" fill="#5b6b7a">ground north up at the map's scale;</text>
  <text x="250" y="258" fill="#5b6b7a">grey: outside the photo (valid = 0)</text>
  <!-- 3. map -->
  <text x="470" y="56" fill="#1d2733" font-weight="bold">3. the map patch</text>
  <rect x="470" y="80" width="140" height="140" fill="#e8dcc0" stroke="#0b6e8a" stroke-width="2"/>
  <path d="M470 136 L610 168" stroke="#7a6a50" stroke-width="4"/><rect x="532" y="126" width="14" height="10" fill="#ffffff" stroke="#555"/>
  <path d="M398 150 H462" stroke="#2e8b57" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="402" y="140" fill="#2e8b57" font-size="12">patches,</text><text x="402" y="172" fill="#2e8b57" font-size="12">descriptors,</text>
  <text x="402" y="186" fill="#2e8b57" font-size="12">ratio test</text>
  <!-- back -->
  <path d="M320 272 V300 H95 V262" stroke="#d64545" stroke-width="2" fill="none"/><path d="M89 264 L95 252 L101 264 Z" fill="#d64545"/>
  <text x="130" y="292" fill="#d64545">4. bring the photo-side points back: p_photo = A⁻¹ · p_upright, then RANSAC</text>
  <text x="470" y="250" fill="#5b6b7a" font-size="12">map data © OpenStreetMap</text><text x="470" y="264" fill="#5b6b7a" font-size="12">contributors (drawing)</text>
</svg>
