<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="sans-serif" font-size="13"><rect width="760" height="330" fill="#f7fafc"/><defs><marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d2733"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c98a06"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e4f"/></marker></defs><rect x="35" y="141" width="150" height="48" rx="10" fill="#ffffff" stroke="#2e9e4f" stroke-width="2.5"/><text x="110.0" y="170.0" text-anchor="middle" font-size="15" fill="#2e9e4f" font-weight="bold">TRUSTED</text><rect x="305" y="46" width="150" height="48" rx="10" fill="#ffffff" stroke="#c98a06" stroke-width="2.5"/><text x="380.0" y="75.0" text-anchor="middle" font-size="15" fill="#c98a06" font-weight="bold">IN DOUBT</text><rect x="575" y="141" width="150" height="48" rx="10" fill="#ffffff" stroke="#d64545" stroke-width="2.5"/><text x="650.0" y="170.0" text-anchor="middle" font-size="15" fill="#d64545" font-weight="bold">REFUSED</text><text x="110.0" y="210.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">GPS used as it is</text><text x="380.0" y="115.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">GPS used, widened to the gap:</text><text x="380.0" y="129.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">the judge says DEGRADED</text><text x="650.0" y="210.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">GPS not used:</text><text x="650.0" y="224.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">the judge flies on vision</text><path d="M150 141 Q 210 70 305 66" fill="none" stroke="#c98a06" stroke-width="2" marker-end="url(#ma)"/><text x="150.0" y="58.0" text-anchor="start" font-size="12" fill="#c98a06" font-weight="normal">2 tests in a row d² > γ</text><text x="150.0" y="73.0" text-anchor="start" font-size="11" fill="#c98a06" font-weight="normal">(gap ≤ 500 m)</text><path d="M310 92 Q 230 135 186 160" fill="none" stroke="#2e9e4f" stroke-width="2" marker-end="url(#mg)"/><text x="232.0" y="130.0" text-anchor="middle" font-size="12" fill="#2e9e4f" font-weight="normal">1 test d² ≤ γ</text><path d="M455 66 Q 560 70 612 141" fill="none" stroke="#d64545" stroke-width="2" marker-end="url(#mr)"/><text x="470.0" y="50.0" text-anchor="start" font-size="12" fill="#d64545" font-weight="normal">5 in a row d² > γ, or</text><text x="470.0" y="64.0" text-anchor="start" font-size="12" fill="#d64545" font-weight="normal">2 in a row d² > γ_far, or a jump</text><path d="M185 178 L 575 178" fill="none" stroke="#d64545" stroke-width="2" marker-end="url(#mr)"/><text x="400.0" y="170.0" text-anchor="middle" font-size="11" fill="#d64545" font-weight="normal">a jump · 2 in a row d² > γ_far · back from an outage (reference heard)</text><path d="M575 196 Q 380 290 185 196" fill="none" stroke="#2e9e4f" stroke-width="2" marker-end="url(#mg)"/><text x="380.0" y="262.0" text-anchor="middle" font-size="12" fill="#2e9e4f" font-weight="normal">2 reference fixes in a row agree (d² ≤ γ): confirmed</text><text x="380.0" y="278.0" text-anchor="middle" font-size="11" fill="#2e9e4f" font-weight="normal">or, with no stated reference for 120 s: the jump gate says reachable again</text><text x="380.0" y="318.0" text-anchor="middle" font-size="12" fill="#8a96a3" font-weight="normal">Every arrow needs evidence; the way back needs more evidence than the way out (hysteresis).</text></svg>
