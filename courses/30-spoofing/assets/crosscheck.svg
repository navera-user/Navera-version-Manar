<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="280" rx="12" fill="#f8fafc"/>
  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">The vision cross-check: a slow drift, step by step</text>
  <!-- state bar -->
  <rect x="40" y="40" width="360" height="22" fill="#bbf7d0"/><text x="220" y="56" text-anchor="middle" font-size="12">GPS used (FIX)</text>
  <rect x="400" y="40" width="150" height="22" fill="#fde68a"/><text x="475" y="56" text-anchor="middle" font-size="12">IN DOUBT (DEGRADED)</text>
  <rect x="550" y="40" width="140" height="22" fill="#fecaca"/><text x="620" y="56" text-anchor="middle" font-size="12">refused → vision</text>
  <rect x="690" y="40" width="40" height="22" fill="#bbf7d0"/><text x="710" y="56" text-anchor="middle" font-size="11">FIX</text>
  <!-- tolerance band -->
  <rect x="40" y="150" width="690" height="50" fill="#dcfce7"/>
  <text x="725" y="168" text-anchor="end" font-size="11" fill="#166534">agrees: within 3σ of vision (3 × 15 m = 45 m)</text>
  <!-- axis -->
  <line x1="40" y1="200" x2="730" y2="200" stroke="#334155"/>
  <text x="730" y="218" text-anchor="end" font-size="11">time →</text>
  <!-- GPS offset line -->
  <path d="M40 198 L150 198 L640 76" stroke="#dc2626" stroke-width="3" fill="none"/>
  <path d="M640 196 L730 196" stroke="#2563eb" stroke-width="3"/>
  <text x="380" y="104" text-anchor="end" fill="#991b1b" font-weight="bold">GPS – vision gap (spoofer pulls slowly)</text>
  <!-- vision fixes beyond 3 sigma -->
  <g fill="#0f172a">
    <circle cx="350" cy="200" r="4"/><circle cx="400" cy="200" r="4"/><circle cx="450" cy="200" r="4"/>
    <circle cx="500" cy="200" r="4"/><circle cx="550" cy="200" r="4"/>
  </g>
  <g fill="#1d4ed8"><circle cx="650" cy="200" r="4"/><circle cx="690" cy="200" r="4"/></g>
  <text x="340" y="234" text-anchor="end" font-size="11">vision fix beyond 3σ: 1</text>
  <text x="400" y="252" text-anchor="middle" font-size="11" fill="#92400e" font-weight="bold">2 → IN DOUBT</text>
  <text x="550" y="234" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="bold">5 → REFUSED</text>
  <text x="725" y="234" text-anchor="end" font-size="11" fill="#1d4ed8" font-weight="bold">true GPS back:</text>
  <text x="725" y="252" text-anchor="end" font-size="11" fill="#1d4ed8">2 agreeing → re-accepted</text>
  <text x="380" y="272" text-anchor="middle" font-size="11" fill="#334155">● = one distinct vision fix (one every 2 s). The streak resets when a fix agrees again.</text>
</svg>
