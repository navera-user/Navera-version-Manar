<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="sans-serif" font-size="13">
<rect width="720" height="330" fill="#f7fafc"/>
<text x="20" y="28" font-size="15" font-weight="bold" fill="#1d2733">Mutants: break the code on purpose, and see whether a test notices</text>
<!-- given code -->
<rect x="20" y="50" width="200" height="56" rx="8" fill="#2f855a"/>
<text x="120" y="73" fill="#fff" text-anchor="middle" font-weight="bold">the given code</text>
<text x="120" y="92" fill="#e3f4ea" text-anchor="middle" font-size="11">your tests must PASS here</text>
<!-- mutants -->
<g font-size="11">
<rect x="20" y="130" width="200" height="34" rx="6" fill="#e6f2f6" stroke="#0b6e8a"/>
<text x="30" y="151" fill="#1d2733">1: cos(p1) * cos(p2) → cos(p1) ** 2</text>
<rect x="20" y="172" width="200" height="34" rx="6" fill="#e6f2f6" stroke="#0b6e8a"/>
<text x="30" y="193" fill="#1d2733">2: 2.0 * R → R</text>
<rect x="20" y="214" width="200" height="34" rx="6" fill="#e6f2f6" stroke="#0b6e8a"/>
<text x="30" y="235" fill="#1d2733">3: d &lt;= limit → d &lt; limit</text>
<rect x="20" y="256" width="200" height="34" rx="6" fill="#e6f2f6" stroke="#0b6e8a"/>
<text x="30" y="277" fill="#1d2733">4: a change no input can show</text>
</g>
<!-- tests -->
<rect x="290" y="150" width="140" height="120" rx="8" fill="#1d2733"/>
<text x="360" y="200" fill="#fff" text-anchor="middle" font-weight="bold">your tests</text>
<text x="360" y="220" fill="#cbd5e0" text-anchor="middle" font-size="11">run on each copy</text>
<g stroke="#0b6e8a" stroke-width="2" fill="none">
<path d="M220 147 L290 190"/><path d="M220 189 L290 202"/><path d="M220 231 L290 222"/><path d="M220 273 L290 240"/>
</g>
<!-- results -->
<g font-size="12">
<rect x="500" y="130" width="200" height="34" rx="6" fill="#c53030"/>
<text x="510" y="151" fill="#fff">1 killed (symmetry failed)</text>
<rect x="500" y="172" width="200" height="34" rx="6" fill="#c53030"/>
<text x="510" y="193" fill="#fff">2 killed (a known distance)</text>
<rect x="500" y="214" width="200" height="34" rx="6" fill="#d69e2e"/>
<text x="510" y="235" fill="#fff">3 SURVIVED: no test at the limit</text>
<rect x="500" y="256" width="200" height="34" rx="6" fill="#a0aec0"/>
<text x="510" y="277" fill="#fff">4 equivalent: left out</text>
</g>
<g stroke="#1d2733" stroke-width="2" fill="none">
<path d="M430 190 L500 147"/><path d="M430 202 L500 189"/><path d="M430 222 L500 231"/><path d="M430 240 L500 273"/>
</g>
<text x="500" y="70" fill="#1d2733" font-weight="bold">mutation score</text>
<text x="500" y="90" fill="#1d2733">= killed / killable = 2 / 3</text>
<text x="500" y="110" fill="#555" font-size="11">survivor 3: add a test at the limit</text>
<text x="20" y="318" fill="#555" font-size="11">Each mutant is a whole copy of the stack with ONE change. Killed = at least one test fails on it. The given code itself must pass every test.</text>
</svg>
