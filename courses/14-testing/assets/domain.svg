<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="sans-serif" font-size="13">
<rect width="720" height="250" fill="#f7fafc"/>
<text x="20" y="28" font-size="15" font-weight="bold" fill="#1d2733">A test says something only about the inputs it tried</text>
<text x="20" y="48" fill="#555" font-size="12">one value of the inertial software, converted to a 16-bit signed integer (schematic, not to scale)</text>
<!-- axis -->
<line x1="40" y1="150" x2="690" y2="150" stroke="#1d2733" stroke-width="2"/>
<polygon points="690,150 680,145 680,155" fill="#1d2733"/>
<text x="40" y="172" fill="#1d2733" font-size="12">0</text>
<text x="640" y="172" fill="#1d2733" font-size="12">value</text>
<!-- int16 limit -->
<line x1="430" y1="70" x2="430" y2="185" stroke="#c53030" stroke-width="2" stroke-dasharray="6 4"/>
<text x="436" y="82" fill="#c53030" font-size="12" font-weight="bold">32 767: the largest 16-bit integer</text>
<!-- tested domain -->
<rect x="60" y="110" width="250" height="28" rx="6" fill="#2f855a"/>
<text x="185" y="129" fill="#fff" text-anchor="middle">Ariane 4 trajectories: tested, fine</text>
<!-- flight domain -->
<rect x="60" y="196" width="560" height="28" rx="6" fill="#0b6e8a" opacity="0.9"/>
<text x="245" y="215" fill="#fff" text-anchor="middle">Ariane 5 early flight: the values really reached</text>
<rect x="430" y="196" width="190" height="28" rx="0" fill="#c53030"/>
<text x="525" y="215" fill="#fff" text-anchor="middle" font-weight="bold">never tested → overflow</text>
<text x="20" y="244" fill="#555" font-size="11">Source: Ariane 501 Inquiry Board report (J.-L. Lions, July 1996). In this mission: properties (§3) search the whole domain for you.</text>
</svg>
