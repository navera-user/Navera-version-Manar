<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif" font-size="13">
<rect width="720" height="300" fill="#f7fafc"/>
<text x="20" y="28" font-size="15" font-weight="bold" fill="#1d2733">launch_test test_arbiter_launch.py — about 5 to 10 seconds</text>
<!-- timeline -->
<line x1="30" y1="250" x2="700" y2="250" stroke="#1d2733" stroke-width="2"/>
<polygon points="700,250 690,245 690,255" fill="#1d2733"/>
<text x="660" y="270" fill="#555" font-size="11">time</text>
<!-- judge process bar -->
<rect x="60" y="64" width="470" height="34" rx="6" fill="#2f855a"/>
<text x="295" y="86" fill="#fff" text-anchor="middle" font-weight="bold">the judge (arbiter v0) runs: a real process</text>
<text x="60" y="58" fill="#2f855a" font-size="11">1. generate_test_description() → started</text>
<!-- ready -->
<line x1="110" y1="98" x2="110" y2="250" stroke="#0b6e8a" stroke-dasharray="4 3"/>
<text x="114" y="240" fill="#0b6e8a" font-size="11">ReadyToTest()</text>
<!-- active tests -->
<rect x="120" y="120" width="400" height="80" rx="8" fill="#e6f2f6" stroke="#0b6e8a"/>
<text x="130" y="138" fill="#0b6e8a" font-weight="bold">2. TestJudge — while the judge runs</text>
<text x="130" y="158" fill="#1d2733" font-size="12">test_0: wait for a status and a subscriber</text>
<text x="130" y="175" fill="#1d2733" font-size="12">test_1: publish fixes on /navera_lite/fix/gps …</text>
<text x="130" y="192" fill="#1d2733" font-size="12">         … read /navera_lite/status and /navera_lite/position</text>
<!-- shutdown -->
<line x1="530" y1="64" x2="530" y2="250" stroke="#c53030" stroke-width="2"/>
<text x="536" y="118" fill="#c53030" font-size="11">Ctrl+C (SIGINT)</text>
<rect x="545" y="140" width="155" height="60" rx="8" fill="#1d2733"/>
<text x="622" y="162" fill="#fff" text-anchor="middle" font-size="12" font-weight="bold">3. TestShutdown</text>
<text x="622" y="182" fill="#cbd5e0" text-anchor="middle" font-size="11">exit code 0?</text>
<text x="20" y="290" fill="#555" font-size="11">Unit tests call Python functions; a launch test talks to a running node through its topics, so it also tests QoS, names, timers and the stop.</text>
</svg>
