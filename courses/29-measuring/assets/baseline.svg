<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="300" rx="12" fill="#f8fafc"/>
  <text x="380" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">GPS lost: a method must beat "repeat the last position"</text>
  <line x1="70" y1="250" x2="720" y2="250" stroke="#334155"/>
  <line x1="70" y1="250" x2="70" y2="45" stroke="#334155"/>
  <text x="720" y="270" text-anchor="end">time since GPS was lost →</text>
  <text x="62" y="60" text-anchor="end" font-size="12">error</text>
  <!-- baseline line -->
  <path d="M70 248 L700 60" stroke="#dc2626" stroke-width="3"/>
  <text x="560" y="80" fill="#991b1b" font-weight="bold">baseline: last GPS position</text>
  <text x="560" y="97" fill="#991b1b" font-size="12">error grows with the distance flown</text>
  <!-- good method -->
  <path d="M70 232 Q200 226 330 230 T700 228" stroke="#16a34a" stroke-width="3" fill="none"/>
  <text x="600" y="220" fill="#166534" font-weight="bold">a good method</text>
  <!-- poor method -->
  <path d="M70 140 Q200 150 330 132 T700 142" stroke="#2563eb" stroke-width="3" fill="none" stroke-dasharray="7 5"/>
  <text x="430" y="158" fill="#1e40af" font-weight="bold">a poor method (~440 m)</text>
  <line x1="430" y1="250" x2="430" y2="140" stroke="#64748b" stroke-dasharray="3 3"/>
  <text x="430" y="285" text-anchor="middle" font-size="12" fill="#334155">before this point the poor method is WORSE than doing nothing</text>
</svg>
