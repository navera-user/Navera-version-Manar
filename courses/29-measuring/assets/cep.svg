<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="360" rx="12" fill="#f8fafc"/>
  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">40 position errors: CEP50, CEP95 and the bias</text>
  <line x1="50" y1="185" x2="350" y2="185" stroke="#cbd5e1"/>
  <line x1="200" y1="35" x2="200" y2="335" stroke="#cbd5e1"/>
  <text x="348" y="179" text-anchor="end" font-size="11" fill="#64748b">east (m)</text>
  <text x="206" y="47" font-size="11" fill="#64748b">north (m)</text>
  <circle cx="200" cy="185" r="89.7" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="200" cy="185" r="43.2" fill="#dcfce7" fill-opacity="0.6" stroke="#16a34a" stroke-width="2"/>
  <circle cx="194.7" cy="223.7" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="216.3" cy="155.6" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="270.3" cy="167.7" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="204.4" cy="202.6" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="255.2" cy="108.2" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="236.6" cy="220.1" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="188.6" cy="109.6" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="233.9" cy="239.6" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="222.7" cy="217.4" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="201.5" cy="191.0" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="198.2" cy="150.4" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="223.5" cy="195.0" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="242.0" cy="139.6" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="161.9" cy="182.0" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="187.8" cy="178.8" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="175.7" cy="171.2" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="224.5" cy="183.9" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="185.1" cy="187.5" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="183.4" cy="224.9" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="234.8" cy="215.3" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="271.6" cy="144.1" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="148.1" cy="161.4" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="183.0" cy="170.7" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="227.7" cy="249.5" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="216.9" cy="182.0" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="263.5" cy="218.1" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="254.8" cy="214.9" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="213.1" cy="204.8" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="282.5" cy="149.8" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="320.8" cy="147.0" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="259.0" cy="139.2" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="202.3" cy="174.7" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="278.7" cy="187.5" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="233.4" cy="172.8" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="249.8" cy="186.2" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="220.1" cy="162.5" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="230.0" cy="205.7" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="260.9" cy="222.6" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="179.2" cy="222.0" r="3.2" fill="#2563eb" fill-opacity="0.75"/><circle cx="263.7" cy="186.1" r="3.2" fill="#2563eb" fill-opacity="0.75"/>
  <line x1="200" y1="185" x2="225.0" y2="184.1" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="225.0" cy="184.1" r="5" fill="#7c3aed"/>
  <circle cx="200" cy="185" r="5" fill="#0f172a"/>
  <text x="192" y="203" text-anchor="end" font-size="12" stroke="#f8fafc" stroke-width="4" paint-order="stroke" font-weight="bold" fill="#0f172a">truth</text>
  <text x="200" y="87.3" text-anchor="middle" font-size="12" stroke="#f8fafc" stroke-width="4" paint-order="stroke" font-weight="bold" fill="#b91c1c">CEP95 = 6.9 m</text>
  <text x="200" y="244.2" text-anchor="middle" font-size="12" stroke="#f8fafc" stroke-width="4" paint-order="stroke" font-weight="bold" fill="#15803d">CEP50 = 3.3 m</text>
  <g font-size="13" fill="#0f172a">
    <text x="420" y="70" font-weight="bold">Each dot = one estimate minus the truth</text>
    <text x="420" y="94"><tspan fill="#15803d" font-weight="bold">CEP50</tspan>: half of the dots are inside (median)</text>
    <text x="420" y="116"><tspan fill="#b91c1c" font-weight="bold">CEP95</tspan>: 95 % of the dots are inside</text>
    <text x="420" y="138"><tspan fill="#7c3aed" font-weight="bold">bias</tspan>: mean error vector (1.9, 0.1) m</text>
    <text x="420" y="160">RMSE = √(mean of e²) = 4.3 m</text>
    <text x="420" y="196" font-weight="bold">If the error is a 2-D Gaussian, σ per axis:</text>
    <text x="420" y="218" font-family="monospace" font-size="12" xml:space="preserve">CEP50 = 1.18 σ    mean  = 1.25 σ</text>
    <text x="420" y="238" font-family="monospace" font-size="12" xml:space="preserve">RMSE  = 1.41 σ    CEP95 = 2.45 σ</text>
    <text x="420" y="258" font-family="monospace" font-size="12" xml:space="preserve">P(e ≤ kσ) = 1 − exp(−k²/2)</text>
    <text x="420" y="294" fill="#334155">Simulated: σ = 3 m per axis, true bias (2, 1) m.</text>
    <text x="420" y="314" fill="#334155">The formulas assume no bias, and n = 40 is</text>
    <text x="420" y="334" fill="#334155">small: measured values differ from them.</text>
  </g>
</svg>
