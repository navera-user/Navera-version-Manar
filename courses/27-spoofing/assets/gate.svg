<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="300" rx="12" fill="#f8fafc"/>
  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">The kinematic gate: could the vehicle have got there?</text>
  <!-- circles -->
  <circle cx="230" cy="165" r="120" fill="#dcfce7" stroke="#16a34a" stroke-dasharray="6 4"/>
  <circle cx="230" cy="165" r="70" fill="#bbf7d0" stroke="#16a34a" stroke-dasharray="6 4"/>
  <circle cx="230" cy="165" r="25" fill="#86efac" stroke="#16a34a"/>
  <circle cx="230" cy="165" r="5" fill="#0f172a"/>
  <text x="230" y="153" text-anchor="middle" font-size="11">last trusted fix</text>
  <text x="230" y="203" text-anchor="middle" font-size="11" fill="#166534">margin 50 m</text>
  <text x="300" y="120" font-size="11" fill="#166534">after 1 s</text>
  <text x="330" y="70" font-size="11" fill="#166534">after 3 s</text>
  <!-- good fix -->
  <circle cx="275" cy="150" r="6" fill="#2563eb"/><text x="285" y="148" font-size="12" fill="#1d4ed8">new fix ✔ reachable</text>
  <!-- spoofed fix -->
  <circle cx="440" cy="60" r="7" fill="#dc2626"/>
  <text x="452" y="58" fill="#991b1b" font-weight="bold">spoofed fix 2 km away ✘</text>
  <path d="M235 160 L433 64" stroke="#dc2626" stroke-dasharray="4 3"/>
  <text x="470" y="140" fill="#0f172a">reachable = <tspan font-weight="bold">max_speed × time + margin</tspan></text>
  <text x="470" y="164" fill="#334155">drone at 30 m/s, 1 s later: 30 × 1 + 50 = 80 m</text>
  <text x="470" y="188" fill="#334155">2 000 m in 1 s → "implausible jump"</text>
  <text x="470" y="226" fill="#92400e">but the circle GROWS with time:</text>
  <text x="470" y="246" fill="#92400e">wait long enough (or jam first),</text>
  <text x="470" y="266" fill="#92400e">and any spoof becomes "reachable".</text>
</svg>
