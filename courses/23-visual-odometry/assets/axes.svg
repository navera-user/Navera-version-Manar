<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" font-family="sans-serif" font-size="13">
  <rect width="640" height="310" fill="#f7fafc"/>
  <defs>
    <marker id="k" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0b6e8a"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker>
  </defs>
  <text x="20" y="24" fill="#1d2733" font-weight="bold">Image (camera) axes</text>
  <rect x="40" y="50" width="200" height="150" fill="#ffffff" stroke="#1d2733"/>
  <line x1="60" y1="70" x2="140" y2="70" stroke="#1d2733" stroke-width="2" marker-end="url(#k)"/>
  <text x="146" y="74" fill="#1d2733">x (dx)</text>
  <line x1="60" y1="70" x2="60" y2="140" stroke="#1d2733" stroke-width="2" marker-end="url(#k)"/>
  <text x="66" y="156" fill="#1d2733">y (dy): down</text>
  <line x1="185" y1="190" x2="185" y2="110" stroke="#0b6e8a" stroke-width="3" marker-end="url(#g)"/>
  <text x="160" y="104" fill="#0b6e8a">forward</text>
  <line x1="185" y1="190" x2="232" y2="190" stroke="#0b6e8a" stroke-width="3" marker-end="url(#g)"/>
  <text x="196" y="180" fill="#0b6e8a">right</text>
  <text x="40" y="226" fill="#1d2733">right = −dx · m/px</text>
  <text x="40" y="246" fill="#1d2733">forward = +dy · m/px</text>
  <text x="40" y="268" fill="#5b6773" font-size="12">(the ground moves the opposite way)</text>
  <text x="330" y="24" fill="#1d2733" font-weight="bold">Ground: top of the image at heading θ</text>
  <line x1="470" y1="210" x2="470" y2="60" stroke="#1d2733" stroke-width="2" marker-end="url(#k)"/>
  <text x="476" y="62" fill="#1d2733">north</text>
  <line x1="470" y1="210" x2="610" y2="210" stroke="#1d2733" stroke-width="2" marker-end="url(#k)"/>
  <text x="575" y="230" fill="#1d2733">east</text>
  <!-- heading 40 deg: forward = (sin40, cos40) -->
  <line x1="470" y1="210" x2="547" y2="118" stroke="#0b6e8a" stroke-width="3" marker-end="url(#g)"/>
  <text x="552" y="116" fill="#0b6e8a">forward</text>
  <line x1="470" y1="210" x2="562" y2="287" stroke="#0b6e8a" stroke-width="3" marker-end="url(#g)"/>
  <text x="572" y="290" fill="#0b6e8a">right</text>
  <path d="M470 150 A60 60 0 0 1 509 164" fill="none" stroke="#d64545" stroke-width="2"/>
  <text x="494" y="146" fill="#d64545">θ</text>
  <text x="300" y="250" fill="#1d2733" font-size="12">east  = fwd·sinθ + right·cosθ</text>
  <text x="300" y="268" fill="#1d2733" font-size="12">north = fwd·cosθ − right·sinθ</text>
</svg>
