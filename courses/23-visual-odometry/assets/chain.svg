<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" font-family="sans-serif" font-size="13">
  <rect width="560" height="150" fill="#f7fafc"/>
  <g stroke="#1d2733" fill="#ffffff">
    <rect x="10" y="40" width="90" height="60" rx="6"/><rect x="120" y="40" width="100" height="60" rx="6"/>
    <rect x="240" y="40" width="100" height="60" rx="6"/><rect x="360" y="40" width="90" height="60" rx="6"/>
    <rect x="470" y="40" width="80" height="60" rx="6"/>
  </g>
  <g fill="#1d2733" text-anchor="middle">
    <text x="55" y="66">2 photos</text><text x="55" y="84">(prev, cur)</text>
    <text x="170" y="66">phase</text><text x="170" y="84">correlation</text>
    <text x="290" y="66">(dx, dy) px</text><text x="290" y="84">× m per px</text>
    <text x="405" y="66">step</text><text x="405" y="84">(east, north)</text>
    <text x="510" y="66">add to</text><text x="510" y="84">position</text>
  </g>
  <g stroke="#0b6e8a" stroke-width="2.5"><line x1="100" y1="70" x2="118" y2="70"/><line x1="220" y1="70" x2="238" y2="70"/>
    <line x1="340" y1="70" x2="358" y2="70"/><line x1="450" y1="70" x2="468" y2="70"/></g>
  <text x="290" y="125" text-anchor="middle" fill="#a8680d">height (barometer) + field of view → meters per pixel (lesson 17)</text>
  <text x="280" y="24" text-anchor="middle" fill="#0b6e8a">repeated for every new photo</text>
</svg>
