<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="sans-serif" font-size="13">
  <rect width="720" height="250" fill="#f7fafc"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#0b6e8a"/></marker></defs>
  <text x="360" y="22" text-anchor="middle" fill="#1d2733" font-weight="bold">Phase correlation: all shifts tested at once</text>
  <g stroke="#1d2733" fill="#ffffff">
    <rect x="12" y="40" width="96" height="70" rx="6"/>
    <rect x="132" y="40" width="104" height="70" rx="6"/>
    <rect x="260" y="40" width="96" height="70" rx="6"/>
    <rect x="380" y="40" width="150" height="70" rx="6"/>
    <rect x="554" y="40" width="154" height="70" rx="6"/>
  </g>
  <g fill="#1d2733" text-anchor="middle">
    <text x="60" y="66">frames a, b</text><text x="60" y="84">grey, float</text><text x="60" y="100" fill="#5b6773" font-size="11">(prev, cur)</text>
    <text x="184" y="66">× Hanning</text><text x="184" y="84">window w</text><text x="184" y="100" fill="#5b6773" font-size="11">fade the borders</text>
    <text x="308" y="66">FFT</text><text x="308" y="84">A, B</text><text x="308" y="100" fill="#5b6773" font-size="11">np.fft.fft2</text>
    <text x="455" y="66">R = B·A* / |B·A*|</text><text x="455" y="84">phase only</text><text x="455" y="100" fill="#5b6773" font-size="11">cross-power spectrum</text>
    <text x="631" y="66">r = IFFT(R)</text><text x="631" y="84">peak at (dx, dy)</text><text x="631" y="100" fill="#5b6773" font-size="11">+ parabola: sub-pixel</text>
  </g>
  <g stroke="#0b6e8a" stroke-width="2.5" marker-end="url(#a)">
    <line x1="108" y1="75" x2="128" y2="75"/><line x1="236" y1="75" x2="256" y2="75"/>
    <line x1="356" y1="75" x2="376" y2="75"/><line x1="530" y1="75" x2="550" y2="75"/>
  </g>
  <g stroke="#1d2733" fill="#ffffff">
    <rect x="132" y="160" width="150" height="60" rx="6"/>
    <rect x="320" y="160" width="160" height="60" rx="6"/>
    <rect x="518" y="160" width="190" height="60" rx="6"/>
  </g>
  <g fill="#1d2733" text-anchor="middle">
    <text x="207" y="185">× metres per pixel</text><text x="207" y="203" fill="#5b6773" font-size="11">2 h tan(HFOV/2) / W</text>
    <text x="400" y="185">turn by the heading</text><text x="400" y="203" fill="#5b6773" font-size="11">(right, fwd) → (east, north)</text>
    <text x="613" y="185">add to the position</text><text x="613" y="203" fill="#5b6773" font-size="11">σ grows at every step</text>
  </g>
  <path d="M631 110 L631 135 L90 135 L90 190 L128 190" fill="none" stroke="#0b6e8a" stroke-width="2.5" marker-end="url(#a)"/>
  <g stroke="#0b6e8a" stroke-width="2.5" marker-end="url(#a)">
    <line x1="282" y1="190" x2="316" y2="190"/><line x1="480" y1="190" x2="514" y2="190"/>
  </g>
  <text x="12" y="240" fill="#a8680d">height (barometer) and field of view → scale;  IMU → heading;  repeated for every new frame</text>
</svg>
