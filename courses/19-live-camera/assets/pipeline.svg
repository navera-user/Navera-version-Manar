<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="sans-serif" font-size="12">
  <rect width="760" height="330" fill="#f7fafc"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d2733"/></marker></defs>
  <text x="20" y="24" font-size="15" font-weight="bold" fill="#1d2733">From the lens to day vision — one frame's journey</text>
  <!-- camera -->
  <rect x="20" y="50" width="110" height="90" rx="10" fill="#0b6e8a"/>
  <circle cx="75" cy="72" r="12" fill="#9cc7d6"/><circle cx="75" cy="118" r="12" fill="#9cc7d6"/>
  <text x="75" y="160" text-anchor="middle" fill="#1d2733">Insta360 ONE R</text>
  <text x="75" y="176" text-anchor="middle" fill="#5a6775">2 lenses</text>
  <line x1="132" y1="95" x2="178" y2="95" stroke="#1d2733" stroke-width="2" marker-end="url(#a)"/>
  <text x="155" y="86" text-anchor="middle" fill="#a8680d">USB</text>
  <!-- v4l2 -->
  <rect x="180" y="62" width="120" height="66" rx="6" fill="#fff" stroke="#0b6e8a" stroke-width="2"/>
  <text x="240" y="84" text-anchor="middle" font-weight="bold" fill="#1d2733">V4L2 driver</text>
  <text x="240" y="100" text-anchor="middle" fill="#1d2733">/dev/video0</text>
  <text x="240" y="116" text-anchor="middle" fill="#5a6775">MJPG 1920×1080</text>
  <text x="240" y="146" text-anchor="middle" fill="#5a6775">28.8 frames / s</text>
  <line x1="302" y1="95" x2="348" y2="95" stroke="#1d2733" stroke-width="2" marker-end="url(#a)"/>
  <!-- grab -->
  <rect x="350" y="62" width="110" height="66" rx="6" fill="#fff" stroke="#f2a33a" stroke-width="2"/>
  <text x="405" y="84" text-anchor="middle" font-weight="bold" fill="#1d2733">grab()</text>
  <text x="405" y="100" text-anchor="middle" fill="#1d2733">every frame</text>
  <text x="405" y="116" text-anchor="middle" fill="#5a6775">cheap</text>
  <text x="405" y="146" text-anchor="middle" fill="#a8680d">t = now − 0.138 s</text>
  <line x1="462" y1="95" x2="508" y2="95" stroke="#1d2733" stroke-width="2" marker-end="url(#a)"/>
  <!-- retrieve -->
  <rect x="510" y="62" width="110" height="66" rx="6" fill="#fff" stroke="#f2a33a" stroke-width="2"/>
  <text x="565" y="84" text-anchor="middle" font-weight="bold" fill="#1d2733">retrieve()</text>
  <text x="565" y="100" text-anchor="middle" fill="#1d2733">only the one</text>
  <text x="565" y="116" text-anchor="middle" fill="#1d2733">to send</text>
  <text x="565" y="146" text-anchor="middle" fill="#5a6775">decode ≈ 51 ms</text>
  <line x1="622" y1="95" x2="668" y2="95" stroke="#1d2733" stroke-width="2" marker-end="url(#a)"/>
  <!-- crop -->
  <rect x="670" y="50" width="70" height="90" fill="#cde6c8" stroke="#1d2733"/>
  <line x1="670" y1="95" x2="740" y2="95" stroke="#1d2733" stroke-dasharray="4 3"/>
  <text x="705" y="77" text-anchor="middle" fill="#1d2733">top</text>
  <text x="705" y="122" text-anchor="middle" fill="#8a96a3">bottom</text>
  <text x="705" y="160" text-anchor="middle" fill="#1d2733">crop "top"</text>
  <text x="705" y="176" text-anchor="middle" fill="#5a6775">1920×540</text>
  <!-- second row -->
  <path d="M705 182 L705 205 L660 225" fill="none" stroke="#1d2733" stroke-width="2" marker-end="url(#a)"/>
  <rect x="500" y="210" width="165" height="66" rx="6" fill="#fff" stroke="#0b6e8a" stroke-width="2"/>
  <text x="582" y="232" text-anchor="middle" font-weight="bold" fill="#1d2733">undistort</text>
  <text x="582" y="248" text-anchor="middle" fill="#1d2733">calibration file</text>
  <text x="582" y="264" text-anchor="middle" fill="#5a6775">fisheye → straight, 111°</text>
  <line x1="498" y1="243" x2="462" y2="243" stroke="#1d2733" stroke-width="2" marker-end="url(#a)"/>
  <rect x="320" y="210" width="140" height="66" rx="6" fill="#fff" stroke="#0b6e8a" stroke-width="2"/>
  <text x="390" y="232" text-anchor="middle" font-weight="bold" fill="#1d2733">straighten</text>
  <text x="390" y="248" text-anchor="middle" fill="#1d2733">IMU attitude</text>
  <text x="390" y="264" text-anchor="middle" fill="#a8680d">at the exposure time</text>
  <line x1="318" y1="243" x2="272" y2="243" stroke="#1d2733" stroke-width="2" marker-end="url(#a)"/>
  <rect x="80" y="205" width="190" height="78" rx="6" fill="#0b6e8a"/>
  <text x="175" y="228" text-anchor="middle" font-weight="bold" fill="#fff">publish</text>
  <text x="175" y="245" text-anchor="middle" fill="#fff">/day/image_raw</text>
  <text x="175" y="261" text-anchor="middle" fill="#fff">/day/frame_meta (JSON)</text>
  <text x="175" y="277" text-anchor="middle" fill="#fff">/day/camera_info</text>
  <text x="80" y="310" fill="#1d2733">→ day vision compares it with the map</text>
  <text x="740" y="310" text-anchor="end" fill="#5a6775">all in camera_pkg/nodes/live_camera.py</text>
</svg>
