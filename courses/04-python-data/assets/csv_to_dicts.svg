<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="sans-serif" font-size="13">
  <rect width="700" height="260" fill="#f7fafc"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0b6e8a"/>
    </marker>
  </defs>
  <text x="20" y="26" font-weight="bold" fill="#1d2733">flight_log.csv  (text)</text>
  <rect x="20" y="36" width="260" height="110" fill="#ffffff" stroke="#c9d3dc"/>
  <g font-family="monospace" font-size="10.5" fill="#1d2733">
    <text x="26" y="54" fill="#a8680d">time_s,lat,lon,alt_m,…,source</text>
    <text x="26" y="72">0,35.824514,10.633998,0.0,…,gps</text>
    <text x="26" y="90">2,35.824460,10.633995,8.0,…,gps</text>
    <text x="26" y="108">4,35.824489,10.634021,16.0,…,gps</text>
    <text x="26" y="126">…  278 rows</text>
  </g>
  <text x="26" y="166" fill="#a8680d">1st line = the column names (header)</text>
  <text x="26" y="184" fill="#4a5866">each other line = one row, values</text>
  <text x="26" y="200" fill="#4a5866">separated by commas</text>
  <line x1="286" y1="90" x2="374" y2="90" stroke="#0b6e8a" stroke-width="3" marker-end="url(#ar)"/>
  <text x="330" y="78" text-anchor="middle" fill="#0b6e8a" font-family="monospace" font-size="11">read_log()</text>
  <text x="330" y="112" text-anchor="middle" fill="#4a5866" font-size="11">DictReader</text>
  <text x="330" y="126" text-anchor="middle" fill="#4a5866" font-size="11">+ float(), int()</text>
  <text x="380" y="26" font-weight="bold" fill="#1d2733">rows  (a list of dicts)</text>
  <g font-family="monospace" font-size="9.5" fill="#1d2733">
    <rect x="380" y="36" width="300" height="46" rx="5" fill="#e9f3e6" stroke="#86b67d"/>
    <text x="388" y="53" fill="#2f6b28" font-weight="bold">rows[0]</text>
    <text x="388" y="71">{"time_s": 0.0, "alt_m": 0.0, …, "source": "gps"}</text>
    <rect x="380" y="88" width="300" height="46" rx="5" fill="#e9f3e6" stroke="#86b67d"/>
    <text x="388" y="105" fill="#2f6b28" font-weight="bold">rows[1]</text>
    <text x="388" y="123">{"time_s": 2.0, "alt_m": 8.0, …, "source": "gps"}</text>
    <rect x="380" y="140" width="300" height="30" rx="5" fill="#f2f7f0" stroke="#b7d3b0"/>
    <text x="388" y="160">…</text>
    <rect x="380" y="176" width="300" height="30" rx="5" fill="#e9f3e6" stroke="#86b67d"/>
    <text x="388" y="196" fill="#2f6b28" font-weight="bold">rows[-1]  (the last one)</text>
  </g>
  <text x="380" y="232" fill="#1d2733" font-family="monospace" font-size="12">rows[1]["alt_m"]  →  8.0</text>
  <text x="380" y="250" fill="#4a5866">which row (list index), then which column (dict key)</text>
</svg>
