<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, Segoe UI, sans-serif">
<defs><linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1d4e6b"/><stop offset="1" stop-color="#13284a"/></linearGradient></defs>
<rect width="720" height="360" fill="#0b1730"/><rect width="720" height="300" fill="url(#sky)"/>
<text x="20" y="28" fill="#ffb3a3" font-size="11.5" font-weight="700" letter-spacing="3">MISSION 04 · READING A FLIGHT-TEST CAMPAIGN</text>
<text x="20" y="58" fill="#e8f0f5" font-size="15">Four flights of one small drone, about ten minutes each. The raw log, analysed with no cleaning, says:</text>
<g transform="translate(20,82)">
  <rect width="215" height="132" rx="12" fill="#13284a" stroke="#ff8f7a" stroke-width="1.5"/>
  <text x="18" y="30" fill="#9fc4d8" font-size="12.5">distance of one flight</text>
  <text x="18" y="76" fill="#ff8f7a" font-size="34" font-weight="700">8 274 km</text>
  <text x="18" y="108" fill="#cfe3d9" font-size="12">in 10 minutes</text>
</g>
<g transform="translate(252,82)">
  <rect width="215" height="132" rx="12" fill="#13284a" stroke="#ff8f7a" stroke-width="1.5"/>
  <text x="18" y="30" fill="#9fc4d8" font-size="12.5">top speed</text>
  <text x="18" y="76" fill="#ff8f7a" font-size="34" font-weight="700">2 066 494</text>
  <text x="18" y="108" fill="#cfe3d9" font-size="12">metres per second</text>
</g>
<g transform="translate(484,82)">
  <rect width="215" height="132" rx="12" fill="#13284a" stroke="#ff8f7a" stroke-width="1.5"/>
  <text x="18" y="30" fill="#9fc4d8" font-size="12.5">highest altitude</text>
  <text x="18" y="76" fill="#ff8f7a" font-size="34" font-weight="700">9 999 m</text>
  <text x="18" y="108" fill="#cfe3d9" font-size="12">for a drone flying at 250 m</text>
</g>
<text x="20" y="250" fill="#7fe0d3" font-size="14">Every number was computed correctly. None of them is true.</text>
<text x="20" y="274" fill="#e8f0f5" font-size="13">The data did not mean what its labels said: duplicates, zeros, glitches, one clock and one column that lie.</text>
<text x="20" y="330" fill="#ffd166" font-size="14" font-weight="600">Before any statistic: clean by written rules, check clocks and units, then measure.</text>
</svg>
