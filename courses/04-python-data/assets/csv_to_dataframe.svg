<text x="20" y="180" fill="#555" font-size="12">every value is TEXT; an empty cell is ""</text>
<line x1="275" y1="80" x2="380" y2="80" stroke="#0b6e8a" stroke-width="2.5" marker-end="url(#ar)"/>
