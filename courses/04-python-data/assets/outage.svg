<text x="20" y="244" fill="#1d2733">np.diff(padded)[i] = padded[i+1] − padded[i]: <tspan font-weight="bold">+1</tspan> where a run of 0 starts (at row i),</text>
<text x="20" y="262" fill="#1d2733"><tspan font-weight="bold">−1</tspan> where it stops (row i is the first row with GPS again, or the end).</text>
<text x="20" y="290" fill="#1d2733" font-family="monospace">starts = [2, 6]   stops = [5, 8]   →   runs [(2, 5), (6, 8)]</text>
<text x="20" y="314" fill="#555">duration of a run = time_s[stop − 1] − time_s[start] + DT_S   (rows 2–4 at 2 s: 4 + 2 = 6 s)</text>
