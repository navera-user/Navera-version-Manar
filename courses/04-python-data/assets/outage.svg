<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 225" font-family="sans-serif" font-size="13">
  <rect width="700" height="225" fill="#f7fafc"/>
  <text x="20" y="26" font-weight="bold" fill="#1d2733">Longest GPS outage: walk through the rows with two counters</text>
  <g font-family="monospace" font-size="14" text-anchor="middle">
    <text x="72" y="70" fill="#4a5866" font-size="11" text-anchor="end">gps_valid</text>
    <text x="72" y="118" fill="#a8680d" font-size="12" text-anchor="end">run</text>
    <text x="72" y="160" fill="#0b6e8a" font-size="12" text-anchor="end">best</text>
  </g>
  <g font-family="monospace" font-size="15" text-anchor="middle">
    <!-- sequence 1 1 0 0 0 1 0 0 1 -->
    <rect x="80"  y="48" width="56" height="34" rx="4" fill="#d7e8f5" stroke="#8aa3b8"/><text x="108" y="71">1</text>
    <rect x="144" y="48" width="56" height="34" rx="4" fill="#d7e8f5" stroke="#8aa3b8"/><text x="172" y="71">1</text>
    <rect x="208" y="48" width="56" height="34" rx="4" fill="#f6d2d2" stroke="#d64545"/><text x="236" y="71">0</text>
    <rect x="272" y="48" width="56" height="34" rx="4" fill="#f6d2d2" stroke="#d64545"/><text x="300" y="71">0</text>
    <rect x="336" y="48" width="56" height="34" rx="4" fill="#f6d2d2" stroke="#d64545"/><text x="364" y="71">0</text>
    <rect x="400" y="48" width="56" height="34" rx="4" fill="#d7e8f5" stroke="#8aa3b8"/><text x="428" y="71">1</text>
    <rect x="464" y="48" width="56" height="34" rx="4" fill="#f6d2d2" stroke="#d64545"/><text x="492" y="71">0</text>
    <rect x="528" y="48" width="56" height="34" rx="4" fill="#f6d2d2" stroke="#d64545"/><text x="556" y="71">0</text>
    <rect x="592" y="48" width="56" height="34" rx="4" fill="#d7e8f5" stroke="#8aa3b8"/><text x="620" y="71">1</text>
    <g fill="#a8680d">
      <text x="108" y="118">0</text><text x="172" y="118">0</text><text x="236" y="118">1</text><text x="300" y="118">2</text>
      <text x="364" y="118">3</text><text x="428" y="118">0</text><text x="492" y="118">1</text><text x="556" y="118">2</text><text x="620" y="118">0</text>
    </g>
    <g fill="#0b6e8a">
      <text x="108" y="160">0</text><text x="172" y="160">0</text><text x="236" y="160">1</text><text x="300" y="160">2</text>
      <text x="364" y="160" font-weight="bold">3</text><text x="428" y="160">3</text><text x="492" y="160">3</text><text x="556" y="160">3</text><text x="620" y="160" font-weight="bold">3</text>
    </g>
  </g>
  <text x="80" y="194" fill="#4a5866">On a 0: run grows by 1, and best keeps the biggest run seen so far.</text>
  <text x="80" y="212" fill="#4a5866">On a 1: run goes back to 0.   At the end, the answer is best = 3.</text>
</svg>
