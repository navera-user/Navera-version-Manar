<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 305" font-family="sans-serif" font-size="13"><rect width="780" height="305" fill="#f7fafc"/><defs><marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2733"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a8680d"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a96a3"/></marker></defs><text x="390.0" y="26.0" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">Gimbal lock: at ROS pitch +90° the nose points straight down</text><text x="140.0" y="56.0" text-anchor="middle" font-size="13" fill="#0b6e8a" font-weight="bold">roll 0°, yaw 30°</text><line x1="140.0" y1="150.0" x2="140.0" y2="150.0" stroke="#1d2733" stroke-width="4" stroke-linecap="round"/><line x1="140.0" y1="150.0" x2="140.0" y2="150.0" stroke="#d64545" stroke-width="6" stroke-linecap="round"/><line x1="140.0" y1="150.0" x2="118.4" y2="112.6" stroke="#2e9e4f" stroke-width="4" stroke-linecap="round"/><line x1="140.0" y1="150.0" x2="161.6" y2="187.4" stroke="#0b6e8a" stroke-width="4" stroke-linecap="round"/><line x1="132.3" y1="136.7" x2="147.7" y2="163.3" stroke="#7a8794" stroke-width="4" stroke-linecap="round"/><line x1="140.0" y1="150.0" x2="152.5" y2="142.8" stroke="#a8680d" stroke-width="4" stroke-linecap="round"/><text x="140.0" y="236.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">seen from above</text><text x="390.0" y="56.0" text-anchor="middle" font-size="13" fill="#0b6e8a" font-weight="bold">roll 20°, yaw 50°</text><line x1="390.0" y1="150.0" x2="390.0" y2="150.0" stroke="#1d2733" stroke-width="4" stroke-linecap="round"/><line x1="390.0" y1="150.0" x2="390.0" y2="150.0" stroke="#d64545" stroke-width="6" stroke-linecap="round"/><line x1="390.0" y1="150.0" x2="368.4" y2="112.6" stroke="#2e9e4f" stroke-width="4" stroke-linecap="round"/><line x1="390.0" y1="150.0" x2="411.6" y2="187.4" stroke="#0b6e8a" stroke-width="4" stroke-linecap="round"/><line x1="382.4" y1="136.7" x2="397.6" y2="163.3" stroke="#7a8794" stroke-width="4" stroke-linecap="round"/><line x1="390.0" y1="150.0" x2="402.5" y2="142.8" stroke="#a8680d" stroke-width="4" stroke-linecap="round"/><text x="390.0" y="236.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">seen from above</text><text x="640.0" y="56.0" text-anchor="middle" font-size="13" fill="#0b6e8a" font-weight="bold">roll -15°, yaw 15°</text><line x1="640.0" y1="150.0" x2="640.0" y2="150.0" stroke="#1d2733" stroke-width="4" stroke-linecap="round"/><line x1="640.0" y1="150.0" x2="640.0" y2="150.0" stroke="#d64545" stroke-width="6" stroke-linecap="round"/><line x1="640.0" y1="150.0" x2="618.4" y2="112.6" stroke="#2e9e4f" stroke-width="4" stroke-linecap="round"/><line x1="640.0" y1="150.0" x2="661.6" y2="187.4" stroke="#0b6e8a" stroke-width="4" stroke-linecap="round"/><line x1="632.4" y1="136.7" x2="647.6" y2="163.3" stroke="#7a8794" stroke-width="4" stroke-linecap="round"/><line x1="640.0" y1="150.0" x2="652.5" y2="142.8" stroke="#a8680d" stroke-width="4" stroke-linecap="round"/><text x="640.0" y="236.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">seen from above</text><text x="390.0" y="270.0" text-anchor="middle" font-size="12" fill="#1d2733" font-weight="normal">Three (roll, yaw) pairs, one attitude: only yaw − roll = 30° matters. The roll axis (the nose)</text><text x="390.0" y="288.0" text-anchor="middle" font-size="12" fill="#1d2733" font-weight="normal">now lies along the yaw axis (vertical), so turning about one is turning about the other.</text></svg>
