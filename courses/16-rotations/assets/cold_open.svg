<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 445" font-family="sans-serif" font-size="13"><rect width="790" height="445" fill="#f7fafc"/><defs><marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2733"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a8680d"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a96a3"/></marker></defs><text x="395.0" y="24.0" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">Three gimbals hold the platform still while the spacecraft turns around it</text><ellipse cx="210" cy="225" rx="150" ry="150" fill="none" stroke="#8a96a3" stroke-width="10"/><ellipse cx="210" cy="225" rx="112" ry="112" fill="none" stroke="#0b6e8a" stroke-width="10"/><ellipse cx="210" cy="225" rx="30" ry="112" fill="none" stroke="#a8680d" stroke-width="10"/><rect x="188" y="203" width="44" height="44" fill="#1d2733" rx="4"/><line x1="210.0" y1="397.0" x2="210.0" y2="53.0" stroke="#d64545" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#mr)"/><line x1="35.0" y1="225.0" x2="385.0" y2="225.0" stroke="#8a96a3" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mg)"/><text x="220.0" y="65.0" text-anchor="start" font-size="12" fill="#d64545" font-weight="normal">outer axis</text><text x="220.0" y="397.0" text-anchor="start" font-size="12" fill="#d64545" font-weight="normal">= inner axis: two axes in one line</text><text x="390.0" y="229.0" text-anchor="start" font-size="12" fill="#8a96a3" font-weight="normal">middle axis</text><text x="238.0" y="265.0" text-anchor="start" font-size="11" fill="#1d2733" font-weight="normal">platform</text><text x="105.0" y="75.0" text-anchor="end" font-size="12" fill="#8a96a3" font-weight="normal">outer gimbal</text><text x="92.0" y="133.0" text-anchor="end" font-size="12" fill="#0b6e8a" font-weight="normal">middle</text><text x="250.0" y="155.0" text-anchor="start" font-size="12" fill="#a8680d" font-weight="normal">inner</text><rect x="465" y="90" width="315" height="236" rx="8" fill="#ffffff" stroke="#8a96a3"/><text x="481.0" y="118.0" text-anchor="start" font-size="13" fill="#1d2733" font-weight="normal">Apollo 11, 20 July 1969, about two hours</text><text x="481.0" y="139.0" text-anchor="start" font-size="13" fill="#1d2733" font-weight="normal">after the Moon landing</text><text x="481.0" y="160.0" text-anchor="start" font-size="13" fill="#1d2733" font-weight="normal"></text><text x="481.0" y="181.0" text-anchor="start" font-size="13" fill="#0b6e8a" font-weight="normal">104:59:35  Houston: “We noticed you are</text><text x="481.0" y="202.0" text-anchor="start" font-size="13" fill="#0b6e8a" font-weight="normal">maneuvering very close to gimbal lock.</text><text x="481.0" y="223.0" text-anchor="start" font-size="13" fill="#0b6e8a" font-weight="normal">I suggest you move back away.”</text><text x="481.0" y="244.0" text-anchor="start" font-size="13" fill="#1d2733" font-weight="normal"></text><text x="481.0" y="265.0" text-anchor="start" font-size="13" fill="#d64545" font-weight="bold">105:00:30  Collins: “How about sending me</text><text x="481.0" y="286.0" text-anchor="start" font-size="13" fill="#d64545" font-weight="bold">a fourth gimbal for Christmas.”</text><text x="481.0" y="313.0" text-anchor="start" font-size="10" fill="#8a96a3" font-weight="normal">NASA Apollo Lunar Surface Journal (E. Jones, P. Fjeld)</text><text x="395.0" y="428.0" text-anchor="middle" font-size="12" fill="#1d2733" font-weight="normal">When the middle gimbal turns 90°, the inner and outer axes line up: one way of turning is lost (gimbal lock).</text></svg>
