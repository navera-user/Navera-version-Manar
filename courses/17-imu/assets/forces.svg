<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 305" font-family="sans-serif" font-size="13"><rect width="830" height="305" fill="#f7fafc"/><defs><marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d2733"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8680d"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a96a3"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e4f"/></marker></defs><text x="415.0" y="24.0" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">What the accelerometer feels: the specific force f = (all forces except gravity) / mass</text><text x="105.0" y="52.0" text-anchor="middle" font-size="13" fill="#0b6e8a" font-weight="bold">on a table / hovering</text><line x1="59.0" y1="160.0" x2="151.0" y2="160.0" stroke="#1d2733" stroke-width="7"/><line x1="41.0" y1="160.0" x2="77.0" y2="160.0" stroke="#8a96a3" stroke-width="3"/><line x1="133.0" y1="160.0" x2="169.0" y2="160.0" stroke="#8a96a3" stroke-width="3"/><line x1="99.0" y1="160.0" x2="99.0" y2="100.0" stroke="#a8680d" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#mo)"/><text x="109.0" y="92.0" text-anchor="start" font-size="10" fill="#a8680d" font-weight="normal">body z</text><line x1="111.0" y1="160.0" x2="111.0" y2="106.0" stroke="#d64545" stroke-width="3" marker-end="url(#mr)"/><text x="125.0" y="120.0" text-anchor="start" font-size="11" fill="#d64545" font-weight="normal">f = 9.81 up</text><line x1="35.0" y1="170.0" x2="35.0" y2="212.0" stroke="#8a96a3" stroke-width="2" marker-end="url(#mg)"/><text x="35.0" y="226.0" text-anchor="middle" font-size="10" fill="#8a96a3" font-weight="normal">gravity</text><text x="105.0" y="248.0" text-anchor="middle" font-size="12" fill="#1d2733" font-weight="bold">reads (0, 0, +9.81)</text><text x="105.0" y="266.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">the table (or thrust) pushes UP</text><text x="310.0" y="52.0" text-anchor="middle" font-size="13" fill="#0b6e8a" font-weight="bold">free fall</text><line x1="264.0" y1="160.0" x2="356.0" y2="160.0" stroke="#1d2733" stroke-width="7"/><line x1="246.0" y1="160.0" x2="282.0" y2="160.0" stroke="#8a96a3" stroke-width="3"/><line x1="338.0" y1="160.0" x2="374.0" y2="160.0" stroke="#8a96a3" stroke-width="3"/><line x1="304.0" y1="160.0" x2="304.0" y2="100.0" stroke="#a8680d" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#mo)"/><text x="314.0" y="92.0" text-anchor="start" font-size="10" fill="#a8680d" font-weight="normal">body z</text><line x1="240.0" y1="170.0" x2="240.0" y2="212.0" stroke="#8a96a3" stroke-width="2" marker-end="url(#mg)"/><text x="240.0" y="226.0" text-anchor="middle" font-size="10" fill="#8a96a3" font-weight="normal">gravity</text><text x="310.0" y="248.0" text-anchor="middle" font-size="12" fill="#1d2733" font-weight="bold">reads (0, 0, 0)</text><text x="310.0" y="266.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">nothing pushes: weightless</text><text x="520.0" y="52.0" text-anchor="middle" font-size="13" fill="#0b6e8a" font-weight="bold">speeding up at 2 m/s²</text><line x1="474.9" y1="150.8" x2="565.1" y2="169.2" stroke="#1d2733" stroke-width="7"/><line x1="457.3" y1="147.2" x2="492.6" y2="154.4" stroke="#8a96a3" stroke-width="3"/><line x1="547.4" y1="165.6" x2="582.7" y2="172.8" stroke="#8a96a3" stroke-width="3"/><line x1="514.0" y1="160.0" x2="526.0" y2="101.2" stroke="#a8680d" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#mo)"/><text x="537.6" y="93.4" text-anchor="start" font-size="10" fill="#a8680d" font-weight="normal">body z</text><line x1="526.0" y1="160.0" x2="537.0" y2="106.0" stroke="#d64545" stroke-width="3" marker-end="url(#mr)"/><text x="551.0" y="120.0" text-anchor="start" font-size="11" fill="#d64545" font-weight="normal">|f| = 10.01</text><line x1="450.0" y1="170.0" x2="450.0" y2="212.0" stroke="#8a96a3" stroke-width="2" marker-end="url(#mg)"/><text x="450.0" y="226.0" text-anchor="middle" font-size="10" fill="#8a96a3" font-weight="normal">gravity</text><line x1="445.0" y1="90.0" x2="479.0" y2="90.0" stroke="#0b6e8a" stroke-width="2.5" marker-end="url(#mb)"/><text x="462.0" y="82.0" text-anchor="middle" font-size="10" fill="#0b6e8a" font-weight="normal">a</text><text x="520.0" y="248.0" text-anchor="middle" font-size="12" fill="#1d2733" font-weight="bold">reads (0, 0, +10.01)</text><text x="520.0" y="266.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">tilted 11.5°, yet it looks level</text><text x="725.0" y="52.0" text-anchor="middle" font-size="13" fill="#0b6e8a" font-weight="bold">turn: 12 m/s at 20°/s</text><line x1="682.7" y1="141.9" x2="767.3" y2="178.1" stroke="#1d2733" stroke-width="7"/><line x1="666.1" y1="134.9" x2="699.2" y2="149.0" stroke="#8a96a3" stroke-width="3"/><line x1="750.8" y1="171.0" x2="783.9" y2="185.1" stroke="#8a96a3" stroke-width="3"/><line x1="719.0" y1="160.0" x2="742.6" y2="104.8" stroke="#a8680d" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#mo)"/><text x="755.7" y="97.5" text-anchor="start" font-size="10" fill="#a8680d" font-weight="normal">body z</text><line x1="731.0" y1="160.0" x2="754.0" y2="106.0" stroke="#d64545" stroke-width="3" marker-end="url(#mr)"/><text x="768.0" y="120.0" text-anchor="start" font-size="11" fill="#d64545" font-weight="normal">|f| = 10.67</text><line x1="655.0" y1="170.0" x2="655.0" y2="212.0" stroke="#8a96a3" stroke-width="2" marker-end="url(#mg)"/><text x="655.0" y="226.0" text-anchor="middle" font-size="10" fill="#8a96a3" font-weight="normal">gravity</text><line x1="650.0" y1="90.0" x2="710.0" y2="90.0" stroke="#0b6e8a" stroke-width="2.5" marker-end="url(#mb)"/><text x="680.0" y="82.0" text-anchor="middle" font-size="10" fill="#0b6e8a" font-weight="normal">a to the centre</text><text x="725.0" y="248.0" text-anchor="middle" font-size="12" fill="#1d2733" font-weight="bold">reads (0, 0, +10.67)</text><text x="725.0" y="266.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">banked 23.1°, yet it looks level</text><text x="415.0" y="292.0" text-anchor="middle" font-size="11" fill="#1d2733" font-weight="normal">Seen from behind (turn) or from the side (speeding up). A multirotor's thrust is always along its body z axis: when the drone accelerates, f stays along body z.</text></svg>
