<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" font-family="sans-serif" font-size="13"><rect width="620" height="260" fill="#f7fafc"/><defs><marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d2733"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8680d"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a96a3"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e4f"/></marker></defs><text x="310.0" y="24.0" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">The gravity step in 3-D: a small turn about a horizontal axis</text><line x1="40.0" y1="210.0" x2="300.0" y2="210.0" stroke="#8a96a3" stroke-width="1" stroke-dasharray="5 4"/><text x="296.0" y="226.0" text-anchor="end" font-size="10" fill="#8a96a3" font-weight="normal">horizontal</text><line x1="150.0" y1="210.0" x2="150.0" y2="70.0" stroke="#1d2733" stroke-width="2.5" marker-end="url(#mi)"/><text x="144.0" y="64.0" text-anchor="end" font-size="12" fill="#1d2733" font-weight="normal">up (0, 0, 1)</text><line x1="150.0" y1="210.0" x2="206.9" y2="82.1" stroke="#d64545" stroke-width="2.5" marker-end="url(#mr)"/><text x="212.9" y="82.1" text-anchor="start" font-size="12" fill="#d64545" font-weight="bold">seen_up</text><text x="212.9" y="98.1" text-anchor="start" font-size="10" fill="#d64545" font-weight="normal">gravity's push, turned</text><text x="212.9" y="112.1" text-anchor="start" font-size="10" fill="#d64545" font-weight="normal">into the world by q</text><path d="M178.5 146.1 A70 70 0 0 0 150.0 140" fill="none" stroke="#a8680d" stroke-width="2" marker-end="url(#mo)"/><text x="190.0" y="130.0" text-anchor="start" font-size="11" fill="#a8680d" font-weight="normal">error</text><circle cx="150" cy="210" r="7" fill="#ffffff" stroke="#0b6e8a" stroke-width="2"/><circle cx="150" cy="210" r="2" fill="#0b6e8a"/><text x="150.0" y="236.0" text-anchor="middle" font-size="11" fill="#0b6e8a" font-weight="normal">axis = seen_up × up (horizontal, out of the page)</text><text x="360.0" y="70.0" text-anchor="start" font-size="12" fill="#1d2733" font-weight="normal">1. turn with the gyro: q ← q ⊗ Δq</text><text x="360.0" y="89.0" text-anchor="start" font-size="12" fill="#1d2733" font-weight="normal">2. where does gravity's push point,</text><text x="360.0" y="108.0" text-anchor="start" font-size="12" fill="#1d2733" font-weight="normal">   according to q?  seen_up</text><text x="360.0" y="127.0" text-anchor="start" font-size="12" fill="#1d2733" font-weight="normal">3. turn the WORLD by (1 − α) · error</text><text x="360.0" y="146.0" text-anchor="start" font-size="12" fill="#1d2733" font-weight="normal">   about the horizontal axis:</text><text x="360.0" y="165.0" text-anchor="start" font-size="12" fill="#1d2733" font-weight="normal">   q ← Δ_gravity ⊗ q   (on the LEFT)</text><text x="360.0" y="184.0" text-anchor="start" font-size="12" fill="#8a96a3" font-weight="normal"></text><text x="360.0" y="203.0" text-anchor="start" font-size="12" fill="#8a96a3" font-weight="normal">A horizontal axis never turns the</text><text x="360.0" y="222.0" text-anchor="start" font-size="12" fill="#8a96a3" font-weight="normal">drone about the vertical: gravity</text><text x="360.0" y="241.0" text-anchor="start" font-size="12" fill="#8a96a3" font-weight="normal">cannot see the heading.</text></svg>
