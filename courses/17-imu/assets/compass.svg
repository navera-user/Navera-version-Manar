<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 300" font-family="sans-serif" font-size="13"><rect width="830" height="300" fill="#f7fafc"/><defs><marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d2733"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8680d"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a96a3"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e4f"/></marker></defs><text x="415.0" y="24.0" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">The Earth's field near Monastir (WMM2025, October 2026), and the two norths</text><line x1="30.0" y1="90.0" x2="330.0" y2="90.0" stroke="#8a96a3" stroke-width="1" stroke-dasharray="5 4"/><text x="326.0" y="106.0" text-anchor="end" font-size="10" fill="#8a96a3" font-weight="normal">horizontal, towards magnetic north →</text><line x1="60.0" y1="90.0" x2="178.7" y2="234.0" stroke="#d64545" stroke-width="3" marker-end="url(#mr)"/><text x="184.7" y="238.0" text-anchor="start" font-size="12" fill="#d64545" font-weight="normal">F = 44.4 µT</text><line x1="60.0" y1="90.0" x2="178.7" y2="90.0" stroke="#0b6e8a" stroke-width="2" marker-end="url(#mb)"/><text x="119.3" y="82.0" text-anchor="middle" font-size="11" fill="#0b6e8a" font-weight="normal">H = 28.3 µT</text><line x1="178.7" y1="90.0" x2="178.7" y2="234.0" stroke="#2e9e4f" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#mn)"/><text x="184.7" y="162.0" text-anchor="start" font-size="11" fill="#2e9e4f" font-weight="normal">Z = 34.3 µT down</text><path d="M105 90 A45 45 0 0 1 88.6 124.7" fill="none" stroke="#a8680d" stroke-width="2"/><text x="112.0" y="120.0" text-anchor="start" font-size="12" fill="#a8680d" font-weight="normal">I = 50.5°</text><text x="180.0" y="268.0" text-anchor="middle" font-size="11" fill="#1d2733" font-weight="normal">Side view: the field dips steeply. Tilt the drone</text><text x="180.0" y="284.0" text-anchor="middle" font-size="11" fill="#1d2733" font-weight="normal">and the big Z leaks into its x and y readings.</text><line x1="600.0" y1="200.0" x2="600.0" y2="60.0" stroke="#1d2733" stroke-width="2.5" marker-end="url(#mi)"/><text x="600.0" y="52.0" text-anchor="middle" font-size="12" fill="#1d2733" font-weight="normal">true north (maps)</text><line x1="600.0" y1="200.0" x2="629.1" y2="63.1" stroke="#d64545" stroke-width="2.5" marker-end="url(#mr)"/><text x="635.1" y="75.1" text-anchor="start" font-size="12" fill="#d64545" font-weight="normal">magnetic north</text><path d="M600 110 A90 90 0 0 1 618.7 112.0" fill="none" stroke="#a8680d" stroke-width="2"/><text x="614.0" y="102.0" text-anchor="start" font-size="13" fill="#a8680d" font-weight="bold">D</text><line x1="600.0" y1="200.0" x2="712.6" y2="135.0" stroke="#0b6e8a" stroke-width="3" marker-end="url(#mb)"/><text x="718.6" y="139.0" text-anchor="start" font-size="12" fill="#0b6e8a" font-weight="normal">nose</text><text x="600.0" y="234.0" text-anchor="middle" font-size="13" fill="#1d2733" font-weight="bold">true heading = magnetic heading + D</text><text x="600.0" y="252.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">(D east positive; here D = +3.35°, drawn larger)</text></svg>
