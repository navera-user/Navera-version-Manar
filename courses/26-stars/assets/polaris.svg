<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="sans-serif" font-size="13"><rect width="620" height="300" fill="#f7fafc"/><defs><marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d2733"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8680d"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a96a3"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e4f"/></marker></defs><text x="310.0" y="24.0" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">Polaris circles the pole: correct the altitude with its hour angle</text><line x1="30.0" y1="250.0" x2="330.0" y2="250.0" stroke="#2e9e4f" stroke-width="2.0"/><text x="40.0" y="268.0" text-anchor="start" font-size="11" fill="#2e9e4f" font-weight="normal">northern horizon</text><line x1="60.0" y1="250.0" x2="213.2" y2="121.4" stroke="#1d2733" stroke-width="1.0" stroke-dasharray="4 3"/><path d="M120,250 A60,60 0 0 0 106.0,211.4" stroke="#0b6e8a" fill="none" stroke-width="2"/><text x="130.0" y="232.0" text-anchor="start" font-size="15" fill="#0b6e8a" font-weight="bold">φ</text><circle cx="213.2" cy="121.4" r="4.0" stroke="#1d2733" fill="#1d2733" stroke-width="1.5"/><text x="217.2" y="139.4" text-anchor="start" font-size="11" fill="#1d2733" font-weight="normal">pole</text><circle cx="213.2" cy="121.4" r="34.0" stroke="#a8680d" fill="none" stroke-width="1.4" stroke-dasharray="4 3"/><circle cx="213.2" cy="87.4" r="5.0" stroke="#a8680d" fill="#a8680d" stroke-width="1.5"/><text x="221.2" y="83.4" text-anchor="start" font-size="11" fill="#a8680d" font-weight="normal">Polaris at H = 0° (above the pole)</text><text x="253.2" y="151.4" text-anchor="start" font-size="11" fill="#a8680d" font-weight="normal">radius p = 90° − δ</text><text x="350.0" y="70.0" text-anchor="start" font-size="12.5" fill="#1d2733" font-weight="bold">the pole stands φ above the horizon:</text><text x="350.0" y="100.0" text-anchor="start" font-size="12.5" fill="#1d2733" font-weight="normal">altitude of the pole = your latitude</text><text x="350.0" y="130.0" text-anchor="start" font-size="12.5" fill="#1d2733" font-weight="normal">Polaris is p ≈ 0.63° away from it (2026)</text><text x="350.0" y="160.0" text-anchor="start" font-size="12.5" fill="#1d2733" font-weight="normal">its altitude: a ≈ φ + p·cos H</text><text x="350.0" y="190.0" text-anchor="start" font-size="12.5" fill="#d64545" font-weight="bold">so  φ ≈ a − p·cos H</text><text x="350.0" y="220.0" text-anchor="start" font-size="12.5" fill="#8a96a3" font-weight="normal">left out: p² terms, refraction, the horizon's dip</text></svg>
