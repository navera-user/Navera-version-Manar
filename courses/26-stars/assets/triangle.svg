<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="sans-serif" font-size="13"><rect width="640" height="330" fill="#f7fafc"/><defs><marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d2733"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8680d"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a96a3"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e4f"/></marker></defs><circle cx="200.0" cy="175.0" r="135.0" stroke="#8a96a3" fill="none" stroke-width="1.2"/><text x="320.0" y="24.0" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">The navigational triangle: pole P, zenith Z, star X</text><path d="M145,80 Q207.9,78.0 270,120" stroke="#0b6e8a" fill="none" stroke-width="2.4"/><text x="208.1" y="66.0" text-anchor="middle" font-size="12.5" fill="#0b6e8a" font-weight="bold">90° − φ</text><path d="M270,120 Q252.0,201.5 205,250" stroke="#2e9e4f" fill="none" stroke-width="2.4"/><text x="262.6" y="217.5" text-anchor="middle" font-size="12.5" fill="#2e9e4f" font-weight="bold">90° − a</text><path d="M145,80 Q155.1,174.4 205,250" stroke="#a8680d" fill="none" stroke-width="2.4"/><text x="140.7" y="185.3" text-anchor="middle" font-size="12.5" fill="#a8680d" font-weight="bold">90° − δ</text><circle cx="145.0" cy="80.0" r="5.0" stroke="#1d2733" fill="#1d2733" stroke-width="1.5"/><text x="135.0" y="72.0" text-anchor="end" font-size="13" fill="#1d2733" font-weight="bold">P (pole)</text><circle cx="270.0" cy="120.0" r="5.0" stroke="#1d2733" fill="#1d2733" stroke-width="1.5"/><text x="280.0" y="112.0" text-anchor="start" font-size="13" fill="#1d2733" font-weight="bold">Z (zenith)</text><circle cx="205.0" cy="250.0" r="5.0" stroke="#1d2733" fill="#1d2733" stroke-width="1.5"/><text x="215.0" y="266.0" text-anchor="start" font-size="13" fill="#1d2733" font-weight="bold">X (star)</text><text x="171.0" y="110.0" text-anchor="middle" font-size="13" fill="#d64545" font-weight="bold">H</text><text x="248.0" y="144.0" text-anchor="middle" font-size="13" fill="#d64545" font-weight="bold">A</text><text x="380.0" y="80.0" text-anchor="start" font-size="12.5" fill="#1d2733" font-weight="bold">sides are ANGLES (on a unit sphere):</text><text x="380.0" y="104.0" text-anchor="start" font-size="12.5" fill="#1d2733" font-weight="normal">PZ = 90° − φ   (your latitude)</text><text x="380.0" y="128.0" text-anchor="start" font-size="12.5" fill="#1d2733" font-weight="normal">ZX = 90° − a   (the star's altitude)</text><text x="380.0" y="152.0" text-anchor="start" font-size="12.5" fill="#1d2733" font-weight="normal">PX = 90° − δ   (the star's declination)</text><text x="380.0" y="176.0" text-anchor="start" font-size="12.5" fill="#1d2733" font-weight="normal">angle at P = H (the hour angle)</text><text x="380.0" y="200.0" text-anchor="start" font-size="12.5" fill="#1d2733" font-weight="normal">angle at Z = A (the azimuth)</text><text x="380.0" y="224.0" text-anchor="start" font-size="12.5" fill="#1d2733" font-weight="normal"></text><text x="380.0" y="248.0" text-anchor="start" font-size="12.5" fill="#1d2733" font-weight="normal">the spherical law of cosines on ZX:</text><text x="380.0" y="272.0" text-anchor="start" font-size="12.5" fill="#d64545" font-weight="bold">sin a = sin δ sin φ + cos δ cos φ cos H</text></svg>
