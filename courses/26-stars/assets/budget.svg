<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="sans-serif" font-size="13"><rect width="660" height="340" fill="#f7fafc"/><defs><marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d2733"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8680d"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a96a3"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e4f"/></marker></defs><text x="330.0" y="24.0" text-anchor="middle" font-size="14" fill="#1d2733" font-weight="bold">An attitude error becomes a position error</text><path d="M55,280 A115,115 0 0 1 285,280" stroke="#8a96a3" fill="#e8eef3" stroke-width="1.5"/><text x="170.0" y="300.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">the Earth</text><circle cx="170.0" cy="165.0" r="5.0" stroke="#2e9e4f" fill="#2e9e4f" stroke-width="1.5"/><line x1="170.0" y1="165.0" x2="170.0" y2="95.0" stroke="#2e9e4f" stroke-width="2.0" marker-end="url(#mn)"/><text x="166.0" y="81.0" text-anchor="end" font-size="11" fill="#2e9e4f" font-weight="normal">zenith (true)</text><circle cx="193.9" cy="167.5" r="5.0" stroke="#d64545" fill="#d64545" stroke-width="1.5"/><line x1="193.9" y1="167.5" x2="208.5" y2="99.0" stroke="#d64545" stroke-width="2.0" marker-end="url(#mr)"/><text x="214.5" y="85.3" text-anchor="start" font-size="11" fill="#d64545" font-weight="normal">zenith (computed)</text><text x="218.0" y="191.0" text-anchor="middle" font-size="15" fill="#d64545" font-weight="bold">ε</text><text x="345.0" y="90.0" text-anchor="start" font-size="12.5" fill="#1d2733" font-weight="bold">the IMU tilts the sky by ε  →  your zenith moves by ε</text><text x="345.0" y="122.0" text-anchor="start" font-size="12.5" fill="#1d2733" font-weight="normal">→  your position moves ε × 111.2 km</text><text x="345.0" y="154.0" text-anchor="start" font-size="12.5" fill="#0b6e8a" font-weight="normal">1° = 111.2 km;   1′ = 1.852 km (one nautical mile)</text><text x="345.0" y="186.0" text-anchor="start" font-size="12.5" fill="#1d2733" font-weight="normal">a heading error turns the sky about the vertical:</text><text x="345.0" y="218.0" text-anchor="start" font-size="12.5" fill="#1d2733" font-weight="normal">it moves the camera's direction by heading × cos(alt)</text><text x="345.0" y="250.0" text-anchor="start" font-size="12.5" fill="#d64545" font-weight="bold">independent errors: √(tilt² + (heading·cos alt)²)</text><text x="330.0" y="330.0" text-anchor="middle" font-size="10.5" fill="#8a96a3" font-weight="normal">(the one-direction method of lesson §6; with the plate solve's whole rotation the heading drops out)</text></svg>
