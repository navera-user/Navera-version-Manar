<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="sans-serif" font-size="13">
  <rect width="560" height="300" fill="#f7fafc"/>
  <!-- the Earth: centre far below the picture -->
  <circle cx="280" cy="602" r="420" fill="#cde6c8" stroke="#1d2733" stroke-width="1.5"/>
  <line x1="280" y1="602" x2="280" y2="60" stroke="#0b6e8a" stroke-width="2"/>
  <line x1="280" y1="602" x2="338.5" y2="45" stroke="#d64545" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="280" cy="182" r="6" fill="#0b6e8a"/>
  <circle cx="324" cy="184" r="6" fill="#d64545"/>
  <text x="168" y="176" fill="#0b6e8a" font-weight="bold">true position</text>
  <text x="336" y="180" fill="#d64545" font-weight="bold">computed position</text>
  <path d="M 280 100 Q 306 96 333 100" fill="none" stroke="#1d2733"/>
  <text x="342" y="104" fill="#1d2733" font-size="12">attitude error 1° (drawn bigger)</text>
  <text x="20" y="26" fill="#1d2733">blue: where the camera really points · red: where the IMU says it points</text>
  <text x="272" y="225" fill="#1d2733" text-anchor="end">1° of the Earth's circle</text>
  <text x="272" y="243" fill="#1d2733" text-anchor="end">= 40 030 km ÷ 360 ≈ <tspan font-weight="bold">111 km</tspan></text>
  <rect x="0" y="260" width="560" height="40" fill="#f7fafc"/>
  <text x="20" y="278" fill="#1d2733" font-size="12">The stars are so far away that only DIRECTIONS count:</text>
  <text x="20" y="294" fill="#1d2733" font-size="12">a direction wrong by 1° puts you 1° of the Earth away from the truth.</text>
</svg>
