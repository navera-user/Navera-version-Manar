<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="sans-serif" font-size="13">
  <rect width="640" height="380" fill="#f7fafc"/>
  <text x="320" y="22" text-anchor="middle" fill="#1d2733" font-weight="bold">Harris response in the plane of the eigenvalues of M (k = 0.05)</text>
  <!-- corner region: between the two lines R = 0, away from the origin -->
  <polygon points="60,330 76.7,40 360,40 360,313.3" fill="#d64545" fill-opacity="0.13"/>
  <polygon points="60,330 76.7,40 60,40" fill="#f2a33a" fill-opacity="0.25"/>
  <polygon points="60,330 360,313.3 360,330" fill="#f2a33a" fill-opacity="0.25"/>
  <path d="M60,330 L60,290 A40,40 0 0 1 100,330 Z" fill="#cfe3ea"/>
  <!-- axes -->
  <g stroke="#1d2733" stroke-width="1.5">
    <line x1="60" y1="330" x2="372" y2="330"/><line x1="60" y1="330" x2="60" y2="34"/>
  </g>
  <path d="M372,325 L382,330 L372,335 z" fill="#1d2733"/><path d="M55,34 L60,24 L65,34 z" fill="#1d2733"/>
  <text x="388" y="334" fill="#1d2733">λ1</text>
  <text x="70" y="32" fill="#1d2733">λ2</text>
  <g fill="#5a6573" font-size="11" text-anchor="middle">
    <text x="60" y="346">0</text><text x="210" y="346">200</text><text x="360" y="346">400</text>
    <text x="48" y="184" text-anchor="end">200</text>
  </g>
  <!-- the two lines R = 0 -->
  <g stroke="#a8680d" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="60" y1="330" x2="360" y2="313.3"/><line x1="60" y1="330" x2="76.7" y2="40"/>
  </g>
  <!-- region labels -->
  <text x="225" y="120" text-anchor="middle" fill="#b03030" font-weight="bold">CORNER</text>
  <text x="225" y="137" text-anchor="middle" fill="#b03030">both λ large, R &gt; 0</text>
  <text x="270" y="300" text-anchor="middle" fill="#a8680d" font-weight="bold">EDGE  (λ1 ≫ λ2, R &lt; 0)</text>
  <text x="70" y="318" fill="#0b6e8a" font-weight="bold" font-size="11">flat</text>
  <!-- worked-example points -->
  <circle cx="210" cy="180" r="5" fill="#d64545"/>
  <circle cx="360" cy="330" r="5" fill="#a8680d"/>
  <!-- legend / notes on the right -->
  <g fill="#1d2733">
    <text x="400" y="70" font-weight="bold">Reading it</text>
    <text x="400" y="94">● (200, 200): the lesson's corner,</text>
    <text x="414" y="111">R = +32 000</text>
    <text x="400" y="135">● (400, 0): the vertical and the</text>
    <text x="414" y="152">diagonal edges, R = −8 000</text>
    <text x="400" y="176">Dashed lines: R = 0, that is</text>
    <text x="414" y="193">λ2 = 0.056·λ1 and λ1 = 0.056·λ2</text>
    <text x="400" y="217">Near the origin |R| is small:</text>
    <text x="414" y="234">flat ground, removed by the</text>
    <text x="414" y="251">threshold R &gt; 0.01·max(R)</text>
    <text x="400" y="281">R = λ1·λ2 − k·(λ1 + λ2)²</text>
    <text x="414" y="298">= det M − k·(trace M)²</text>
  </g>
</svg>
