<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" font-family="sans-serif" font-size="12">
  <rect width="680" height="230" fill="#f7fafc"/>
  <text x="340" y="20" text-anchor="middle" fill="#1d2733" font-weight="bold" font-size="13">PatchNet: a 32 × 32 patch in, 64 numbers of length 1 out (the ? are yours to work out)</text>
  <rect x="20" y="60" width="64" height="64" fill="#c9c2b4" stroke="#1d2733"/>
  <text x="52" y="145" text-anchor="middle">1 × 32 × 32</text><text x="52" y="160" text-anchor="middle" fill="#5a6573">patch</text>
  <g fill="#0b6e8a" fill-opacity="0.25" stroke="#0b6e8a">
    <rect x="130" y="64" width="44" height="44"/><rect x="134" y="68" width="44" height="44"/><rect x="138" y="72" width="44" height="44"/>
    <rect x="240" y="76" width="28" height="28"/><rect x="243" y="79" width="28" height="28"/><rect x="246" y="82" width="28" height="28"/><rect x="249" y="85" width="28" height="28"/>
    <rect x="340" y="84" width="16" height="16"/><rect x="342" y="86" width="16" height="16"/><rect x="344" y="88" width="16" height="16"/><rect x="346" y="90" width="16" height="16"/><rect x="348" y="92" width="16" height="16"/>
  </g>
  <text x="156" y="145" text-anchor="middle">16 × 16 × 16</text><text x="156" y="160" text-anchor="middle" fill="#5a6573">conv1 + ReLU + pool</text>
  <text x="258" y="45" text-anchor="middle">? × ? × ?</text><text x="258" y="60" text-anchor="middle" fill="#5a6573">conv2 + ReLU + pool</text>
  <text x="352" y="145" text-anchor="middle">? × ? × ?</text><text x="352" y="160" text-anchor="middle" fill="#5a6573">conv3 + ReLU + pool</text>
  <rect x="420" y="40" width="14" height="110" fill="#f2a33a" fill-opacity="0.4" stroke="#b36b00"/>
  <text x="427" y="170" text-anchor="middle">?</text><text x="427" y="185" text-anchor="middle" fill="#5a6573">flatten</text>
  <rect x="500" y="70" width="14" height="50" fill="#d64545" fill-opacity="0.4" stroke="#d64545"/>
  <text x="507" y="140" text-anchor="middle">64</text><text x="507" y="155" text-anchor="middle" fill="#5a6573">fc</text>
  <text x="600" y="92" text-anchor="middle" fill="#1d2733">÷ its length</text><text x="600" y="108" text-anchor="middle" fill="#1d2733">→ descriptor</text>
  <g stroke="#1d2733" stroke-width="1.5"><line x1="90" y1="92" x2="124" y2="92"/><line x1="192" y1="92" x2="234" y2="92"/><line x1="284" y1="96" x2="334" y2="96"/><line x1="372" y1="96" x2="414" y2="96"/><line x1="440" y1="96" x2="494" y2="96"/><line x1="520" y1="96" x2="556" y2="96"/></g>
  <text x="340" y="205" text-anchor="middle" fill="#5a6573">Each conv layer: 3 × 3 filters as in mission 08, but their numbers are LEARNED.</text><text x="340" y="221" text-anchor="middle" fill="#5a6573">Pooling keeps the largest value of each 2 × 2 block.</text>
</svg>
