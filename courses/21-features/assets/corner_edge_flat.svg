<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" font-family="sans-serif" font-size="13">
  <rect width="600" height="270" fill="#f7fafc"/>
  <!-- three scenes: a dark roof on light ground -->
  <g>
    <rect x="20" y="20" width="170" height="170" fill="#e8dcc4"/>
    <rect x="215" y="20" width="170" height="170" fill="#e8dcc4"/>
    <rect x="410" y="20" width="170" height="170" fill="#e8dcc4"/>
    <rect x="80" y="80" width="110" height="110" fill="#7a5c3e"/>
    <rect x="275" y="80" width="110" height="110" fill="#7a5c3e"/>
    <rect x="470" y="80" width="110" height="110" fill="#7a5c3e"/>
  </g>
  <!-- flat: window in the middle of the ground -->
  <rect x="30" y="28" width="36" height="36" fill="none" stroke="#0b6e8a" stroke-width="3"/>
  <g stroke="#0b6e8a" stroke-width="2" marker-end="url(#a)">
    <line x1="48" y1="46" x2="48" y2="24"/><line x1="48" y1="46" x2="72" y2="46"/>
  </g>
  <!-- edge: window on the top edge of the roof -->
  <rect x="312" y="62" width="36" height="36" fill="none" stroke="#f2a33a" stroke-width="3"/>
  <g stroke="#f2a33a" stroke-width="2" marker-end="url(#b)">
    <line x1="330" y1="80" x2="360" y2="80"/><line x1="330" y1="80" x2="330" y2="52"/>
  </g>
  <!-- corner: window on the roof corner -->
  <rect x="452" y="62" width="36" height="36" fill="none" stroke="#d64545" stroke-width="3"/>
  <g stroke="#d64545" stroke-width="2" marker-end="url(#c)">
    <line x1="470" y1="80" x2="500" y2="80"/><line x1="470" y1="80" x2="470" y2="52"/>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0b6e8a"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f2a33a"/></marker>
    <marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d64545"/></marker>
  </defs>
  <g fill="#1d2733">
    <text x="105" y="212" text-anchor="middle" font-weight="bold">FLAT</text>
    <text x="105" y="230" text-anchor="middle">move the window any way:</text>
    <text x="105" y="246" text-anchor="middle">nothing changes</text>
    <text x="300" y="212" text-anchor="middle" font-weight="bold">EDGE</text>
    <text x="300" y="230" text-anchor="middle">slide along it: no change</text>
    <text x="300" y="246" text-anchor="middle">→ you can't tell where you are</text>
    <text x="495" y="212" text-anchor="middle" font-weight="bold" fill="#d64545">CORNER = keypoint</text>
    <text x="495" y="230" text-anchor="middle">every move changes</text>
    <text x="495" y="246" text-anchor="middle">→ one exact place</text>
  </g>
</svg>
