<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" font-family="sans-serif" font-size="12">
<rect width="720" height="290" fill="#f7fafc"/>
<text x="360.0" y="24.0" fill="#1d2733" text-anchor="middle" font-size="14" font-weight="bold">A watchdog checked by a 1 Hz timer: when does it say “silent”?</text>
<line x1="70.0" y1="40" x2="70.0" y2="215" stroke="#d5dde5"/><text x="70.0" y="232.0" fill="#56606b" text-anchor="middle" font-size="11">7 s</text>
<line x1="150.0" y1="40" x2="150.0" y2="215" stroke="#d5dde5"/><text x="150.0" y="232.0" fill="#56606b" text-anchor="middle" font-size="11">8 s</text>
<line x1="230.0" y1="40" x2="230.0" y2="215" stroke="#d5dde5"/><text x="230.0" y="232.0" fill="#56606b" text-anchor="middle" font-size="11">9 s</text>
<line x1="310.0" y1="40" x2="310.0" y2="215" stroke="#d5dde5"/><text x="310.0" y="232.0" fill="#56606b" text-anchor="middle" font-size="11">10 s</text>
<line x1="390.0" y1="40" x2="390.0" y2="215" stroke="#d5dde5"/><text x="390.0" y="232.0" fill="#56606b" text-anchor="middle" font-size="11">11 s</text>
<line x1="470.0" y1="40" x2="470.0" y2="215" stroke="#d5dde5"/><text x="470.0" y="232.0" fill="#56606b" text-anchor="middle" font-size="11">12 s</text>
<line x1="550.0" y1="40" x2="550.0" y2="215" stroke="#d5dde5"/><text x="550.0" y="232.0" fill="#56606b" text-anchor="middle" font-size="11">13 s</text>
<line x1="630.0" y1="40" x2="630.0" y2="215" stroke="#d5dde5"/><text x="630.0" y="232.0" fill="#56606b" text-anchor="middle" font-size="11">14 s</text>
<text x="14.0" y="70.0" fill="#1d2733" text-anchor="start" font-weight="bold">fixes</text>
<path d="M70.0 52 v26" stroke="#1d2733" stroke-width="3"/><path d="M150.0 52 v26" stroke="#1d2733" stroke-width="3"/><path d="M230.0 52 v26" stroke="#1d2733" stroke-width="3"/><path d="M310.0 52 v26" stroke="#1d2733" stroke-width="3"/><text x="310.0" y="96.0" fill="#1d2733" text-anchor="middle" font-size="11">last fix: kick(10.0)</text>
<line x1="310.0" y1="110" x2="550.0" y2="110" stroke="#a8680d" stroke-width="2"/><text x="430.0" y="104.0" fill="#a8680d" text-anchor="middle" font-size="11">silence_s = 3.0 s</text>
<path d="M550.0 104 v12" stroke="#a8680d" stroke-width="2"/><text x="14.0" y="160.0" fill="#1d2733" text-anchor="start" font-weight="bold">timer</text>
<text x="14.0" y="175.0" fill="#56606b" text-anchor="start" font-size="11">1 Hz</text>
<rect x="107.0" y="146" width="6" height="26" fill="#0b6e8a"/><rect x="187.0" y="146" width="6" height="26" fill="#0b6e8a"/><rect x="267.0" y="146" width="6" height="26" fill="#0b6e8a"/><rect x="347.0" y="146" width="6" height="26" fill="#0b6e8a"/><text x="350.0" y="190.0" fill="#0b6e8a" text-anchor="middle" font-size="11">ok</text>
<rect x="427.0" y="146" width="6" height="26" fill="#0b6e8a"/><text x="430.0" y="190.0" fill="#0b6e8a" text-anchor="middle" font-size="11">ok</text>
<rect x="507.0" y="146" width="6" height="26" fill="#0b6e8a"/><text x="510.0" y="190.0" fill="#0b6e8a" text-anchor="middle" font-size="11">ok</text>
<rect x="587.0" y="146" width="6" height="26" fill="#b3261e"/><text x="590.0" y="190.0" fill="#b3261e" text-anchor="middle" font-size="11">silent</text>
<rect x="667.0" y="146" width="6" height="26" fill="#b3261e"/><text x="670.0" y="190.0" fill="#b3261e" text-anchor="middle" font-size="11">silent</text>
<text x="590.0" y="206.0" fill="#b3261e" text-anchor="middle" font-size="11">3.5 s after the last fix</text>
<text x="360.0" y="258.0" fill="#56606b" text-anchor="middle" font-size="11">silent(now) is True once now − last_s > 3.0 s, but nobody asks before the next tick:</text>
<text x="360.0" y="274.0" fill="#56606b" text-anchor="middle" font-size="11">with a 1 Hz timer the alarm comes 3.0 to 4.0 s after the last fix, depending on the timer's phase.</text>
</svg>
