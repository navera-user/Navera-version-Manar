<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif" font-size="12">
<rect width="720" height="300" fill="#f7fafc"/>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d32"/></marker></defs>
<text x="360" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d2733">Speed from noisy fixes: consecutive steps versus a window of 10 fixes</text>
<text x="360" y="42" text-anchor="middle" fill="#56606b">schematic: true step 3 m (6 m/s at 2 Hz); the lab uses noise σ = 3 m per axis</text>
<path d="M50 150 L686 150" stroke="#9aa5b1" stroke-width="3" stroke-dasharray="8 5"/>
<text x="686" y="198" text-anchor="end" fill="#56606b">true path (dashed)</text>
<path d="M83 193 L112 184 L199 141 L337 155 L335 175 L438 149 L484 117 L516 135 L547 99 L601 142" fill="none" stroke="#b3261e" stroke-width="2"/>
<circle cx="83" cy="193" r="5" fill="#b3261e"/>
<circle cx="112" cy="184" r="5" fill="#b3261e"/>
<circle cx="199" cy="141" r="5" fill="#b3261e"/>
<circle cx="337" cy="155" r="5" fill="#b3261e"/>
<circle cx="335" cy="175" r="5" fill="#b3261e"/>
<circle cx="438" cy="149" r="5" fill="#b3261e"/>
<circle cx="484" cy="117" r="5" fill="#b3261e"/>
<circle cx="516" cy="135" r="5" fill="#b3261e"/>
<circle cx="547" cy="99" r="5" fill="#b3261e"/>
<circle cx="601" cy="142" r="5" fill="#b3261e"/>
<path d="M83 193 L594 142" stroke="#2e7d32" stroke-width="3" fill="none" marker-end="url(#m)" opacity="0.9"/>
<rect x="40" y="224" width="14" height="4" fill="#b3261e"/>
<text x="62" y="230" fill="#1d2733">consecutive steps: v = step / 0.5 s — zig-zags, too long on average (biased)</text>
<rect x="40" y="250" width="14" height="4" fill="#2e7d32"/>
<text x="62" y="256" fill="#1d2733">window chord: oldest → newest fix over 4.5 s — σ_v ≈ √2·σ / 4.5 s ≈ 0.94 m/s</text>
<text x="62" y="282" fill="#56606b">price of the window: a delay (lag) and a shorter chord in turns</text>
</svg>
