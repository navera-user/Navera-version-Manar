<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="sans-serif" font-size="12">
<rect width="720" height="330" fill="#f7fafc"/>
<text x="360.0" y="24.0" fill="#1d2733" text-anchor="middle" font-size="14" font-weight="bold">Speed from noisy fixes: fix to fix, or across a 10 s window</text>
<text x="360.0" y="42.0" fill="#56606b" text-anchor="middle" font-size="11">schematic: 10 m/s east, one fix per second, noise σ = 5 m per axis (the lesson's worked example)</text>
<line x1="60" y1="170" x2="640.0" y2="170" stroke="#1d2733" stroke-dasharray="6 4"/>
<text x="644.0" y="174.0" fill="#56606b" text-anchor="start">true path</text>
<line x1="71.1" y1="157.2" x2="112.3" y2="160.3" stroke="#8a949e" stroke-width="1.5"/>
<line x1="112.3" y1="160.3" x2="205.5" y2="158.7" stroke="#8a949e" stroke-width="1.5"/>
<line x1="205.5" y1="158.7" x2="278.0" y2="194.3" stroke="#8a949e" stroke-width="1.5"/>
<line x1="278.0" y1="194.3" x2="291.9" y2="189.4" stroke="#8a949e" stroke-width="1.5"/>
<line x1="291.9" y1="189.4" x2="323.5" y2="175.1" stroke="#8a949e" stroke-width="1.5"/>
<line x1="323.5" y1="175.1" x2="406.1" y2="158.5" stroke="#8a949e" stroke-width="1.5"/>
<line x1="406.1" y1="158.5" x2="469.0" y2="108.6" stroke="#8a949e" stroke-width="1.5"/>
<line x1="469.0" y1="108.6" x2="533.7" y2="213.8" stroke="#8a949e" stroke-width="1.5"/>
<line x1="533.7" y1="213.8" x2="570.6" y2="187.1" stroke="#8a949e" stroke-width="1.5"/>
<line x1="570.6" y1="187.1" x2="605.8" y2="134.1" stroke="#8a949e" stroke-width="1.5"/>
<line x1="71.1" y1="157.2" x2="605.8" y2="134.1" stroke="#0b6e8a" stroke-width="3" opacity=".85"/>
<circle cx="71.1" cy="157.2" r="4" fill="#1d2733"/>
<circle cx="112.3" cy="160.3" r="4" fill="#1d2733"/>
<circle cx="205.5" cy="158.7" r="4" fill="#1d2733"/>
<circle cx="278.0" cy="194.3" r="4" fill="#1d2733"/>
<circle cx="291.9" cy="189.4" r="4" fill="#1d2733"/>
<circle cx="323.5" cy="175.1" r="4" fill="#1d2733"/>
<circle cx="406.1" cy="158.5" r="4" fill="#1d2733"/>
<circle cx="469.0" cy="108.6" r="4" fill="#1d2733"/>
<circle cx="533.7" cy="213.8" r="4" fill="#1d2733"/>
<circle cx="570.6" cy="187.1" r="4" fill="#1d2733"/>
<circle cx="605.8" cy="134.1" r="4" fill="#1d2733"/>
<text x="73.1" y="179.2" fill="#56606b" text-anchor="start" font-size="11">oldest (t − 10 s)</text>
<text x="605.8" y="156.1" fill="#56606b" text-anchor="middle" font-size="11">newest (t)</text>
<line x1="70" y1="258" x2="96" y2="258" stroke="#8a949e" stroke-width="1.5"/>
<text x="104.0" y="262.0" fill="#1d2733" text-anchor="start">fix to fix (window 1 s): each 10 m step carries the noise of two fixes → σ_v ≈ √2 · 5 m / 1 s ≈ 7.1 m/s</text>
<line x1="70" y1="282" x2="96" y2="282" stroke="#0b6e8a" stroke-width="3"/>
<text x="104.0" y="286.0" fill="#1d2733" text-anchor="start">window chord: the same two-fix noise over a 100 m chord → σ_v ≈ √2 · 5 m / 10 s ≈ 0.71 m/s</text>
<text x="104.0" y="310.0" fill="#b3261e" text-anchor="start">its price: it tells the average of the last 10 s — a delay when the speed changes</text>
</svg>
