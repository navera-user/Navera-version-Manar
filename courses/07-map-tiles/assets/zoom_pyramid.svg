<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="sans-serif" font-size="13">
  <rect width="700" height="300" fill="#f7fafc"/>
  <!-- zoom 0 -->
  <text x="40" y="30" fill="#1d2733" font-weight="bold">zoom 0</text>
  <rect x="40" y="45" width="160" height="160" fill="#cde6c8" stroke="#0b6e8a" stroke-width="2"/>
  <text x="95" y="130" fill="#1d2733">0 / 0</text>
  <text x="40" y="230" fill="#555" font-size="12">1 tile: the whole world</text>
  <text x="40" y="246" fill="#555" font-size="12">1 px ≈ 156 km</text>
  <!-- zoom 1 -->
  <text x="240" y="30" fill="#1d2733" font-weight="bold">zoom 1</text>
  <g fill="#cde6c8" stroke="#0b6e8a" stroke-width="2">
    <rect x="240" y="45" width="80" height="80"/><rect x="320" y="45" width="80" height="80"/>
    <rect x="240" y="125" width="80" height="80"/><rect x="320" y="125" width="80" height="80"/>
  </g>
  <g fill="#1d2733" font-size="12"><text x="262" y="90">0 / 0</text><text x="342" y="90">1 / 0</text><text x="262" y="170">0 / 1</text><text x="342" y="170">1 / 1</text></g>
  <text x="240" y="230" fill="#555" font-size="12">2 × 2 = 4 tiles</text>
  <text x="240" y="246" fill="#555" font-size="12">1 px ≈ 78 km</text>
  <!-- zoom 2 -->
  <text x="440" y="30" fill="#1d2733" font-weight="bold">zoom 2</text>
  <g fill="#cde6c8" stroke="#0b6e8a" stroke-width="1.5">
    <rect x="440" y="45" width="40" height="40"/><rect x="480" y="45" width="40" height="40"/><rect x="520" y="45" width="40" height="40"/><rect x="560" y="45" width="40" height="40"/>
    <rect x="440" y="85" width="40" height="40"/><rect x="480" y="85" width="40" height="40"/><rect x="520" y="85" width="40" height="40"/><rect x="560" y="85" width="40" height="40"/>
    <rect x="440" y="125" width="40" height="40"/><rect x="480" y="125" width="40" height="40"/><rect x="520" y="125" width="40" height="40"/><rect x="560" y="125" width="40" height="40"/>
    <rect x="440" y="165" width="40" height="40"/><rect x="480" y="165" width="40" height="40"/><rect x="520" y="165" width="40" height="40"/><rect x="560" y="165" width="40" height="40"/>
  </g>
  <rect x="520" y="85" width="40" height="40" fill="#f2a33a" stroke="#0b6e8a" stroke-width="1.5"/>
  <text x="524" y="110" fill="#1d2733" font-size="11">2 / 1</text>
  <text x="440" y="230" fill="#555" font-size="12">4 × 4 = 16 tiles</text>
  <text x="440" y="246" fill="#555" font-size="12">orange: x = 2, y = 1</text><text x="440" y="262" fill="#555" font-size="12">(Tunisia is in it)</text>
  <!-- axes -->
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d64545"/></marker></defs>
  <line x1="440" y1="38" x2="610" y2="38" stroke="#d64545" stroke-width="2" marker-end="url(#a)"/>
  <text x="612" y="34" fill="#d64545" font-size="12">x</text>
  <line x1="612" y1="45" x2="612" y2="210" stroke="#d64545" stroke-width="2" marker-end="url(#a)"/>
  <text x="618" y="215" fill="#d64545" font-size="12">y</text>
  <text x="40" y="288" fill="#1d2733">Each zoom level cuts every tile into 4: at zoom z, 2^z × 2^z tiles of 256 × 256 pixels.</text>
</svg>
