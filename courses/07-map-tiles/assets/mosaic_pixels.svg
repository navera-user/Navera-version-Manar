<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="sans-serif" font-size="13">
<rect width="720" height="400" fill="#f7fafc"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
<text x="20" y="26" fill="#1d2733" font-weight="bold">Pixels of a mosaic, and the corner bug</text>
<rect x="50" y="66" width="86" height="86" fill="#e9f3e6" stroke="#0b6e8a" stroke-width="1.5"/>
<rect x="136" y="66" width="86" height="86" fill="#e9f3e6" stroke="#0b6e8a" stroke-width="1.5"/>
<rect x="222" y="66" width="86" height="86" fill="#e9f3e6" stroke="#0b6e8a" stroke-width="1.5"/>
<rect x="50" y="152" width="86" height="86" fill="#e9f3e6" stroke="#0b6e8a" stroke-width="1.5"/>
<rect x="136" y="152" width="86" height="86" fill="#cde6c8" stroke="#0b6e8a" stroke-width="1.5"/>
<rect x="222" y="152" width="86" height="86" fill="#e9f3e6" stroke="#0b6e8a" stroke-width="1.5"/>
<rect x="50" y="238" width="86" height="86" fill="#e9f3e6" stroke="#0b6e8a" stroke-width="1.5"/>
<rect x="136" y="238" width="86" height="86" fill="#e9f3e6" stroke="#0b6e8a" stroke-width="1.5"/>
<rect x="222" y="238" width="86" height="86" fill="#e9f3e6" stroke="#0b6e8a" stroke-width="1.5"/>
<text x="54" y="82" fill="#1d2733" font-size="11.5">tile (x0, y0)</text>
<text x="218" y="232" fill="#1d2733" font-size="11.5" text-anchor="end">tile (x, y)</text>
<line x1="50" y1="56" x2="157.5" y2="56" stroke="#d64545" stroke-width="1.5" marker-end="url(#a)"/><text x="103.8" y="51" fill="#d64545" font-size="12" text-anchor="middle">px</text>
<line x1="40" y1="66" x2="40" y2="216.5" stroke="#d64545" stroke-width="1.5" marker-end="url(#a)"/><text x="35" y="141.2" fill="#d64545" font-size="12" text-anchor="end">py</text>
<line x1="157.5" y1="56" x2="157.5" y2="216.5" stroke="#d64545" stroke-dasharray="2 3"/><line x1="40" y1="216.5" x2="157.5" y2="216.5" stroke="#d64545" stroke-dasharray="2 3"/>
<circle cx="157.5" cy="216.5" r="5" fill="#d64545"/>
<circle cx="136" cy="152" r="6" fill="#c99a06" stroke="white"/><circle cx="179.0" cy="195.0" r="6" fill="#2f855a" stroke="white"/><line x1="141" y1="157" x2="173.0" y2="189.0" stroke="#1d2733" stroke-width="1.5" marker-end="url(#a)"/>
<text x="50" y="346" fill="#d64545" font-size="12">● the point: px = (x_frac − x0)·256, py = (y_frac − y0)·256</text>
<text x="50" y="364" fill="#c99a06" font-size="12">● NW corner of its tile = tile_to_latlon(x, y)</text>
<text x="50" y="382" fill="#2f855a" font-size="12">● centre = tile_to_latlon(x + 0.5, y + 0.5)</text>
<text x="380" y="60" fill="#1d2733" font-size="12.5" font-weight="bold">Pixel ↔ lat/lon in a mosaic</text>
<text x="380" y="82" fill="#1d2733" font-size="12.5">x_frac, y_frac = tile_xy(lat, lon, z)</text>
<text x="380" y="104" fill="#1d2733" font-size="12.5">px = (x_frac − x0) · 256</text>
<text x="380" y="126" fill="#1d2733" font-size="12.5">back: tile_to_latlon(x0 + px/256, y0 + py/256, z)</text>
<text x="380" y="170" fill="#1d2733" font-size="12.5" font-weight="bold">The corner bug (NAVERA, fixed)</text>
<text x="380" y="192" fill="#1d2733" font-size="12.5">The dataset stored each tile's NW corner;</text>
<text x="380" y="214" fill="#1d2733" font-size="12.5">a matched tile was published at that corner.</text>
<text x="380" y="236" fill="#1d2733" font-size="12.5">The photo centre is the tile centre:</text>
<text x="380" y="258" fill="#1d2733" font-size="12.5">error = half the tile diagonal, to the NW</text>
<text x="380" y="280" fill="#1d2733" font-size="12.5">zoom 17:  Sousse 175 m,  Singapore 216 m</text>
</svg>
