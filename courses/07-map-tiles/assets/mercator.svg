<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" font-family="sans-serif" font-size="13">
<rect width="740" height="360" fill="#f7fafc"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
<text x="20" y="26" fill="#1d2733" font-weight="bold">Mercator: stretch north–south exactly as much as east–west</text>
<text x="20" y="56" fill="#0b6e8a" font-weight="bold">sphere, latitude φ</text>
<rect x="50" y="80" width="70" height="80" fill="#d7ecf5" stroke="#0b6e8a" stroke-width="2"/>
<text x="85" y="178" fill="#1d2733" font-size="12" text-anchor="middle">R·cos φ·dλ</text>
<text x="44" y="125" fill="#1d2733" font-size="12" text-anchor="end">R·dφ</text>
<line x1="140" y1="120" x2="185" y2="120" stroke="#1d2733" stroke-width="1.5" marker-end="url(#a)"/>
<text x="215" y="56" fill="#a8680d" font-weight="bold">map</text>
<rect x="200" y="62" width="110" height="116" fill="#fbe6c8" stroke="#a8680d" stroke-width="2"/>
<text x="255" y="196" fill="#1d2733" font-size="12" text-anchor="middle">dx = R·dλ</text>
<text x="318" y="125" fill="#1d2733" font-size="12">dy</text>
<text x="20" y="232" fill="#1d2733" font-size="12.5">x = R·λ: meridians become vertical, equally</text>
<text x="20" y="253" fill="#1d2733" font-size="12.5">spaced, so east–west is stretched by 1 / cos φ.</text>
<text x="20" y="274" fill="#1d2733" font-size="12.5">Same shape (conformal) needs the same stretch</text>
<text x="20" y="295" fill="#1d2733" font-size="12.5">north–south:  dy = R·dφ / cos φ</text>
<text x="20" y="316" fill="#1d2733" font-size="12.5" font-weight="bold">y = R ∫ dφ / cos φ = R·ln tan(π/4 + φ/2)</text>
<text x="20" y="337" fill="#1d2733" font-size="12.5">scale factor k = 1 / cos φ (areas: 1 / cos² φ)</text>
<text x="400" y="60" fill="#1d2733" font-weight="bold">scale factor k = 1 / cos φ</text>
