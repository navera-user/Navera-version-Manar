<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#1d2733"/></marker>
  </defs>
  <rect width="640" height="340" fill="#f7fafc"/>
  <text x="16" y="24" fill="#1d2733" font-weight="bold">Pinhole projection (side view, camera frame)</text>
  <!-- formula box -->
  <rect x="300" y="40" width="326" height="84" rx="8" fill="#ffffff" stroke="#0b6e8a"/>
  <text x="314" y="62" fill="#1d2733" font-weight="bold">u = f · X / Z + cx</text>
  <text x="474" y="62" fill="#1d2733" font-weight="bold">v = f · Y / Z + cy</text>
  <text x="314" y="86" fill="#1d2733">matrix form:  λ · [u, v, 1]ᵀ = K · X_c</text>
  <text x="314" y="108" fill="#1d2733">camera coordinates:  X_c = R_wcᵀ (X_world − C)</text>
  <!-- optical axis -->
  <line x1="80" y1="160" x2="610" y2="160" stroke="#1d2733" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="500" y="152" fill="#1d2733">z (optical axis)</text>
  <!-- y axis (down) -->
  <line x1="80" y1="160" x2="80" y2="226" stroke="#1d2733" marker-end="url(#ar)"/>
  <text x="88" y="226" fill="#1d2733">y (down)</text>
  <!-- camera centre -->
  <circle cx="80" cy="160" r="6" fill="#d64545"/>
  <text x="22" y="140" fill="#d64545" font-weight="bold">C</text>
  <text x="16" y="182" fill="#d64545" font-size="12">camera</text>
  <text x="16" y="196" fill="#d64545" font-size="12">centre</text>
  <!-- image plane -->
  <line x1="230" y1="70" x2="230" y2="270" stroke="#0b6e8a" stroke-width="4"/>
  <text x="182" y="62" fill="#0b6e8a">image plane</text>
  <circle cx="230" cy="160" r="4" fill="#0b6e8a"/>
  <text x="238" y="150" fill="#0b6e8a" font-size="12">principal point (cx, cy)</text>
  <!-- world point below the axis (Y > 0) -->
  <line x1="80" y1="160" x2="560" y2="250" stroke="#d64545" stroke-width="1.6"/>
  <circle cx="560" cy="250" r="6" fill="#f08c00"/>
  <text x="470" y="276" fill="#a8680d" font-weight="bold">X_c = (X, Y, Z)</text>
  <line x1="560" y1="164" x2="560" y2="244" stroke="#a8680d" stroke-dasharray="3 3"/>
  <text x="568" y="210" fill="#a8680d">Y</text>
  <circle cx="230" cy="188.1" r="5" fill="#d64545"/>
  <text x="118" y="254" fill="#d64545">image point:</text>
  <text x="118" y="270" fill="#d64545">v − cy = f · Y / Z</text>
  <line x1="200" y1="244" x2="227" y2="194" stroke="#d64545" stroke-width="1"/>
  <!-- f and Z -->
  <line x1="80" y1="296" x2="230" y2="296" stroke="#1d2733" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="120" y="316" fill="#1d2733">f (pixels)</text>
  <line x1="80" y1="324" x2="560" y2="324" stroke="#a8680d" stroke-dasharray="2 4"/>
  <text x="340" y="318" fill="#a8680d">Z (depth, metres)</text>
</svg>
