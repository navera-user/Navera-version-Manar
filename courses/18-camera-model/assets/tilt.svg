<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#1d2733"/></marker>
  </defs>
  <rect width="640" height="360" fill="#f7fafc"/>
  <text x="16" y="24" fill="#1d2733" font-weight="bold">Nose down 20°: the fixed down-camera looks BEHIND the drone (side view)</text>
  <!-- ground -->
  <rect x="0" y="280" width="640" height="80" fill="#cde6c8"/>
  <!-- field of view on the ground -->
  <polygon points="300,70 95.6,280 315.6,280" fill="#f2a33a" fill-opacity="0.22" stroke="#f2a33a" stroke-width="2"/>
  <!-- vertical -->
  <line x1="300" y1="70" x2="300" y2="280" stroke="#1d2733" stroke-dasharray="4 4"/>
  <!-- optical axis -->
  <line x1="300" y1="70" x2="223.6" y2="280" stroke="#d64545" stroke-width="2.2"/>
  <path d="M300 130 A60 60 0 0 1 279.5 126.4" fill="none" stroke="#1d2733" stroke-width="1.4"/>
  <text x="270" y="150" fill="#1d2733">θ</text>
  <!-- drone, pitched nose down (nose to the right) -->
  <g transform="rotate(20 300 64)">
    <rect x="270" y="56" width="60" height="14" rx="4" fill="#1d2733"/>
    <polygon points="330,56 346,63 330,70" fill="#1d2733"/>
    <line x1="262" y1="54" x2="338" y2="54" stroke="#1d2733" stroke-width="3"/>
  </g>
  <circle cx="300" cy="70" r="5" fill="#d64545"/>
  <!-- flight direction -->
  <line x1="380" y1="52" x2="470" y2="52" stroke="#1d2733" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="380" y="44" fill="#1d2733">direction of flight</text>
  <!-- ground points -->
  <circle cx="300" cy="280" r="5" fill="#1d2733"/>
  <circle cx="223.6" cy="280" r="5" fill="#d64545"/>
  <circle cx="95.6" cy="280" r="4" fill="#a8680d"/>
  <circle cx="315.6" cy="280" r="4" fill="#a8680d"/>
  <text x="306" y="300" fill="#1d2733">under the drone</text>
  <text x="150" y="300" fill="#d64545">image centre</text>
  <text x="60" y="300" fill="#a8680d">far edge</text>
  <text x="322" y="272" fill="#a8680d">near edge</text>
  <!-- distances -->
  <line x1="223.6" y1="318" x2="300" y2="318" stroke="#d64545" stroke-width="2"/>
  <text x="150" y="338" fill="#d64545">h · tan θ behind</text>
  <!-- height -->
  <text x="306" y="190" fill="#1d2733">h</text>
  <!-- box -->
  <rect x="366" y="88" width="266" height="168" rx="8" fill="#ffffff" stroke="#7a8794"/>
  <text x="378" y="110" fill="#1d2733" font-weight="bold">h = 120 m, θ = 20°, VFOV 48.5°</text>
  <text x="378" y="132" fill="#1d2733">centre: 120 · tan 20° = 43.7 m</text>
  <text x="378" y="150" fill="#1d2733">behind the drone</text>
  <text x="378" y="172" fill="#1d2733">far: 120 · tan 44.2° = 117 m behind</text>
  <text x="378" y="190" fill="#1d2733">near: 120 · tan 4.2° = 9 m ahead</text>
  <text x="378" y="214" fill="#0b6e8a">each ray:  X = C + λ d</text>
  <text x="378" y="234" fill="#0b6e8a">ground z = 0  ⇒  λ = −h / d_z</text>
</svg>
