<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#1d2733"/></marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#d64545"/></marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#0b6e8a"/></marker>
  </defs>
  <rect width="640" height="330" fill="#f7fafc"/>
  <text x="16" y="24" fill="#1d2733" font-weight="bold">Seen from above: body axes (FLU), camera axes (OpenCV), world axes (ENU)</text>
  <!-- drone, top view, nose up the page -->
  <g transform="translate(170 175)">
    <line x1="-70" y1="-70" x2="70" y2="70" stroke="#7a8794" stroke-width="6"/>
    <line x1="-70" y1="70" x2="70" y2="-70" stroke="#7a8794" stroke-width="6"/>
    <circle cx="-70" cy="-70" r="20" fill="none" stroke="#7a8794" stroke-width="2"/>
    <circle cx="70" cy="-70" r="20" fill="none" stroke="#7a8794" stroke-width="2"/>
    <circle cx="-70" cy="70" r="20" fill="none" stroke="#7a8794" stroke-width="2"/>
    <circle cx="70" cy="70" r="20" fill="none" stroke="#7a8794" stroke-width="2"/>
    <rect x="-22" y="-30" width="44" height="60" rx="8" fill="#ffffff" stroke="#1d2733" stroke-width="2"/>
    <polygon points="-10,-30 10,-30 0,-44" fill="#1d2733"/>
    <!-- body axes -->
    <line x1="0" y1="0" x2="0" y2="-118" stroke="#1d2733" stroke-width="2.2" marker-end="url(#a1)"/>
    <text x="6" y="-110" fill="#1d2733">x body = forward (nose)</text>
    <line x1="0" y1="0" x2="-118" y2="0" stroke="#1d2733" stroke-width="2.2" marker-end="url(#a1)"/>
    <text x="-150" y="-8" fill="#1d2733">y body = left</text>
    <circle cx="0" cy="0" r="7" fill="#ffffff" stroke="#1d2733" stroke-width="2"/>
    <circle cx="0" cy="0" r="2.5" fill="#1d2733"/>
    <text x="-60" y="135" fill="#1d2733">z body = up (out of the page)</text>
    <!-- camera axes -->
    <line x1="0" y1="0" x2="105" y2="0" stroke="#d64545" stroke-width="2.2" marker-end="url(#a2)"/>
    <text x="80" y="-8" fill="#d64545">x cam</text>
    <line x1="0" y1="0" x2="0" y2="105" stroke="#d64545" stroke-width="2.2" marker-end="url(#a2)"/>
    <text x="6" y="100" fill="#d64545">y cam</text>
  </g>
  <!-- legend box -->
  <rect x="346" y="44" width="288" height="176" rx="8" fill="#ffffff" stroke="#7a8794"/>
  <text x="356" y="66" fill="#d64545" font-weight="bold">camera looking straight down</text>
  <text x="356" y="88" fill="#d64545">x cam = image right = body right (−y)</text>
  <text x="356" y="108" fill="#d64545">y cam = image down = body back (−x)</text>
  <text x="356" y="128" fill="#d64545">z cam = optical axis = body down (−z)</text>
  <text x="356" y="154" fill="#1d2733">so the image TOP looks at the nose:</text>
  <text x="356" y="174" fill="#1d2733">R_BODY_NADIR_CAM (its columns are the</text>
  <text x="356" y="192" fill="#1d2733">camera axes in body axes):</text>
  <text x="356" y="210" fill="#1d2733">[[0, −1, 0], [−1, 0, 0], [0, 0, −1]]</text>
  <!-- world axes -->
  <g transform="translate(470 285)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#0b6e8a" stroke-width="2.2" marker-end="url(#a3)"/>
    <text x="74" y="5" fill="#0b6e8a">E (x world)</text>
    <line x1="0" y1="0" x2="0" y2="-50" stroke="#0b6e8a" stroke-width="2.2" marker-end="url(#a3)"/>
    <text x="6" y="-44" fill="#0b6e8a">N (y world)</text>
    <circle cx="0" cy="0" r="6" fill="#ffffff" stroke="#0b6e8a" stroke-width="2"/>
    <circle cx="0" cy="0" r="2" fill="#0b6e8a"/>
    <text x="-150" y="30" fill="#0b6e8a">U = up (out of the page). Here: nose north.</text>
  </g>
</svg>
