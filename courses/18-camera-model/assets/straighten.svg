<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="sans-serif" font-size="13">
  <rect width="640" height="300" fill="#f7fafc"/>
  <text x="16" y="24" fill="#1d2733" font-weight="bold">Same camera centre, two orientations: only the rays turn</text>
  <!-- ground -->
  <rect x="0" y="230" width="330" height="70" fill="#cde6c8"/>
  <!-- tilted camera footprint (orange) -->
  <polygon points="170,60 40,230 205,230" fill="#f2a33a" fill-opacity="0.22" stroke="#f2a33a" stroke-width="2"/>
  <line x1="170" y1="60" x2="114" y2="230" stroke="#d64545" stroke-width="2"/>
  <!-- level camera footprint (blue) -->
  <polygon points="170,60 90,230 250,230" fill="#0b6e8a" fill-opacity="0.10" stroke="#0b6e8a" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="170" y1="60" x2="170" y2="230" stroke="#0b6e8a" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="170" cy="60" r="6" fill="#1d2733"/>
  <text x="182" y="58" fill="#1d2733">C (one centre)</text>
  <circle cx="170" cy="230" r="5" fill="#1d2733"/>
  <text x="176" y="250" fill="#1d2733">under the drone</text>
  <circle cx="114" cy="230" r="5" fill="#d64545"/>
  <text x="40" y="270" fill="#d64545">tilted image centre</text>
  <text x="16" y="292" fill="#1d2733" font-size="12">orange: tilted camera   blue dashes: level camera</text>
  <!-- images -->
  <rect x="360" y="50" width="120" height="68" fill="#ffffff" stroke="#d64545" stroke-width="2"/>
  <text x="360" y="44" fill="#d64545">tilted view</text>
  <polygon points="420,72 432,80 424,92 412,84" fill="#f08c00"/>
  <circle cx="436" cy="62" r="3.5" fill="#1d2733"/>
  <rect x="500" y="50" width="120" height="68" fill="#ffffff" stroke="#0b6e8a" stroke-width="2"/>
  <text x="500" y="44" fill="#0b6e8a">straightened view</text>
  <rect x="540" y="92" width="11" height="11" fill="#f08c00"/>
  <circle cx="560" cy="84" r="3.5" fill="#1d2733"/>
  <line x1="484" y1="84" x2="496" y2="84" stroke="#1d2733" stroke-width="2"/>
  <polygon points="496,79 504,84 496,89" fill="#1d2733"/>
  <rect x="360" y="140" width="262" height="96" rx="8" fill="#ffffff" stroke="#7a8794"/>
  <text x="372" y="164" fill="#1d2733" font-weight="bold">one 3 × 3 matrix H: pixel → pixel</text>
  <text x="372" y="186" fill="#1d2733">no depth needed: a pure rotation</text>
  <text x="372" y="206" fill="#1d2733">black dot (point under the drone)</text>
  <text x="372" y="224" fill="#1d2733">goes to the image centre</text>
</svg>
