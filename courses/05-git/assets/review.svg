<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" font-family="sans-serif" font-size="13">
<rect width="700" height="230" fill="#f7fafc"/>
<text x="350" y="24" text-anchor="middle" font-weight="700" fill="#1d2733">For EACH hunk: four questions. One "no" → reject that hunk.</text>
<rect x="20" y="50" width="120" height="140" rx="8" fill="#ffffff" stroke="#8aa3b8"/>
<text x="80" y="72" text-anchor="middle" font-weight="700" fill="#1d2733">a patch</text>
<rect x="34" y="86" width="92" height="24" rx="4" fill="#d7e3ee"/>
<text x="80" y="102" text-anchor="middle" font-family="monospace" font-size="12" fill="#0b6e8a">@@ hunk 1</text>
<rect x="34" y="118" width="92" height="24" rx="4" fill="#d7e3ee"/>
<text x="80" y="134" text-anchor="middle" font-family="monospace" font-size="12" fill="#0b6e8a">@@ hunk 2</text>
<rect x="34" y="150" width="92" height="24" rx="4" fill="#d7e3ee"/>
<text x="80" y="166" text-anchor="middle" font-family="monospace" font-size="12" fill="#0b6e8a">@@ hunk 3</text>
<rect x="180" y="52" width="345" height="30" rx="6" fill="#fde7c5" stroke="#d6a65c"/>
<text x="192" y="71" font-weight="700" fill="#1d2733">1. as described?</text>
<text x="338" y="71" fill="#4a5866" font-size="12">only that: one concern</text>
<rect x="180" y="88" width="345" height="30" rx="6" fill="#fde7c5" stroke="#d6a65c"/>
<text x="192" y="107" font-weight="700" fill="#1d2733">2. correct?</text>
<text x="338" y="107" fill="#4a5866" font-size="12">tests pass, none removed</text>
<rect x="180" y="124" width="345" height="30" rx="6" fill="#fde7c5" stroke="#d6a65c"/>
<text x="192" y="143" font-weight="700" fill="#1d2733">3. safe?</text>
<text x="338" y="143" fill="#4a5866" font-size="12">a limit weakened? compute it</text>
<rect x="180" y="160" width="345" height="30" rx="6" fill="#fde7c5" stroke="#d6a65c"/>
<text x="192" y="179" font-weight="700" fill="#1d2733">4. measured?</text>
<text x="338" y="179" fill="#4a5866" font-size="12">is the claim measured?</text>
<line x1="140" y1="120" x2="176" y2="120" stroke="#0b6e8a" stroke-width="2"/>
<line x1="525" y1="120" x2="543" y2="120" stroke="#0b6e8a" stroke-width="2"/>
<rect x="545" y="70" width="135" height="40" rx="8" fill="#2e8b57"/><text x="612" y="95" text-anchor="middle" fill="#fff" font-weight="700">all yes: accept</text>
<rect x="545" y="130" width="135" height="40" rx="8" fill="#b0453a"/><text x="612" y="155" text-anchor="middle" fill="#fff" font-weight="700">one no: reject</text>
<text x="350" y="216" text-anchor="middle" fill="#4a5866" font-size="12">Then apply only the accepted hunks (git apply --include), test, and commit them with your own message.</text>
</svg>