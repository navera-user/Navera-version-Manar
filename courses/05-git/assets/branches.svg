<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4a5866"/></marker>
  </defs>
  <rect width="700" height="300" fill="#f7fafc"/>
  <text x="20" y="26" fill="#1d2733" font-weight="bold">History = commits linked to their parent; refs (branches, tags, HEAD) are names pointing at commits</text>
  <!-- commits -->
  <g font-size="11" fill="#ffffff" text-anchor="middle" font-family="monospace">
    <circle cx="90" cy="150" r="30" fill="#8aa3b8"/><text x="90" y="154" font-size="10">b0e06dc</text>
    <circle cx="250" cy="150" r="24" fill="#4e9a44"/><text x="250" y="154">a1</text>
    <circle cx="400" cy="150" r="24" fill="#4e9a44"/><text x="400" y="154">a2</text>
    <circle cx="550" cy="150" r="24" fill="#4e9a44"/><text x="550" y="154">a3</text>
  </g>
  <!-- parent arrows (child -> parent) -->
  <line x1="226" y1="150" x2="124" y2="150" stroke="#4a5866" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="376" y1="150" x2="278" y2="150" stroke="#4a5866" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="526" y1="150" x2="428" y2="150" stroke="#4a5866" stroke-width="2" marker-end="url(#ar)"/>
  <text x="170" y="142" fill="#4a5866" font-size="11" text-anchor="middle">parent</text>
  <!-- commit legend -->
  <g font-size="11" fill="#4a5866">
    <text x="190" y="205">b0e06dc = "NAVERA base" (made by the academy)</text>
    <text x="190" y="221">a1 = your README line,  a2 = GPS log message</text>
    <text x="190" y="237">a3 = the reviewed geo.py change</text>
  </g>
  <!-- refs on base -->
  <rect x="45" y="60" width="90" height="24" rx="5" fill="#fff4d6" stroke="#c99a2e"/>
  <text x="90" y="77" text-anchor="middle" font-family="monospace" fill="#1d2733">tag: base</text>
  <rect x="45" y="222" width="90" height="24" rx="12" fill="#d7e3ee" stroke="#8aa3b8"/>
  <text x="90" y="239" text-anchor="middle" font-family="monospace" fill="#1d2733">work</text>
  <rect x="25" y="260" width="130" height="24" rx="12" fill="#eef1f4" stroke="#8aa3b8" stroke-dasharray="4 3"/>
  <text x="90" y="277" text-anchor="middle" font-family="monospace" fill="#1d2733">base/work</text>
  <line x1="90" y1="84" x2="90" y2="118" stroke="#c99a2e" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="110" y1="222" x2="102" y2="182" stroke="#8aa3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <!-- refs on a3 -->
  <rect x="490" y="60" width="120" height="24" rx="5" fill="#fff4d6" stroke="#c99a2e"/>
  <text x="550" y="77" text-anchor="middle" font-family="monospace" fill="#1d2733">tag: lab5</text>
  <line x1="550" y1="84" x2="550" y2="124" stroke="#c99a2e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="480" y="225" width="140" height="24" rx="12" fill="#cde6c8" stroke="#4e9a44"/>
  <text x="550" y="242" text-anchor="middle" font-family="monospace" fill="#1d2733">my-first-change</text>
  <line x1="550" y1="225" x2="550" y2="176" stroke="#4e9a44" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="630" y="225" width="58" height="24" rx="5" fill="#1d2733"/>
  <text x="659" y="242" text-anchor="middle" font-family="monospace" fill="#ffffff">HEAD</text>
  <line x1="630" y1="237" x2="622" y2="237" stroke="#1d2733" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="250" y="80" fill="#4a5866" font-size="11">a commit's hash = SHA-1 of its content:</text>
  <text x="250" y="96" fill="#4a5866" font-size="11">tree (files) + parent + author + message</text>
  <text x="190" y="277" fill="#4a5866" font-size="11">base/work: remote-tracking branch (the remote "base", as cloned)</text>
</svg>
