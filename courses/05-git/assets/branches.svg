<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" font-family="sans-serif" font-size="13">
  <rect width="700" height="230" fill="#f7fafc"/>
  <!-- base commit -->
  <line x1="120" y1="80" x2="560" y2="80" stroke="#8aa3b8" stroke-width="3" stroke-dasharray="2 6"/>
  <path d="M120 80 C180 80 180 160 240 160" fill="none" stroke="#4e9a44" stroke-width="3"/>
  <circle cx="120" cy="80" r="17" fill="#8aa3b8"/>
  <text x="120" y="84" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">base</text>
  <text x="120" y="44" text-anchor="middle" fill="#1d2733" font-weight="bold">tag: base</text>
  <text x="120" y="58" text-anchor="middle" fill="#4a5866">the copy as you got it</text>
  <rect x="520" y="66" width="150" height="28" rx="14" fill="#d7e3ee" stroke="#8aa3b8"/>
  <text x="595" y="85" text-anchor="middle" font-family="monospace" fill="#1d2733">work</text>
  <text x="595" y="112" text-anchor="middle" fill="#4a5866">(still = base)</text>
  <!-- my-first-change -->
  <line x1="240" y1="160" x2="400" y2="160" stroke="#4e9a44" stroke-width="3"/>
  <circle cx="240" cy="160" r="14" fill="#4e9a44"/>
  <text x="240" y="196" text-anchor="middle" fill="#1d2733">commit 1</text>
