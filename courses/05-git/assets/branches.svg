  <circle cx="400" cy="160" r="14" fill="#4e9a44"/>
  <text x="400" y="196" text-anchor="middle" fill="#1d2733">commit 2</text>
  <text x="400" y="212" text-anchor="middle" fill="#4a5866" font-size="11">GPS log message</text>
  <line x1="414" y1="160" x2="512" y2="160" stroke="#4e9a44" stroke-width="2" stroke-dasharray="4 4"/>
  <rect x="520" y="146" width="150" height="28" rx="14" fill="#cde6c8" stroke="#4e9a44"/>
  <text x="595" y="165" text-anchor="middle" font-family="monospace" fill="#1d2733">my-first-change</text>
  <text x="595" y="192" text-anchor="middle" fill="#4a5866">HEAD: where you are</text>
  <text x="20" y="22" fill="#1d2733" font-weight="bold">A branch is a name that points at the latest commit of a line of work</text>
