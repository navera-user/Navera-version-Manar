<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" font-family="sans-serif" font-size="13">
  <rect width="700" height="270" fill="#f7fafc"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0b6e8a"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d64545"/>
    </marker>
  </defs>
  <!-- three boxes -->
  <rect x="20" y="40" width="190" height="120" rx="10" fill="#fde7c5" stroke="#d6a65c"/>
  <text x="115" y="64" text-anchor="middle" font-weight="bold" fill="#1d2733">working folder</text>
  <text x="115" y="84" text-anchor="middle" fill="#4a5866">~/navera: the files</text>
  <text x="115" y="100" text-anchor="middle" fill="#4a5866">you edit and save</text>
  <text x="115" y="134" text-anchor="middle" font-family="monospace" fill="#a8680d">git status, git diff</text>
  <rect x="255" y="40" width="190" height="120" rx="10" fill="#d7e3ee" stroke="#8aa3b8"/>
  <text x="350" y="64" text-anchor="middle" font-weight="bold" fill="#1d2733">staging area</text>
  <text x="350" y="84" text-anchor="middle" fill="#4a5866">the changes chosen</text>
  <text x="350" y="100" text-anchor="middle" fill="#4a5866">for the next snapshot</text>
  <text x="350" y="134" text-anchor="middle" font-family="monospace" fill="#0b6e8a">git diff --staged</text>
  <rect x="490" y="40" width="190" height="120" rx="10" fill="#cde6c8" stroke="#86b67d"/>
  <text x="585" y="64" text-anchor="middle" font-weight="bold" fill="#1d2733">history (commits)</text>
  <text x="585" y="84" text-anchor="middle" fill="#4a5866">snapshots, kept for ever,</text>
  <text x="585" y="100" text-anchor="middle" fill="#4a5866">each with a message</text>
  <text x="585" y="134" text-anchor="middle" font-family="monospace" fill="#2f6b28">git log</text>
  <!-- forward arrows -->
  <line x1="212" y1="80" x2="252" y2="80" stroke="#0b6e8a" stroke-width="3" marker-end="url(#ar)"/>
  <text x="232" y="30" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#0b6e8a">git add</text>
  <line x1="447" y1="80" x2="487" y2="80" stroke="#0b6e8a" stroke-width="3" marker-end="url(#ar)"/>
  <text x="467" y="30" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#0b6e8a">git commit</text>
  <!-- restore arrow -->
  <path d="M585 162 C585 230 115 230 115 164" fill="none" stroke="#d64545" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ar2)"/>
  <text x="350" y="238" text-anchor="middle" font-family="monospace" font-weight="bold" fill="#d64545">git restore file</text>
  <text x="350" y="258" text-anchor="middle" fill="#d64545">throws away your edits: the file comes back as in the last commit</text>
</svg>
