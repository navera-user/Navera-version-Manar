<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="sans-serif" font-size="13"><rect width="720" height="330" fill="#f7fafc"/><defs><marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d2733"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8680d"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a96a3"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e4f"/></marker></defs><text x="360.0" y="24.0" text-anchor="middle" font-size="15" fill="#1d2733" font-weight="bold">Information adds: each estimate corrects the other where it is weak</text><ellipse cx="150.0" cy="185.0" rx="102.0" ry="20.4" transform="rotate(0.00 150.0 185.0)" stroke="#0b6e8a" fill="#0b6e8a" fill-opacity="0.08" stroke-width="2"/><circle cx="252.0" cy="151.0" r="51.0" stroke="#a8680d" fill="#a8680d" stroke-width="2" fill-opacity="0.08"/><ellipse cx="231.6" cy="180.3" rx="45.6" ry="18.9" transform="rotate(0.00 231.6 180.3)" stroke="#2e9e4f" fill="#2e9e4f" fill-opacity="0.25" stroke-width="2.4"/><circle cx="150.0" cy="185.0" r="4" fill="#0b6e8a"/><circle cx="252.0" cy="151.0" r="4" fill="#a8680d"/><circle cx="231.6" cy="180.3" r="4" fill="#2e9e4f"/><text x="52.0" y="267.4" text-anchor="start" font-size="12" fill="#0b6e8a" font-weight="normal">GPS in a canyon: σ 30 m east, 6 m north</text><text x="252.0" y="92.0" text-anchor="middle" font-size="12" fill="#a8680d" font-weight="normal">vision: σ 15 m</text><text x="309.6" y="182.3" text-anchor="start" font-size="12" fill="#2e9e4f" font-weight="normal">fused: (24.0, 1.4) m,</text><text x="309.6" y="198.3" text-anchor="start" font-size="12" fill="#2e9e4f" font-weight="normal">σ 13.4 m × 5.6 m</text><line x1="430.0" y1="50.0" x2="430.0" y2="318.0" stroke="#8a96a3" stroke-width="1" stroke-dasharray="3 4"/><text x="560.0" y="64.0" text-anchor="middle" font-size="13" fill="#d64545" font-weight="bold">one wrong match at (300, 0) m</text><text x="560.0" y="86.0" text-anchor="middle" font-size="12" fill="#d64545" font-weight="normal">fused without a gate: east = 240 m</text><text x="560.0" y="104.0" text-anchor="middle" font-size="12" fill="#1d2733" font-weight="normal">its d² = 300²/1 125 = 80 → refused</text><text x="560.0" y="122.0" text-anchor="middle" font-size="12" fill="#2e9e4f" font-weight="normal">the good match (30, 10): d² = 1.18 → fused</text><line x1="470.0" y1="220.0" x2="670.0" y2="220.0" stroke="#8a96a3" stroke-width="1"/><line x1="470.0" y1="216.0" x2="470.0" y2="224.0" stroke="#8a96a3" stroke-width="1.2"/><text x="470.0" y="240.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">0</text><line x1="532.0" y1="216.0" x2="532.0" y2="224.0" stroke="#8a96a3" stroke-width="1.2"/><text x="532.0" y="240.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">100</text><line x1="594.0" y1="216.0" x2="594.0" y2="224.0" stroke="#8a96a3" stroke-width="1.2"/><text x="594.0" y="240.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">200</text><line x1="656.0" y1="216.0" x2="656.0" y2="224.0" stroke="#8a96a3" stroke-width="1.2"/><text x="656.0" y="240.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">300 m</text><circle cx="470.0" cy="220.0" r="5" fill="#0b6e8a"/><circle cx="656.0" cy="220.0" r="5" fill="#d64545"/><circle cx="618.8" cy="220.0" r="5" fill="#7a4fb5"/><text x="618.8" y="206.0" text-anchor="middle" font-size="11" fill="#7a4fb5" font-weight="normal">fused (wrong)</text><text x="470.0" y="206.0" text-anchor="middle" font-size="11" fill="#0b6e8a" font-weight="normal">GPS</text><text x="560.0" y="290.0" text-anchor="middle" font-size="13" fill="#1d2733" font-weight="bold">gate first, then fuse</text></svg>
