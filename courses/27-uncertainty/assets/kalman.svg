<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="330" rx="12" fill="#f8fafc"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">One Kalman step: predict (the ellipse grows), gate, update (it shrinks)</text>
  <!-- step k-1 -->
  <ellipse cx="95" cy="190" rx="22" ry="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="95" cy="190" r="3" fill="#1d4ed8"/>
  <text x="95" y="232" text-anchor="middle" fill="#1d4ed8" font-weight="bold">x, P at k−1</text>
  <!-- predict arrow -->
  <line x1="122" y1="190" x2="268" y2="190" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="195" y="160" text-anchor="middle" font-weight="bold">predict</text>
  <text x="195" y="178" text-anchor="middle" font-family="monospace" font-size="12">x = F x</text>
  <text x="195" y="212" text-anchor="middle" font-family="monospace" font-size="12">P = F P Fᵀ + Q</text>
  <!-- predicted -->
  <ellipse cx="350" cy="190" rx="60" ry="36" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="350" cy="190" r="3" fill="#1d4ed8"/>
  <text x="350" y="146" text-anchor="middle" fill="#1d4ed8">predicted (larger)</text>
  <!-- gate ellipse S -->
  <ellipse cx="350" cy="190" rx="98" ry="66" fill="none" stroke="#16a34a" stroke-width="1.5"/>
  <text x="350" y="276" text-anchor="middle" fill="#15803d">gate: νᵀ S⁻¹ ν ≤ χ²₂(0.99) = 9.21</text>
  <text x="350" y="294" text-anchor="middle" fill="#15803d" font-family="monospace" font-size="12">S = H P Hᵀ + R</text>
  <!-- measurement z inside -->
  <circle cx="392" cy="172" r="5" fill="#d97706"/>
  <text x="400" y="168" fill="#b45309">z</text>
  <!-- outlier -->
  <text x="468" y="102" font-size="18" fill="#dc2626" font-weight="bold">✕</text>
  <text x="488" y="98" fill="#dc2626">outlier z′: refused</text>
  <!-- update arrow -->
  <line x1="452" y1="190" x2="578" y2="190" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="515" y="160" text-anchor="middle" font-weight="bold">update</text>
  <text x="515" y="178" text-anchor="middle" font-family="monospace" font-size="12">K = P Hᵀ S⁻¹</text>
  <text x="515" y="212" text-anchor="middle" font-family="monospace" font-size="12">x += K ν</text>
  <text x="515" y="228" text-anchor="middle" font-family="monospace" font-size="12">P = (I − K H) P</text>
  <!-- updated -->
  <ellipse cx="650" cy="190" rx="24" ry="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="650" cy="190" r="3" fill="#1d4ed8"/>
  <text x="650" y="232" text-anchor="middle" fill="#1d4ed8" font-weight="bold">x, P at k</text>
  <text x="650" y="250" text-anchor="middle" fill="#334155" font-size="12">(smaller than both)</text>
  <text x="380" y="316" text-anchor="middle" fill="#334155" font-size="12">No measurement (GPS jammed)? Skip the update: the ellipse keeps growing with Q at every step.</text>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs>
</svg>
