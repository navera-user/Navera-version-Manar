 star (celestial) fix</text><circle cx="595.0" cy="185.0" r="33.0" stroke="#7a4fb5" fill="#7a4fb5" stroke-width="2" fill-opacity="0.08"/><circle cx="520.0" cy="185.0" r="4" fill="#1d2733"/><text x="514.0" y="205.0" text-anchor="end" font-size="11" fill="#1d2733" font-weight="normal">where the drone was</text><circle cx="595.0" cy="185.0" r="5" fill="#d64545"/><line x1="525.0" y1="185.0" x2="589.0" y2="185.0" stroke="#d64545" stroke-width="1.6" marker-end="url(#mr)"/><text x="599.0" y="145.0" text-anchor="start" font-size="11" fill="#7a4fb5" font-weight="normal">the fix, stated by the star</text><text x="599.0" y="159.0" text-anchor="start" font-size="11" fill="#7a4fb5" font-weight="normal">solver as ±55 km (circle)</text><text x="599.0" y="231.0" text-anchor="start" font-size="11" fill="#d64545" font-weight="normal">forwarded as ±300 m:</text><text x="599.0" y="245.0" text-anchor="start" font-size="11" fill="#d64545" font-weight="normal">too small to see here</text><text x="557.5" y="177.0" text-anchor="middle" font-size="11" fill="#d64545" font-weight="normal">125 km</text><text x="560.0" y="294.0" text-anchor="middle" font-size="12" fill="#1d2733" font-weight="normal">it reached the autopilot as ±300 m:</text><text x="560.0" y="312.0" text-anchor="middle" font-size="12" fill="#d64545" font-weight="normal">the autopilot's own position jumped 125 km</text><text x="560.0" y="328.0" text-anchor="middle" font-size="11" fill="#8a96a3" font-weight="normal">(drawn to scale: 0.6 px per km)</text><line x1="380.0" y1="50.0" x2="380.0" y2="330.0" stroke="#8a96a3" stroke-width="1" stroke-dasharray="3 4"/></svg>
