<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="sans-serif" font-size="13"><rect width="820" height="380" fill="#f7fafc"/><defs><marker id="mi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d2733"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6e8a"/></marker><marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8680d"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a96a3"/></marker><marker id="mn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9e4f"/></marker></defs><text x="410.0" y="24.0" text-anchor="middle" font-size="15" fill="#1d2733" font-weight="bold">P = [[12, 5], [5, 6]] m² is an ellipse</text><line x1="20.0" y1="215.0" x2="410.0" y2="215.0" stroke="#8a96a3" stroke-width="1" marker-end="url(#mg)"/><line x1="210.0" y1="365.0" x2="210.0" y2="50.0" stroke="#8a96a3" stroke-width="1" marker-end="url(#mg)"/><text x="402.0" y="233.0" text-anchor="middle" font-size="12" fill="#8a96a3" font-weight="normal">east</text><text x="234.0" y="63.0" text-anchor="middle" font-size="12" fill="#8a96a3" font-weight="normal">north</text><rect x="71.4" y="117.0" width="277.1" height="196.0" fill="none" stroke="#8a96a3" stroke-dasharray="4 4"/><ellipse cx="210.0" cy="215.0" rx="154.0" ry="71.2" transform="rotate(-29.52 210.0 215.0)" stroke="#d64545" fill="#d64545" fill-opacity="0.08" stroke-width="2.2"/><line x1="210.0" y1="215.0" x2="344.0" y2="139.1" stroke="#d64545" stroke-width="2.2" marker-end="url(#mr)"/><line x1="210.0" y1="215.0" x2="174.9" y2="153.0" stroke="#0b6e8a" stroke-width="2.2" marker-end="url(#mb)"/><text x="354.0" y="135.1" text-anchor="start" font-size="13" fill="#d64545" font-weight="normal">a = √λ₁ = 3.85 m</text><text x="164.9" y="147.0" text-anchor="end" font-size="13" fill="#0b6e8a" font-weight="normal">b = √λ₂ = 1.78 m</text><path d="M255.0 215.0 A45 45 0 0 0 249.2 192.8" fill="none" stroke="#1d2733"/><text x="268.0" y="205.0" text-anchor="start" font-size="12" fill="#1d2733" font-weight="normal">θ = 29.5°</text><line x1="210.0" y1="218.0" x2="348.6" y2="218.0" stroke="#a8680d" stroke-width="2.4"/><text x="279.3" y="235.0" text-anchor="middle" font-size="12" fill="#a8680d" font-weight="normal">σE = √12 = 3.46 m</text><text x="530.0" y="90.0" text-anchor="start" font-size="12" fill="#1d2733" font-weight="normal">λ = (a + c)/2 ± √(((a − c)/2)² + b²)</text><text x="530.0" y="116.0" text-anchor="start" font-size="12" fill="#1d2733" font-weight="normal">   = 9 ± √(3² + 5²) = 14.83 and 3.17</text><text x="530.0" y="142.0" text-anchor="start" font-size="12" fill="#1d2733" font-weight="normal">θ = ½·atan2(2b, a − c) = ½·atan2(10, 6)</text><text x="530.0" y="168.0" text-anchor="start" font-size="12" fill="#1d2733" font-weight="normal">   = 29.5° north of east</text><text x="530.0" y="194.0" text-anchor="start" font-size="12" fill="#1d2733" font-weight="normal"></text><text x="530.0" y="220.0" text-anchor="start" font-size="12" fill="#a8680d" font-weight="normal">the judge's σ = √max(a, c) = 3.46 m</text><text x="530.0" y="246.0" text-anchor="start" font-size="12" fill="#d64545" font-weight="normal">the long axis = 3.85 m (at most √2 more)</text><text x="530.0" y="272.0" text-anchor="start" font-size="12" fill="#8a96a3" font-weight="normal">dashed box: ±σE, ±σN — the diagonal only</text></svg>
