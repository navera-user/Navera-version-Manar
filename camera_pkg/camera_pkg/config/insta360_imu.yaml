insta360_imu:
  ros__parameters:
    # live: the camera over USB (Android mode; not while the field server holds it)
    # replay: a field raw recording (<test>/raw folder, or one raw360_NNNN.bin file)
    source: "replay"
    replay_path: ""
    replay_rate: 1.0          # 1 = real time, 0 = as fast as possible (pacing only)
    replay_clock: "now"       # now: the recording shifted to start now; recorded: its original times
    replay_loop: false
    exit_at_end: true

    topic: "/navera/sensors/insta360/imu"
    # A frame aligned with the VEHICLE body (x forward, y left, z up) at the camera: the values
    # are already rotated by the mount below.
    frame_id: "insta360_imu_link"

    # Camera IMU axes along body x, y, z. Camera IMU frame: +x up when the camera stands,
    # +y the LEFT fisheye circle's optical axis, +z = x cross y.
    #   "+y,+z,+x"  standing, left circle forward (default)
    #   "-y,-z,+x"  standing, right circle forward
    #   "+x,+y,+z"  the camera axes are the body axes
    mount_axes: "+y,+z,+x"
    # small trim after the axis mapping (deg, ROS fixed-axis, body frame)
    mount_roll_deg: 0.0
    mount_pitch_deg: 0.0
    mount_yaw_deg: 0.0

    decimation: 5             # 500 Hz records averaged by 5 -> 100 Hz
    bias_at_rest: true        # re-measure the gyro bias whenever the camera is at rest
    calibration_file: ""      # "" = NAVERA_INSTA360_IMU or ~/.navera_sim/insta360_usb_imu.json

    # per-sample (500 Hz) noise measured at rest 2026-10-20 (worst axis); the covariances are
    # these squared / decimation
    gyro_sample_std_dps: 0.085
    accel_sample_std_g: 0.002
