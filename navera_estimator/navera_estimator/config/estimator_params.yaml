estimator_node:
  ros__parameters:
    # How often the arbiter re-evaluates its inputs and publishes nav_status.
    # Decision runs on THIS clock, not on message arrival, so a source going
    # silent is caught within one tick instead of never.
    publish_rate_hz: 5.0

    # GPS estimate is "fresh"/"alive" only if its header.stamp is younger than
    # this. 3.0 s tolerates 2-3 dropped frames at the MEASURED 1.0 Hz GPS rate
    # (ros2 topic hz /navera/sensors/gps_fix = 1.000 Hz, std 0.148 s).
    gps_timeout_s: 3.0

    # IMU liveness window. The IMU contributes NO position in v1 (contributing
    # is always false); this only decides whether it is reported alive.
    imu_timeout_s: 1.0

    # Vision / celestial freshness windows (starting points, to be measured
    # under the real frame cadence of each pipeline).
    day_timeout_s: 3.0
    night_timeout_s: 5.0
    cn_timeout_s: 45.0

    # A header stamp more than this far in the FUTURE is refused (clock stepped
    # back, or a producer on another clock): its age cannot be trusted.
    future_tolerance_s: 0.5

    # While the active source stays usable, a higher-priority source must be
    # continuously usable this long before it takes over (anti-flapping).
    switch_holdoff_s: 2.0

    # GPS kinematic plausibility gate (anti-jump / anti-spoofing). A GPS fix
    # farther from the last trusted fix than max_speed_mps x elapsed +
    # gps_jump_margin_m is refused until it becomes reachable. Set per vehicle
    # with NAVERA_MAX_SPEED_KMH in /etc/navera/navera.env (km/h, overrides this).
    max_speed_mps: 100.0
    gps_jump_margin_m: 50.0

    # FIX (green) requires a known covariance whose horizontal sigma is at most
    # this; a larger stated uncertainty (e.g. GPS HDOP 20) is DEGRADED.
    fix_max_sigma_m: 25.0
