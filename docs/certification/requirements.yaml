# NAVERA — system requirements (machine-readable source of docs/certification/REQUIREMENTS.md
# and of the traceability matrix generated by navera_tools/trace_matrix.py).
#
# Each requirement:
#   id        NAV-<category>-<nn>, never reused
#   title     short name;   text: the requirement ("NAVERA shall ...")
#   code      where it is implemented: path::Symbol (function, Class.method, module name,
#             shell function, unit key) — checked by the script
#   tests     explicit test units (path::test_name, or path for a script test)
#   match     regular expressions; every test unit whose "path::name" + docstring / failure
#             labels match is traced (case-insensitive)
#   evidence  what has been measured or shown, at which level, and where it is written down.
#             Numbers are copied from the cited document, never improved. `against: true` marks
#             evidence that contradicts or limits the requirement (it never raises the level).
#   status    verified-<level> | partial | open | not-implemented
#   note      one line (gaps)
#
# Evidence levels — weakest to strongest. A level says WHAT KIND of data the evidence used:
levels:
  A: analysis / code inspection only
  UT: automated software test (unit / integration, scripted inputs)
  SIM: simulator or ArduPilot SITL (simulated world, simulated or rendered sensors)
  BENCH: NAVERA hardware on a bench (Jetson, real Insta360 filming a screen, real clock), not on a vehicle
  PUB: public real data from another system (UAV-VisLoc drone flights, aerial frames of another source)
  HW: real NAVERA hardware in its operating role (sensor on the box, power-cycle reboot)
  FLT: NAVERA on a moving vehicle (flight / drive) — none yet

categories:
  FUN: Functional
  PERF: Performance (measured numbers only)
  SAF: Safety
  OFF: Offline operation
  IF: Interfaces (MAVLink, NMEA, ROS, operator)
  TIM: Timing
  DEP: Deployment and robustness

# deployment checks that count as test units (scripts, header comment = what they check)
extra_tests:
  - deploy/verify_units.py
  - deploy/stage_check.sh

requirements:

# ───────────────────────────── Functional ─────────────────────────────
- id: NAV-FUN-01
  category: FUN
  title: 'Single-winner source arbitration'
  text: 'NAVERA shall publish one position at a time on /navera/position, chosen by the fixed priority GPS > day vision > night vision > celestial among the sources currently eligible, with a 2 s hold-off before a recovering higher-priority source takes over and an immediate switch when the active source is lost.'
  code:
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._select
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._tick
  match:
    - 'test_estimator\.py::<script>'
  evidence:
    - {level: UT, value: 'flapping GPS (0.5 s): one source switch in 8 s; GPS loss → day vision immediately', ref: 'VALIDATION_STATUS.md, Robustness'}
    - {level: SIM, value: 'drone/boat/robot missions with GPS jam, spoof, camera failure (QA campaign 2026-09-30)', ref: 'ENGINEERING_BACKLOG.md §7'}
  status: verified-SIM

- id: NAV-FUN-02
  category: FUN
  title: 'Typed position contract and eligibility'
  text: 'Every source shall publish navera_msgs/PositionEstimate on /navera/estimate/<source>; only valid MEASURED or PROPAGATED estimates that are fresh, finite and in range shall be eligible; HELD and REPLAYED estimates shall never win.'
  code:
    - navera_estimator/navera_estimator/nodes/estimator_node.py::_ELIGIBLE_MODES
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._eval_source
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._sane
  match:
    - 'test_estimator\.py::<script>'
    - 'test_prior\.py::test_only_valid_measured_finite'
  evidence:
    - {level: UT, value: 'NaN position marked valid refused; MODE_REPLAYED refused (sensor_sim --mode replayed)', ref: 'VALIDATION_STATUS.md, Robustness; LOC-21'}
  status: verified-UT

- id: NAV-FUN-03
  category: FUN
  title: 'Navigation state FIX / DEGRADED / NO_FIX'
  text: 'NAVERA shall report FIX only for a fresh measured position whose stated horizontal sigma (long axis) is known and ≤ 25 m; DEGRADED for an unknown or larger sigma, a propagated position, or a GPS in doubt; NO_FIX when no source is usable — never an old position re-sent as current.'
  code:
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._classify
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._stated_sigma
    - navera_common/navera_common/covariance.py::horizontal_sigma
  match:
    - 'test_estimator\.py::<script>'
    - 'test_estimator_rules\.py::test_stated_sigma_is_the_long_axis'
    - 'test_ros_gps\.py::test_(unknown_accuracy|a_zero_or_undefined)'
  evidence:
    - {level: UT, value: 'GPS 40 m sigma → DEGRADED; all-zero / undefined / non-PSD covariance → DEGRADED or refused', ref: 'VALIDATION_STATUS.md, Robustness'}
  status: verified-UT

- id: NAV-FUN-04
  category: FUN
  title: 'Each measurement published once'
  text: 'The arbiter shall publish each winning measurement once (never the same estimate re-stamped at every tick) and shall decide on arrival of an estimate as well as on its 5 Hz tick.'
  code:
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._publish_position
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._note_rx
  match:
    - 'one estimate (is )?published'
  evidence:
    - {level: UT, value: 'one measurement published once (was re-published at 5 Hz, EST-1)', ref: 'VALIDATION_STATUS.md, Robustness'}
    - {level: SIM, value: 'ArduPilot "GPS not healthy" from doubled/dropped messages fixed (OUT-5, EST-13)', ref: 'ENGINEERING_BACKLOG.md §6'}
  status: verified-SIM

- id: NAV-FUN-05
  category: FUN
  title: 'Day vision — local matching around a prior'
  text: 'Day vision shall locate a frame by local feature matching against the satellite map within a search circle around its prior (last vetted GPS, its own track, or the operator start area), shall not search the whole map by default, and shall report no position outside the prepared area.'
  code:
    - day_pkg/day_pkg/local_matcher.py::LocalMatcher.locate
    - day_pkg/day_pkg/nodes/day_subscriber.py::DaySubscriber._spatial_window
    - day_pkg/day_pkg/learned_matcher.py
  match:
    - 'test_local_matcher\.py::test_(finds_the_frame_centre|outside_the_area|gpu_and_cpu|gpu_matching_in_blocks)'
    - 'test_day_rank\.py::'
    - 'test_learned_level\.py::'
  evidence:
    - {level: PUB, value: '33 aerial frames (other source): SIFT 27/33, DISK+LightGlue 29/33 accepted (≥ 8 inliers), 0 wrong, median 3.3–3.6 m', ref: 'VALIDATION_STATUS.md, Local feature matching (re-measured 2026-10-20)'}
    - {level: BENCH, value: 'Insta360 filming a screen, imagery 2–3 years older than the map: median 3.6–7.3 m by terrain, GPS lost', ref: 'VALIDATION_STATUS.md, screen bench campaign 4'}
  status: verified-BENCH
  note: 'never measured with NAVERA''s camera on a vehicle'

- id: NAV-FUN-06
  category: FUN
  title: 'Day vision refuses rather than guesses'
  text: 'Day vision shall publish no position (rather than a wrong one) for a frame whose fitted scale disagrees with the altitude (±15 %), with too few inliers, over uniform ground, a uniform / unusable frame, or a prior whose circle does not contain the frame.'
  code:
    - day_pkg/day_pkg/local_matcher.py::LocalMatcher._locate_once
    - day_pkg/day_pkg/nodes/day_subscriber.py::DaySubscriber._check_local_fix
    - day_pkg/day_pkg/image_quality.py::sharpness
  match:
    - 'test_local_matcher\.py::test_(wrong_altitude|prior_elsewhere|uniform_ground|retry_features)'
    - 'test_image_quality\.py::'
    - 'test_vision_nav\.py::test_(weak_fix_far|a_strong_fix_far|an_impossible_jump|inliers_on_a_strip)'
  evidence:
    - {level: PUB, value: '0 wrong (> 50 m) accepted on the 33-frame benchmark with the scale check (1 wrong at 1097 m without it)', ref: 'VALIDATION_STATUS.md, Local feature matching'}
    - {level: SIM, value: 'stress test all conditions: wrong accepted fixes 25 → 0 (F13)', ref: 'problems doc F13'}
  status: verified-PUB

- id: NAV-FUN-07
  category: FUN
  title: 'Day vision bounded dead-reckoning between matches'
  text: 'Between matches day vision shall carry its last measured position along the measured track (IMU heading change), published PROPAGATED with a stated sigma that grows with time, for at most max_dead_reckon_s (120 s node default) / 300 m sigma, then stop.'
  code:
    - day_pkg/day_pkg/vision_nav.py::VisionNavigator.predict
    - day_pkg/day_pkg/nodes/day_subscriber.py::DaySubscriber._dead_reckon
    - navera_common/navera_common/track.py::TrackVelocity.propagate
  match:
    - 'test_vision_nav\.py::test_(straight_gap|turn_is_followed|a_turn_grows|a_full_lap|no_velocity_chord|velocity_from_before)'
    - 'test_dead_reckon_sigma\.py::'
    - 'test_track\.py::'
    - 'test_gyro_heading\.py::'
  evidence:
    - {level: SIM, value: 'land route: error median 10 m, max 33 m; 90 s over sea stating ±300 m, true error ≤ 146 m', ref: 'VALIDATION_STATUS.md, Dead-reckoning'}
    - {level: SIM, value: '1606 replayed outages: 100 % within 3σ; 60 s sigma 628 m vs 15 m real (conservative, D16)', ref: 'problems doc D16'}
  status: verified-SIM
  note: 'no real IMU, no real camera; not inertial navigation (NAV-FUN-21)'

- id: NAV-FUN-08
  category: FUN
  title: 'Day pose–attitude guard (VL-1)'
  text: 'Day vision shall use the pose-refined position only when the fitted camera tilt agrees with the attitude-expected tilt within pose_tilt_guard_deg (4°), else publish the frame centre.'
  code:
    - day_pkg/day_pkg/local_matcher.py::refine_with_pose
    - day_pkg/day_pkg/nodes/day_subscriber.py::DaySubscriber._expected_tilt
  match:
    - 'test_pose_tilt_guard\.py::'
  evidence:
    - {level: PUB, value: 'UAV-VisLoc 8 flights, 2599 fixes: > 100 m 70 → 1 (bench artefact); within 3σ 0.999 (30 m floor) / 0.993 (self-cal)', ref: 'VALIDATION_STATUS.md, Day: real drone flights'}
  status: verified-PUB

- id: NAV-FUN-09
  category: FUN
  title: 'Night vision query normalisation'
  text: 'Night vision shall resample each thermal frame to the map resolution from altitude and camera_hfov_deg, turn it north-up with the heading, and refuse frames whose footprint covers < 85 % of the reference.'
  code:
    - night_pkg/night_pkg/nodes/night_localizer.py::normalize_query
    - night_pkg/night_pkg/nodes/night_localizer.py::image_valid_mask
  match:
    - 'test_query_scale\.py::'
    - 'test_thermal_input\.py::'
    - 'test_contrast\.py::'
    - 'test_sthn_geometry\.py::'
  evidence:
    - {level: SIM, value: 'synthetic frames 250–600 m: 8–13 m median (unscaled: 11–263 m)', ref: 'VALIDATION_STATUS.md, Night vision'}
  status: verified-SIM
  note: 'no real thermal imagery (B4, B14, D23)'

- id: NAV-FUN-10
  category: FUN
  title: 'Night wrong-fix rejection'
  text: 'Night vision shall keep a fix only if a re-run from a search centre 150 m away agrees within 25 m and the map warped into the frame correlates with it (gradient NCC ≥ 0.05).'
  code:
    - night_pkg/night_pkg/nodes/night_localizer.py::NightLocalizer._recheck
    - night_pkg/night_pkg/nodes/night_localizer.py::verify_match
    - night_pkg/night_pkg/nodes/night_localizer.py::featureless_mask
  match:
    - 'test_map_check\.py::'
    - 'test_featureless\.py::'
    - 'test_retry\.py::'
    - 'test_fix_sigma\.py::test_(floor_at_400|grows_with_height)'
  evidence:
    - {level: SIM, value: 'conditions stress test: wrong accepts 228/1272 → 0 (1 at 55 m with 10° heading error); stated sigma 100 % within 3σ', ref: 'VALIDATION_STATUS.md, conditions stress test'}
  status: verified-SIM
  note: 'thresholds set on synthetic frames only'

- id: NAV-FUN-11
  category: FUN
  title: 'Night track gate and re-acquisition'
  text: 'Night vision shall refuse a fix implying a speed above max_speed_mps from the last measured fix, and a single wrong fix shall not lock the track (B16, D22).'
  code:
    - night_pkg/night_pkg/nodes/night_tracker.py::NightTracker.gate
    - night_pkg/night_pkg/nodes/night_tracker.py::NightTracker.offer
  match:
    - 'test_night_tracker\.py::'
  evidence:
    - {level: SIM, value: 'track bench: long GPS loss, clouds, injected wrong fixes (B16 fix 133fdb2)', ref: 'docs/test_reports/night_2026-10-19.md'}
  status: verified-SIM

- id: NAV-FUN-12
  category: FUN
  title: 'Celestial position — unambiguous or none'
  text: 'Celestial navigation shall compute both latitude solutions, choose the one consistent with the prior, and report no position when the prior cannot decide or no camera attitude (''up'') is available.'
  code:
    - cn_pkg/cn_pkg/nodes/celestial_math.py::observer_candidates
    - cn_pkg/cn_pkg/nodes/celestial_math.py::choose_candidate
    - cn_pkg/cn_pkg/allsky_locator.py
  match:
    - 'test_celestial_math\.py::'
    - 'test_allsky360\.py::test_(no_up_no_fix|up_)'
    - 'test_attitude\.py::'
  evidence:
    - {level: UT, value: '20 000 random pointings: 0 wrong, 1–2 % ambiguous', ref: 'VALIDATION_STATUS.md, Celestial'}
    - {level: SIM, value: 'perfect attitude 5.5–6.5 km; BNO085-class IMU 24–119 km', ref: 'VALIDATION_STATUS.md, Celestial'}
    - {level: BENCH, value: 'real 360 camera, star field on a screen: 23/27 right (0.4–9 km), 4 wrong identifications caught by the gate', ref: 'problems doc F10'}
  status: verified-BENCH
  note: 'no real night sky with known time/place/attitude yet'

- id: NAV-FUN-13
  category: FUN
  title: 'Celestial star-identification quality gate'
  text: 'An all-sky solution shall be accepted only with ≥ 7 matched stars, rms ≤ 0.2°, chance probability ≤ 1e-6 and lens agreement within 1° (or the tighter third tier p ≤ 1e-2 and rms ≤ 0.10°).'
  code:
    - cn_pkg/cn_pkg/allsky.py::accept
    - cn_pkg/cn_pkg/star_detect.py
  match:
    - 'test_allsky_gate\.py::'
    - 'test_allsky360\.py::test_sim_junk_is_refused'
    - 'test_star_detect\.py::'
  evidence:
    - {level: SIM, value: 'junk frames: 14/24 accepted before the gate, 0/24 after', ref: 'problems doc F11'}
    - {level: BENCH, value: 'real screen campaign re-judged: right 71 → 80 of 87, wrong 0', ref: 'problems doc F26'}
  status: verified-BENCH

- id: NAV-FUN-14
  category: FUN
  title: 'Frames straightened with the attitude at exposure'
  text: 'The camera chain shall straighten each frame to a nadir view with the attitude interpolated at its exposure instant, and mark unusable a frame too tilted, turning faster than the rate limit (fixed camera), or without attitude for a fixed camera.'
  code:
    - navera_common/navera_common/frame_builder.py::FrameBuilder.build
    - navera_common/navera_common/sensor_history.py::History
    - camera_pkg/camera_pkg/nodes/live_camera.py::LiveCamera._check_tilt
  match:
    - 'test_frame_builder\.py::'
    - 'test_camera_model\.py::'
    - 'test_sensor_history\.py::'
  evidence:
    - {level: SIM, value: '33 places, tilts ≤ 12°, IMU bias 0.3°/1.5°: 33/33 within 2.6 m (median 1.1 m); unstraightened median 28 m', ref: 'VALIDATION_STATUS.md, Real camera chain in simulation'}
    - {level: BENCH, value: 'real Insta360 attitude vs dot grid: 0.6° median after the 1.5 s stamp correction (F15)', ref: 'problems doc F15'}
  status: verified-BENCH

- id: NAV-FUN-15
  category: FUN
  title: 'Image / metadata pairing by frame id'
  text: 'Each localizer shall pair an image with its metadata by frame id (never "latest of each"), acknowledge a frame whose image is missing, and bound its pending buffer.'
  code:
    - navera_common/navera_common/pairing.py::FramePairer
  match:
    - 'test_pairing\.py::'
  evidence:
    - {level: UT, value: 'lost image / lost meta does not shift later frames (LOC-15)'}
  status: verified-UT

- id: NAV-FUN-16
  category: FUN
  title: 'Height above ground management'
  text: 'NAVERA shall estimate the height above ground from GPS minus the ground at power-on (or the configured site elevation), the vehicle barometer / rangefinder when available, and image scale, holding the last height with a growing sigma after GPS loss.'
  code:
    - navera_common/navera_common/altitude.py::AltitudeEstimator
  match:
    - 'test_altitude\.py::'
    - 'test_vision_nav\.py::test_(heights_are_retried|height_follows|the_climb|a_wide_re_acquisition)'
  evidence:
    - {level: SIM, value: 'night mission with vehicle barometer after GPS loss: 10 m median', ref: 'VALIDATION_STATUS.md, summary'}
  status: verified-SIM

- id: NAV-FUN-17
  category: FUN
  title: 'Start without GPS (operator start area)'
  text: 'Without a GPS fix at start, NAVERA shall accept an operator start position on /mission as a search area for day vision only, never as a published position.'
  code:
    - day_pkg/day_pkg/nodes/day_subscriber.py::DaySubscriber.on_operator_position
  evidence:
    - {level: BENCH, value: 'accepted, a bad latitude refused, a vision node started later receives it (latched) — verified end to end on the Jetson', ref: 'VALIDATION_STATUS.md, limitation 9 (D11 acceptance)'}
  status: verified-BENCH
  note: 'no automated regression test; not tested in flight'

- id: NAV-FUN-18
  category: FUN
  title: 'Hardware discovery'
  text: 'navera-discover shall find the connected GPS receiver, autopilot, IMU, clock, ROS vehicle and cameras for settings left to "auto", never override a written setting, never take NAVERA''s own output back as a GPS, and never block the boot.'
  code:
    - navera_common/navera_common/discovery.py::decide
    - navera_common/navera_common/discovery.py::discover
    - deploy/systemd/navera_boot_discover.sh
  match:
    - 'test_discovery\.py::'
    - 'sitl_discovery\.py'
  evidence:
    - {level: SIM, value: 'ArduPilot SITL: autopilot found, GPS_TYPE2 1 used, 14 refused', ref: 'ARDUPILOT_INTEGRATION.md §7'}
  status: verified-SIM

- id: NAV-FUN-19
  category: FUN
  title: 'IMU attitude and true heading'
  text: 'The IMU driver shall publish attitude, rates and accelerations in the vehicle frame (mounting rotation applied) with a true heading (World Magnetic Model declination at the vehicle position).'
  code:
    - imu_pkg/imu_pkg/orientation.py
    - imu_pkg/imu_pkg/nodes/imu_node.py::IMUNode.publish_imu
  match:
    - 'test_orientation\.py::'
    - 'test_imu_node\.py::test_(declination|world_magnetic)'
  evidence:
    - {level: HW, value: 'BNO085 verified live on the Jetson 2026-07-13: orientation, rates, accelerations at 50 Hz (no values kept)', ref: 'VALIDATION_STATUS.md, Hardware results'}
  status: partial
  note: 'heading reference not checked against a known heading (IMU-3); covariances are datasheet values'

- id: NAV-FUN-20
  category: FUN
  title: 'Inertial dead-reckoning (FEAT-2)'
  text: 'NAVERA shall integrate the IMU into a position with a growing sigma to bridge vision gaps (sea, uniform ground, night without thermal).'
  evidence:
    - {level: A, value: 'not implemented: the IMU is used for attitude, heading change and liveness only', ref: 'ENGINEERING_BACKLOG.md FEAT-2; problems doc D5'}
  status: not-implemented

# ───────────────────────────── Performance (measured numbers only) ─────────────────────────────
- id: NAV-PERF-01
  category: PERF
  title: 'Day vision accuracy — real drone imagery'
  text: 'Measured: on 8 real UAV-VisLoc flights (2599 accepted fixes, product code with the VL-1 guard) day vision error median 16.0 m, p90 34 m, max 119 m, 1 fix > 100 m (eval artefact). Target for NAVERA camera on a vehicle: to be set from the first recorded flight.'
  code:
    - day_pkg/day_pkg/local_matcher.py::refine_with_pose
  tests:
    - day_pkg/test/test_pose_tilt_guard.py::test_pose_tilt_far_from_the_attitude_keeps_the_frame_centre
  evidence:
    - {level: PUB, value: 'median 16.0 / p90 34 / max 119 m; acceptance 6–92 % per flight', ref: 'VALIDATION_STATUS.md, Day: real drone flights'}
  status: verified-PUB
  note: 'not NAVERA''s camera; maps newer than the photos by up to 7 years'

- id: NAV-PERF-02
  category: PERF
  title: 'Day vision accuracy — NAVERA camera, screen bench'
  text: 'Measured with the Insta360 filming a screen (other-date imagery, GPS lost): output error median 3.6–5.5 m on land terrains, p95 9–20 m (farm fields 110 m), coast 7.3 m median with 51.6 % availability.'
  evidence:
    - {level: BENCH, value: 'campaign 4 table; 18 min city run no drift; wind/shake 12–20 m median with 2–7 wrong fixes per run (F20)', ref: 'VALIDATION_STATUS.md, screen bench; problems doc F20'}
  status: verified-BENCH
  note: 'flat screen — no relief, vibration or real blur'

- id: NAV-PERF-03
  category: PERF
  title: 'Night vision accuracy (synthetic)'
  text: 'Measured on synthetic grey renders of the map: 8–13 m median at 250–600 m; mission simulator 400 m: median 6 m, p90 11 m, max 37 m.'
  evidence:
    - {level: SIM, value: '8–13 m median; 6/11/37 m in mission', ref: 'VALIDATION_STATUS.md, Night vision'}
    - {level: BENCH, against: true, value: 'real Insta360 night screen bench: every frame failed the map check (F24)', ref: 'problems doc F24'}
  status: verified-SIM
  note: 'no real LWIR data — accuracy on real thermal unknown'

- id: NAV-PERF-04
  category: PERF
  title: 'Celestial accuracy (coarse fix)'
  text: 'Measured: 5.5–6.5 km with a perfect attitude, 24–119 km with a BNO085-class IMU (simulation); real 360 camera on a screen 0.4–9 km on 23/27 cases. Celestial positions shall be stated with their sigma and never forwarded to an autopilot (> max_forward_sigma_m).'
  code:
    - cn_pkg/cn_pkg/nodes/cn_subscriber.py::CNSubscriber._sigma_m
  match:
    - 'test_allsky360\.py::test_(node_publishes_allsky_fix_with_sigma|sim_tilt_learned)'
    - 'star_camera_e2e\.py'
  evidence:
    - {level: SIM, value: '24–119 km (IMU-bounded), 100 % within stated sigma in simulated night mission', ref: 'VALIDATION_STATUS.md, Celestial'}
    - {level: BENCH, value: '23/27 right, 0.4–9 km (F10)', ref: 'problems doc F10'}
  status: verified-BENCH

- id: NAV-PERF-05
  category: PERF
  title: 'Processing time per frame (Jetson Orin Nano)'
  text: 'Measured on the Jetson: day DISK+LightGlue 0.35 s/frame at 300 m and 0.77 s at 1500 m (coarser map level); SIFT product module 0.11 s (GPU); STHN ~225 ms per inference on an idle GPU, ~450–570 ms per frame with the re-check on a shared CPU.'
  match:
    - 'test_learned_level\.py::'
  evidence:
    - {level: BENCH, value: 'D14 (13.9 → 0.77 s at 1500 m); STHN GPU 225 ms', ref: 'problems doc D14; VALIDATION_STATUS.md'}
  status: verified-BENCH
  note: 'no TensorRT; times grow when other jobs share the GPU'

- id: NAV-PERF-06
  category: PERF
  title: 'Memory envelope (8 GB shared)'
  text: 'One vision pipeline at a time shall fit the 8 GB Jetson with the rest of the stack; measured: learned day matcher RSS 3.7 GB at 1500 m (was 4.5–5.2 GB); a 30 min day run reached 3.5 GB and was OOM-killed without swap, completed with a 16 GB swap file (F5).'
  code:
    - deploy/systemd/navera-pipeline-day.service::Conflicts
  tests:
    - deploy/verify_units.py
  evidence:
    - {level: BENCH, value: 'D14: learned matcher 3.7 GB RSS at 1500 m', ref: 'problems doc D14'}
    - {level: BENCH, against: true, value: 'F5: OOM kill at 4.6 min without swap (completed with a 16 GB swap file)', ref: 'problems doc F5'}
  status: open
  note: 'swap not installed by deploy/install.sh; no OOM protection (OOMScoreAdjust) in the units'

- id: NAV-PERF-07
  category: PERF
  title: 'Honest stated accuracy'
  text: 'The sigma published with every non-GPS position shall cover its true error — target ≥ 99 % of accepted fixes within 3 σ. Measured — day (self-calibrated / 30 m floor) 0.993 / 0.999 on 8 real flights; night 100 % (synthetic); celestial 100 % (simulation).'
  code:
    - day_pkg/day_pkg/fix_sigma.py::SigmaCalibration
    - day_pkg/day_pkg/fix_sigma.py::day_fix_sigma_m
    - night_pkg/night_pkg/nodes/night_localizer.py::fix_sigma_m
  match:
    - 'test_day_fix_sigma\.py::'
    - 'test_fix_sigma_rollback\.py::'
    - 'test_evaluate_session\.py'
  evidence:
    - {level: PUB, value: 'model alone 0.65–0.71 (unsafe); self-cal + floor + guard 0.993 / 0.999', ref: 'VALIDATION_STATUS.md, verdict on the stated sigma'}
  status: verified-PUB
  note: 'VL-2 — flights that match rarely never self-calibrate (30 m floor)'

- id: NAV-PERF-08
  category: PERF
  title: 'GPS spoof detection thresholds'
  text: 'Measured: sudden jumps beyond max_speed refused within 1 s (SITL boat, 2 km); slow drift 4 m/s refused at ~140 m (simulator); 3 m/s at ~60–72 m with the growth test (replay of real bench vision); false refusals 0 over 79 + 29 real-camera runs and 7.2 h of UAV-VisLoc with a good GPS.'
  code:
    - navera_common/navera_common/gps_crosscheck.py::GpsDriftTrend
  match:
    - 'test_gps_crosscheck\.py::'
  evidence:
    - {level: SIM, value: '2 km spoof refused within 1 s; 4 m/s drift at ~140 m', ref: 'VALIDATION_STATUS.md, Autopilot in the loop'}
    - {level: BENCH, value: 'replay of 108 real-camera runs: 0 false refusals; 3 m/s refused ~72 m (30 m σ floor)', ref: 'VALIDATION_STATUS.md, Robustness'}
  status: verified-BENCH
  note: 'needs an independent source with a stated sigma (D1: none over sea / desert)'

# ───────────────────────────── Safety ─────────────────────────────
- id: NAV-SAF-01
  category: SAF
  title: 'GPS kinematic jump gate'
  text: 'A GPS fix farther from the last trusted fix than max_speed_mps × elapsed + gps_jump_margin_m, or a steady drag beyond max speed over gps_jump_window_s, shall be refused.'
  code:
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._check_gps_plausibility
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._window_drag
  match:
    - 'test_estimator_rules\.py::test_(a_steady_drag|a_vehicle_at_max_speed)'
    - 'test_estimator\.py::<script>'
  evidence:
    - {level: UT, value: '5 km jump refused; 145 m/s drag refused at the 2nd fix, 99 m/s vehicle never refused (D2)', ref: 'VALIDATION_STATUS.md; problems doc D2'}
    - {level: SIM, value: 'boat, 2 km spoof refused within 1 s', ref: 'VALIDATION_STATUS.md, Autopilot in the loop'}
  status: verified-SIM

- id: NAV-SAF-02
  category: SAF
  title: 'Refused or returning GPS needs independent agreement'
  text: 'A refused GPS, and a GPS returning after an outage, shall be accepted only when it agrees with a fresh independent source of stated accuracy (2 distinct fixes within 3 σ); without such a source it falls back to reachability (documented weakness).'
  code:
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._independent_reference
    - navera_common/navera_common/gps_crosscheck.py::GpsCrossCheck.back_to_baseline
  match:
    - 'test_estimator\.py::<script>'
    - 'test_estimator_rules\.py::test_a_growth_refusal_holds'
  evidence:
    - {level: SIM, value: 'jam 30 s then 2 km spoof 30 s: refused throughout, true GPS re-accepted 3 s after it returns', ref: 'VALIDATION_STATUS.md, Autopilot in the loop'}
  status: verified-SIM

- id: NAV-SAF-03
  category: SAF
  title: 'Gradual spoof detection and "GPS in doubt"'
  text: 'A trusted GPS shall be marked in doubt (DEGRADED, sigma no better than the gap, ≤ 500 m) after 2 fixes in a row beyond 3 σ of the independent source, and refused after 5 distinct fixes beyond 3 σ, 2 beyond 5 σ + 50 m over 3 s, or a steady growth of the offset (growth test).'
  code:
    - navera_common/navera_common/gps_crosscheck.py::GpsCrossCheck.update
    - navera_common/navera_common/gps_crosscheck.py::GpsDriftTrend.add
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._drifting_away
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._in_doubt
  match:
    - 'test_gps_crosscheck\.py::'
    - 'test_estimator_rules\.py::test_a_slow_gps_spoof'
  evidence:
    - {level: SIM, value: 'gimbal camera, GPS pulled at 4 m/s: refused at ~140 m, NAVERA error median 15 m, max 143 m', ref: 'VALIDATION_STATUS.md, limitation 7'}
    - {level: BENCH, value: 'real-camera replay: 0 false refusals (F22 fixed)', ref: 'problems doc F22'}
  status: verified-BENCH
  note: 'undetected where vision has no match (D1)'

- id: NAV-SAF-04
  category: SAF
  title: 'A good GPS is not refused for noisy vision'
  text: 'The cross-check shall not refuse a GPS on one or two noisy / wrong vision fixes; a growth inside the stated sigma shall never refuse.'
  code:
    - navera_common/navera_common/gps_crosscheck.py::GpsCrossCheck
  match:
    - 'test_gps_crosscheck\.py::test_(two_noisy|a_good_gps|a_growth_inside|a_run_of_wrong|one_fix_counts)'
    - 'test_estimator_rules\.py::test_a_good_gps_is_not_refused'
    - 'single wrong vision fix'
  evidence:
    - {level: BENCH, value: '79 real-campaign runs: false refusals 6 → 0', ref: 'problems doc F22'}
    - {level: PUB, value: 'UAV-VisLoc 7.2 h with a good GPS: 0 false refusals', ref: 'VALIDATION_STATUS.md, Robustness'}
  status: verified-PUB

- id: NAV-SAF-05
  category: SAF
  title: 'Clock and timestamp integrity'
  text: 'A message stamped more than future_tolerance_s (0.5 s) ahead shall be refused and never come back to life; the clock node shall report valid only for a UTC, powered, non-drifting DS3231; celestial shall solve only on a trusted time (NAV-SAF-20).'
  code:
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._eval_source
    - rtc_pkg/rtc_pkg/nodes/rtc_node.py::RTCNode.publish_rtc
  match:
    - 'test_estimator_rules\.py::test_a_fix_that_arrived_from_the_future'
    - 'test_rtc_node\.py::'
    - 'future stamp'
    - 'test_sensor_history\.py::test_a_clock_step_back'
  evidence:
    - {level: HW, value: 'DS3231 power-cycle reboot 2026-07-14: valid, lost_power false, drift −0.148 s vs NTP', ref: 'CLAUDE.md §8'}
    - {level: BENCH, against: true, value: 'F27 (2026-10-21): no DS3231 on bus 1 of the field Jetson — booted 16 h off until NTP', ref: 'problems doc F27'}
  status: partial
  note: 'a box can still lack the DS3231 (F27): RTC mandatory in the install (O-16/O-17); GPS_INPUT / NMEA time still from the system clock'

- id: NAV-SAF-06
  category: SAF
  title: 'Covariance sanity'
  text: 'A covariance that is non-finite, negative, asymmetric or not positive semi-definite (horizontal block, unit-consistent tolerance) shall not be used; the stated horizontal sigma shall be the long axis of the ellipse.'
  code:
    - navera_common/navera_common/covariance.py::covariance_sane
    - navera_common/navera_common/covariance.py::horizontal_sigma
  match:
    - 'test_covariance\.py::'
  evidence:
    - {level: UT, value: 'B7 / B13 fixed (1c4b14a)', ref: 'problems doc B7, B13'}
  status: verified-UT

- id: NAV-SAF-07
  category: SAF
  title: 'Degraded positions withheld from the autopilot by default'
  text: 'A DEGRADED position shall be sent to the autopilot only when the integrator enables forward_degraded with a stated degraded_sigma_m; the sent sigma shall never be better than the source states; positions coarser than max_forward_sigma_m (1 km) shall never be sent.'
  code:
    - navera_output/navera_output/policy.py::decide
    - navera_output/navera_output/policy.py::Config.validate
  match:
    - 'test_output\.py::test_(degraded|forwarded_accuracy|a_forwarded_sigma_above|everything_else|fix_is_sent|a_degraded_position_needs)'
  evidence:
    - {level: SIM, value: 'celestial ±55 km moved a SITL autopilot 125 km before the 1 km ceiling (QAS-2)', ref: 'ENGINEERING_BACKLOG.md §7'}
  status: verified-SIM

- id: NAV-SAF-08
  category: SAF
  title: 'Vision never moves the vehicle''s height'
  text: 'Only a GNSS position may carry an altitude in GPS_INPUT; vision / celestial positions shall be sent with IGNORE_ALT. The integration guide shall forbid EK3_SRC1_POSZ = 3 and EK3_OGN_HGT_MASK.'
  code:
    - navera_output/navera_output/mavlink_out.py::gps_input_fields
  match:
    - 'test_output\.py::test_gps_input_(never_carries|no_fix_and_unknown)'
    - 'sitl_f7_height\.py'
  evidence:
    - {level: SIM, value: 'ArduCopter 4.5.7 SITL: EKF height = baro within 0.1 m in every phase with POSZ=1; POSZ=3 → 431 m off in 20 s', ref: 'ARDUPILOT_INTEGRATION.md §3 (F7)'}
  status: verified-SIM
  note: 'NAVERA cannot read or enforce the autopilot''s EK3 parameters (hazard H-11)'

- id: NAV-SAF-09
  category: SAF
  title: 'No stale or future measurement sent as current'
  text: 'The output shall not send a measurement older than max_measurement_age_s (5 s) or stamped in the future; a vision position shall be carried to the present along the measured ground velocity with its sigma grown by the lag (or by max speed × age without a velocity).'
  code:
    - navera_output/navera_output/policy.py::decide
  match:
    - 'test_output\.py::test_(old_measurements|a_vision_position_is_carried)'
  evidence:
    - {level: SIM, value: 'plane 40 m/s: output error median 83 m before (0 % within sigma); now carried; 1.5 s old photo at 40 m/s moved 60 m, stated ±31.5 m', ref: 'VALIDATION_STATUS.md, positions carried to the present'}
  status: verified-SIM

- id: NAV-SAF-10
  category: SAF
  title: 'Bounded gap bridging'
  text: 'A gap in forwarded vision positions shall be bridged from 2.5 s, once a second, for at most bridge_max_s (10 s) and only while the grown sigma ≤ max_forward_sigma_m; a GPS fix is never bridged.'
  code:
    - navera_output/navera_output/policy.py::bridge
    - navera_output/navera_output/policy.py::hold
  match:
    - 'test_bridge_flow\.py::'
    - 'test_output\.py::test_(a_bridge|a_bridged|nothing_is_bridged|bridge_settings|the_soft_no_fix)'
  evidence:
    - {level: SIM, value: 'F8: a 5 s NO FIX gap landed the drone; bridge added (3f0cce8)', ref: 'problems doc F8'}
  status: verified-SIM

- id: NAV-SAF-11
  category: SAF
  title: 'Drift alarm on coarse forwarded positions'
  text: 'When the vehicle is given an estimated position coarser than drift_alarm_sigma_m (100 m), the output node shall raise a drift alarm every 5 s.'
  code:
    - navera_output/navera_output/nodes/vehicle_output_node.py::VehicleOutputNode._tick
  evidence:
    - {level: A, value: 'implemented e535f62 (F1/F6); log only, not on the operator view', ref: 'git log e535f62'}
  status: open
  note: 'no automated test of the alarm'

- id: NAV-SAF-12
  category: SAF
  title: 'NMEA carries no vision position by default'
  text: 'An estimated (vision) position shall go out over NMEA as "no fix" unless NAVERA_NMEA_FORWARD_DEGRADED is set (then GGA quality 6 / RMC mode E).'
  code:
    - navera_output/navera_output/policy.py::for_nmea
    - navera_output/navera_output/nmea.py::gga
  match:
    - 'test_output\.py::test_(a_vision_position_never_goes_out_over_nmea|estimated_is_quality_6|no_fix_sentences)'
  evidence:
    - {level: UT, value: 'ArduPilot fuses NMEA with its own 0.5 m noise (source read)', ref: 'ARDUPILOT_INTEGRATION.md §4'}
  status: verified-UT

- id: NAV-SAF-13
  category: SAF
  title: 'Frozen sensor data detected'
  text: 'Identical consecutive IMU samples (1 s at 50 Hz) shall be reported frozen and the sensor reinitialised; a frozen attitude stream shall stop frames from being straightened with it.'
  code:
    - navera_common/navera_common/health.py::FrozenSampleDetector
    - imu_pkg/imu_pkg/nodes/imu_node.py::IMUNode.publish_imu
    - camera_pkg/camera_pkg/nodes/live_camera.py::LiveCamera._on_imu
  match:
    - 'test_health\.py::'
    - 'test_imu_node\.py::test_(noisy_data|reconnect)'
  evidence:
    - {level: UT, value: 'IMU-1 / IMU-2 fixed (8050227)'}
  status: verified-UT
  note: 'frozen camera IMAGES: NAV-SAF-19'

- id: NAV-SAF-14
  category: SAF
  title: 'Camera loss ends in a restart, not a silent stall'
  text: 'When the camera cannot be opened or stops delivering frames (> 50 failed grabs), the live camera node shall exit so systemd restarts the pipeline; while no frame is localized the vision source goes stale and the arbiter stops using it.'
  code:
    - camera_pkg/camera_pkg/nodes/live_camera.py::LiveCamera._grab_loop
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._eval_source
  match:
    - 'test_live_camera\.py'
    - 'test_gst_capture\.py::test_a_bad_pipeline'
  evidence:
    - {level: SIM, value: 'GPS jammed + camera failed → NO FIX → autopilot failsafe (LAND / HOLD)', ref: 'VALIDATION_STATUS.md, Autopilot in the loop'}
  status: verified-SIM

- id: NAV-SAF-15
  category: SAF
  title: 'One arbiter per ROS network'
  text: 'A second arbiter on the same ROS network shall be detected and reported.'
  code:
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._check_single_arbiter
  evidence:
    - {level: SIM, value: 'EST-10 (555b851); R-12 orphan estimator in the simulator', ref: 'ENGINEERING_BACKLOG.md'}
  status: partial
  note: 'no automated test'

- id: NAV-SAF-16
  category: SAF
  title: 'Operator control is authenticated and locked in flight'
  text: 'Every control action on the web interface shall require the token (none = read-only), refuse cross-site and malformed requests, lock an address out after 5 wrong codes in 60 s, and refuse restarts / map generation while armed, moving > 1.5 m/s or navigating without GPS.'
  code:
    - simulation_web/simulation_web/web_common.py::BridgeHandler.read_control_json
    - simulation_web/simulation_web/web_common.py::_CodeGuard
    - simulation_web/simulation_web/mission_prep.py::in_flight_refusal
  match:
    - 'test_web_common\.py::'
    - 'test_mission_prep\.py::test_(wrong_codes|services_are_not_restarted|a_forged|a_line_break|bad_settings|settings_are_validated)'
  evidence:
    - {level: UT, value: '401 / 415 / 400; 429 after 5 wrong codes', ref: 'VALIDATION_STATUS.md, Robustness'}
  status: verified-UT

- id: NAV-SAF-17
  category: SAF
  title: 'Simulation tools cannot feed a live box'
  text: 'Every tool that publishes simulated data on NAVERA topics shall refuse to run without NAVERA_ALLOW_SIM=1, and simulated positions shall be marked on the operator view.'
  code:
    - navera_tools/navera_fakes.py
    - navera_tools/sensor_sim.py
    - deploy/stage/fake_vehicle_gps.py
  match:
    - 'test_operator_sim\.py::'
  evidence:
    - {level: UT, value: 'operator view marks simulation (red banner)'}
  status: verified-UT

- id: NAV-SAF-18
  category: SAF
  title: 'Vehicle configuration validated at start'
  text: 'Vehicle settings (maximum speed, IMU, camera mount) shall be validated at node start and a wrong value shall stop the node with its reason; check_box shall flag a bad integrator configuration (shared serial port, forwarded sigma above 100 m, NMEA forwarding).'
  code:
    - navera_common/navera_common/vehicle.py::max_speed_params
    - navera_tools/check_box.py::config_findings
  match:
    - 'test_vehicle\.py::'
    - 'test_check_box_config\.py'
    - 'test_params\.py::'
  evidence:
    - {level: UT, value: 'R-1: one NAVERA_MAX_SPEED_KMH feeds estimator and both vision gates'}
  status: verified-UT

- id: NAV-SAF-19
  category: SAF
  title: 'A frozen camera picture never produces a position'
  text: 'The live camera shall mark a frame unusable ("camera image frozen") when its time does not advance, its picture is identical to the previous one, or nearly identical while the IMU / GPS say the vehicle moved; day, night and celestial shall publish no position for it; the freeze shall be reported on <ns>/camera_health, a camera device frozen longer than frozen_restart_s (20 s) shall exit for a restart, and the first new picture shall end the freeze.'
  code:
    - navera_common/navera_common/health.py::FrozenFrameDetector
    - camera_pkg/camera_pkg/nodes/live_camera.py::LiveCamera._check_frozen
    - camera_pkg/camera_pkg/nodes/live_camera.py::LiveCamera._moved
    - cn_pkg/cn_pkg/nodes/cn_subscriber.py::CNSubscriber._process_frame
  tests:
    - navera_tools/tests/test_live_camera_frozen.py
  match:
    - 'test_health\.py::test_(a_camera_delivering|an_identical_picture|a_frame_whose_time|a_nearly_identical)'
    - 'test_cn_gates\.py::test_a_frozen_star_picture'
  evidence:
    - {level: UT, value: 'live_camera on a ROS camera: frozen pictures and an old-stamp frame published unusable with the reason, camera_health frozen, recovery on the first new picture (problems log D24, hazard H-01b)'}
  status: verified-UT
  note: 'not yet seen on a real stuck driver / RTSP stall; the localizers rely on the frame_meta usable flag (day and night already honour it)'

- id: NAV-SAF-20
  category: SAF
  title: 'Celestial solves only on a trusted time'
  text: 'cn_subscriber (geoloc and allsky360 modes) shall solve a live frame only on a trusted time: the exposure on the system clock vouched for by the DS3231 (rtc_time within 5 s and rtc_status valid, not lost_power), a GNSS time received within gnss_time_max_age_s (300 s) or NTP synchronisation, with no wall-clock step (wall minus monotonic > 1 s) since that evidence and none in the last 60 s; otherwise it shall publish no position with the reason "no trusted time: ...". gps_node shall publish the receiver UTC (RMC status A) on /navera/sensors/gnss_time.'
  code:
    - navera_common/navera_common/trusted_time.py::TrustedClock
    - cn_pkg/cn_pkg/nodes/cn_subscriber.py::CNSubscriber._utc_for
    - cn_pkg/cn_pkg/nodes/cn_subscriber.py::CNSubscriber._utc_now
    - gps_pkg/gps_pkg/nodes/gps_node.py::rmc_utc_epoch
    - gps_pkg/gps_pkg/nodes/gps_node.py::GPSNode._publish_time
  match:
    - 'test_trusted_time\.py::'
    - 'test_cn_gates\.py::test_(no_star_solve|an_rtc_that_lost|a_valid_rtc|gnss_time_vouches|a_stated_time|allsky360_mode)'
    - 'test_gnss_time\.py::'
  evidence:
    - {level: UT, value: 'no RTC / GNSS time / NTP → no solve; RTC lost_power → no solve; RTC 2 h ahead of the system clock → exposure solved on the RTC time; +1 h wall-clock step → no solve (same rule as the field server, db2f95c)'}
    - {level: BENCH, against: true, value: 'F27 (2026-10-21): the field Jetson had no DS3231 and booted 16 h off — the gate now refuses instead of solving thousands of km off', ref: 'problems doc F27'}
  status: verified-UT
  note: 'GNSS time is as trustworthy as the GNSS (a spoofer controls it too); not yet run on the box with the DS3231 removed'

# ───────────────────────────── Offline ─────────────────────────────
- id: NAV-OFF-01
  category: OFF
  title: 'No network needed in flight'
  text: 'Everything NAVERA uses in flight (map, route maps, models, star catalogue, Earth-orientation table, web assets) shall be on the box before departure; nothing shall be downloaded at run time.'
  code:
    - cn_pkg/cn_pkg/nodes/celestial_math.py::configure_offline_iers
    - deploy/install.sh
  match:
    - 'test_allsky360\.py::test_(catalogue_is_never_downloaded|bundled_catalogue)'
    - 'test_celestial_math\.py::test_times_past_the_iers_table'
    - 'test_prepare_area\.py::test_missing_tiles_are_downloaded'
  evidence:
    - {level: BENCH, value: 'celestial reproduced offline (unshare -rn): IERSRangeError before, offline = online result after (B3)', ref: 'problems doc B3'}
    - {level: A, value: 'dashboard without CDN (WEB-3); DISK/LightGlue weights fetched by install.sh into TORCH_HOME'}
  status: partial
  note: 'no end-to-end offline boot test of the whole stack (network namespace) yet'

- id: NAV-OFF-02
  category: OFF
  title: 'Route maps prepared before departure'
  text: 'The mission page shall prepare the route corridor (≤ 10 km great-circle legs, ±1 km) from the onboard map and downloaded tiles before departure, report missing coverage, and refuse an unprepared route.'
  code:
    - day_pkg/day_pkg/prepare_area.py
    - simulation_web/simulation_web/mission_prep.py::AreaJobs.plan
  match:
    - 'test_prepare_area\.py::'
    - 'test_mission_prep\.py::test_(plan_generate|area_id|terrain_of|generate_refusal|named_missions|waypoints|plan_file|bad_mission)'
  evidence:
    - {level: SIM, value: 'Paris → Tunisia 1768 km: 79 775 tiles in 105 min, 980 MB', ref: 'VALIDATION_STATUS.md, Long route'}
  status: verified-SIM
  note: 'imagery licence for offline commercial use still required (DEP-11)'

- id: NAV-OFF-03
  category: OFF
  title: 'Boot without network'
  text: 'No NAVERA unit shall depend on network-online; all nodes talk over loopback DDS (ROS_LOCALHOST_ONLY=1, isolated domain 42 unless a vehicle domain is discovered).'
  code:
    - deploy/systemd/navera_boot_lib.sh::navera_env
    - deploy/systemd/navera-estimator.service::After
  tests:
    - deploy/verify_units.py
  evidence:
    - {level: A, value: 'DEP-9 removed network-online.target; verify_units checks the units'}
  status: verified-UT

# ───────────────────────────── Interfaces ─────────────────────────────
- id: NAV-IF-01
  category: IF
  title: 'MAVLink GPS_INPUT output'
  text: 'NAVERA shall send MAVLink GPS_INPUT (gps_id 0, GPS week time of the measurement, 3D fix flag for vision with IGNORE_ALT, horizontal accuracy, velocity only with a GPS position) to an ArduPilot autopilot (GPS_TYPE 14).'
  code:
    - navera_output/navera_output/mavlink_out.py::gps_input_fields
    - navera_output/navera_output/mavlink_out.py::gps_week_time
  match:
    - 'test_output\.py::test_gps_(input|week|velocity)'
    - 'test_output\.py::test_no_velocity'
    - 'sitl_ardupilot\.py'
    - 'test_vehicle_output\.py'
  evidence:
    - {level: SIM, value: 'ArduCopter 4.5.7 SITL: 3D fix at the NAVERA position, fix lost after NAVERA no fix', ref: 'ARDUPILOT_INTEGRATION.md §3'}
  status: verified-SIM
  note: 'no real autopilot connected; PX4 ignores GPS_INPUT (D7)'

- id: NAV-IF-02
  category: IF
  title: 'NMEA GGA / RMC output'
  text: 'NAVERA shall emit checksummed GGA and RMC sentences at the measurement time, GGA quality 1 for a GNSS fix and 6 / RMC mode E for an estimated position, "no fix" sentences carrying no position.'
  code:
    - navera_output/navera_output/nmea.py::gga
    - navera_output/navera_output/nmea.py::rmc
    - navera_output/navera_output/nmea.py::checksum
  match:
    - 'test_output\.py::test_(gga_rmc|minute_rounding|estimated_is_quality_6|no_fix_sentences)'
  evidence:
    - {level: SIM, value: 'ArduPilot SITL NMEA input (GPS_TYPE 5, SERIAL3) passed', ref: 'ARDUPILOT_INTEGRATION.md §4'}
  status: verified-SIM

- id: NAV-IF-03
  category: IF
  title: 'Serial NMEA GPS input'
  text: 'The GPS driver shall verify NMEA checksums, reject GGA quality 6/7/8, report ellipsoidal altitude, keep an unknown HDOP unknown, and exit (code 1) when its port vanishes.'
  code:
    - gps_pkg/gps_pkg/nodes/gps_node.py::GPSNode._publish_fix
    - gps_pkg/gps_pkg/nodes/gps_node.py::GPSNode._read_loop
  match:
    - 'test_gps_serial\.py'
  evidence:
    - {level: UT, value: 'pseudo-terminal: checksum, quality, port loss exit 1'}
    - {level: HW, value: 'u-blox NEO-M8N on /dev/ttyTHS1 gave a valid fix (project report 2026-06-02; replayed through gps_node)', ref: 'VALIDATION_STATUS.md, Hardware results'}
  status: partial
  note: 'the real receiver was not run through today''s gps_node live'

- id: NAV-IF-04
  category: IF
  title: 'ROS / vehicle GPS input'
  text: 'A vehicle GPS given as a NavSatFix topic (or the autopilot''s GPS2_RAW via the vehicle link) shall become NAVERA''s GPS source with its stated accuracy; no fix or (0,0) is invalid, a missing accuracy stays unknown.'
  code:
    - gps_pkg/gps_pkg/nodes/ros_gps_node.py::estimate_from_fix
  match:
    - 'test_ros_gps\.py::'
  tests:
    - deploy/stage_check.sh
  evidence:
    - {level: UT, value: 'stage check 2026-10-21: ros_gps_node fed by a simulated vehicle GPS in the staged stack', ref: 'docs/certification/DEPLOYMENT_VALIDATION.md'}
  status: verified-UT

- id: NAV-IF-05
  category: IF
  title: 'Vehicle link (autopilot → NAVERA)'
  text: 'The vehicle link shall read attitude (50 Hz), height, rangefinder and the second GPS from an ArduPilot autopilot, requesting its own message intervals, ignoring non-autopilot heartbeats, and relaying NAVERA''s output on the same port.'
  code:
    - navera_output/navera_output/nodes/vehicle_link_node.py::VehicleLink._handle
    - navera_output/navera_output/mavlink_in.py
  match:
    - 'test_mavlink_in\.py::'
    - 'test_vehicle_link\.py::'
    - 'sitl_vehicle_link\.py'
  evidence:
    - {level: SIM, value: 'SITL: attitude, height above home and rangefinder agree with autopilot and simulator', ref: 'ARDUPILOT_INTEGRATION.md §6'}
  status: verified-SIM

- id: NAV-IF-06
  category: IF
  title: 'MAVLink address format'
  text: 'Every MAVLink address shall use one format (serial:/dev/x:baud, udpin, udpout, tcp); a malformed one shall be refused at start; NAVERA_MAVLINK_URL=off disables the output.'
  code:
    - navera_output/navera_output/mavlink_url.py
  match:
    - 'test_mavlink_url\.py::'
  status: verified-UT

- id: NAV-IF-07
  category: IF
  title: 'Operator view and ROS fix output'
  text: 'The web bridge shall serve the operator view offline with the source, state, stated accuracy and camera warnings, mark simulated data, never show an expired position; /navera/fix shall carry service 0 for non-GPS positions.'
  code:
    - simulation_web/simulation_web/scripts/navera_web_bridge.py
    - navera_output/navera_output/nodes/vehicle_output_node.py::VehicleOutputNode._navsatfix
  match:
    - 'test_operator_sim\.py::'
    - 'test_web_common\.py::test_(static_stays|https|mbtiles|parse_tile|valid_latlon)'
  evidence:
    - {level: UT, value: 'stage check: /health answers 200 on the staged bridge', ref: 'docs/certification/DEPLOYMENT_VALIDATION.md'}
  status: verified-UT

# ───────────────────────────── Timing ─────────────────────────────
- id: NAV-TIM-01
  category: TIM
  title: 'Source freshness windows'
  text: 'A source shall be used only while its last measurement is younger than its window: GPS 3 s, day 3 s, night 5 s, celestial 45 s, IMU liveness 1 s (estimator defaults).'
  code:
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._age_s
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._measured_at
  match:
    - 'test_estimator\.py::<script>'
  evidence:
    - {level: A, value: 'estimator_node.py declares day_timeout_s 3.0; VALIDATION_STATUS.md says "day-vision freshness window is 5 s" — doc / code mismatch to resolve', ref: 'estimator_node.py:168; VALIDATION_STATUS.md'}
  status: partial
  note: 'celestial 45 s window "to be measured under real cadence"'

- id: NAV-TIM-02
  category: TIM
  title: 'Camera latency compensation'
  text: 'Each frame shall be stamped at its exposure (grab time − NAVERA_CAMERA_LATENCY_S), and the latency may be calibrated online against GPS on a turning track, frozen when GPS is not trusted.'
  code:
    - navera_common/navera_common/latency_cal.py::LatencyCalibrator
    - camera_pkg/camera_pkg/nodes/live_camera.py::LiveCamera._grab_loop
  match:
    - 'test_latency_cal\.py::'
    - 'test_latency_hook\.py::'
  evidence:
    - {level: BENCH, value: 'Insta360 USB 360 stream 1.71 s delay: uncompensated 39.8 m at 80 m/s, compensated 3.3 m (F9); webcam 0.14 s', ref: 'problems doc F9'}
  status: verified-BENCH

- id: NAV-TIM-03
  category: TIM
  title: 'Output latency to the autopilot'
  text: 'Positions shall be sent on arrival (no polling), stamped with the measurement instant (GPS) or carried to now (vision); the integrator sets GPS_DELAY_MS to the lowest measured latency.'
  code:
    - navera_output/navera_output/nodes/vehicle_output_node.py::VehicleOutputNode._on_position
  match:
    - 'test_bridge_flow\.py::test_between_two_positions'
  evidence:
    - {level: SIM, value: 'OUT-5: polling dropped / doubled messages, ArduPilot refused to arm; fixed by send on arrival', ref: 'ENGINEERING_BACKLOG.md §6'}
  status: partial
  note: 'GPS_DELAY_MS recommendation not verified; end-to-end latency on the box not measured'

# ───────────────────────────── Deployment ─────────────────────────────
- id: NAV-DEP-01
  category: DEP
  title: 'Automatic start and restart'
  text: 'Every NAVERA unit shall start at boot without a login, restart 10 s after any exit (Restart=always, StartLimitIntervalSec=0) because ros2 launch exits 0 when a node dies, and a driver without its device shall idle instead of restart-looping.'
  code:
    - deploy/systemd/navera-estimator.service::Restart
    - deploy/systemd/navera_boot_lib.sh::navera_env
    - deploy/systemd/navera_boot_imu.sh
  tests:
    - deploy/verify_units.py
    - deploy/stage_check.sh
  evidence:
    - {level: HW, value: 'reboot validation 2026-07-15 (6 units, previous restart mechanism)', ref: 'CLAUDE.md §8'}
    - {level: UT, value: 'staged user units 2026-10-21: killed estimator and GPS nodes restarted by systemd, check_boot PASS again', ref: 'docs/certification/DEPLOYMENT_VALIDATION.md'}
  status: partial
  note: 'DEP-14 — reboot of a deployed unit with today''s mechanism still to do (commands in DEPLOYMENT_VALIDATION.md)'

- id: NAV-DEP-02
  category: DEP
  title: 'Missing data disk does not start a half-blind pipeline'
  text: 'A vision pipeline shall not start while its map / weights are missing (data disk not mounted): the wrapper exits and systemd retries every 10 s; the box still boots (nofail).'
  code:
    - deploy/systemd/navera_boot_lib.sh::navera_require
  evidence:
    - {level: A, value: 'navera_require checks each path; deploy/README.md §3.10'}
  status: partial
  note: 'no automated test with the disk absent'

- id: NAV-DEP-03
  category: DEP
  title: 'Bounded disk use'
  text: 'ROS log folders older than 7 days shall be pruned at every unit start; recordings go to the data disk.'
  code:
    - deploy/systemd/navera_boot_lib.sh::navera_prune_logs
  evidence:
    - {level: A, value: 'DEP-13 (252fa15)'}
  status: open
  note: 'no free-space check or alarm; journald size not configured; no test'

- id: NAV-DEP-04
  category: DEP
  title: 'Reproducible install with least privilege'
  text: 'deploy/install.sh shall install code, build, settings (never overwriting navera.env), wrappers and units in one command, idempotently; the web service may run as root only the exact systemctl restarts in deploy/sudoers/navera-web.'
  code:
    - deploy/install.sh
    - deploy/sudoers/navera-web
  tests:
    - deploy/verify_units.py
    - deploy/stage_check.sh
  evidence:
    - {level: UT, value: 'staged install (--root) + systemd-analyze verify + visudo -c -f: PASS; real-mode dry-run output byte-identical to before the change', ref: 'docs/certification/DEPLOYMENT_VALIDATION.md'}
  status: verified-UT
  note: 'R-8 — the sudoers restart path to verify on an installed box'
