# ───────────────────────────── Safety ─────────────────────────────
- id: NAV-SAF-01
  category: SAF
  title: 'GPS kinematic jump gate'
  text: 'A GPS fix farther from the last trusted fix than max_speed_mps × elapsed + gps_jump_margin_m, or a steady drag beyond max speed over gps_jump_window_s, shall be refused.'
  code:
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._check_gps_plausibility
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._window_drag
  match:
    - 'test_estimator_rules\.py::test_(a_steady_drag|a_vehicle_at_max_speed)'
    - 'test_estimator\.py::<script>'
  evidence:
    - {level: UT, value: '5 km jump refused; 145 m/s drag refused at the 2nd fix, 99 m/s vehicle never refused (D2)', ref: 'VALIDATION_STATUS.md; problems doc D2'}
    - {level: SIM, value: 'boat, 2 km spoof refused within 1 s', ref: 'VALIDATION_STATUS.md, Autopilot in the loop'}
  status: verified-SIM

- id: NAV-SAF-02
  category: SAF
  title: 'Refused or returning GPS needs independent agreement'
  text: 'A refused GPS, and a GPS returning after an outage, shall be accepted only when it agrees with a fresh independent source of stated accuracy (2 distinct fixes within 3 σ); without such a source it falls back to reachability (documented weakness).'
  code:
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._independent_reference
    - navera_common/navera_common/gps_crosscheck.py::GpsCrossCheck.back_to_baseline
  match:
    - 'test_estimator\.py::<script>'
    - 'test_estimator_rules\.py::test_a_growth_refusal_holds'
  evidence:
    - {level: SIM, value: 'jam 30 s then 2 km spoof 30 s: refused throughout, true GPS re-accepted 3 s after it returns', ref: 'VALIDATION_STATUS.md, Autopilot in the loop'}
  status: verified-SIM

- id: NAV-SAF-03
  category: SAF
  title: 'Gradual spoof detection and "GPS in doubt"'
  text: 'A trusted GPS shall be marked in doubt (DEGRADED, sigma no better than the gap, ≤ 500 m) after 2 fixes in a row beyond 3 σ of the independent source, and refused after 5 distinct fixes beyond 3 σ, 2 beyond 5 σ + 50 m over 3 s, or a steady growth of the offset (growth test).'
  code:
    - navera_common/navera_common/gps_crosscheck.py::GpsCrossCheck.update
    - navera_common/navera_common/gps_crosscheck.py::GpsDriftTrend.add
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._drifting_away
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._in_doubt
  match:
    - 'test_gps_crosscheck\.py::'
    - 'test_estimator_rules\.py::test_a_slow_gps_spoof'
  evidence:
    - {level: SIM, value: 'gimbal camera, GPS pulled at 4 m/s: refused at ~140 m, NAVERA error median 15 m, max 143 m', ref: 'VALIDATION_STATUS.md, limitation 7'}
    - {level: BENCH, value: 'real-camera replay: 0 false refusals (F22 fixed)', ref: 'problems doc F22'}
  status: verified-BENCH
  note: 'undetected where vision has no match (D1)'

- id: NAV-SAF-04
  category: SAF
  title: 'A good GPS is not refused for noisy vision'
  text: 'The cross-check shall not refuse a GPS on one or two noisy / wrong vision fixes; a growth inside the stated sigma shall never refuse.'
  code:
    - navera_common/navera_common/gps_crosscheck.py::GpsCrossCheck
  match:
    - 'test_gps_crosscheck\.py::test_(two_noisy|a_good_gps|a_growth_inside|a_run_of_wrong|one_fix_counts)'
    - 'test_estimator_rules\.py::test_a_good_gps_is_not_refused'
    - 'single wrong vision fix'
  evidence:
    - {level: BENCH, value: '79 real-campaign runs: false refusals 6 → 0', ref: 'problems doc F22'}
    - {level: PUB, value: 'UAV-VisLoc 7.2 h with a good GPS: 0 false refusals', ref: 'VALIDATION_STATUS.md, Robustness'}
  status: verified-PUB

- id: NAV-SAF-05
  category: SAF
  title: 'Clock and timestamp integrity'
  text: 'A message stamped more than future_tolerance_s (0.5 s) ahead shall be refused and never come back to life; the clock node shall report valid only for a UTC, powered, non-drifting DS3231; celestial shall solve only on a trusted time (NAV-SAF-20).'
  code:
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._eval_source
    - rtc_pkg/rtc_pkg/nodes/rtc_node.py::RTCNode.publish_rtc
  match:
