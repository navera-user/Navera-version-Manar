  status: verified-SIM

- id: NAV-IF-06
  category: IF
  title: 'MAVLink address format'
  text: 'Every MAVLink address shall use one format (serial:/dev/x:baud, udpin, udpout, tcp); a malformed one shall be refused at start; NAVERA_MAVLINK_URL=off disables the output.'
