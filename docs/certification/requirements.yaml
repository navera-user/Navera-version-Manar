    - {level: UT, value: '180 m estimate at 1 Hz for 10 s: 3 alarms (0, 5, 10 s); bridged 150 m alarms; 60 m / exactly 100 m estimates, GNSS fixes and no-fix never'}
  status: verified-UT
  note: 'log only, not on the operator view'

- id: NAV-SAF-12
  category: SAF
  title: 'NMEA carries no vision position by default'
  text: 'An estimated (vision) position shall go out over NMEA as "no fix" unless NAVERA_NMEA_FORWARD_DEGRADED is set (then GGA quality 6 / RMC mode E).'
  code:
