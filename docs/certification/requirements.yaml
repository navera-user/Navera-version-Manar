  evidence:
    - {level: UT, value: '401 / 415 / 400; 429 after 5 wrong codes', ref: 'VALIDATION_STATUS.md, Robustness'}
  status: verified-UT

- id: NAV-SAF-17
  category: SAF
  title: 'Simulation tools cannot feed a live box'
  text: 'Every tool that publishes simulated data on NAVERA topics shall refuse to run without NAVERA_ALLOW_SIM=1, and simulated positions shall be marked on the operator view.'
