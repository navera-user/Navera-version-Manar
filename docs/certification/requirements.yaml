  status: verified-UT

- id: NAV-SAF-19
  category: SAF
  title: 'A frozen camera picture never produces a position'
  text: 'The live camera shall mark a frame unusable ("camera image frozen") when its time does not advance, its picture is identical to the previous one, or nearly identical while the IMU / GPS say the vehicle moved; day, night and celestial shall publish no position for it; the freeze shall be reported on <ns>/camera_health, a camera device frozen longer than frozen_restart_s (20 s) shall exit for a restart, and the first new picture shall end the freeze.'
  code:
    - navera_common/navera_common/health.py::FrozenFrameDetector
    - camera_pkg/camera_pkg/nodes/live_camera.py::LiveCamera._check_frozen
    - camera_pkg/camera_pkg/nodes/live_camera.py::LiveCamera._moved
    - cn_pkg/cn_pkg/nodes/cn_subscriber.py::CNSubscriber._process_frame
  tests:
    - navera_tools/tests/test_live_camera_frozen.py
  match:
    - 'test_health\.py::test_(a_camera_delivering|an_identical_picture|a_frame_whose_time|a_nearly_identical)'
    - 'test_cn_gates\.py::test_a_frozen_star_picture'
    - 'test_frozen_replay\.py::'
  evidence:
    - {level: PUB, value: 'real flight MARS-LVIG AMvalley03 at 1 Hz (513 frames, 52 with the vehicle still on the ground / in the hover): 0 false freezes; smallest change between real frames while moving 16.2 grey levels (threshold 0.5); an injected driver freeze caught on every frame; a stream re-encoding the stuck picture caught from its 2nd frame (one JPEG re-encode changes it 0.9-3.6 grey levels: the 1st, ~1 s old, passes)', ref: 'navera_common/test/test_frozen_replay.py'}
    - {level: UT, value: 'live_camera on a ROS camera: frozen pictures and an old-stamp frame published unusable with the reason, camera_health frozen, recovery on the first new picture (problems log D24, hazard H-01b)'}
  status: verified-UT
  note: 'not yet seen on a real stuck driver / RTSP stall; the localizers rely on the frame_meta usable flag (day and night already honour it)'

- id: NAV-SAF-20
  category: SAF
  title: 'Celestial solves only on a trusted time (GPS-anchored, no hardware clock required)'
  text: 'cn_subscriber (geoloc and allsky360 modes) and the field server shall solve a live frame only on a trusted time, taken in this order: (1) the GPS anchor: a receiver UTC the receiver vouches for (UBX NAV-PVT validDate+validTime+fullyResolved with a fix, NMEA RMC status A, ZDA within 2 s of a valid fix) received while the GPS is trusted (cn: nav_status shows the GPS contributing; field: a satellite fix within 2 km of the phone GPS), held as UTC minus the monotonic clock for the rest of the boot, refreshed only by a later trusted sample within 0.5 s + the drift of the first anchor (others counted and reported as jumps); (2) the autopilot SYSTEM_TIME (vehicle_link /navera/vehicle/system_time, within 5 s); (3) the DS3231 (rtc_time within 5 s and rtc_status valid, not lost_power); (4, field server only) the phone clock; (5) NTP synchronisation. Each source has a stated 1-sigma growing at time_drift_ppm (20 ppm) since its sample and is not used beyond 5 s; the GPS anchor and SYSTEM_TIME more than 1 s apart give no trusted time; a wall-clock step does not discard the anchor but no frame stamp is converted for 60 s after it. Otherwise no position, with the reason "no trusted time: ...". The source and its 1-sigma shall be published (/navera/time_status, frame status utc_source / utc_sigma_s, the field page "Star time"). The anchor is not persisted: after a reboot it is gone until a trusted GPS fix.'
  code:
    - navera_common/navera_common/trusted_time.py::TrustedClock
    - navera_common/navera_common/gnss.py::rmc_utc_epoch
    - navera_common/navera_common/gnss.py::zda_utc_epoch
    - navera_common/navera_common/gnss.py::pvt_fix
    - cn_pkg/cn_pkg/nodes/cn_subscriber.py::CNSubscriber._utc_for
    - cn_pkg/cn_pkg/nodes/cn_subscriber.py::CNSubscriber._utc_now
    - cn_pkg/cn_pkg/nodes/cn_subscriber.py::CNSubscriber._on_gnss_time
    - cn_pkg/cn_pkg/nodes/cn_subscriber.py::CNSubscriber._on_nav_status
    - cn_pkg/cn_pkg/nodes/cn_subscriber.py::CNSubscriber._time_tick
    - gps_pkg/gps_pkg/nodes/gps_node.py::GPSNode._publish_time
    - navera_output/navera_output/nodes/vehicle_link_node.py::system_time_reference
    - navera_tools/field/rtc_clock.py::RtcClock
    - navera_tools/field/time_feeds.py::GnssTimeParser
    - navera_tools/field/time_feeds.py::AutopilotTimeFeed
    - navera_tools/field/server.py::Field.star_time_sigma
  match:
    - 'test_trusted_time\.py::'
    - 'test_cn_gates\.py::test_(no_star_solve|an_rtc_that_lost|a_valid_rtc|gnss_time_anchors|the_gps_anchor|autopilot_time|a_stated_time|allsky360_mode)'
    - 'test_gnss_time\.py::'
    - 'test_vehicle_link\.py::test_system_time'
    - 'test_field_rtc\.py::'
    - 'test_field_clock\.py::'
    - 'test_field_time_feeds\.py::'
  evidence:
    - {level: UT, value: 'GPS anchor held 3 h without GPS (sigma 0.5 -> 0.716 s at 20 ppm) and through a +16 h wall-clock step; untrusted (refused) GPS never anchors; a 30 s time jump is logged once and the anchor kept; 0.4 s steps cannot walk the anchor (stays within 0.5 s); anchor vs SYSTEM_TIME 1.7-2 s apart -> no solve; order gnss > autopilot > rtc > phone > ntp; reboot (no anchor) -> SYSTEM_TIME; no source -> no solve'}
    - {level: BENCH, against: true, value: 'F27 (2026-10-21): the field Jetson had no DS3231 and booted 16 h off — the gate now refuses instead of solving thousands of km off', ref: 'problems doc F27'}
  status: verified-UT
  note: 'decision 2026-10-22: no hardware clock required (GPS good at take-off); the 20 ppm drift and the 0.5 s GNSS-message latency are stated, not measured (time_status anchor minus SYSTEM_TIME measures the drift in flight); not yet run with a real GPS + autopilot on the box; NAVERA''s own GPS_INPUT / NMEA output still stamps with the system clock'

- id: NAV-SAF-21
  category: SAF
  title: 'Compute health monitored, heavy retries shed when hot or short of memory'
  text: 'A compute health monitor shall read the Jetson temperatures, memory, swap, GPU load and thermal throttling without root every 2 s and publish them on /diagnostics and /navera/compute_health; it shall report a box without swap at start, WARN at 85 C / 15 % memory available / throttling, and set the latched /navera/compute/degraded at 95 C / 8 % (cleared 5 C / 4 % back) so day and night skip their optional height / heading retries; its failure shall never stop the arbiter.'
  code:
    - navera_common/navera_common/compute_health.py::ComputeHealthMonitor
    - navera_common/navera_common/compute_health.py::watch_degraded
    - navera_estimator/navera_estimator/nodes/compute_health_node.py::ComputeHealthNode
  match:
    - 'test_compute_health\.py::'
    - 'test_compute_health_node\.py::'
  evidence:
    - {level: UT, value: 'fake /sys + /proc tree: readers, WARN / DEGRADED with hysteresis, no-swap report; node: /diagnostics levels and the latched flag reaching a subscriber'}
    - {level: BENCH, value: 'read on the Orin Nano without root (2026-10-21): 9 thermal zones (3 CV zones unreadable, skipped), GPU load from /sys/devices/platform/17000000.gpu/load, 20 GB swap', ref: 'navera_common/compute_health.py docstring'}
  status: verified-UT
  note: 'thresholds are starting values (Orin throttles near 99 C); not shown on the operator view yet; OOMScoreAdjust / MemoryHigh in the units still open (O-20)'

- id: NAV-SAF-25
  category: SAF
  title: "Celestial 'up' trusted only at rest (gyro-propagated vertical)"
  text: "A celestial fix whose 'up' comes from an accelerometer shall be trusted (stated with the at-rest attitude sigma) only when the vehicle is at rest at the exposure: the exposure window steady (0.2 s means within 0.003 g, rotation < 0.5 deg/s, |a| within 0.004 g of its value at rest) AND, over the last 10 s, the gyro-propagated vertical has not moved by more than 0.3 deg unless |a| shows that the earlier state was the accelerated one (braking to the stop); otherwise the fix is flagged moving (5 deg added to its sigma)."
  code:
    - cn_pkg/cn_pkg/standstill.py::judge
    - navera_tools/field/server.py::Stillness
  match:
    - 'test_standstill\.py::'
    - 'test_field_stillness\.py::test_(gentle|stop_after|long_check|history)'
  evidence:
    - {level: SIM, value: "car drive simulation (13 profiles + seeds): glass road, 'stopped' frames with 'up' > 0.3 deg off 106 → 1 (max 7.4 → 0.48 deg), 4 seeds 394 → 2; no at-rest frame lost on any profile; through the field server trusted fixes p90 265 → 9.3 km, max 825 → 22 km, within 3 sigma 56/72 → 30/30", ref: 'VALIDATION_STATUS.md, Celestial: field-test readiness fixes'}
  status: verified-SIM
  note: 'a steady gentle acceleration lasting > 10 s is not separable from rest by an IMU (stated); the camera_pkg insta360 node publishes no frame_meta and no all-sky frame yet, so the product has no frame_meta stopped to set (standstill.judge to be wired where the all-sky frame is produced); real drive 31 Oct'

- id: NAV-SAF-26
  category: SAF
  title: "Online tilt-of-'up' calibration robust to bad samples"
  text: "The tilt of 'up' learned on fixes with a reference position shall leave out samples more than 3.5 robust sigma (at least 0.3 deg, at most 1.0 deg) from the fit, count only agreeing samples towards the 12 it freezes on (or stop after 24), and not be applied without a clear majority (>= 3 agreeing, more than half) or with a tilt over 5 deg."
  code:
    - cn_pkg/cn_pkg/allsky_mount.py::fit_tilt
    - cn_pkg/cn_pkg/allsky_mount.py::TiltCalibration
    - navera_tools/field/server.py::Field._cal_frozen
  match:
    - 'test_tilt_robust\.py::'
    - 'test_allsky360\.py::test_(fit_tilt|tilt)'
  evidence:
    - {level: UT, value: '1 deg tilt, 12 samples with 1-4 bad ones 1.5-8 deg off: plain fit 0.30-0.91 deg (33-101 km), robust 0.007-0.021 deg (0.8-2.4 km); clean samples unchanged'}
  status: verified-UT

- id: NAV-SAF-27
  category: SAF
  title: 'Insta360 IMU feed recovered when it goes silent (F14)'
  text: 'While the Insta360 video goes on and its IMU feed is silent (no IMU packet for 1.5 s, after a 4 s warm-up), the driver (field insta360_usb and camera_pkg UsbImuSource) shall re-send StartLiveStream at most every 2 s and, after 3 such restarts in vain, reset the USB device and start the stream again (~8 s after the silence began); the field server shall reopen the camera only when the IMU stays silent 10 s and no USB reset happened in the last 6 s. Restarts, resets and reopenings shall be counted in the camera health. The field driver shall keep 20 s of IMU rows, readable through imu_rows().'
  code:
    - navera_common/navera_common/insta360_protocol.py::ImuWatchdog
    - navera_tools/field/insta360_usb.py::Insta360Usb.reset_usb
    - navera_tools/field/insta360_usb.py::Insta360Usb.imu_rows
    - camera_pkg/camera_pkg/insta360_imu.py::UsbImuSource.reset_usb
    - navera_tools/field/server.py::Camera360._watch_once
  match:
    - 'test_insta360_watchdog\.py::'
    - 'test_insta360_usb_driver\.py::'
    - 'test_insta360_imu\.py::test_silent_imu'
    - 'test_field_stillness\.py::test_silent_imu'
  evidence:
    - {level: UT, value: 'fake USB: 3 restarts at 2 s intervals then one USB reset (re-claimed, sync + start re-sent); the server does not reopen within 6 s of the reset, does after; 20 s of 500 Hz rows kept'}
    - {level: BENCH, against: true, value: 'F14 (2026-10-19): the IMU feed stopped after its first packet on the first starts after power-on; a restart brought it back', ref: 'problems doc F14'}
  status: verified-UT
  note: 'the USB reset is not yet tried on the real camera (it is held by navera-field); whether the One R re-enumerates after a reset is unknown (the driver finds it again either way)'

- id: NAV-SAF-28
  category: SAF
  title: 'Day track consistency: no confident wrong fix believed alone'
  text: 'A day fix further from the carried position than 3 x the two sigmas combined (strong fixes included) shall not be believed until a second fix agrees with it (within 6 s, 20 s while lost); a believed fix shall be averaged with the carried position by their sigmas when the carry has a heading (frame attitude or gyro) and the fix is not a re-acquisition — only the independent parts of the two errors (the error every fix shares, speed x the camera delay sigma and height x tan(the mount sigma), neither sets the weight nor shrinks in the stated sigma), the carry being made of the measured fixes, never of its own output; frames smeared by the camera rotation at the exposure or blurred may be refused (frame_max_blur_px, frame_sharp_rel; off by default); the heading search shall run when no heading is known or after local_heading_search_after frames without a match.'
  code:
    - day_pkg/day_pkg/fix_consistency.py::FixConsistency
    - day_pkg/day_pkg/frame_gate.py::FrameGate
    - day_pkg/day_pkg/nodes/day_subscriber.py::DaySubscriber._check_local_fix
    - day_pkg/day_pkg/nodes/day_subscriber.py::DaySubscriber._blend_fix
    - day_pkg/day_pkg/nodes/day_subscriber.py::DaySubscriber._heading_search_kw
  match:
    - 'test_fix_consistency\.py::'
