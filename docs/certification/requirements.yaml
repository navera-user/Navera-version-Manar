- id: NAV-SAF-18
  category: SAF
  title: 'Vehicle configuration validated at start'
  text: 'Vehicle settings (maximum speed, IMU, camera mount) shall be validated at node start and a wrong value shall stop the node with its reason; check_box shall flag a bad integrator configuration (shared serial port, forwarded sigma above 100 m, NMEA forwarding).'
  code:
