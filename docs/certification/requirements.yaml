  status: verified-UT

- id: NAV-SAF-13
  category: SAF
  title: 'Frozen sensor data detected'
  text: 'Identical consecutive IMU samples (1 s at 50 Hz) shall be reported frozen and the sensor reinitialised; a frozen attitude stream shall stop frames from being straightened with it.'
  code:
