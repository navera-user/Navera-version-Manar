- id: NAV-SAF-16
  category: SAF
  title: 'Operator control is authenticated and locked in flight'
  text: 'Every control action on the web interface shall require the token (none = read-only), refuse cross-site and malformed requests, lock an address out after 5 wrong codes in 60 s, and refuse restarts / map generation while armed, moving > 1.5 m/s or navigating without GPS.'
