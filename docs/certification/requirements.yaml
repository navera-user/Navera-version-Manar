  evidence:
    - {level: SIM, value: 'ArduPilot SITL NMEA input (GPS_TYPE 5, SERIAL3) passed', ref: 'ARDUPILOT_INTEGRATION.md §4'}
  status: verified-SIM

- id: NAV-IF-03
  category: IF
  title: 'Serial NMEA / u-blox UBX GPS input'
  text: 'The GPS driver shall verify NMEA checksums, reject GGA quality 6/7/8, report ellipsoidal altitude, keep an unknown HDOP unknown, and exit (code 1) when its port vanishes. On the same stream it shall read u-blox UBX NAV-PVT (Fletcher-checksummed): a fix only with gnssFixOK and a 2D / 3D / GNSS+DR fix (not DR-only, time-only or invalidLlh), the receiver''s hAcc / vAcc as a diagonal covariance (else unknown), ellipsoidal height, ENU velocity and the UTC only when valid and fully resolved; it shall not publish the same receiver''s NMEA fix while NAV-PVT arrives, and never write to the receiver unless configure_receiver is set (then RAM-only NAV-PVT / NAV-DOP enable); a serial port with nothing valid for 5 s shall be listened to at the next common baud (a local setting only).'
  code:
    - gps_pkg/gps_pkg/nodes/gps_node.py::GPSNode._publish_fix
    - gps_pkg/gps_pkg/nodes/gps_node.py::GPSNode._read_loop
    - gps_pkg/gps_pkg/nodes/gps_node.py::GPSNode._handle_ubx
    - gps_pkg/gps_pkg/nodes/gps_node.py::GPSNode._next_baud
    - navera_common/navera_common/gnss.py::StreamDecoder
    - navera_common/navera_common/gnss.py::pvt_fix
    - navera_common/navera_common/gnss.py::ubx_enable_pvt_frames
    - gps_pkg/gps_pkg/fix_publish.py::estimate
  match:
    - 'test_gps_serial\.py'
    - 'test_gps_sources\.py'
    - 'test_gnss\.py::test_(ubx|decoder|a_3d_fix|only_satellite|rtk|time_only|u_blox|receiver_configuration)'
  evidence:
    - {level: UT, value: 'pseudo-terminal: checksum, quality, port loss exit 1'}
    - {level: UT, value: '2026-10-22: UBX NAV-PVT + NMEA mixed on a pseudo-terminal (tap at 230400): fixes with hAcc covariance, velocity, GNSS time, NMEA not repeated, DR-only invalid, corrupted frame dropped, nothing written to the receiver; NAV-PVT layout cross-checked against pyubx2'}
    - {level: HW, value: 'u-blox NEO-M8N on /dev/ttyTHS1 gave a valid fix (project report 2026-06-02; replayed through gps_node)', ref: 'VALIDATION_STATUS.md, Hardware results'}
  status: partial
  note: 'the real receiver was not run through today''s gps_node live; UBX only with simulated streams (no real u-blox / Y-cable tap yet)'

- id: NAV-IF-04
  category: IF
  title: 'ROS / vehicle GPS input'
  text: 'A vehicle GPS given as a NavSatFix topic (or the autopilot''s GPS2_RAW via the vehicle link) shall become NAVERA''s GPS source with its stated accuracy; no fix or (0,0) is invalid, a missing accuracy stays unknown.'
  code:
    - gps_pkg/gps_pkg/nodes/ros_gps_node.py::estimate_from_fix
  match:
    - 'test_ros_gps\.py::'
  tests:
    - deploy/stage_check.sh
  evidence:
    - {level: UT, value: 'stage check 2026-10-21: ros_gps_node fed by a simulated vehicle GPS in the staged stack', ref: 'docs/certification/DEPLOYMENT_VALIDATION.md'}
  status: verified-UT

- id: NAV-IF-08
  category: IF
  title: 'DroneCAN GPS input'
  text: 'A DroneCAN GNSS (uavcan.equipment.gnss.Fix2, legacy Fix) shall become NAVERA''s GPS source with the same contract as the serial GPS: valid only with a 2D / 3D fix, accuracy from its covariance (else unknown), ellipsoidal height, UTC from a UTC or GPS (leap-corrected) timestamp. The node shall listen passively (no node id, nothing sent) unless node id allocation is explicitly enabled, never use a node that commands motors (an autopilot re-broadcasting its GPS), keep one receiver, and exit (code 1) when the bus fails.'
  code:
    - navera_common/navera_common/gnss.py::fix2_fix
    - gps_pkg/gps_pkg/nodes/dronecan_gps_node.py::GnssSelector
    - gps_pkg/gps_pkg/nodes/dronecan_gps_node.py::DroneCanGps
  match:
    - 'test_gnss\.py::test_fix2'
    - 'test_dronecan_gps\.py::'
    - 'test_gps_sources\.py'
  evidence:
    - {level: UT, value: '2026-10-22: dronecan_gps_node on a pydronecan virtual bus (mcast): Here3-like node 124 used with its covariance, autopilot node 10 (ESC commands + Fix2) never; nothing transmitted in passive mode, node 125 heard only with allocation on'}
  status: verified-UT
  note: 'no real DroneCAN GPS on can0 yet (can0 is down on the bench; bringing it up needs root)'

- id: NAV-IF-09
  category: IF
  title: 'Network GPS input'
  text: 'A GPS stream on the network (NMEA and / or UBX, tcp:<host>:<port> as client or udp:<port> as listener) shall be read like a serial GPS; a lost TCP connection shall exit (code 1) so the service reconnects; a UDP GPS is never written to.'
  code:
    - navera_common/navera_common/gnss.py::Stream
    - navera_common/navera_common/gnss.py::parse_stream_url
  match:
    - 'test_gnss\.py::test_(stream_urls|tcp_and_udp)'
    - 'test_gps_sources\.py'
  evidence:
    - {level: UT, value: '2026-10-22: gps_node url tcp: (NMEA, exit 1 when the server closes) and udp: (UBX) on loopback'}
  status: verified-UT

- id: NAV-IF-10
  category: IF
  title: 'The autopilot''s first GPS (NAVERA not feeding it)'
  text: 'With NAVERA_GPS_SOURCE=vehicle_gps1 the vehicle link shall publish the autopilot''s GPS_RAW_INT (3D fix, ellipsoid altitude, h_acc / v_acc) only while the autopilot''s GPS_TYPE / GPS1_TYPE, read at every connection and every 30 s, is known and neither 0, nor 14 (NAVERA''s GPS_INPUT), nor 5 while NAVERA''s NMEA output is on; it shall stop at once otherwise.'
  code:
    - navera_output/navera_output/nodes/vehicle_link_node.py::gps1_readable
    - navera_output/navera_output/nodes/vehicle_link_node.py::gps_raw_navsatfix
