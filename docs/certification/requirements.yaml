    - day_pkg/day_pkg/mount_cal.py::MountCalibration.reset
    - day_pkg/day_pkg/nodes/day_subscriber.py::DaySubscriber._check_mount_id
  match:
    - 'test_mount_identity\.py::'
    - 'test_mount_id_and_camera_delay\.py::test_(stale_reason|a_stored|a_changed|a_mount_changed|a_calibration_without)'
  evidence:
    - {level: UT, value: 'mount angles, lens file content, crop each change the id; a changed mount drops the stored calibration (sigma back to the 2 deg prior) and it is not reloaded by the next flight'}
  status: verified-UT
  note: 'F33 open item 4'

- id: NAV-FUN-27
  category: FUN
  title: 'Camera mount learned only from what the GPS checks can separate'
  text: 'A GPS-check match shall be a day-camera mount sample only while the camera delay is known (set by the camera or estimated and applied) and the frame dating error (ground speed x the delay sigma) is at most mount_cal_max_dating_m; an in-flight mount fit shall be used or persisted only once its samples span mount_cal_min_heading_span_deg of frame headings; without one, the mount prior sigma (mount_sigma_deg) stays in the stated accuracy.'
  code:
    - day_pkg/day_pkg/nodes/day_subscriber.py::DaySubscriber._mount_sample_refused
    - day_pkg/day_pkg/mount_cal.py::heading_span_deg
    - day_pkg/day_pkg/mount_cal.py::MountCalibration._enough
  match:
    - 'test_mount_place_fix\.py::test_no_mount_sample'
    - 'test_mount_cal\.py::test_(heading_span|a_climb_on_one_heading)'
  evidence:
    - {level: UT, value: 'no sample with the delay unknown or 3 m dating error, a sample at 1 m; a 40-check climb on one heading not learned, a persisted prior kept, a circuit learned'}
    - {level: SIM, value: 'F41 offline replay of Isaac runs: the learned mount (delay / one-heading map shift) made pd_h600 16.3 → 10.0 m median without it, pd_plane30 14.2 → 9.2 m (no blend)', ref: 'VALIDATION_STATUS.md, Isaac Sim closed loop: the overconfident copter sigma'}
  status: verified-UT
  note: 'F41; a copter whose delay is never learned (samples too slow / turning) keeps the 2 deg prior: fixes stated h x tan(2 deg) more'

# ───────────────────────────── Timing ─────────────────────────────
- id: NAV-TIM-01
  category: TIM
  title: 'Source freshness windows'
  text: 'A source shall be used only while its last measurement is younger than its window: GPS 3 s, day 5 s, night 5 s, celestial 45 s, IMU liveness 1 s (estimator defaults = config/estimator_params.yaml).'
  code:
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._age_s
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._measured_at
  match:
    - 'test_estimator\.py::<script>'
    - 'test_estimator_rules\.py::test_(node_freshness_defaults_are_the_deployed_ones|a_day_fix_stays_usable_5_s)'
  evidence:
    - {level: SIM, value: 'day window 3 s → 5 s (e1d0674): under load NAVERA alternated FIX / NO_FIX on 20–60 % of samples and the autopilot landed in a 6.7–9.2 s gap', ref: 'VALIDATION_STATUS.md, Vision positions carried to the present'}
    - {level: UT, value: 'C4 resolved: the node default was 3.0 while the deployed yaml and the docs said 5 s — default now 5.0, a test keeps the node defaults equal to the yaml'}
  status: verified-UT
  note: 'celestial 45 s window "to be measured under real cadence"'

- id: NAV-TIM-02
  category: TIM
  title: 'Camera latency compensation'
  text: 'Each frame shall be stamped at its exposure (grab time − NAVERA_CAMERA_LATENCY_S), and the latency may be calibrated online against GPS on a turning track, frozen when GPS is not trusted.'
  code:
    - navera_common/navera_common/latency_cal.py::LatencyCalibrator
    - camera_pkg/camera_pkg/nodes/live_camera.py::LiveCamera._grab_loop
  match:
    - 'test_latency_cal\.py::'
    - 'test_latency_hook\.py::'
  evidence:
    - {level: BENCH, value: 'Insta360 USB 360 stream 1.71 s delay: uncompensated 39.8 m at 80 m/s, compensated 3.3 m (F9); webcam 0.14 s', ref: 'problems doc F9'}
  status: verified-BENCH

- id: NAV-TIM-04
  category: TIM
  title: 'Attitude at the exposure with an in-flight camera delay'
  text: 'A frame shall be straightened with the attitude at the instant the day node dates it (arrival minus the set delay minus the in-flight correction, published on /day/camera_delay and applied by live_camera), never twice the set delay; a staged (not yet stable) delay estimate shall be applied only while ground speed x its sigma is at most latency_partial_max_error_m (10 m).'
  code:
    - navera_common/navera_common/latency_cal.py::delay_message
    - navera_common/navera_common/latency_cal.py::attitude_shift_s
    - navera_common/navera_common/latency_cal.py::LatencyCalibrator._apply_posterior
    - camera_pkg/camera_pkg/nodes/live_camera.py::LiveCamera._on_delay
    - day_pkg/day_pkg/nodes/day_subscriber.py::DaySubscriber._publish_camera_delay
  match:
    - 'test_latency_cal\.py::test_(the_staged_delay_is_not_applied_when_speed_times_its_sigma_is_too_large|a_stable_delay_is_applied_whatever_the_speed|a_contradicted_stored_delay_is_not_kept_when_the_staged_one_is_capped|the_camera_takes_the_attitude_at_the_day_nodes_dating)'
    - 'test_mount_id_and_camera_delay\.py::test_the_delay_estimate_is_published_for_the_camera_when_it_changes'
    - 'test_live_camera\.py::<script>'
  evidence:
    - {level: UT, value: 'plane 30 m/s staged 1.11 +- 0.38 s (11 m) not applied, copter 10 m/s applied; live_camera with a 1 s delay message straightens with the attitude of 1 s before the stamp, stamp unchanged'}
    - {level: SIM, value: 'Isaac Sim plane 30 m/s, delay learned in flight only: wrong fixes 6 -> 0, matched 83 -> 98 %, 13 m median at the stated time (hand-set delay 9 m)', ref: 'VALIDATION_STATUS.md, F35b'}
  status: verified-SIM
  note: 'Isaac Sim closed-loop result in VALIDATION_STATUS.md (F35b); not run with a real camera on a plane'

- id: NAV-TIM-03
  category: TIM
  title: 'Output latency to the autopilot'
  text: 'Positions shall be sent on arrival (no polling), stamped with the measurement instant (GPS) or carried to now (vision); the integrator sets GPS_DELAY_MS to the lowest measured latency.'
  code:
    - navera_output/navera_output/nodes/vehicle_output_node.py::VehicleOutputNode._on_position
  match:
    - 'test_bridge_flow\.py::test_between_two_positions'
  evidence:
    - {level: SIM, value: 'OUT-5: polling dropped / doubled messages, ArduPilot refused to arm; fixed by send on arrival', ref: 'ENGINEERING_BACKLOG.md §6'}
  status: partial
  note: 'GPS_DELAY_MS recommendation not verified; end-to-end latency on the box not measured'

# ───────────────────────────── Deployment ─────────────────────────────
- id: NAV-DEP-01
  category: DEP
  title: 'Automatic start and restart'
  text: 'Every NAVERA unit shall start at boot without a login and restart after any exit, forever (Restart=always, StartLimitIntervalSec=0) because ros2 launch exits 0 when a node dies: the critical units (estimator, output, vehicle link, GPS, IMU, RTC) and the pipelines (day, night, celestial, Insta360) after 1 s (RestartSec=1), the others after 10 s; a unit failing at every start shall back off (past 5 starts in 60 s: 2, 4, 8... s, at most 30 s) instead of restart-looping, and a driver without its device shall idle.'
  code:
    - deploy/systemd/navera-estimator.service::Restart
    - deploy/systemd/navera_boot_lib.sh::navera_env
    - deploy/systemd/navera_boot_lib.sh::navera_restart_backoff
    - deploy/verify_units.py::restart_findings
    - deploy/systemd/navera_boot_imu.sh
  tests:
    - deploy/verify_units.py
    - deploy/stage_check.sh
  match:
    - 'test_fast_restart\.py::'
  evidence:
    - {level: UT, value: 'B23 2026-10-22: verify_units fast-restart check PASS on all 10 critical / pipeline units; a 10 s RestartSec, a start limit or a library without the backoff FAIL; the 3rd start within the window waits (free 2, cap 1 s in the test), another workspace counts apart, a broken record never blocks', ref: 'deploy/test/test_fast_restart.py'}
    - {level: HW, value: 'reboot validation 2026-07-15 (6 units, previous restart mechanism)', ref: 'CLAUDE.md §8'}
    - {level: UT, value: 'staged user units 2026-10-21: killed estimator and GPS nodes restarted by systemd, check_boot PASS again', ref: 'docs/certification/DEPLOYMENT_VALIDATION.md'}
  status: partial
  note: 'DEP-14 — reboot of a deployed unit with today''s mechanism still to do (commands in DEPLOYMENT_VALIDATION.md)'

- id: NAV-DEP-07
  category: DEP
  title: 'A crash in flight does not end the mission'
  text: 'With GPS lost (for the whole flight if need be), the crash of any one NAVERA service shall not leave the autopilot without a position longer than its failsafe delay: the critical units restart within 1 s; the day pipeline respawns a crashed day node or camera alone (the other goes on, the camera re-sends as soon as the new localizer is ready); the output bridges its last forwarded vision position across a silent or initializing arbiter (bounded by bridge_max_s, accuracy growing) and, restarted itself, resumes that bridge from its persisted last position without holding the next positions back; a restarted estimator restores its GPS-gate state (a refused GPS stays refused) and never a position.'
  code:
    - navera_output/navera_output/policy.py::decide
    - navera_output/navera_output/nodes/vehicle_output_node.py::held_from_state
    - navera_output/navera_output/nodes/vehicle_output_node.py::VehicleOutputNode._restore_held
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._restore_gps_state
    - camera_pkg/camera_pkg/nodes/live_camera.py::LiveCamera._on_ready
    - simulation_web/simulation_web/launch/day_pipeline.launch.py
    - navera_tools/isaac/hil_flight.sh
  match:
    - 'test_bridge_flow\.py::test_(a_restarted|no_restore|the_held_position)'
    - 'test_output\.py::test_the_soft_no_fix'
    - 'test_estimator_rules\.py::test_(a_restart|an_old_gps_gate)'
    - 'test_localizer_restart\.py::'
    - 'test_day_pipeline_respawn\.py::'
    - 'test_hil\.py::test_restart_gap'
  evidence:
    - {level: HW, against: true, value: 'B23 2026-10-22 box in the loop before the fix (RestartSec=10, arbiter silence = no fix, whole-pipeline restart): killed estimator -> /navera/position back after 15.4 s, autopilot GPS lost after 2.3 s, EKF failsafe LAND; killed day camera -> 25.5 s, LAND', ref: '~/.navera_sim/isaac/hil/hil_base1, hil_endur30'}
    - {level: UT, value: 'arbiter silent / initializing bridged; held position persisted (1/s), restored on a new monotonic clock only within bridge_max_s, cleared by a GPS fix; refused GPS still refused after a restart, nothing published; the camera re-sends on a new ready; the day node and camera respawn alone'}
    - {level: SIM, value: 'B23 box in the loop 2026-10-23 (real Jetson, SITL copter, GPS denied): estimator killed twice -> autopilot gap 2.6 / 2.5 s, no failsafe; output killed -> gap 4.7 s, no failsafe; day camera killed -> gap 2.6 s; whole day pipeline unit -> positions after 12.5 s, bridged 10 s, no failsafe', ref: 'DEPLOYMENT_VALIDATION.md §4'}
    - {level: SIM, against: true, value: 'B23 2026-10-23: day_subscriber killed alone -> ready 7.2 s after but no match in its 600 m restart search circle; bridge ended at 10 s, EKF failsafe LAND (hil_resil4)', ref: 'DEPLOYMENT_VALIDATION.md §4'}
  status: partial
  note: 'open: a restarted day node must restore its track (velocity, heading, sigma), not only day_anchor, to match again inside the bridge (day_subscriber.py); not on a real vehicle'

- id: NAV-DEP-02
  category: DEP
  title: 'Missing data disk does not start a half-blind pipeline'
  text: 'A vision pipeline shall not start while its map / weights are missing (data disk not mounted): the wrapper exits and systemd retries every 10 s; the box still boots (nofail).'
  code:
    - deploy/systemd/navera_boot_lib.sh::navera_require
  match:
    - 'test_boot_require\.py::'
  evidence:
    - {level: A, value: 'navera_require checks each path; deploy/README.md §3.10'}
    - {level: UT, value: 'map on an unmounted path or unset → exit 1 before the launch, with the reason; day / night wrappers require their map / weights before exec, units Restart=always RestartSec=10'}
  status: partial
  note: 'nofail (the box still boots without the disk) is an fstab line in deploy/README.md: not tested on a box with the disk unplugged'

- id: NAV-DEP-03
  category: DEP
  title: 'Bounded disk use'
  text: 'At every unit start, ROS log folders older than 7 days shall be pruned, then the oldest until the log folder is under NAVERA_LOG_MAX_MB (1024 MB), and a free space below NAVERA_MIN_FREE_MB (2048 MB) on its disk shall be warned without stopping the unit; recordings go to the data disk.'
  code:
    - deploy/systemd/navera_boot_lib.sh::navera_prune_logs
    - deploy/journald/navera.conf
  match:
    - 'test_boot_logs\.py::'
    - 'test_swap\.py::test_the_staged_install_makes_the_swap_only_when_asked_and_caps_the_journal'
  evidence:
    - {level: A, value: 'DEP-13 (252fa15)'}
    - {level: UT, value: '9-day-old folder pruned, 1-day-old kept; 10 restarts × 0.4 MB with a 2 MB cap → the newest 5 kept; low free space warned, exit 0'}
    - {level: A, value: 'within a run the ROS log files grow ~1.5 MB/h for the day node (0.4 kB per frame at 1 frame/s, measured on 29 385 simulator frames), a few MB/h in all; the journal (units stdout) is capped by install.sh: SystemMaxUse 1 GB, SystemKeepFree 2 GB, 64 MB files, rate limit (deploy/journald/navera.conf)'}
  status: verified-UT
  note: 'the current run''s ROS log files are pruned at the next start only (~15 MB for a 10 h flight); free space shown by check_box, not on the operator view'

- id: NAV-DEP-06
  category: DEP
  title: 'Hot-plug of a GPS, autopilot or camera'
  text: 'navera-hotplug shall probe, read-only, only the devices that appear after boot (and, while no GPS is found, re-listen to silent ports, CAN buses and network GPS addresses every 60 s), rewrite discovered.env for the needs navera-discover left idle only — never a working source — and never switch the GPS while the vehicle is armed or its armed state is unknown with an autopilot link; idle units shall restart by themselves when discovered.env changes.'
  code:
    - navera_common/navera_common/hotplug.py::fill_idle
    - navera_common/navera_common/hotplug.py::run
    - navera_common/navera_common/hotplug.py::gps_switch_allowed
    - deploy/systemd/navera_boot_lib.sh::navera_idle_until_discovered
    - deploy/systemd/navera-hotplug.service
  match:
    - 'test_hotplug\.py::'
    - 'test_boot_idle\.py::'
  evidence:
    - {level: UT, value: '2026-10-22: USB GPS appearing fills the idle GPS only; a second receiver never replaces a working one; armed / unknown -> deferred, disarmed -> filled; idle wrapper exits when discovered.env changes'}
  status: verified-UT
  note: 'not yet on the deployed box (systemd restart chain, real USB plug)'

- id: NAV-DEP-05
  category: DEP
  title: 'Hours-long operation without growing state'
  text: 'Over a flight of hours (with or without GPS) no runtime state shall grow without bound: every history, queue and per-message table of the nodes is capped by size or time, the web service keeps at most MAX_PLANS (20) route plans and forgets ended lock-outs and old wrong-code addresses.'
  code:
    - simulation_web/simulation_web/mission_prep.py::AreaJobs.plan
    - simulation_web/simulation_web/web_common.py::_CodeGuard._forget_old
  match:
    - 'test_mission_prep\.py::test_route_plans_kept_are_bounded'
    - 'test_web_common\.py::test_the_code_guard_forgets_old_addresses'
  evidence:
    - {level: A, value: '2026-10-22 audit of every runtime node (estimator, camera, day / night / celestial, output, GPS / IMU / RTC, web): histories are deque(maxlen) or pruned by time, pairing tables trimmed, per-source tables popped before insert; no node writes its own growing file; only the web plans and wrong-code tables grew (fixed here)'}
    - {level: UT, value: '35 plans → the newest 20 kept; 500 addresses × 5 wrong codes → nothing kept once the lock-outs and the window have passed'}
  status: verified-UT
  note: 'no multi-hour soak run on the box yet (memory measured over 430 s of real flight replay: NAV-PERF-06)'

- id: NAV-DEP-04
  category: DEP
  title: 'Reproducible install with least privilege'
  text: 'deploy/install.sh shall install code, build, settings (never overwriting navera.env), wrappers and units in one command, idempotently, never copying git data, other worktrees (.claude/), build products or test data / recordings to the box; the web service may run as root only the exact systemctl restarts in deploy/sudoers/navera-web.'
  code:
    - deploy/install.sh
    - deploy/sudoers/navera-web
    - deploy/verify_units.py::check_code_excludes
  tests:
    - deploy/verify_units.py
    - deploy/stage_check.sh
  match:
    - 'test_install_excludes\.py::'
  evidence:
    - {level: UT, value: 'staged install (--root) + systemd-analyze verify + visudo -c -f: PASS; real-mode dry-run output byte-identical to before the change', ref: 'docs/certification/DEPLOYMENT_VALIDATION.md'}
    - {level: UT, value: 'B18: a staged install from a working repository with .git, .claude/worktrees, build/, caches and rosbag / mcap recordings ships the code and none of them; real-mode dry-run shows the same excludes', ref: 'deploy/test/test_install_excludes.py'}
    - {level: UT, value: '2026-10-22: an update over an install older than B18 removes the .git, .claude worktrees, caches and recordings it left (rsync --delete skips excluded paths), keeps build/ install/ log/ (found by stage_check on a stage reused from 2026-10-21)', ref: 'deploy/test/test_install_excludes.py'}
  status: verified-UT
  note: 'R-8 — the sudoers restart path to verify on an installed box'
