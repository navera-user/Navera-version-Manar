    - {level: BENCH, against: true, value: 'F27 (2026-10-21): no DS3231 on bus 1 of the field Jetson — booted 16 h off until NTP', ref: 'problems doc F27'}
    - {level: UT, value: 'field server (2026-10-22): a wired DS3231 is a trusted star time without phone or internet (rtc_clock.py, raw I2C, tick-synced); lost power / unset / local time / clock step refused (fake RTC)', ref: 'navera_tools/tests/test_field_rtc.py'}
  status: partial
  note: 'the DS3231 is optional since 2026-10-22 (celestial time from the GPS anchor and SYSTEM_TIME, NAV-SAF-20); GPS_INPUT / NMEA time still from the system clock'

- id: NAV-SAF-06
  category: SAF
  title: 'Covariance sanity'
  text: 'A covariance that is non-finite, negative, asymmetric or not positive semi-definite (horizontal block, unit-consistent tolerance) shall not be used; the stated horizontal sigma shall be the long axis of the ellipse.'
  code:
