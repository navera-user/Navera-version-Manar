# ───────────────────────────── Interfaces ─────────────────────────────
- id: NAV-IF-01
  category: IF
  title: 'MAVLink GPS_INPUT output'
  text: 'NAVERA shall send MAVLink GPS_INPUT (gps_id 0, GPS week time of the measurement, 3D fix flag for vision with IGNORE_ALT, horizontal accuracy, velocity only with a GPS position) to an ArduPilot autopilot (GPS_TYPE 14).'
  code:
