  status: verified-SIM
  note: 'no real autopilot connected; PX4 ignores GPS_INPUT (D7): it gets HIL_GPS (NAV-IF-11)'

- id: NAV-IF-02
  category: IF
  title: 'NMEA GGA / RMC output'
  text: 'NAVERA shall emit checksummed GGA and RMC sentences at the measurement time, GGA quality 1 for a GNSS fix and 6 / RMC mode E for an estimated position, "no fix" sentences carrying no position.'
  code:
    - navera_output/navera_output/nmea.py::gga
    - navera_output/navera_output/nmea.py::rmc
    - navera_output/navera_output/nmea.py::checksum
  match:
