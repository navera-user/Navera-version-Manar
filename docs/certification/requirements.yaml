  status: verified-UT
  note: 'frozen camera IMAGES: NAV-SAF-19'

- id: NAV-SAF-14
  category: SAF
  title: 'Camera loss ends in a restart, not a silent stall'
  text: 'When the camera cannot be opened or stops delivering frames (> 50 failed grabs), the live camera node shall exit so systemd restarts the pipeline; while no frame is localized the vision source goes stale and the arbiter stops using it.'
  code:
    - camera_pkg/camera_pkg/nodes/live_camera.py::LiveCamera._grab_loop
    - camera_pkg/camera_pkg/nodes/live_camera.py::LiveCamera._camera_stalled
    - camera_pkg/camera_pkg/grab_watchdog.py::GrabWatchdog
    - navera_estimator/navera_estimator/nodes/estimator_node.py::EstimatorNode._eval_source
  match:
    - 'test_live_camera\.py'
    - 'test_live_camera_stall\.py'
    - 'test_grab_watchdog\.py::'
    - 'test_gst_capture\.py::test_a_bad_pipeline'
  evidence:
    - {level: SIM, value: 'GPS jammed + camera failed → NO FIX → autopilot failsafe (LAND / HOLD)', ref: 'VALIDATION_STATUS.md, Autopilot in the loop'}
    - {level: UT, value: 'a GStreamer camera that stops sending: camera_health "stalled" and the node exits 2.8 s after its last frames with camera_stall_restart_s 3 s (before: > 50 failed grabs = 100 s here, minutes with V4L2 10 s grab timeouts, never for a blocking grab)', ref: 'navera_tools/tests/test_live_camera_stall.py'}
  status: verified-SIM

- id: NAV-SAF-15
  category: SAF
  title: 'One arbiter per ROS network'
  text: 'A second arbiter on the same ROS network shall be detected and reported.'
  code:
