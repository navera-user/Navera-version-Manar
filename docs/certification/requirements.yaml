- id: NAV-FUN-25
  category: FUN
  title: 'Compass-free celestial fix for a narrow star camera with a known mount'
  text: "When the narrow star camera's full mounting is known (camera_R_cam_body, or camera_mount_roll_deg with the elevation and azimuth), cn_subscriber (geoloc) shall compute the position as the zenith among the stars from the plate solve's whole camera rotation and 'up' from the IMU's roll and pitch, using no compass, declination or prior; without it, the compass method shall be used and the status shall say so."
