  status: verified-UT

- id: NAV-FUN-26
  category: FUN
  title: 'Camera mount calibration bound to the camera settings'
  text: 'A learned or stored day-camera mount (boresight) calibration shall be dropped, and the stored copy overwritten, when the frames carry a different mount_id (live_camera: mount roll/pitch/yaw, lens calibration file content, crop) than the one it was learned with; a calibration without a mount_id is kept.'
  code:
    - navera_common/navera_common/camera_model.py::mount_identity
