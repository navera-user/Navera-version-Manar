  status: verified-SIM

- id: NAV-SAF-10
  category: SAF
  title: 'Bounded gap bridging'
  text: 'A gap in forwarded vision positions — including a silent or initializing arbiter (a restarting estimator, B23) — shall be bridged from 2.5 s, once a second, for at most bridge_max_s (10 s) and only while the grown sigma ≤ max_forward_sigma_m; a GPS fix is never bridged.'
  code:
    - navera_output/navera_output/policy.py::bridge
    - navera_output/navera_output/policy.py::hold
  match:
    - 'test_bridge_flow\.py::'
    - 'test_output\.py::test_(a_bridge|a_bridged|nothing_is_bridged|bridge_settings|the_soft_no_fix)'
  evidence:
    - {level: SIM, value: 'F8: a 5 s NO FIX gap landed the drone; bridge added (3f0cce8)', ref: 'problems doc F8'}
  status: verified-SIM

- id: NAV-SAF-11
  category: SAF
  title: 'Drift alarm on coarse forwarded positions'
  text: 'When the vehicle is given an estimated position coarser than drift_alarm_sigma_m (100 m), the output node shall raise a drift alarm every 5 s.'
