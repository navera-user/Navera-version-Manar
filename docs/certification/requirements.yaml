  status: verified-UT

- id: NAV-SAF-07
  category: SAF
  title: 'Degraded positions withheld from the autopilot by default'
  text: 'A DEGRADED position shall be sent to the autopilot only when the integrator enables forward_degraded with a stated degraded_sigma_m; the sent sigma shall never be better than the source states; positions coarser than max_forward_sigma_m (1 km) shall never be sent.'
  code:
    - navera_output/navera_output/policy.py::decide
    - navera_output/navera_output/policy.py::Config.validate
  match:
    - 'test_output\.py::test_(degraded|forwarded_accuracy|a_forwarded_sigma_above|everything_else|fix_is_sent|a_degraded_position_needs)'
  evidence:
    - {level: SIM, value: 'celestial ±55 km moved a SITL autopilot 125 km before the 1 km ceiling (QAS-2)', ref: 'ENGINEERING_BACKLOG.md §7'}
  status: verified-SIM

- id: NAV-SAF-08
  category: SAF
  title: 'Vision never moves the vehicle''s height'
  text: 'Only a GNSS position may carry an altitude in GPS_INPUT; vision / celestial positions shall be sent with IGNORE_ALT. The integration guide shall forbid EK3_SRC1_POSZ = 3 and EK3_OGN_HGT_MASK.'
  code:
    - navera_output/navera_output/mavlink_out.py::gps_input_fields
  match:
    - 'test_output\.py::test_gps_input_(never_carries|no_fix_and_unknown)'
    - 'sitl_f7_height\.py'
  evidence:
    - {level: SIM, value: 'ArduCopter 4.5.7 SITL: EKF height = baro within 0.1 m in every phase with POSZ=1; POSZ=3 → 431 m off in 20 s', ref: 'ARDUPILOT_INTEGRATION.md §3 (F7)'}
  status: verified-SIM
  note: 'NAVERA cannot read or enforce the autopilot''s EK3 parameters (hazard H-11)'

- id: NAV-SAF-09
  category: SAF
  title: 'No stale or future measurement sent as current'
  text: 'The output shall not send a measurement older than max_measurement_age_s (5 s) or stamped in the future; a vision position shall be carried to the present along the measured ground velocity with its sigma grown by the lag (or by max speed × age without a velocity).'
  code:
    - navera_output/navera_output/policy.py::decide
  match:
    - 'test_output\.py::test_(old_measurements|a_vision_position_is_carried)'
  evidence:
