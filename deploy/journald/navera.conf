# /etc/systemd/journald.conf.d/navera.conf — installed by deploy/install.sh.
#
# NAVERA's units log to the journal (their stdout). A flight lasts hours and a unit whose
# hardware is missing restarts every 10 s: the journal must never fill the disk the maps,
# the swap file and the state live on. Measured: the day node writes ~0.4 kB per frame
# (~1.5 MB/h at 1 frame/s), all units together a few MB per hour.
[Journal]
# persistent, so a flight's log survives the power-off for the analysis. Power cut: journal
# files are append-only; one cut while written is marked dirty and set aside by journald at
# the next start (journalctl still reads it) — it never blocks the boot.
Storage=persistent
# written to the disk at most every 30 s (default 5 min): a cut loses at most the last 30 s
# (messages of priority CRIT and above are synced at once)
SyncIntervalSec=30s
# at most 1 GB in all, and always 2 GB left free on the disk; files rotated at 64 MB
SystemMaxUse=1G
SystemKeepFree=2G
SystemMaxFileSize=64M
# a message storm (a node logging in a loop) is cut, not written out in full
RateLimitIntervalSec=30s
RateLimitBurst=10000
