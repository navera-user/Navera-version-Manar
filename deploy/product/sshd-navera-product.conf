# /etc/ssh/sshd_config.d/10-navera-product.conf — installed by deploy/install.sh --product.
# A delivered NAVERA box: SSH with keys only. Loaded before the other files of this
# directory (the first value of a setting wins in sshd). Remove this file and
# `sudo systemctl reload ssh` to allow passwords again (development only).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 3
