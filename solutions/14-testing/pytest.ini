# pytest settings for this lab folder (you do not need to change this file).
# Some versions of the ROS launch_testing pytest plugin use a private pytest function and pytest warns
# "A private pytest class or function was used." once per test: it is not about your code, so it is
# hidden here. All other warnings stay visible.
[pytest]
filterwarnings =
    ignore:A private pytest class or function was used:pytest.PytestDeprecationWarning
