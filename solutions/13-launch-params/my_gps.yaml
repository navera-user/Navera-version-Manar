# my_gps.yaml — the parameters of TWO fake GNSS receivers (teacher solution).
/**:                              # every node: common values FIRST (the lowest matching row wins)
  ros__parameters:
    rate_hz: 1.0
    sigma_m: 3.0

/drone/fake_gps:
  ros__parameters:
    vehicle: "drone"
    speed_mps: 18.0
    heading_deg: 90.0

/boat/fake_gps:
  ros__parameters:
    vehicle: "boat"
    speed_mps: 6.0
    heading_deg: 45.0
    start_lat: 35.7800             # at sea, off Monastir
    start_lon: 10.8600
