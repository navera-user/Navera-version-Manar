# Parameters of TWO fake GNSS receivers (teacher solution).
/**:                                 # every node: put the common values FIRST (the last match wins)
  ros__parameters:
    rate_hz: 1.0                    # like NAVERA's real receiver (1.000 Hz measured)
    sigma_m: 3.0

/car/fake_gps:
  ros__parameters:
    vehicle: "car"
    start_lat: 35.8250              # in Sousse (NAVERA's test area), Tunisia
    start_lon: 10.5950
    speed_mps: 12.0
    heading_deg: 90.0               # due east

/boat/fake_gps:
  ros__parameters:
    vehicle: "boat"
    start_lat: 35.7800              # at sea, off Monastir
    start_lon: 10.8600
    speed_mps: 5.0
    heading_deg: 45.0               # north-east, out to sea
