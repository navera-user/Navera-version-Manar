# navera_lite.yaml — the settings of NAVERA Lite, your navigation stack (a ROS 2 params file).
#
# One file feeds `--params-file`, the launch files and navera_lite.settings.load().
# The values are the ones of NAVERA's arbiter, as mission 01's settings sheet describes them;
# NAVERA's own code and files are not part of the course. Later missions add keys here.
/**:
  ros__parameters:
    # freshness: a source is "fresh" while its latest position is younger than this
    gps_timeout_s: 3.0          # GPS: one fix per second, so 2 lost fixes are tolerated
    day_timeout_s: 5.0          # day vision: one match every 1–4 s
    night_timeout_s: 5.0        # night vision
    celestial_timeout_s: 45.0   # celestial (star) fixes are rare
    future_tolerance_s: 0.5     # used by the position contract (mission 12)
    # states
    fix_max_sigma_m: 2.0        # FIX only if the source states a σ of at most this; otherwise DEGRADED
    min_stated_sigma_m: 0.01    # used by the position contract (mission 12)
    # switching
    switch_holdoff_s: 2.0       # a higher-priority source must stay usable this long before it takes over
    tick_hz: 5.0                # the judge decides on every arrival and also at this rate
    # jump gate: a GPS fix farther than max_speed_mps × elapsed + gps_jump_margin_m from the last
    # trusted fix is refused
    # 100 m/s is the plane's limit, the same for every vehicle: NAVERA's R-1 (lesson 03); mission 13 sets it per vehicle from VEHICLES
    max_speed_mps: 100.0
    gps_jump_margin_m: 50.0
    vehicle: "drone"            # drone, plane, boat or robot (vehicle.VEHICLES)
