# NAVERA astrometry.net config
# Index files live in the container's system astrometry dir (installed via the
# astrometry.net-data-tycho2 package: index-tycho2-10 .. 19). This path resolves
# INSIDE the Isaac ROS container; the old host path
# (/home/navera/isaac_ros_common/...) does NOT, so autoindex loaded zero indexes.
add_path /usr/share/astrometry
inparallel
cpulimit 300
autoindex
