  var out = tr(key);
  var target = (out === null) ? n.__navOrig : out;
  if (n.nodeValue !== target) n.nodeValue = target;
}

    var a = ATTRS[i];
    if (!el.hasAttribute || !el.hasAttribute(a)) continue;
    var store = '__navOrig_'+a;

    var out = tr(norm(el[store]));
    var target = (out === null) ? el[store] : out;
    if (el.getAttribute(a) !== target) el.setAttribute(a, target);
  }
}

  if (root.nodeType === 3) { translateTextNode(root); return; }
  if (root.nodeType !== 1) return;
  var tag = root.tagName;
  if (tag === 'SCRIPT' || tag === 'STYLE') return;
  if (root.id === 'nav-i18n') return;
  translateAttrs(root);
  for (var c = root.firstChild; c; c = c.nextSibling) walk(c);
}
function applyAll(){
  applying = true;
  walk(document.body);
  var de = document.documentElement;
  de.setAttribute('lang', lang);
  de.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  var btns = document.querySelectorAll('#nav-i18n button');

  if (mo) mo.takeRecords();   /* discard records caused by our own writes */
  applying = false;
}
function setLang(l){
  lang = l;
  try { localStorage.setItem('navera_lang', l); } catch(e){}
  applyAll();
}

bar.addEventListener('click', function(e){
  var b = e.target.closest('button');
  if (b) setLang(b.dataset.l);
});
document.body.appendChild(bar);
/* dynamic content */
function isOwnWrite(n){
  /* our writes always leave nodeValue equal to the translation of __navOrig */
  if (n.__navOrig === undefined) return false;
  var out = tr(norm(n.__navOrig));
  var target = (out === null) ? n.__navOrig : out;

}

  applying = true;
  for (var i=0;i<muts.length;i++){
    var m = muts[i];
    if (m.type === 'characterData'){
      if (!isOwnWrite(m.target)) m.target.__navOrig = m.target.nodeValue; /* app wrote new source text */
      translateTextNode(m.target);
    } else if (m.type === 'childList'){
      for (var j=0;j<m.addedNodes.length;j++) walk(m.addedNodes[j]);

      var cur = el.getAttribute(a);

      if (!ours) el[store] = cur;
      translateAttrs(el);
    }
  }
  mo.takeRecords();   /* discard records caused by our own writes above */
  applying = false;
});
