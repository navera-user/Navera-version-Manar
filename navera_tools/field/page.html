<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NAVERA Field Sky</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NAVERA Sky">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" href="/static/icon-192.png">
<style>
:root{--bg:#0b0d12;--panel:#12151d;--line:#222737;--fg:#d9dde8;--mute:#8089a0;--red:#ff6a4d;--ok:#5fd39a;--warn:#f2b84b;--bad:#ff5c6c;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 padding:16px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:800 32px/1 "Arial Narrow",system-ui,sans-serif;margin:0;letter-spacing:.01em}h1 span{color:var(--red)}
h2{font:700 12px system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
h3{font:800 28px/1.05 "Arial Narrow",system-ui,sans-serif;margin:0 0 8px}
p{margin:0}.mute{color:var(--mute)}.mono{font-family:ui-monospace,Menlo,monospace}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{border:0;border-radius:0;background:var(--panel);color:var(--mute);min-height:44px;font-size:15px}
.tabs button[aria-selected=true]{background:var(--red);color:#1a0a06}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
button{font:600 16px system-ui;padding:14px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);min-height:52px;width:100%}
button.main{background:var(--red);border-color:var(--red);color:#1a0a06;font-size:18px;min-height:60px}
button:disabled{opacity:.45}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.prog{display:flex;gap:6px}.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}.prog i.d{background:var(--ok)}.prog i.c{background:var(--red)}
.checks div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.checks small{display:block;color:var(--mute)}
.s{font:500 11px ui-monospace,Menlo,monospace;padding:2px 7px;border-radius:3px;align-self:flex-start;white-space:nowrap}
.s.ok{background:#12301f;color:var(--ok)}.s.wait{background:#3a2d0e;color:var(--warn)}.s.bad{background:#3d151b;color:var(--bad)}
.stack{display:flex;flex-direction:column;gap:10px}
img.pv{width:100%;border-radius:6px;border:1px solid var(--line);background:#05060a;display:block;aspect-ratio:16/5.6}
.big{font:800 64px/1 "Arial Narrow",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.m .v{font:500 20px ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}.m .l{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.prob{border-left:3px solid var(--bad);padding:2px 0 2px 12px;margin-top:10px}.prob.warn{border-color:var(--warn)}.prob b{display:block}.prob small{color:var(--mute);display:block}
.sess{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;border-radius:0;text-align:left;min-height:0;width:100%}
table{width:100%;border-collapse:collapse;font:12px ui-monospace,Menlo,monospace}th,td{text-align:left;padding:6px 8px 6px 0;border-top:1px solid var(--line)}th{color:var(--mute);font-weight:500}
.scroll{overflow-x:auto}
input[type=text]{font:16px system-ui;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
svg{display:block;width:100%;height:auto}svg text{fill:var(--mute);font:10px ui-monospace,Menlo,monospace}
a.btn{display:block;text-align:center;text-decoration:none;font:600 16px system-ui;padding:14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
</style></head>
<body><div id="err" hidden style="position:sticky;top:0;z-index:6;background:var(--bad);color:#1a0a06;padding:8px 12px;border-radius:6px;font-weight:600"></div><div id="sens" hidden style="position:sticky;top:0;z-index:6"><button class="main" id="sensbtn" style="background:var(--bad);border-color:var(--bad)">SENSORS OFF - tap here to turn GPS and tilt on</button></div><div id="net" hidden style="position:sticky;top:0;z-index:5;background:var(--bad);color:#1a0a06;padding:8px 12px;border-radius:6px;font-weight:600"></div><div class="wrap">
<h1>NAVERA <span>sky</span> test</h1>
<div id="act" hidden role="alert" style="background:var(--bad);color:#1a0a06;padding:12px 14px;border-radius:8px;font-weight:700;font-size:17px"></div><div class="tabs" role="tablist" hidden><button role="tab" id="t1" aria-selected="true">Operator</button><button role="tab" id="t2" aria-selected="false">Results</button></div>
<div id="op" class="wrap" style="gap:14px"></div>
<div id="res" class="wrap" hidden></div>
<p style="text-align:center;margin-top:24px"><a href="#" id="owner" class="mute" style="font-size:13px">Owner: results</a></p>
</div>
<script>
"use strict";
var S={}, phone={}, tab=1, sensorsOn=false, lastSend=0, wake=null, openId=null;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function api(path,body){
  var ac=new AbortController(),t=setTimeout(function(){ac.abort()},10000);
  var o=body===undefined?{signal:ac.signal}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ac.signal};
  return fetch(path,o).then(function(r){clearTimeout(t);return r.json()},function(e){clearTimeout(t);throw e})}
var errT=null;
function toast(m){var e=$("err");e.textContent=m;e.hidden=false;clearTimeout(errT);errT=setTimeout(function(){e.hidden=true},6000)}
window.addEventListener("unhandledrejection",function(ev){ev.preventDefault();toast("That did not go through. Check the connection and tap again.")});

// ── phone sensors ───────────────────────────────────────────────
var gpsId=null;
function watchGps(){
  if(!navigator.geolocation)return;
  if(gpsId!==null)try{navigator.geolocation.clearWatch(gpsId)}catch(e){}
  gpsId=navigator.geolocation.watchPosition(function(p){
    var c=p.coords;phone.gpsError=null;phone.gps_t_ms=p.timestamp;phone.lat=c.latitude;phone.lon=c.longitude;phone.acc=c.accuracy;phone.alt=c.altitude;
    phone.speed=c.speed;phone.course=(c.speed&&c.speed>0.5)?c.heading:null;
  },function(e){if(e.code===1||e.code===2)phone.gpsError=e.message},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
}
function startSensors(){
  var go=function(){
    watchGps();
    var h=function(e){
      if(e.beta!=null){phone.beta=e.beta;phone.gamma=e.gamma;phone.tilt_t_ms=Date.now();}
      if(e.webkitCompassHeading!=null)phone.compass=e.webkitCompassHeading;
      else if(e.absolute&&e.alpha!=null)phone.compass=(360-e.alpha)%360;
    };
    window.addEventListener("deviceorientation",h);window.addEventListener("deviceorientationabsolute",h);
    try{if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(w){wake=w}).catch(function(){})}catch(e){}
    sensorsOn=true;try{localStorage.setItem("navera_sens","1")}catch(e){}
    showSens();
  };
  if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==="function"){
    DeviceOrientationEvent.requestPermission().then(go).catch(go);
  }else go();
}
// Samples the network could not carry are kept here and sent, with their own time, when it is back.
var backlog=[],offline=false,flushing=false;
function showLink(){var b=document.getElementById("net");if(!b)return;b.hidden=!offline;
  b.textContent="Connection lost - keep driving, "+backlog.length+" readings kept on the phone."}
function flush(){
  if(flushing||!backlog.length)return;flushing=true;
  var chunk=backlog.slice(0,200);
  api("/api/phone_batch",{items:chunk}).then(function(r){flushing=false;if(r&&r.stored===chunk.length){backlog.splice(0,chunk.length);flush()}})
    .catch(function(){flushing=false});
}
setInterval(function(){
  if(!sensorsOn)return;
  var d=Object.assign({},phone);d.phone_t_ms=Date.now();
  api("/api/phone",d).then(function(){offline=false;showLink();flush()}).catch(function(){
    offline=true;backlog.push(d);if(backlog.length>7200)backlog.shift();showLink()});
},1000);
function showSens(){var s=$("sens");if(s)s.hidden=sensorsOn||!S.recording}
$("sensbtn").onclick=function(){startSensors()};
document.addEventListener("visibilitychange",function(){if(!document.hidden&&sensorsOn)watchGps();if(!document.hidden&&sensorsOn&&navigator.wakeLock)navigator.wakeLock.request("screen").then(function(w){wake=w}).catch(function(){})});

// ── operator: START, drive, END ─────────────────────────────────
// Everything else (camera, steadiness, stars, recording) is automatic and never blocks: small status
// lines, and a red banner only when the operator has something to do.
function chk(id){return (S.checks||[]).filter(function(c){return c.id===id})[0]||{status:"wait",label:id,detail:""}}
function line(st,label,detail){return '<div><span>'+esc(label)+(detail?'<small>'+esc(detail)+'</small>':'')+'</span><span class="s '+st+'">'+({ok:"OK",wait:"WAIT",bad:"CHECK"})[st]+'</span></div>'}
function gpsLine(){
  if(phone.gpsError)return line("bad","Phone GPS","location is off or refused");
  if(phone.acc==null)return line(sensorsOn||!S.recording?"wait":"bad","Phone GPS",sensorsOn?"searching...":"starts with START");
  return line(phone.acc<=30?"ok":"wait","Phone GPS","accuracy "+Math.round(phone.acc)+" m")}
function statusLines(){
  var cam=chk("camera"),st=chk("stars"),f=S.last_fix||{};
  return '<div class="checks">'+gpsLine()+line(navOk?"ok":"bad","NAVERA connected",navOk?"":"the phone cannot reach the Jetson")+
    line(cam.status==="ok"?"ok":"bad","Camera",cam.status==="ok"?"":(cam.detail||"no picture"))+
    line(st.status==="ok"?"ok":"wait","Stars",(S.live||{}).confirmed==null?"waiting for the sky":S.live.confirmed+" seen")+
    (S.recording?line((S.fixes||0)>0?"ok":"wait","Positions from the sky",(S.fixes||0)+(f.err_km==null?"":" · last "+f.err_km+" km from GPS")):"")+'</div>'}
function banner(){
  var m="";
  if(phone.gpsError)m="Turn on location for this app (phone settings), then press START again.";
  else if(S.recording&&!sensorsOn)m="";        // the SENSORS OFF button says it
  else if(S.recording&&hiddenWhileRec)m="Keep this app open on the screen during the drive.";
  else if(!navOk&&(S.recording||startPending))m="NAVERA is not reachable. Keep driving: the phone keeps its GPS and sends it later.";
  var b=$("act");b.hidden=!m;b.textContent=m}
var navOk=false,startPending=false,hiddenWhileRec=false;
function renderOp(){
  var h;
  if(S.recording){
    h='<section class="card" style="text-align:center"><p class="mute mono">Recording '+esc(S.recording)+'</p>'+
      '<div class="big" id="clock">'+elapsed()+'</div><p style="margin:10px 0 4px"><b>Drive normally. Stop 20 s every 2-3 min.</b></p></section>'+
      '<section class="card">'+statusLines()+'</section>'+
      '<button class="main" id="end" style="min-height:84px;font-size:24px;background:var(--panel);color:var(--fg);border:2px solid var(--red)">END</button>';
  }else if(S.done&&!startPending){
    h='<section class="card" style="text-align:center"><h3>Test saved</h3><p class="mono" style="font-size:18px">'+esc(S.done)+'</p>'+
      '<p style="margin-top:10px">Thank you.</p></section><button id="start" style="margin-top:6px">Start another test</button>';
  }else{
    h='<p class="mute" style="text-align:center">Camera on the roof, phone in the car.</p>'+
      '<button class="main" id="start" style="min-height:120px;font-size:34px;letter-spacing:.08em"'+(startPending?' disabled':'')+'>'+(startPending?'STARTING...':'START')+'</button>'+
      '<section class="card">'+statusLines()+'</section>';
  }
  $("op").innerHTML=h;bind();banner();
}
function elapsed(){if(!S.started)return "00:00";var s=Math.max(0,Math.floor(Date.now()/1000-S.started)),m=Math.floor(s/60);
  return (m>=60?Math.floor(m/60)+":"+String(m%60).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(s%60).padStart(2,"0")}
function bind(){
  var on=function(i,f){var e=$(i);if(e)e.onclick=f};
  on("start",function(){
    startSensors();                       // the one permission prompt (location + motion), from this tap
    startPending=true;renderOp();
    api("/api/start",{}).then(function(s){S=s;startPending=false;lastKey="";renderOp()})
      .catch(function(){startPending=false;renderOp();toast("NAVERA did not answer. Check the Jetson is on, then press START again.")});
  });
  on("end",function(){
    if(!window.confirm("End the test?"))return;
    this.disabled=true;this.textContent="Saving...";
    api("/api/end",{}).then(function(s){S=s;lastKey="";renderOp()}).catch(function(){toast("NAVERA did not answer. Tap END again in a moment.");renderOp()});
  });
}
function updateLive(){var c=$("clock");if(c)c.textContent=elapsed()}
setInterval(function(){if(tab===1){updateLive();banner()}},1000);
document.addEventListener("visibilitychange",function(){if(document.hidden&&S.recording)hiddenWhileRec=true;
  else if(!document.hidden)setTimeout(function(){hiddenWhileRec=false;banner()},8000);banner()});
var lastKey="";
function poll(){
  api("/api/state").then(function(s){S=s;navOk=true;
    var key=JSON.stringify([s.recording,s.done,(s.checks||[]).map(function(c){return c.id+c.status}),(s.live||{}).confirmed,s.fixes,
      (s.last_fix||{}).err_km,sensorsOn,phone.acc==null,phone.gpsError]);
    showSens();if(s.disk_error)toast("Cannot save to the disk of the Jetson - tell the owner now.");
    if(key!==lastKey&&tab===1){lastKey=key;renderOp()}
  }).catch(function(){
    navOk=false;
    if(!S.step){lastKey="";$("op").innerHTML='<section class="card"><h3>Waiting for NAVERA...</h3><p class="mute">The phone cannot reach the Jetson yet. '+
      'Check that the Jetson is on, and that the phone and the Jetson are on the same Wi-Fi or hotspot. This screen updates by itself.</p></section>'}
    else if(tab===1){lastKey="";renderOp()}
  });
}
setInterval(poll,1500);poll();
// ── installed app ───────────────────────────────────────────────
// the page shell stays on the phone (service worker: only on a trusted https address, not the LAN's own certificate)
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(function(){});
// an iPhone home-screen app keeps its own cookies: the shortcut must carry the link's key (Android uses the manifest)
(function(){var k="__NAVERA_KEY__",standalone=window.navigator.standalone||matchMedia("(display-mode: standalone)").matches;
  if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&!standalone&&k.indexOf("__")!==0&&location.search.indexOf("k=")<0)
    history.replaceState(null,"","/field?k="+encodeURIComponent(k))})();

// ── results ─────────────────────────────────────────────────────
function show(t){tab=t;$("owner").textContent=t===1?"Owner: results":"Back to the test";$("op").hidden=t!==1;$("res").hidden=t!==2;$("t1").setAttribute("aria-selected",t===1);$("t2").setAttribute("aria-selected",t===2);if(t===2)loadList()}
$("t1").onclick=function(){show(1)};$("t2").onclick=function(){show(2)};$("owner").onclick=function(e){e.preventDefault();show(tab===1?2:1)};
function when(t){return t?new Date(t*1000).toLocaleString():""}
function vclass(v){return v==="OK"?"ok":v==="PARTLY"?"wait":"bad"}
function loadList(openFirst){
  api("/api/sessions").then(function(l){
    var h='<section class="card"><h2>Saved tests</h2>'+(l.length?l.map(function(m){
      return '<button class="sess" data-id="'+esc(m.id)+'"><div><b>'+esc(m.id)+'</b><div class="mute" style="font-size:13px">'+(m.frames||0)+' frames · '+(m.solved||0)+' with a position</div></div><span class="s '+vclass(m.verdict)+'">'+esc(m.verdict||"RUNNING")+'</span></button>'}).join(""):'<p class="mute">No test yet.</p>')+'</section><div id="detail"></div>';
    $("res").innerHTML=h;
    Array.prototype.forEach.call(document.querySelectorAll(".sess"),function(b){b.onclick=function(){detail(b.dataset.id)}});
    if(openFirst)detail(openFirst);
  });
}
function chart(rows){
  var pts=rows.filter(function(r){return r.err_km!=null});if(!pts.length)return '<p class="mute">No position to plot.</p>';
  var t0=rows[0].t,t1=rows[rows.length-1].t||t0+1,mx=Math.max.apply(null,pts.map(function(r){return r.err_km}))*1.15||1;
  var X=function(t){return 30+(t-t0)/Math.max(t1-t0,1)*280},Y=function(e){return 80-e/mx*70};
  var path=pts.map(function(r,i){return (i?"L":"M")+X(r.t).toFixed(1)+" "+Y(r.err_km).toFixed(1)}).join("");
  var miss=rows.filter(function(r){return !r.fix}).map(function(r){return '<line x1="'+X(r.t).toFixed(1)+'" x2="'+X(r.t).toFixed(1)+'" y1="4" y2="84" stroke="#ff5c6c" stroke-opacity=".25"/>'}).join("");
  return '<svg viewBox="0 0 320 96" role="img" aria-label="Error over the test">'+miss+'<path d="'+path+'" fill="none" stroke="#ff6a4d" stroke-width="1.6"/>'+
    pts.map(function(r){return '<circle cx="'+X(r.t).toFixed(1)+'" cy="'+Y(r.err_km).toFixed(1)+'" r="2.2" fill="#ff6a4d"/>'}).join("")+
    '<text x="2" y="14">'+mx.toFixed(0)+' km</text><text x="2" y="84">0</text></svg><p class="mute" style="font-size:12px">Red lines: frames with no position.</p>'}
function detail(id){
  $("detail").innerHTML='<section class="card"><p class="mute">Loading...</p></section>';
  api("/api/session/"+encodeURIComponent(id)).then(function(r){
    var e=r.err_km;
    var h='<section class="card"><h2>Test '+esc(r.id)+'</h2><div style="display:flex;gap:12px;align-items:center"><span class="s '+vclass(r.verdict)+'" style="font-size:16px;padding:6px 12px">'+esc(r.verdict)+'</span>'+
      '<p class="mute">'+r.solved+' of '+r.frames+' frames got a position'+(e?', median error '+e.median+' km':'')+'.</p></div>'+
      '<div class="grid" style="margin-top:12px"><div class="m"><div class="v">'+Math.round(r.solved_frac*100)+' %</div><div class="l">solved</div></div>'+
      '<div class="m"><div class="v">'+(e?e.median+' km':'–')+'</div><div class="l">median</div></div>'+
      '<div class="m"><div class="v">'+(r.stars_median==null?'–':r.stars_median)+'</div><div class="l">stars, median</div></div></div>'+
      (r.problems.length?r.problems.map(function(p){return '<div class="prob '+(p.severity==="bad"?"":"warn")+'"><b>'+esc(p.title)+'</b><span>'+esc(p.detail)+'</span><small>Fix: '+esc(p.fix)+'</small></div>'}).join(""):'<p class="mute" style="margin-top:10px">No problem found.</p>')+'</section>'+
      '<section class="card"><h2>Error over the drive</h2>'+chart(r.rows)+'</section>'+
      '<section class="card"><h2>Frame by frame</h2><div class="scroll"><table><tr><th>time</th><th>stars</th><th>fix</th><th>km</th><th>why not</th></tr>'+
      r.rows.map(function(x){return '<tr><td>'+new Date(x.t*1000).toLocaleTimeString()+'</td><td>'+(x.stars==null?'':x.stars)+'</td><td>'+(x.fix?'yes':'no')+'</td><td>'+(x.err_km==null?'':x.err_km)+'</td><td>'+esc(x.why||'')+'</td></tr>'}).join("")+'</table></div></section>'+
      '<section class="card"><h2>Where it is saved</h2><p class="mono mute" style="word-break:break-all;font-size:12px">~/navera-field/'+esc(r.id)+'/</p><p class="mute" style="margin:8px 0 12px">Frames, phone GPS and tilt, every decision, notes, report. Written every second.</p>'+
      '<div class="stack"><a class="btn" href="/api/session/'+encodeURIComponent(r.id)+'/zip">Download the test (zip)</a></div></section>';
    $("detail").innerHTML=h;$("detail").scrollIntoView();
  });
}
</script></body></html>
