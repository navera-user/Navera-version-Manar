<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160">
  <!-- Navi the swallow: NAVERA Academy mascot -->
  <defs>
    <linearGradient id="nb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f5bb7"/><stop offset="1" stop-color="#1f3f8f"/></linearGradient>
    <linearGradient id="nw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b6fd6"/><stop offset="1" stop-color="#1c3577"/></linearGradient>
  </defs>
  <!-- forked tail -->
  <path d="M70 96 C50 92 28 80 6 66 C26 86 40 96 54 102 C38 110 24 122 12 136 C34 124 52 114 74 106 Z" fill="#1c3577"/>
  <!-- body -->
  <ellipse cx="102" cy="98" rx="46" ry="30" fill="url(#nb)"/>
  <!-- belly -->
  <path d="M70 104 C86 128 128 132 146 108 C130 116 92 118 70 104 Z" fill="#fff6e6"/>
  <ellipse cx="116" cy="110" rx="30" ry="14" fill="#fff6e6"/>
  <!-- back wing -->
  <path d="M92 86 C76 60 58 40 30 26 C58 30 92 46 118 80 Z" fill="#183068"/>
  <!-- head -->
  <circle cx="146" cy="74" r="28" fill="url(#nb)"/>
  <!-- red throat and forehead -->
  <path d="M150 86 C156 96 168 96 173 84 C166 88 158 89 150 86 Z" fill="#e8553f"/>
  <path d="M158 50 C166 52 172 58 174 64 C168 62 162 58 158 50 Z" fill="#e8553f"/>
  <!-- cheek -->
  <ellipse cx="149" cy="81" rx="6" ry="3.6" fill="#ff9aa2" opacity=".8"/>
  <!-- eye -->
  <circle cx="156" cy="68" r="9" fill="#fff"/>
  <circle cx="158.5" cy="68.5" r="5.5" fill="#1b1f2a"/>
  <circle cx="160.5" cy="66" r="2" fill="#fff"/>
  <!-- beak -->
  <path d="M172 74 L188 77 L172 81 Z" fill="#2a2a2a"/>
  <!-- front wing -->
  <path d="M96 92 C84 66 70 44 44 22 C80 32 112 56 128 90 C118 96 106 96 96 92 Z" fill="url(#nw)"/>
  <path d="M100 88 C92 72 82 58 66 42" stroke="#5f8ef0" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/>
  <path d="M110 88 C104 74 96 62 84 50" stroke="#5f8ef0" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".55"/>
  <!-- little compass badge on the chest -->
  <circle cx="128" cy="112" r="9" fill="#ffc94d" stroke="#e0a21f" stroke-width="1.5"/>
  <path d="M128 105 L131 112 L128 119 L125 112 Z" fill="#e8553f"/>
  <circle cx="128" cy="112" r="1.6" fill="#243447"/>
</svg>
