<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAVERA Academy</title>
<link rel="icon" href="/static/img/navi.svg">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100%; overflow: hidden; position: relative;
    background: linear-gradient(180deg, #4fb3f5 0%, #8fd6ff 55%, #dff3ff 100%); }
  .sun { position: absolute; top: 7%; right: 9%; width: 110px; height: 110px; border-radius: 50%; background: #ffd25e;
    box-shadow: 0 0 0 22px rgba(255, 210, 94, .25), 0 0 0 48px rgba(255, 210, 94, .12); }
  .cl { position: absolute; background: #fff; border-radius: 999px; opacity: .92; }
  .cl::before, .cl::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cl.a { width: 200px; height: 52px; top: 16%; left: -220px; animation: sail 60s linear infinite; }
  .cl.a::before { width: 84px; height: 84px; left: 34px; top: -42px; } .cl.a::after { width: 60px; height: 60px; left: 104px; top: -28px; }
  .cl.b { width: 150px; height: 40px; top: 68%; left: -170px; animation: sail 80s linear infinite 12s; opacity: .8; }
  .cl.b::before { width: 60px; height: 60px; left: 26px; top: -30px; } .cl.b::after { width: 46px; height: 46px; left: 76px; top: -20px; }
  .cl.c { width: 120px; height: 32px; top: 38%; left: -140px; animation: sail 70s linear infinite 30s; opacity: .7; }
  .cl.c::before { width: 48px; height: 48px; left: 20px; top: -24px; } .cl.c::after { width: 36px; height: 36px; left: 60px; top: -16px; }
  @keyframes sail { to { transform: translateX(calc(100vw + 400px)); } }
  .flock { position: absolute; top: 24%; left: -120px; width: 120px; animation: sail 26s linear infinite; }
  .flock img { position: absolute; width: 34px; }
  .ground { position: absolute; bottom: 0; left: 0; right: 0; height: 16%; background:
    radial-gradient(120% 140% at 20% 100%, #7ccf6a 50%, transparent 51%),
    radial-gradient(120% 160% at 85% 100%, #6cc35a 50%, transparent 51%); }
  .box { position: relative; z-index: 2; background: #fff; border-radius: 30px; padding: 26px 30px 22px; width: min(400px, 92vw);
    box-shadow: 0 30px 80px rgba(15, 47, 99, .3); border: 4px solid #ffe7a3; }
  .box .navi { width: 132px; display: block; margin: -86px auto 0; animation: flap 3s ease-in-out infinite; filter: drop-shadow(0 10px 8px rgba(15,47,99,.2)); }
  .box h1 { margin: 6px 0 2px; font-size: 32px; text-align: center; color: #0f2f63; }
  .box h1 span { color: #ff9f43; }
  .box p { color: var(--muted); margin: 0 0 14px; line-height: 1.5; font-size: 15px; text-align: center; font-weight: 600; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; font-weight: 800; }
  input { width: 100%; font-size: 16px; }
  button { width: 100%; margin-top: 18px; padding: 11px; font-size: 17px; }
  .err { color: var(--bad); font-size: 14px; min-height: 20px; margin-top: 10px; text-align: center; font-weight: 700; }
</style>
</head>
<body>
<div class="sun"></div>
<div class="cl a"></div><div class="cl b"></div><div class="cl c"></div>
<div class="flock"><img src="/static/img/navi.svg" style="left:0;top:0" alt=""><img src="/static/img/navi.svg" style="left:40px;top:22px;width:28px" alt=""><img src="/static/img/navi.svg" style="left:76px;top:4px;width:24px" alt=""></div>
<div class="ground"></div>
<form class="box" id="f">
  <img class="navi" src="/static/img/navi.svg" alt="Navi the swallow">
  <h1>NAVERA <span>Academy</span></h1>
  <p>Hi, I'm <b>Navi</b>! Birds cross whole continents without GPS.<br>Come and learn how robots can do it too. 🐦</p>
  <label for="n">Your name</label><input id="n" autocomplete="username" autofocus>
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
  <button class="go">Take off! ✈</button>
  <div class="err" id="e"></div>
</form>
<script>
document.getElementById('f').onsubmit = async (ev) => {
  ev.preventDefault();
  const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: n.value, password: p.value})});
  const d = await r.json();
  if (r.ok) location.href = d.role === 'teacher' ? '/teacher' : '/';
  else document.getElementById('e').textContent = d.error || 'Error';
};
</script>
</body>
</html>
