version: '3.8'

services:
  vision-server:
    build:
      context: ./vision_pkg
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./vision_pkg/dataset:/app/dataset
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - vision-server
    restart: unless-stopped
